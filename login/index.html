<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DR. Xiaomi · Ingresar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">
</head>
<body>

  <!-- ============================================================
       VISTA 1: SELECCIÓN DE PERFIL
       ============================================================ -->
  <div class="login-container" id="viewPerfiles">
    <div class="login-logo">
      <i class="fas fa-tools"></i>
    </div>

    <h1 class="login-title">DR. XIAOMI</h1>
    <p class="login-subtitle">Servicio Técnico Especializado</p>

    <p class="login-section-title">¿Quién está ingresando?</p>

    <div id="perfilesList" style="width: 100%; max-width: 340px;"></div>

    <button id="themeToggle" class="icon-btn" 
            style="position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100;"
            aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================
       VISTA 2: INGRESAR CLAVE
       ============================================================ -->
  <div class="login-container hidden" id="viewPin">
    <button id="backBtn" 
            style="position: fixed; top: 20px; left: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100;"
            aria-label="Volver">
      <i class="fas fa-arrow-left"></i>
    </button>

    <div class="login-logo" id="profileIconView" style="margin-bottom: 16px;">
      <span style="font-size: 40px;">👑</span>
    </div>

    <h1 class="login-title" id="profileNameView" style="font-size: 22px;">Admin</h1>
    <p class="login-subtitle" id="profileRoleView" style="margin-bottom: 32px;">Dueño</p>

    <form style="width: 100%; max-width: 340px;" id="pinForm">
      <div style="position: relative; margin-bottom: 16px;">
        <input type="password" 
               id="pinInput" 
               placeholder="Ingresa tu clave"
               autocomplete="current-password"
               style="width: 100%; padding: 18px 50px 18px 18px; background: var(--bg-elev-1); border: 1.5px solid var(--border-2); border-radius: 16px; color: var(--text-1); font-size: 16px; font-weight: 600; text-align: center; letter-spacing: 1px; transition: all 0.2s ease; font-family: inherit;"
               autofocus>
        <button type="button" id="togglePin" 
                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-3); font-size: 16px; cursor: pointer; border-radius: 12px;"
                aria-label="Mostrar clave">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div id="pinError" style="text-align: center; color: #EF4444; font-size: 14px; font-weight: 600; min-height: 20px; margin-bottom: 12px;"></div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i>
        Ingresar
      </button>
    </form>

    <button id="themeToggle2" class="icon-btn" 
            style="position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100;"
            aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script type="module">
    import { getPerfiles, login, getSesion, redirigirSegunRol } from '/js/app-auth.js';
    import { toast, haptic, initTheme, toggleTheme } from '/js/app-ui.js';

    let perfilActual = null;

    const viewPerfiles    = document.getElementById('viewPerfiles');
    const viewPin         = document.getElementById('viewPin');
    const perfilesList    = document.getElementById('perfilesList');
    const profileIconView = document.getElementById('profileIconView');
    const profileNameView = document.getElementById('profileNameView');
    const profileRoleView = document.getElementById('profileRoleView');
    const pinForm         = document.getElementById('pinForm');
    const pinInput        = document.getElementById('pinInput');
    const pinError        = document.getElementById('pinError');
    const submitBtn       = document.getElementById('submitBtn');
    const togglePin       = document.getElementById('togglePin');
    const backBtn         = document.getElementById('backBtn');
    const themeToggle     = document.getElementById('themeToggle');
    const themeToggle2    = document.getElementById('themeToggle2');

    initTheme();

    const sesionExistente = getSesion();
    if (sesionExistente) {
      console.log('✅ Ya hay sesión activa, redirigiendo...');
      redirigirSegunRol();
    }

    themeToggle.addEventListener('click', () => { haptic(10); toggleTheme(); });
    themeToggle2.addEventListener('click', () => { haptic(10); toggleTheme(); });

    function cargarPerfiles() {
      const perfiles = getPerfiles();

      perfilesList.innerHTML = perfiles.map(p => `
        <button class="profile-card" data-perfil-id="${p.id}" type="button">
          <div class="profile-icon">${p.icono}</div>
          <div class="profile-info">
            <div class="profile-name">${p.nombre}</div>
            <div class="profile-role">${p.subtitulo}</div>
          </div>
          <i class="fas fa-chevron-right profile-arrow"></i>
        </button>
      `).join('');

      perfilesList.querySelectorAll('.profile-card').forEach(card => {
        card.addEventListener('click', () => {
          const perfilId = card.dataset.perfilId;
          const perfil = perfiles.find(p => p.id === perfilId);
          if (perfil) seleccionarPerfil(perfil);
        });
      });
    }

    function seleccionarPerfil(perfil) {
      perfilActual = perfil;
      haptic(15);

      profileIconView.innerHTML = `<span style="font-size: 40px;">${perfil.icono}</span>`;
      profileNameView.textContent = perfil.nombre;
      profileRoleView.textContent = perfil.subtitulo;

      pinForm.reset();
      pinError.textContent = '';
      pinInput.type = 'password';
      togglePin.innerHTML = '<i class="fas fa-eye"></i>';

      viewPerfiles.classList.add('hidden');
      viewPin.classList.remove('hidden');

      setTimeout(() => pinInput.focus(), 100);
    }

    backBtn.addEventListener('click', () => {
      haptic(10);
      perfilActual = null;
      pinInput.value = '';
      pinError.textContent = '';
      viewPin.classList.add('hidden');
      viewPerfiles.classList.remove('hidden');
    });

    togglePin.addEventListener('click', () => {
      haptic(8);
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        togglePin.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        pinInput.type = 'password';
        togglePin.innerHTML = '<i class="fas fa-eye"></i>';
      }
      pinInput.focus();
    });

    pinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      verificarPin();
    });

    function verificarPin() {
      if (!perfilActual) return;

      const pin = pinInput.value;
      if (!pin) {
        pinError.textContent = 'Ingresa tu clave';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></div> Verificando...';
      pinError.textContent = '';

      const resultado = login(perfilActual.id, pin);

      if (resultado.success) {
        haptic([15, 50, 15]);
        toast(`¡Bienvenido, ${perfilActual.nombre}!`, 'success', 1200);

        setTimeout(() => {
          redirigirSegunRol();
        }, 800);
      } else {
        haptic([50, 30, 50]);
        pinError.textContent = resultado.error || 'Clave incorrecta';

        pinForm.style.animation = 'shake 0.4s';
        setTimeout(() => pinForm.style.animation = '', 400);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';

        pinInput.select();
      }
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-6px); }
        80%      { transform: translateX(6px); }
      }
      #pinInput:focus {
        outline: none;
        border-color: var(--brand-500) !important;
        box-shadow: 0 0 0 3px rgba(255, 105, 0, 0.15);
      }
      #togglePin:hover { color: var(--text-1); background: var(--bg-elev-2); }
    `;
    document.head.appendChild(style);

    cargarPerfiles();
  </script>

</body>
</html>
