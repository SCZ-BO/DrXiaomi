<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DR. Xiaomi · Ingresar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">
</head>
<body>

  <!-- ============================================================
       VISTA 1: SELECCIÓN DE PERFIL
       ============================================================ -->
  <div class="login-container" id="viewPerfiles">
    <div class="login-logo">
      <i class="fas fa-tools"></i>
    </div>

    <h1 class="login-title">DR. XIAOMI</h1>
    <p class="login-subtitle">Servicio Técnico Especializado</p>

    <p class="login-section-title">¿Quién está ingresando?</p>

    <div id="perfilesList" style="width: 100%; max-width: 340px;">
      <!-- Se cargan dinámicamente -->
      <div class="skeleton" style="height: 84px; margin-bottom: 12px; border-radius: 20px;"></div>
      <div class="skeleton" style="height: 84px; border-radius: 20px;"></div>
    </div>

    <button id="themeToggle" class="icon-btn" 
            style="position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100;"
            aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================
       VISTA 2: INGRESAR CONTRASEÑA
       ============================================================ -->
  <div class="login-container hidden" id="viewPassword">
    <button id="backBtn" 
            style="position: absolute; top: 20px; left: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;"
            aria-label="Volver">
      <i class="fas fa-arrow-left"></i>
    </button>

    <div class="login-logo" id="profileIconView">
      <span style="font-size: 40px;">👑</span>
    </div>

    <h1 class="login-title" id="profileNameView">Admin</h1>
    <p class="login-subtitle" id="profileRoleView">Dueño</p>

    <form id="loginForm" style="width: 100%; max-width: 340px;">
      <div class="field">
        <input type="password" 
               id="passwordInput" 
               placeholder=" " 
               required 
               autocomplete="current-password"
               autofocus>
        <label for="passwordInput">Contraseña</label>
      </div>

      <div id="loginError" class="field-error hidden" style="text-align: center; margin-top: 4px;"></div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i>
        Ingresar
      </button>
    </form>

    <button id="themeToggle2" class="icon-btn" 
            style="position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; background: var(--bg-elev-1); border: 1px solid var(--border-2); border-radius: 12px; color: var(--text-2); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100;"
            aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script type="module">
    import { getPerfiles, login, redirigirSegunRol } from '/js/app-auth.js';
    import { 
      toast, showLoading, hideLoading, 
      haptic, initTheme, toggleTheme 
    } from '/js/app-ui.js';
    import { auth } from '/js/firebase.js';

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================

    let perfilSeleccionado = null;

    // Referencias del DOM
    const viewPerfiles       = document.getElementById('viewPerfiles');
    const viewPassword       = document.getElementById('viewPassword');
    const perfilesList       = document.getElementById('perfilesList');
    const profileIconView    = document.getElementById('profileIconView');
    const profileNameView    = document.getElementById('profileNameView');
    const profileRoleView    = document.getElementById('profileRoleView');
    const loginForm          = document.getElementById('loginForm');
    const passwordInput      = document.getElementById('passwordInput');
    const loginError         = document.getElementById('loginError');
    const submitBtn          = document.getElementById('submitBtn');
    const backBtn            = document.getElementById('backBtn');
    const themeToggle        = document.getElementById('themeToggle');
    const themeToggle2       = document.getElementById('themeToggle2');

    // Inicializar tema
    initTheme();

    // Listeners de tema
    themeToggle.addEventListener('click', () => { haptic(10); toggleTheme(); });
    themeToggle2.addEventListener('click', () => { haptic(10); toggleTheme(); });

    // ============================================================
    // SI YA HAY SESIÓN → REDIRIGIR AL APP
    // ============================================================

    auth.onAuthStateChanged((user) => {
      if (user) {
        console.log('✅ Ya hay sesión activa, redirigiendo...');
        redirigirSegunRol();
      }
    });

    // ============================================================
    // CARGAR PERFILES
    // ============================================================

    async function cargarPerfiles() {
      try {
        const perfiles = await getPerfiles();

        if (perfiles.length === 0) {
          perfilesList.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-users-slash"></i>
              <h3>No hay perfiles disponibles</h3>
              <p>Contacta al administrador</p>
            </div>
          `;
          return;
        }

        perfilesList.innerHTML = perfiles.map(p => `
          <button class="profile-card" data-perfil-id="${p.id}" type="button">
            <div class="profile-icon">${p.icono || '👤'}</div>
            <div class="profile-info">
              <div class="profile-name">${p.nombreVisible}</div>
              <div class="profile-role">${p.subtitulo || ''}</div>
            </div>
            <i class="fas fa-chevron-right profile-arrow"></i>
          </button>
        `).join('');

        // Listener en cada tarjeta
        perfilesList.querySelectorAll('.profile-card').forEach(card => {
          card.addEventListener('click', () => {
            const perfilId = card.dataset.perfilId;
            const perfil = perfiles.find(p => p.id === perfilId);
            if (perfil) seleccionarPerfil(perfil);
          });
        });

      } catch (error) {
        console.error('Error cargando perfiles:', error);
        perfilesList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error al cargar</h3>
            <p>Verifica tu conexión a internet</p>
          </div>
        `;
      }
    }

    // ============================================================
    // SELECCIONAR PERFIL
    // ============================================================

    function seleccionarPerfil(perfil) {
      perfilSeleccionado = perfil;
      haptic(15);

      // Actualizar vista de contraseña
      profileIconView.innerHTML = `<span style="font-size: 40px;">${perfil.icono || '👤'}</span>`;
      profileNameView.textContent = perfil.nombreVisible;
      profileRoleView.textContent = perfil.subtitulo || perfil.rol;

      // Resetear formulario
      loginForm.reset();
      loginError.classList.add('hidden');
      loginError.textContent = '';

      // Cambiar vista
      viewPerfiles.classList.add('hidden');
      viewPassword.classList.remove('hidden');

      // Focus en el campo de contraseña
      setTimeout(() => passwordInput.focus(), 100);
    }

    // ============================================================
    // VOLVER A PERFILES
    // ============================================================

    backBtn.addEventListener('click', () => {
      haptic(10);
      perfilSeleccionado = null;
      viewPassword.classList.add('hidden');
      viewPerfiles.classList.remove('hidden');
    });

    // ============================================================
    // SUBMIT LOGIN
    // ============================================================

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!perfilSeleccionado) return;

      const password = passwordInput.value;
      if (!password) {
        mostrarError('Ingresa tu contraseña');
        return;
      }

      // UI: loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></div> Ingresando...';
      loginError.classList.add('hidden');

      haptic(10);

      // Login
      const result = await login(perfilSeleccionado.email, password);

      if (result.success) {
        // Éxito
        haptic([10, 50, 10]);
        toast(`¡Bienvenido, ${perfilSeleccionado.nombreVisible}!`, 'success', 1500);

        setTimeout(() => {
          redirigirSegunRol();
        }, 600);
      } else {
        // Error
        haptic([50, 30, 50]);
        mostrarError(result.error);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';

        // Shake animation
        loginForm.style.animation = 'shake 0.4s';
        setTimeout(() => loginForm.style.animation = '', 400);

        passwordInput.select();
      }
    });

    function mostrarError(mensaje) {
      loginError.textContent = mensaje;
      loginError.classList.remove('hidden');
    }

    // ============================================================
    // ARRANCAR
    // ============================================================

    cargarPerfiles();

    // Añadir animación shake
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-6px); }
        80%      { transform: translateX(6px); }
      }
    `;
    document.head.appendChild(style);
  </script>

</body>
</html>
