<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Cierre de Caja</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- CSS UNIFICADOS -->
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/app-layouts.css">
  <link rel="stylesheet" href="../css/app-components.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-ring {
      position: absolute; inset: 0; border-radius: 50%; 
      border: 3px solid transparent; 
      border-top-color: #FF6900; border-bottom-color: #FF6900;
      animation: spin 1.2s linear infinite !important; 
    }

    .section-block { 
      background: var(--bg-elev-1); border: 1px solid var(--border-1); 
      border-radius: var(--r-lg); padding: 20px; margin-bottom: 16px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    /* 🔥 ICONOS PNG PARA LAS SECCIONES */
    .icon-seccion {
      width: 20px; height: 20px; object-fit: contain;
    }

    .fila-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; font-size: 14px; }
    .fila-info .label { color: var(--text-3); font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .fila-info .valor { color: var(--text-1); font-weight: 700; text-align: right; }

    .total-destacado { background: var(--bg-elev-2); border-radius: var(--r-lg); padding: 20px; text-align: center; margin-top: 16px; }
    .total-destacado .valor { font-size: 36px; font-weight: 900; color: var(--brand-500); line-height: 1; letter-spacing: -1px; }
    .total-destacado .label { font-size: 11px; color: var(--text-3); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-top: 6px; }
    
    .ganancia-destacada { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success-500); border-radius: var(--r-lg); padding: 24px; text-align: center; margin-bottom: 24px; }
    .ganancia-destacada .valor { font-size: 32px; font-weight: 900; color: var(--success-500); line-height: 1; letter-spacing: -1px; }
    .ganancia-destacada .label { font-size: 11px; color: var(--success-500); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-top: 6px; }

    .item-extra { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
    .item-extra input { padding: 12px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-elev-2); color: var(--text-1); font-family: inherit; font-size: 14px; outline: none; }
    .item-extra input:focus { border-color: var(--brand-500); }
    .item-extra input.desc { flex: 2; min-width: 120px; }
    .item-extra input.monto { flex: 1; min-width: 80px; text-align: right; color: var(--brand-500); font-weight: 700; }
    .item-extra input.costo { flex: 1; min-width: 80px; text-align: right; color: var(--danger-500); font-weight: 700; }
    .btn-remove { width: 42px; height: 42px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); color: var(--danger-500); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-remove img { width: 20px; height: 20px; object-fit: contain; }

    .producto-btn { background: var(--bg-elev-2); border: 1px solid var(--border-1); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
    .producto-btn:active { transform: scale(0.95); border-color: var(--brand-500); }
    .producto-btn img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
    .producto-btn span.nombre { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; color: var(--text-1); }
    .producto-btn span.precio { font-size: 12px; font-weight: 800; color: var(--brand-500); }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img">
    </div>
    <div class="loader-text">Preparando cierre...</div>
  </div>

  <!-- 🔥 INDICADOR PULL TO REFRESH -->
  <div id="pullToRefresh" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%) translateY(-60px); z-index: 9999; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; pointer-events: none;">
    <div style="background: var(--bg-elev-1); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); border: 1px solid var(--border-1);">
      <img id="ptrIcon" src="/app/icons/estado-reparacion.png" width="24" height="24" alt="Refresh" style="transition: transform 0.3s;">
    </div>
  </div>

  <main class="app-container">
    <!-- HEADER Y BOTTOM NAV INYECTADOS DESDE LAYOUT.JS -->
    <script type="module">
      import { montarLayout } from '../js/layout.js';
      montarLayout({
        titulo: 'Cierre de Caja',
        padre: '/app/',
        activo: 'panel'
      });
    </script>

    <div class="app-content">
      <!-- 1. Reparaciones -->
      <div class="section-block" style="border-top: 3px solid var(--brand-500);">
        <div class="section-title" style="color: var(--brand-500);">
          <img src="/app/icons/estado-reparacion.png" class="icon-seccion" alt="Reparaciones"> Reparaciones (Hoy)
        </div>
        <div class="fila-info"><span class="label">Cantidad entregada:</span><span class="valor" id="cantReparaciones">0</span></div>
        <div class="fila-info"><span class="label">Total Cobrado:</span><span class="valor" id="totalReparaciones" style="color:var(--success-500); font-weight:800; font-size:16px;">Bs. 0.00</span></div>
        <div style="margin-top:16px; border-top:1px solid var(--border-1); padding-top:16px;">
          <div class="fila-info"><span class="label"><img src="/app/icons/cobrar.png" width="18" height="18" alt="Efectivo"> Efectivo:</span><span class="valor" id="totalEfectivo">Bs. 0</span></div>
          <div class="fila-info"><span class="label"><img src="/app/icons/reportes.png" width="18" height="18" alt="QR"> QR:</span><span class="valor" id="totalQR">Bs. 0</span></div>
          <div class="fila-info"><span class="label"><img src="/app/icons/total.png" width="18" height="18" alt="Transf"> Transf:</span><span class="valor" id="totalTransf">Bs. 0</span></div>
        </div>
      </div>

      <!-- 2. Ventas de Accesorios -->
      <div class="section-block" style="border-top: 3px solid var(--info-500);">
        <div class="section-title" style="color: var(--info-500);">
          <img src="/app/icons/inventario.png" class="icon-seccion" alt="Accesorios"> Ventas de Accesorios
        </div>
        <div id="listaInventario" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
      </div>

      <!-- 3. Ventas Extras -->
      <div class="section-block" style="border-top: 3px solid var(--purple-500);">
        <div class="section-title" style="color: var(--purple-500);">
          <img src="/app/icons/venta.png" class="icon-seccion" alt="Extras"> Ventas Extras (Manual)
        </div>
        <div id="listaExtras"></div>
        <button class="btn btn-secondary" id="btnAddExtra" style="width: 100%; padding: 12px; font-size: 13px; border: 1px dashed var(--purple-500); color: var(--purple-500); background: transparent;"><img src="/app/icons/agregar.png" width="16" height="16" style="margin-right: 6px;"> Añadir Venta Manual</button>
      </div>

      <!-- 4. Total y Ganancia -->
      <div class="total-destacado">
        <div class="valor" id="totalGlobal">Bs. 0.00</div>
        <div class="label">Total Ingresos del Día</div>
      </div>
      <div class="ganancia-destacada">
        <div class="valor" id="gananciaGlobal">Bs. 0.00</div>
        <div class="label">Ganancia Real del Día</div>
      </div>

      <!-- 5. Botones -->
      <button class="btn btn-whatsapp" id="btnEnviarWhatsApp" style="width: 100%; margin-bottom: 12px;"><img src="/app/icons/whatsapp.png" width="20" height="20" style="margin-right: 8px;"> Enviar Cierre al Admin</button>
      <button class="btn btn-primary" id="btnGuardarCierre" style="width: 100%; margin-bottom: 32px;"><img src="/app/icons/cierre.png" width="20" height="20" style="margin-right: 8px;"> Guardar en Historial</button>
    </div>
  </main>

  <!-- AQUÍ SE CARGA TODA LA LÓGICA DESDE TU ARCHIVO CIERRE.JS -->
  <script type="module" src="./cierre.js"></script>
  
  <!-- SCRIPT DE SEGURIDAD (Oculta el loader si algo falla) -->
  <script>
    setTimeout(() => { document.getElementById('appLoader')?.classList.add('hidden'); }, 1500);
  </script>
</body>
</html>
