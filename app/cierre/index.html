<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Cierre de Caja</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    :root { 
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; 
      --brand: #E65100; --brand-hover: #BF360C; --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; --bg-card: #181818; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2A2A2A; 
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; --bg-card: #FFFFFF; --bg-elev: #F0F0F0; 
      --text-main: #111111; --text-mute: #666666; --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }

    /* SECCIONES */
    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; }
    .section-block h3 { font-size: 11px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* FILAS DE INFO */
    .fila-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; font-size: 13px; }
    .fila-info:last-child { margin-bottom: 0; }
    .fila-info .label { color: var(--text-mute); font-weight: 500; flex-shrink: 0; }
    .fila-info .valor { color: var(--text-main); font-weight: 600; text-align: right; word-break: break-word; }

    .total-destacado { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; text-align: center; margin-top: 12px; }
    .total-destacado .valor { font-size: 32px; font-weight: 800; color: var(--brand); line-height: 1; }
    .total-destacado .label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; }

    /* VENTAS EXTRAS MANUALES */
    .item-extra { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .item-extra input { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); font-family: inherit; }
    .item-extra input.costo { width: 80px; text-align: right; }
    .btn-remove { width: 38px; height: 38px; border-radius: var(--radius-sm); background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); cursor: pointer; }
    
    /* BOTONES */
    .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; font-family: inherit; }
    .btn-action:active { transform: scale(0.98); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-secondary { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25D366; color: white; }

    /* PRODUCTOS DEL INVENTARIO */
    .producto-btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .producto-btn:active { transform: scale(0.95); }
    .producto-btn img { width: 40px; height: 40px; object-fit: cover; border-radius: var(--radius-sm); }
    .producto-btn span.nombre { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.1; color: var(--text-main); }
    .producto-btn span.precio { font-size: 11px; font-weight: 800; color: var(--brand); }

    /* LOADER PRO */
    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); box-shadow: 0 0 20px rgba(230, 81, 0, 0.2); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- LOADER PRO -->
  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/img/logo1.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/web-app-manifest-192x192.png'">
    </div>
    <div class="loader-text">Preparando cierre...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi" onerror="this.style.display='none';">
        </div>
        <div class="brand-text">
          <h1>CIERRE DE CAJA</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
    </header>

    <main class="app-content">
      <!-- Sección 1: Reparaciones automáticas del día -->
      <div class="section-block">
        <h3><i class="fas fa-wrench"></i> Reparaciones (Hoy)</h3>
        <div class="fila-info">
          <span class="label">Cantidad entregada:</span>
          <span class="valor" id="cantReparaciones">0</span>
        </div>
        <div class="fila-info">
          <span class="label">Total Cobrado:</span>
          <span class="valor" id="totalReparaciones" style="color:#22C55E; font-weight:800;">Bs. 0.00</span>
        </div>
        <div class="fila-info" style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
          <span class="label">💵 Efectivo:</span>
          <span class="valor" id="totalEfectivo">Bs. 0</span>
        </div>
        <div class="fila-info">
          <span class="label">📱 QR:</span>
          <span class="valor" id="totalQR">Bs. 0</span>
        </div>
        <div class="fila-info">
          <span class="label">🏦 Transferencia:</span>
          <span class="valor" id="totalTransf">Bs. 0</span>
        </div>
      </div>

      <!-- Sección 2: Ventas de Accesorios (Desde Inventario) -->
      <div class="section-block">
        <h3><i class="fas fa-box"></i> Ventas de Accesorios</h3>
        <div id="listaInventario" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <!-- Se inyecta por JS -->
        </div>
      </div>

      <!-- Sección 3: Ventas Extras (Manual) -->
      <div class="section-block">
        <h3><i class="fas fa-cart-plus"></i> Ventas Extras (Manual)</h3>
        <div id="listaExtras"></div>
        <button class="btn-action btn-secondary" id="btnAddExtra" style="font-size:12px; padding:10px;">
          <i class="fas fa-plus"></i> Añadir Venta Manual
        </button>
      </div>

      <!-- Sección 4: TOTAL FINAL -->
      <div class="total-destacado">
        <div class="valor" id="totalGlobal">Bs. 0.00</div>
        <div class="label">Total Ingresos del Día</div>
      </div>

      <!-- Sección 5: Botones de Acción -->
      <button class="btn-action btn-whatsapp" id="btnEnviarWhatsApp">
        <i class="fab fa-whatsapp"></i> Enviar Cierre al Dueño
      </button>
      <button class="btn-action btn-primary" id="btnGuardarCierre" style="margin-bottom:24px;">
        <i class="fas fa-save"></i> Guardar en Historial
      </button>

    </main>
  </div>

  <script type="module" src="cierre.js"></script>

  <!-- 🔥 RED DE SEGURIDAD -->
  <script>
    setTimeout(() => {
      const loader = document.getElementById('appLoader');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        console.warn('⚠️ Loader apagado por seguridad (timeout de 2s).');
      }
    }, 2000);
  </script>
</body>
</html>
