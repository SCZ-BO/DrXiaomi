<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Inventario Pro</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    :root { 
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; 
      --brand: #FF6900; --brand-hover: #E55A00; --brand-light: rgba(255, 105, 0, 0.15); 
      --bg-main: #0A0A0A; --bg-card: #161616; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2C2C2C; 
      --success: #10B981; --danger: #EF4444;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; letter-spacing: -0.01em; }
    
    .app-container { display: flex; flex-direction: column; height: 100dvh; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 16px 16px 100px 16px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--bg-elev); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 12px; color: var(--brand); margin: 0; font-weight: 600; }
    
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.9); }

    /* RESUMEN SUPERIOR (KPIs) */
    .dashboard-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--bg-card); border: 1px solid var(--border); padding: 14px; border-radius: var(--radius-md); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
    .kpi-title { font-size: 10px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .kpi-value { font-size: 20px; font-weight: 800; color: var(--text-main); }
    .kpi-value.green { color: var(--success); }

    /* GRID DE PRODUCTOS */
    .productos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    
    .producto-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: var(--radius-md); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      position: relative;
      transition: transform 0.15s;
    }
    .producto-card:active { transform: scale(0.98); }
    
    .producto-img { 
      width: 100%; 
      aspect-ratio: 1; 
      object-fit: cover; 
      background: var(--bg-elev); 
      display: block;
    }
    
    .producto-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .producto-nombre { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .producto-precio { font-size: 16px; font-weight: 800; color: var(--brand); margin-bottom: 6px; }
    
    .producto-costos { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-mute); font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .producto-ganancia { color: var(--success); background: rgba(16, 185, 129, 0.1); padding: 2px 6px; border-radius: 4px; font-weight: 800; }

    /* CONTROLES DE STOCK EN LA TARJETA */
    .stock-controls { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .stock-display { font-size: 13px; font-weight: 800; color: var(--text-main); }
    .stock-display.low { color: var(--danger); }
    .stock-display.empty { color: var(--text-mute); text-decoration: line-through; }
    
    .stock-actions { display: flex; gap: 6px; }
    .btn-stock-action { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; transition: 0.15s; }
    .btn-stock-action:active { background: var(--brand); color: white; transform: scale(0.9); }
    .btn-stock-action:disabled { opacity: 0.5; pointer-events: none; }

    /* BOTÓN FLOTANTE (FAB) */
    .btn-fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--brand); color: white; border: none; box-shadow: 0 4px 16px rgba(230, 81, 0, 0.4); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 90; transition: 0.2s; }
    .btn-fab:active { transform: scale(0.9); }

    /* MODALES (BOTTOM SHEETS) */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.show { display: flex; animation: fade 0.2s ease; }
    .modal { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 540px; border-top: 1px solid var(--border); max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1); position: relative; }
    .modal-backdrop.show .modal { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .btn-close { background: var(--bg-elev); border: none; color: var(--text-mute); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .form-field { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 14px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-family: inherit; font-size: 15px; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: var(--brand); }
    
    .foto-uploader { display: flex; gap: 10px; flex-wrap: wrap; }
    .foto-preview { position: relative; width: 90px; height: 90px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-preview .btn-remove-foto { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 10px; cursor: pointer; }
    .btn-add-foto { width: 90px; height: 90px; border-radius: var(--radius-sm); background: var(--bg-elev); border: 1px dashed var(--border); color: var(--text-mute); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; gap: 6px; cursor: pointer; }
    .btn-add-foto i { font-size: 22px; }

    .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; border: none; margin-top: 12px; transition: 0.2s; font-family: inherit; }
    .btn-action:active { transform: scale(0.98); }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 4px 12px var(--brand-light); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:active { background: var(--danger); color: white; }

    /* LOADER PRO */
    .loader-overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/img/logo1.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/web-app-manifest-192x192.png'">
    </div>
    <div class="loader-text">Sincronizando inventario...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi" onerror="this.style.display='none';">
        </div>
        <div class="brand-text">
          <h1>INVENTARIO</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnWhatsApp" title="Exportar a WhatsApp"><i class="fab fa-whatsapp"></i></button>
      </div>
    </header>

    <main class="app-content">
      <!-- DASHBOARD KPIs -->
      <div class="dashboard-kpis" id="dashboardKpis">
        <div class="kpi-card">
          <span class="kpi-title">Total Productos</span>
          <span class="kpi-value" id="kpiTotal">0</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-title">Valor Inventario</span>
          <span class="kpi-value green" id="kpiValor">Bs. 0</span>
        </div>
      </div>

      <div class="productos-grid" id="productosGrid">
        <!-- Los productos se inyectan aquí -->
      </div>
    </main>

    <button class="btn-fab" id="btnNuevoProducto">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- MODAL: NUEVO / EDITAR PRODUCTO -->
  <div class="modal-backdrop" id="modalProducto">
    <div class="modal">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Nuevo Producto</h3>
        <button class="btn-close" id="btnCloseModal"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="form-field">
        <label class="form-label">Nombre del Producto *</label>
        <input type="text" id="inputNombre" class="form-input" placeholder="Ej. Pantalla Redmi Note 10">
      </div>
      
      <div style="display: flex; gap: 12px;">
        <div class="form-field" style="flex: 1;">
          <label class="form-label">Costo (Bs.) *</label>
          <input type="number" id="inputCosto" class="form-input" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="form-field" style="flex: 1;">
          <label class="form-label">Precio Venta (Bs.) *</label>
          <input type="number" id="inputPrecio" class="form-input" placeholder="0.00" inputmode="decimal">
        </div>
      </div>
      
      <div class="form-field">
        <label class="form-label">Stock *</label>
        <input type="number" id="inputStock" class="form-input" placeholder="0" inputmode="numeric">
      </div>

      <div class="form-field">
        <label class="form-label">Foto del Repuesto</label>
        <div class="foto-uploader" id="fotoUploader">
          <button type="button" class="btn-add-foto" id="btnAddFoto">
            <i class="fas fa-camera"></i>
            <span>Subir Foto</span>
          </button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" hidden>
      </div>

      <button class="btn-action btn-primary" id="btnGuardarProducto">
        <i class="fas fa-save"></i> Guardar Producto
      </button>
      <button class="btn-action btn-danger" id="btnEliminarProducto" style="display: none; margin-top: 12px;">
        <i class="fas fa-trash-alt"></i> Eliminar Producto
      </button>
    </div>
  </div>

  <script type="module" src="inventario.js"></script>
</body>
</html>
