<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Inventario Pro</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <!-- CSS UNIFICADOS -->
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/app-layouts.css">
  <link rel="stylesheet" href="../css/app-components.css">

  <style>
    /* 🔥 FORZAR ANIMACIÓN DEL LOADER */
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-ring {
      position: absolute; inset: 0; border-radius: 50%; 
      border: 3px solid transparent; 
      border-top-color: #FF6900; border-bottom-color: #FF6900;
      animation: spin 1.2s linear infinite !important; 
    }

    /* DASHBOARD KPIs */
    .dashboard-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--bg-elev-1); border: 1px solid var(--border-1); padding: 14px; border-radius: var(--r-lg); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
    .kpi-title { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .kpi-value { font-size: 22px; font-weight: 800; color: var(--text-1); }
    .kpi-value.green { color: var(--success-500); }

    /* GRID DE PRODUCTOS */
    .productos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    
    .producto-card { 
      background: var(--bg-elev-1); border: 1px solid var(--border-1); 
      border-radius: var(--r-lg); overflow: hidden; display: flex; 
      flex-direction: column; position: relative; transition: transform 0.15s;
    }
    .producto-card:active { transform: scale(0.98); }
    
    .producto-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg-elev-2); display: block; }
    
    .producto-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .producto-nombre { font-size: 14px; font-weight: 700; color: var(--text-1); margin-bottom: 4px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .producto-precio { font-size: 16px; font-weight: 800; color: var(--brand-500); margin-bottom: 6px; }
    
    .producto-costos { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-3); font-weight: 600; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-1); }
    .producto-ganancia { color: var(--success-500); background: rgba(16, 185, 129, 0.1); padding: 2px 6px; border-radius: 4px; font-weight: 800; }

    /* CONTROLES DE STOCK */
    .stock-controls { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .stock-display { font-size: 13px; font-weight: 800; color: var(--text-1); }
    .stock-display.low { color: var(--danger-500); }
    .stock-display.empty { color: var(--text-3); text-decoration: line-through; }
    
    .stock-actions { display: flex; gap: 6px; }
    .btn-stock-action { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-elev-2); color: var(--text-1); border: 1px solid var(--border-1); display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; transition: 0.15s; }
    .btn-stock-action:active { background: var(--brand-500); color: white; transform: scale(0.9); }
    .btn-stock-action:disabled { opacity: 0.5; pointer-events: none; }

    /* BOTÓN FLOTANTE (FAB) */
    .btn-fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--brand-500); color: white; border: none; box-shadow: var(--shadow-glow); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 90; transition: 0.2s; }
    .btn-fab:active { transform: scale(0.9); }

    /* MODALES (BOTTOM SHEETS) */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.show { display: flex; animation: fade 0.2s ease; }
    .modal { background: var(--bg-elev-1); border-radius: var(--r-2xl) var(--r-2xl) 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 540px; border-top: 1px solid var(--border-1); max-height: 92vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1); position: relative; }
    .modal-backdrop.show .modal { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: var(--border-3); border-radius: 999px; margin: 0 auto 16px; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .btn-close { background: var(--bg-elev-2); border: none; color: var(--text-3); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .form-field { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 14px; background: var(--bg-elev-2); border: 1px solid var(--border-1); border-radius: var(--r-sm); color: var(--text-1); font-family: inherit; font-size: 15px; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: var(--brand-500); }
    
    .foto-uploader { display: flex; gap: 10px; flex-wrap: wrap; }
    .foto-preview { position: relative; width: 90px; height: 90px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border-1); }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-preview .btn-remove-foto { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 10px; cursor: pointer; }
    .btn-add-foto { width: 90px; height: 90px; border-radius: var(--r-sm); background: var(--bg-elev-2); border: 1px dashed var(--border-2); color: var(--text-3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; gap: 6px; cursor: pointer; }
    .btn-add-foto i { font-size: 22px; }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img">
    </div>
    <div class="loader-text">Sincronizando inventario...</div>
  </div>

  <main class="app-container">
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><img src="/app/icons/volver.png" width="20" height="20" alt="Volver"></button>
        <div class="brand-text">
          <h1>Inventario</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnWhatsApp" title="Exportar a WhatsApp">
          <img src="/app/icons/whatsapp.png" width="20" height="20" alt="WhatsApp">
        </button>
      </div>
    </header>

    <div class="app-content">
      <!-- DASHBOARD KPIs -->
      <div class="dashboard-kpis" id="dashboardKpis">
        <div class="kpi-card">
          <span class="kpi-title">Total Productos</span>
          <span class="kpi-value" id="kpiTotal">0</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-title">Valor Inventario</span>
          <span class="kpi-value green" id="kpiValor">Bs. 0</span>
        </div>
      </div>

      <!-- GRID DE PRODUCTOS -->
      <div class="productos-grid" id="productosGrid">
        <!-- Aquí se inyectan los productos -->
      </div>
    </div>
  </main>

  <button class="btn-fab" id="btnNuevoProducto">
    <img src="/app/icons/agregar.png" width="28" height="28" alt="Nuevo">
  </button>

  <!-- MODAL: NUEVO / EDITAR PRODUCTO -->
  <div class="modal-backdrop" id="modalProducto">
    <div class="modal">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Nuevo Producto</h3>
        <button class="btn-close" id="btnCloseModal"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="form-field">
        <label class="form-label">Nombre del Producto *</label>
        <input type="text" id="inputNombre" class="form-input" placeholder="Ej. Pantalla Redmi Note 10">
      </div>
      
      <div style="display: flex; gap: 12px;">
        <div class="form-field" style="flex: 1;">
          <label class="form-label">Costo (Bs.) *</label>
          <input type="number" id="inputCosto" class="form-input" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="form-field" style="flex: 1;">
          <label class="form-label">Precio Venta (Bs.) *</label>
          <input type="number" id="inputPrecio" class="form-input" placeholder="0.00" inputmode="decimal">
        </div>
      </div>
      
      <div class="form-field">
        <label class="form-label">Stock *</label>
        <input type="number" id="inputStock" class="form-input" placeholder="0" inputmode="numeric">
      </div>

      <div class="form-field">
        <label class="form-label">Foto del Repuesto</label>
        <div class="foto-uploader" id="fotoUploader">
          <button type="button" class="btn-add-foto" id="btnAddFoto">
            <i class="fas fa-camera"></i>
            <span>Subir Foto</span>
          </button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" hidden>
      </div>

      <button class="btn btn-primary" id="btnGuardarProducto" style="width: 100%; margin-top: 12px;">
        <i class="fas fa-save"></i> Guardar Producto
      </button>
      <button class="btn btn-danger" id="btnEliminarProducto" style="width: 100%; margin-top: 12px; display: none;">
        <i class="fas fa-trash-alt"></i> Eliminar Producto
      </button>
    </div>
  </div>

  <script type="module" src="./inventario.js"></script>
  
  <script>
    setTimeout(() => { document.getElementById('appLoader')?.classList.add('hidden'); }, 1500);
  </script>
</body>
</html>
