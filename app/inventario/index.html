<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Inventario</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    :root { 
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; 
      --brand: #E65100; --brand-hover: #BF360C; --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; --bg-card: #181818; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2A2A2A; 
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; --bg-card: #FFFFFF; --bg-elev: #F0F0F0; 
      --text-main: #111111; --text-mute: #666666; --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }

    /* GRID DE PRODUCTOS */
    .productos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    
    .producto-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: var(--radius-md); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column;
      position: relative;
    }
    
    .producto-img { 
      width: 100%; 
      aspect-ratio: 1; 
      object-fit: cover; 
      background: var(--bg-elev); 
      display: block;
    }
    
    .producto-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .producto-nombre { font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; line-height: 1.2; }
    .producto-precio { font-size: 15px; font-weight: 800; color: var(--brand); }
    .producto-stock { font-size: 11px; color: var(--text-mute); font-weight: 600; margin-top: 2px; }
    
    .stock-bajo { color: #EF4444 !important; }
    .stock-cero { color: #666 !important; text-decoration: line-through; }

    .btn-stock { 
      position: absolute; bottom: 10px; right: 10px; 
      width: 36px; height: 36px; 
      border-radius: 50%; 
      background: var(--brand); 
      color: white; 
      border: none; 
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(230,81,0,0.4);
      transition: 0.2s;
    }
    .btn-stock:active { transform: scale(0.9); }
    .btn-stock:disabled { background: var(--bg-elev); color: var(--text-mute); cursor: not-allowed; }

    /* BOTÓN FLOTANTE (FAB) */
    .btn-fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: white; border: none; box-shadow: 0 4px 16px rgba(230, 81, 0, 0.3); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 90; }
    .btn-fab:active { transform: scale(0.9); }

    /* MODALES */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; width: 100%; max-width: 500px; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: 0.3s; }
    .modal-backdrop.show .modal { transform: translateY(0); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 16px; font-weight: 800; }
    
    .form-field { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-family: inherit; font-size: 14px; outline: none; }
    
    .foto-uploader { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .foto-preview { position: relative; width: 80px; height: 80px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .btn-add-foto { width: 80px; height: 80px; border-radius: var(--radius-sm); background: var(--bg-elev); border: 1px dashed var(--border); color: var(--text-mute); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 4px; cursor: pointer; }
    .btn-add-foto i { font-size: 20px; }

    .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; font-family: inherit; }
    .btn-action:active { transform: scale(0.98); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-secondary { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }

    /* LOADER PRO */
    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); box-shadow: 0 0 20px rgba(230, 81, 0, 0.2); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/img/logo1.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/web-app-manifest-192x192.png'">
    </div>
    <div class="loader-text">Cargando inventario...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi" onerror="this.style.display='none';">
        </div>
        <div class="brand-text">
          <h1>INVENTARIO</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnWhatsApp" title="Enviar por WhatsApp"><i class="fab fa-whatsapp"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div class="productos-grid" id="productosGrid">
        <!-- Los productos se inyectan aquí -->
      </div>
    </main>

    <button class="btn-fab" id="btnNuevoProducto">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- MODAL: NUEVO PRODUCTO -->
  <div class="modal-backdrop" id="modalProducto">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Nuevo Producto</h3>
        <button class="icon-btn" id="btnCloseModal"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="form-field">
        <label class="form-label">Nombre *</label>
        <input type="text" id="inputNombre" class="form-input" placeholder="Ej. Cargador 20W">
      </div>
      
      <div class="form-field">
        <label class="form-label">Precio (Bs.) *</label>
        <input type="number" id="inputPrecio" class="form-input" placeholder="0.00" inputmode="decimal">
      </div>
      
      <div class="form-field">
        <label class="form-label">Stock inicial *</label>
        <input type="number" id="inputStock" class="form-input" placeholder="0" inputmode="numeric">
      </div>

      <div class="form-field">
        <label class="form-label">Foto</label>
        <div class="foto-uploader" id="fotoUploader">
          <button type="button" class="btn-add-foto" id="btnAddFoto">
            <i class="fas fa-camera"></i>
            <span>Foto</span>
          </button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" hidden>
      </div>

      <button class="btn-action btn-primary" id="btnGuardarProducto">
        <i class="fas fa-save"></i> Guardar Producto
      </button>
    </div>
  </div>

  <script type="module" src="inventario.js"></script>
</body>
</html>
