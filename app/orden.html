<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>DR. Xiaomi · Orden</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">

  <!-- PWA -->
  <link rel="manifest" href="/app/manifest.json">
  <meta name="apple-mobile-web-app-title" content="DR. Xiaomi Panel">

  <style>
    /* ============================================================ */
    /* 🎯 CHIPS DE ESTADO                                            */
    /* ============================================================ */
    .chip-recibido    { background: rgba(245, 158, 11, 0.18); color: #F59E0B; }
    .chip-reparacion  { background: rgba(59, 130, 246, 0.18); color: #3B82F6; }
    .chip-espera      { background: rgba(255, 105, 0, 0.18);  color: #FF6900; }
    .chip-listo       { background: rgba(16, 185, 129, 0.18); color: #10B981; }
    .chip-entregado   { background: rgba(139, 92, 246, 0.18); color: #8B5CF6; }
    .chip-devuelto    { background: rgba(239, 68, 68, 0.18);  color: #EF4444; }

    /* ============================================================ */
    /* 🔄 BOTONES DE ESTADO                                          */
    /* ============================================================ */
    .estado-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: var(--bg-elev-2);
      border: 2px solid var(--border-2);
      border-radius: 12px;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }
    .estado-btn i { font-size: 16px; }
    .estado-btn:active { transform: scale(0.97); }
    .estado-btn.activo {
      background: var(--brand-500);
      border-color: var(--brand-500);
      color: white;
      box-shadow: 0 4px 12px rgba(255, 105, 0, 0.4);
    }
    .estado-btn.activo i { color: white; }

    /* ============================================================ */
    /* 📋 BITÁCORA                                                   */
    /* ============================================================ */
    .bitacora-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-1);
    }
    .bitacora-item:last-child { border-bottom: none; }
    .bitacora-icono {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .bitacora-icono.estado { background: rgba(255,105,0,0.15); color: var(--brand-500); }
    .bitacora-icono.nota { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }
    .bitacora-icono.foto { background: rgba(139, 92, 246, 0.15); color: #8B5CF6; }
    .bitacora-icono.whatsapp { background: rgba(37, 211, 102, 0.15); color: #25D366; }

    .bitacora-content { flex: 1; min-width: 0; }
    .bitacora-autor { font-size: 12px; font-weight: 700; color: var(--text-1); }
    .bitacora-fecha { font-size: 11px; color: var(--text-3); margin-left: 6px; font-weight: 500; }
    .bitacora-texto { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; word-wrap: break-word; }
    .bitacora-fotos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .bitacora-fotos img {
      width: 70px; height: 70px;
      object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border-2);
      cursor: zoom-in;
      transition: transform 0.15s ease;
    }
    .bitacora-fotos img:active { transform: scale(0.95); }

    /* ============================================================ */
    /* 📸 FOTO UPLOADER                                              */
    /* ============================================================ */
    .foto-uploader { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .foto-preview {
      position: relative; width: 70px; height: 70px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border-2);
    }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-preview .btn-remove {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(239, 68, 68, 0.95); color: white;
      border: none; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-add-foto {
      width: 70px; height: 70px; border-radius: 8px;
      background: var(--bg-elev-2); border: 2px dashed var(--border-3);
      color: var(--text-3); display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 10px; gap: 2px; cursor: pointer; font-family: inherit;
    }
    .btn-add-foto i { font-size: 18px; }

    /* ============================================================ */
    /* ⏳ LOADING                                                    */
    /* ============================================================ */
    .orden-loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 16px;
    }

    /* ============================================================ */
    /* 📦 SECCIONES                                                  */
    /* ============================================================ */
    .section-block {
      background: var(--bg-elev-1);
      border: 1px solid var(--border-1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-block h3 {
      font-size: 12px; font-weight: 800;
      color: var(--brand-500);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    .fila-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 12px;
    }
    .fila-info .label {
      color: var(--text-3);
      font-size: 12px;
      flex-shrink: 0;
    }
    .fila-info .valor {
      color: var(--text-1);
      font-weight: 600;
      font-size: 13px;
      text-align: right;
      word-break: break-word;
    }

    /* ============================================================ */
    /* 💬 WHATSAPP GRANDE                                            */
    /* ============================================================ */
    .btn-whatsapp-grande {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
      transition: all 0.2s ease;
      margin-top: 12px;
    }
    .btn-whatsapp-grande:active { transform: scale(0.97); }
    .btn-whatsapp-grande i { font-size: 20px; }

    /* ============================================================ */
    /* 🟠 LOGO REDONDO EN EL HEADER                                 */
    /* ============================================================ */
    .brand-logo-orden {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(255, 105, 0, 0.35);
      margin: 0 10px;
    }
    .brand-logo-orden img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* ============================================================ */
    /* 🖼️ VISOR DE IMÁGENES (MODAL)                                 */
    /* ============================================================ */
    .img-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .img-viewer.show { display: flex; }
    .img-viewer img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .img-viewer .cerrar {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .img-viewer .cerrar:active { transform: scale(0.92); }

    /* ============================================================ */
    /* 📄 RECIBO BONITO (estilo vista previa del wizard)            */
    /* ============================================================ */
    .preview-recibo {
      background: var(--bg-elev-1);
      border: 1px solid var(--border-1);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .preview-header {
      background: linear-gradient(135deg, #FF6900, #FF8A3C);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .preview-header::after {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .preview-header img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
      z-index: 1;
    }
    .preview-header-text {
      flex: 1;
      min-width: 0;
      z-index: 1;
    }
    .preview-header-text h3 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: white;
    }
    .preview-header-text p {
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
    }
    .preview-header-recibo {
      text-align: right;
      font-size: 9px;
      line-height: 1.3;
      opacity: 0.95;
      flex-shrink: 0;
      z-index: 1;
    }
    .preview-header-recibo strong {
      display: block;
      font-size: 11px;
      font-weight: 800;
    }

    .preview-estado-badge-wrap {
      padding: 10px 16px;
      text-align: center;
      background: var(--bg-elev-2);
      border-bottom: 1px solid var(--border-1);
    }
    .preview-estado-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .preview-fecha {
      background: var(--bg-elev-2);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-3);
      border-bottom: 1px solid var(--border-1);
      flex-wrap: wrap;
      gap: 6px;
    }
    .preview-fecha strong { color: var(--text-1); font-weight: 700; }

    .preview-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-1);
    }
    .preview-section:last-child { border-bottom: none; }

    .preview-section-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--brand-500);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .preview-row:last-child { margin-bottom: 0; }
    .preview-row span:first-child {
      color: var(--text-3);
      flex-shrink: 0;
    }
    .preview-row span:last-child {
      color: var(--text-1);
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .preview-servicios-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .preview-servicios-table th {
      text-align: left;
      padding: 6px 0;
      font-size: 10px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-1);
      font-weight: 700;
    }
    .preview-servicios-table td {
      padding: 8px 0;
      border-bottom: 1px solid var(--border-1);
      color: var(--text-2);
    }
    .preview-servicios-table td.costo {
      text-align: right;
      color: var(--text-1);
      font-weight: 700;
    }

    .preview-totales {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border-2);
    }
    .preview-totales .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .preview-totales .saldo-row {
      display: flex;
      justify-content: space-between;
      background: rgba(255,105,0,0.1);
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-500);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn" aria-label="Volver">
          <i class="fas fa-arrow-left"></i>
        </button>

        <!-- 🟠 Logo redondo -->
        <div class="brand-logo-orden">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand-500); font-size:18px;&quot;></i>';">
        </div>

        <div class="brand-text">
          <h1 id="headerTitle">ORDEN</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="app-content" id="contenido">
      <div class="orden-loading">
        <div class="spinner"></div>
        <p style="color: var(--text-3);">Cargando orden...</p>
      </div>
    </main>

  </div>

  <!-- 🖼️ VISOR DE IMÁGENES -->
  <div class="img-viewer" id="imgViewer">
    <button class="cerrar" id="imgViewerCerrar" aria-label="Cerrar">
      <i class="fas fa-times"></i>
    </button>
    <img src="" alt="Vista previa" id="imgViewerImg">
  </div>

  <script type="module" src="./orden.js"></script>

</body>
</html>
