<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Orden</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Librerías PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <!-- 🔥 RUTAS RELATIVAS CORREGIDAS (Asumiendo que estás en /app/) -->
  <link rel="stylesheet" href="./css/app-theme.css">
  <link rel="stylesheet" href="./css/app-layouts.css">
  <link rel="stylesheet" href="./css/app-components.css">
  <link rel="manifest" href="./manifest.json">

  <!-- ESTILOS ESPECÍFICOS DE ESTA PÁGINA -->
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-ring {
      position: absolute; inset: 0; border-radius: 50%; 
      border: 3px solid transparent; 
      border-top-color: #FF6900; border-bottom-color: #FF6900;
      animation: spin 1.2s linear infinite !important; 
    }

    .recibo-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .recibo-row span:first-child { color: var(--text-3); font-weight: 500; }
    .recibo-row span:last-child { font-weight: 600; color: var(--text-1); text-align: right; }

    .tabla-servicios { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .tabla-servicios th { text-align: left; font-size: 10px; color: var(--text-3); text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--border-1); }
    .tabla-servicios td { padding: 8px 0; font-size: 13px; color: var(--text-1); border-bottom: 1px solid var(--border-1); }
    .tabla-servicios td:last-child { text-align: right; font-weight: 700; color: var(--brand-500); }

    .total-box { background: var(--bg-elev-2); border-radius: 8px; padding: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .total-box strong { font-size: 18px; font-weight: 800; color: var(--brand-500); }

    .estados-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .estado-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 8px; background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: 10px; color: var(--text-1); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-align: center; }
    .estado-btn i { font-size: 18px; margin-bottom: 2px; }
    .estado-btn:active { transform: scale(0.95); }
    .estado-btn.activo { background: var(--brand-light); border-color: var(--brand-500); color: var(--brand-500); font-weight: 700; }

    .bitacora-item { display: flex; gap: 10px; margin-bottom: 12px; }
    .bitacora-icono { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-elev-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--brand-500); font-size: 12px; }
    .bitacora-content { flex: 1; }
    .bitacora-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .bitacora-autor { font-size: 11px; font-weight: 700; color: var(--text-1); }
    .bitacora-fecha { font-size: 9px; color: var(--text-3); }
    .bitacora-texto { font-size: 12px; color: var(--text-3); line-height: 1.4; background: var(--bg-elev-1); padding: 8px 10px; border-radius: 0 10px 10px 10px; }
    .bitacora-fotos { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .bitacora-fotos img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
  </style>
</head>
<body>

  <!-- LOADER (Se oculta a los 2s pase lo que pase) -->
  <div class="loading-overlay" id="appLoader">
    <div class="loading-card" style="position: relative; text-align: center;">
      <div class="loader-ring" style="position: relative; width: 60px; height: 60px; margin: 0 auto 16px;"></div>
      <img src="./imagenes/web-app-manifest-192x192.png" alt="Cargando..." onerror="this.style.display='none';" style="width: 40px; height: 40px; border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%);">
      <p style="position: relative; margin-top: 10px; color: white; font-weight: 600;">Cargando orden...</p>
    </div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn" aria-label="Volver">
          <img src="./icons/volver.png" width="20" height="20" alt="Volver" onerror="this.style.display='none'">
        </button>
        <div class="brand-text">
          <h1 id="headerTitle">ORDEN</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnSalir" aria-label="Cerrar sesión">
          <img src="./icons/salir.png" width="20" height="20" alt="Salir" onerror="this.style.display='none'">
        </button>
        <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">
          <img src="./icons/tema.png" width="20" height="20" alt="Tema" onerror="this.style.display='none'">
        </button>
      </div>
    </header>

    <!-- 🔥 ESTE ES EL CONTENEDOR QUE ORDEN.JS DEBE LLENAR -->
    <div class="app-content" id="contenido">
      <!-- Aquí se inyecta todo desde orden.js -->
    </div>
  </main>

  <!-- VISOR DE IMÁGENES -->
  <div class="sheet-backdrop" id="imgViewer" style="align-items: center; background: rgba(0,0,0,0.95);">
    <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px;">
      <button class="icon-btn" id="imgViewerCerrar" style="position: absolute; top: 20px; right: 20px;"><i class="fas fa-times"></i></button>
      <img src="" alt="Vista previa" id="imgViewerImg" style="max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px;">
    </div>
  </div>

  <!-- MODAL: AGREGAR/EDITAR SERVICIO -->
  <div class="sheet-backdrop" id="modalServicioBackdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 id="modalServicioTitulo" style="font-size: 20px; font-weight: 800; color: var(--text-1); margin-bottom: 8px;">Agregar servicio</h3>
      <div class="field">
        <label class="input-label">Descripción</label>
        <input type="text" id="servicioDescripcion" class="input-field" placeholder="Ej: Cambio de pantalla OLED">
      </div>
      <div class="field">
        <label class="input-label">Costo (Bs)</label>
        <input type="number" id="servicioCosto" class="input-field" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-secondary" id="modalServicioCancelar" style="flex: 1;">Cancelar</button>
        <button class="btn btn-primary" id="modalServicioGuardar" style="flex: 1;">Guardar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="./orden.js"></script>
  
  <script>
    // 🔥 RED DE SEGURIDAD
    setTimeout(() => {
      const loader = document.getElementById('appLoader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.3s';
        setTimeout(() => loader.style.display = 'none', 300);
      }
    }, 2000);
  </script>
</body>
</html>
