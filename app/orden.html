<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Orden</title>

  <!-- Favicons -->
  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/imagenes/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Librerías PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-title" content="DR. Xiaomi Panel">

  <style>
    :root { 
      --radius-sm: 4px; 
      --radius-md: 8px; 
      --radius-lg: 12px; 
      --brand: #E65100; 
      --brand-hover: #BF360C; 
      --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; 
      --bg-card: #181818; 
      --bg-elev: #242424; 
      --text-main: #F5F5F5; 
      --text-mute: #888888; 
      --border: #2A2A2A; 
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; 
      --bg-card: #FFFFFF; 
      --bg-elev: #F0F0F0; 
      --text-main: #111111; 
      --text-mute: #666666; 
      --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* LAYOUT TIPO APP */
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    /* HEADER */
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }

    /* SECCIONES */
    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; }
    .section-block h3 { font-size: 11px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* FILAS DE INFO */
    .fila-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; font-size: 13px; }
    .fila-info:last-child { margin-bottom: 0; }
    .fila-info .label { color: var(--text-mute); font-weight: 500; flex-shrink: 0; }
    .fila-info .valor { color: var(--text-main); font-weight: 600; text-align: right; word-break: break-word; }

    /* CHIPS DE ESTADO */
    .chip-estado { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .chip-estado[data-estado="recibido"] { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
    .chip-estado[data-estado="reparacion"] { background: rgba(230, 81, 0, 0.15); color: var(--brand); }
    .chip-estado[data-estado="espera-repuesto"] { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }
    .chip-estado[data-estado="listo"] { background: rgba(251, 191, 36, 0.15); color: #FBBF24; }
    .chip-estado[data-estado="entregado"] { background: rgba(34, 197, 94, 0.15); color: #22C55E; }
    .chip-estado[data-estado="devuelto"] { background: rgba(239, 68, 68, 0.15); color: #EF4444; }

    /* BOTONES DE ESTADO (RECTANGULARES) */
    .estado-btn { 
      display: flex; align-items: center; gap: 8px; padding: 12px 14px; 
      background: var(--bg-elev); border: 1px solid var(--border); 
      border-radius: var(--radius-sm); color: var(--text-main); 
      font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; 
      width: 100%; text-align: left; margin-bottom: 8px;
    }
    .estado-btn:active { transform: scale(0.98); }
    .estado-btn.activo { background: var(--brand-light); border-color: var(--brand); color: var(--brand); font-weight: 700; }

    /* BITÁCORA */
    .bitacora-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .bitacora-item:last-child { border-bottom: none; }
    .bitacora-icono { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
    .bitacora-icono.estado { background: rgba(230, 81, 0, 0.15); color: var(--brand); }
    .bitacora-icono.nota { background: rgba(59, 130, 246, 0.15); color: #3B82F6; }
    .bitacora-icono.foto { background: rgba(139, 92, 246, 0.15); color: #8B5CF6; }
    
    .bitacora-content { flex: 1; min-width: 0; }
    .bitacora-autor { font-size: 12px; font-weight: 700; color: var(--text-main); }
    .bitacora-fecha { font-size: 10px; color: var(--text-mute); margin-left: 6px; }
    .bitacora-texto { font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; word-wrap: break-word; }
    .bitacora-fotos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .bitacora-fotos img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: zoom-in; }

    /* FOTO UPLOADER */
    .foto-uploader { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .foto-preview { position: relative; width: 60px; height: 60px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
    .foto-preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-preview .btn-remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #EF4444; color: white; border: none; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-add-foto { width: 60px; height: 60px; border-radius: var(--radius-sm); background: var(--bg-elev); border: 1px dashed var(--border); color: var(--text-mute); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 2px; cursor: pointer; }
    .btn-add-foto i { font-size: 16px; }

    /* BOTONES GRANDES */
    .btn-grande { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; border: none; margin-top: 10px; transition: 0.2s; }
    .btn-grande:active { transform: scale(0.98); }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-pdf { background: var(--brand); color: white; }

    /* VISTA PREVIA RECIBO */
    .preview-recibo { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px; }
    .preview-header { background: linear-gradient(135deg, var(--brand), #FF8A3C); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: relative; }
    .preview-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.15); flex-shrink: 0; }
    .preview-header-text h3 { font-size: 15px; font-weight: 800; margin: 0; }
    .preview-header-text p { font-size: 10px; opacity: 0.9; margin: 2px 0 0; }
    .preview-fecha { background: var(--bg-elev); padding: 10px 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mute); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 6px; }
    .preview-fecha strong { color: var(--text-main); font-weight: 700; }
    .preview-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .preview-section:last-child { border-bottom: none; }
    .preview-section-title { font-size: 10px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .preview-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 12px; }
    .preview-row span:first-child { color: var(--text-mute); }
    .preview-row span:last-child { color: var(--text-main); font-weight: 600; text-align: right; }
    .preview-servicios-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .preview-servicios-table th { text-align: left; padding: 6px 0; font-size: 10px; color: var(--text-mute); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .preview-servicios-table td { padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--text-mute); }
    .preview-totales { margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--border); }
    .preview-totales .total-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-mute); margin-bottom: 6px; }
    .preview-totales .saldo-row { display: flex; justify-content: space-between; background: var(--brand-light); padding: 10px 12px; border-radius: var(--radius-sm); margin-top: 10px; font-size: 14px; font-weight: 800; color: var(--brand); }

    /* LOADER PRO */
    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); box-shadow: 0 0 20px rgba(230, 81, 0, 0.2); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* VISOR DE IMÁGENES */
    .img-viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .img-viewer.show { display: flex; }
    .img-viewer img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: var(--radius-sm); }
    .img-viewer .cerrar { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); color: white; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- LOADER PRO -->
  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/img/logo1.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/web-app-manifest-192x192.png'">
    </div>
    <div class="loader-text">Cargando orden...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand); font-size:18px;&quot;></i>';">
        </div>
        <div class="brand-text">
          <h1 id="headerTitle">ORDEN</h1>
          <p id="headerSubtitle">Cargando...</p>
        </div>
      </div>
    </header>

    <main class="app-content" id="contenido">
      <!-- El contenido se inyecta por JS -->
    </main>
  </div>

  <!-- VISOR DE IMÁGENES -->
  <div class="img-viewer" id="imgViewer">
    <button class="cerrar" id="imgViewerCerrar"><i class="fas fa-times"></i></button>
    <img src="" alt="Vista previa" id="imgViewerImg">
  </div>

  <script type="module" src="./orden.js"></script>
</body>
</html>
