<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Catálogo</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- NUESTROS CSS UNIFICADOS -->
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/app-layouts.css">
  <link rel="stylesheet" href="../css/app-components.css">
  <link rel="manifest" href="/manifest.json">

  <!-- ESTILOS ESPECÍFICOS DE PRECIOS -->
  <style>
    .filter-chip { padding: 8px 16px; border-radius: var(--r-full); font-size: 12px; font-weight: 600; background: var(--bg-elev-1); color: var(--text-1); border: 1px solid var(--border-1); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .filter-chip.active { background: var(--brand-500); color: white; border-color: var(--brand-500); box-shadow: 0 4px 14px var(--brand-100); }
    
    .product-card { background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; position: relative; box-shadow: var(--shadow-sm); }
    .product-card::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; background: var(--brand-500); border-radius: 0 3px 3px 0; }
    .product-card.is-orig::before { background: linear-gradient(180deg, #FFD700, #FFA500); }
    
    .card-brand { font-size: 10px; font-weight: 800; color: var(--brand-500); text-transform: uppercase; letter-spacing: 0.5px; }
    .card-model { font-size: 16px; font-weight: 700; color: var(--text-1); line-height: 1.3; }
    .card-type { padding: 4px 10px; border-radius: var(--r-sm); font-size: 10px; font-weight: 700; background: var(--bg-elev-2); color: var(--text-3); }
    .card-type.oled { background: rgba(255,105,0,0.1); color: var(--brand-500); }
    .card-type.orig { background: linear-gradient(135deg, #FFD700, #FFA500); color: #4A2800; }
    
    .card-price { font-size: 22px; font-weight: 800; color: var(--text-1); letter-spacing: -0.5px; }
    
    .image-btn, .whatsapp-btn, .edit-btn { border: none; padding: 8px 12px; border-radius: var(--r-sm); font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .image-btn { background: var(--bg-elev-2); color: var(--text-1); border: 1px solid var(--border-1); }
    .whatsapp-btn { background: #25D366; color: white; }
    .edit-btn { background: rgba(59, 130, 246, 0.15); color: #3B82F6; border: 1px solid rgba(59, 130, 246, 0.3); }
    
    .suggestions-panel { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px; background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); max-height: 320px; overflow-y: auto; display: none; z-index: 60; }
    .suggestions-panel.active { display: block; }
    .suggestion-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border-1); display: flex; align-items: center; gap: 12px; }

    /* Botón de Modo Técnico Activo */
    .tech-active { background: var(--brand-100) !important; border-color: var(--brand-500) !important; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="splash">
    <div class="loading-card"><div class="spinner"></div><p>Cargando catálogo...</p></div>
  </div>

  <main class="app-container" id="appRoot" style="opacity:0;">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><img src="/app/icons/volver.png" width="20" height="20" alt="Volver"></button>
        <div class="brand-text"><h1>Catálogo</h1><p>Precios y Compatibilidad</p></div>
      </div>
      <div class="header-actions">
        <!-- Botón Admin (solo visible para admin) -->
        <button class="icon-btn" id="adminEditBtn" style="display: none;"><i class="fas fa-list-ul" style="color:#3B82F6;"></i></button>
        
        <!-- 🔥 Botón de Modo Técnico (Ojo) -->
        <button class="icon-btn" id="techModeBtn" title="Mostrar/Ocultar precios de compra">
          <img src="/app/icons/ver.png" width="18" height="18" alt="Ver">
        </button>
        
        <!-- Botón de Nuevo Recibo -->
        <button class="icon-btn" id="receiptBtn">
          <img src="/app/icons/agregar.png" width="18" height="18" alt="Nuevo">
        </button>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="app-content" id="mainScrollContainer">
      
      <!-- BUSCADOR -->
      <div class="search-bar" style="position: relative;">
        <img src="/app/icons/buscar.png" width="18" height="18" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.5;">
        <input type="text" id="searchInput" placeholder="Buscar modelo..." autocomplete="off" style="padding-left: 44px;">
        <button id="clearSearchBtn" style="display: none; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-3);"><i class="fas fa-times"></i></button>
        <div class="suggestions-panel" id="suggestionsPanel"></div>
      </div>

      <!-- FILTROS -->
      <div class="filters-row" id="quickFilters" style="margin-bottom: 16px;">
        <button class="filter-chip active" data-filter="all">Todos</button>
        <button class="filter-chip" data-filter="ORIG">ORIG</button>
        <button class="filter-chip" data-filter="OLED">OLED</button>
        <button class="filter-chip" data-filter="LCD">LCD</button>
        <button class="filter-chip" data-filter="FAV">⭐ Favoritos</button>
        <button class="filter-chip" data-filter="COMPAT">🔄 Compatibles</button>
      </div>

      <!-- RESULTADOS -->
      <div id="resultsCount" style="font-size: 12px; color: var(--text-3); margin-bottom: 12px; display: flex; justify-content: space-between;"></div>
      <div id="resultsContainer"></div>
    </div>

    <!-- 🔥 BARRA DE NAVEGACIÓN INFERIOR CON 5 ICONOS -->
    <nav class="bottom-nav">
      <a href="/app/" class="nav-item">
        <img src="/app/icons/home.png" alt="Panel"> <span>Panel</span>
      </a>
      <a href="/app/precios/" class="nav-item active">
        <img src="/app/icons/precios.png" alt="Precios"> <span>Precios</span>
      </a>
      
      <!-- 🔥 ID para ocultar a los técnicos -->
      <a href="/app/reportes/" class="nav-item" id="navReportes">
        <img src="/app/icons/reportes.png" alt="Reportes"> <span>Reportes</span>
      </a>
      
      <a href="/app/inventario/" class="nav-item">
        <img src="/app/icons/inventario.png" alt="Stock"> <span>Stock</span>
      </a>
      
      <a href="/login/" class="nav-item" onclick="localStorage.removeItem('drx_sesion');">
        <img src="/app/icons/salir.png" alt="Salir"> <span>Salir</span>
      </a>
    </nav>
  </main>

  <script type="module" src="./precios.js"></script>
</body>
</html>
