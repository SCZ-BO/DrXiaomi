  <style>
    /* ==========================================
       WIZARD INMERSIVO - ESTILO APP NATIVA
       ========================================== */
    .wizard-progress { padding: 10px 0 16px 0; display: flex; justify-content: center; gap: 6px; }
    .wizard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-elev-3); transition: 0.3s; }
    .wizard-dot.active { background: var(--brand-500); transform: scale(1.3); box-shadow: 0 0 10px var(--brand-500); }
    .wizard-dot.done { background: var(--brand-500); opacity: 0.5; }

    .wizard-panel { display: none; animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .wizard-panel.active { display: block; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .step-indicator { font-size: 11px; font-weight: 800; color: var(--brand-500); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
    .field-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; display: block; color: var(--text-2); }

    /* 🔥 INPUTS ESTILO APP (Flotantes, oscuros y con glow) */
    .field { position: relative; margin-bottom: 16px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 16px; font-size: 15px; font-weight: 600;
      background: var(--bg-elev-2); border: 1.5px solid var(--border-1);
      border-radius: var(--r-lg); color: var(--text-1);
      transition: all 0.3s var(--ease); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      background: var(--bg-elev-1); border-color: var(--brand-500);
      box-shadow: 0 0 0 4px var(--brand-100);
    }
    .field label {
      position: absolute; left: 16px; top: 16px; font-size: 15px; color: var(--text-3);
      pointer-events: none; transition: all 0.2s var(--ease);
    }
    /* Hace que el label suba si el input tiene texto o está enfocado */
    .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label {
      top: -10px; left: 12px; font-size: 11px; font-weight: 800; color: var(--brand-500);
      background: var(--bg-base); padding: 0 6px; border-radius: 4px;
    }

    /* 🔥 SELECTOR DE MARCA */
    .marcas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .marca-btn { padding: 12px 6px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-2); font-weight: 600; font-size: 11px; cursor: pointer; transition: all 0.2s var(--ease-spring); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .marca-btn img { width: 28px; height: 28px; object-fit: contain; }
    .marca-btn.active { background: color-mix(in srgb, var(--brand-500) 15%, transparent); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 105, 0, 0.2); }
    
    /* 🔥 BOTONES DE ESTADO / SEGURIDAD */
    .radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .radio-option { padding: 14px 6px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-2); font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s var(--ease-spring); }
    .radio-option img { width: 24px; height: 24px; object-fit: contain; }
    .radio-option.active { background: color-mix(in srgb, var(--brand-500) 15%, transparent); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; transform: translateY(-2px); }

    /* 🔥 CHIPS */
    .chips-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip-btn { padding: 10px 14px; border-radius: var(--r-full); background: var(--bg-elev-1); border: 1.5px solid var(--border-2); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .chip-btn img { width: 18px; height: 18px; object-fit: contain; }
    .chip-btn.active { background: var(--brand-500); border-color: var(--brand-500); color: white; box-shadow: 0 4px 12px var(--brand-100); }

    /* 🔥 CHECKLIST */
    .checklist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .check-item { padding: 10px 4px; background: var(--bg-elev-1); border: 1.5px solid var(--border-2); border-radius: var(--r-md); color: var(--text-2); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: 0.2s var(--ease-spring); text-align: center; }
    .check-item img { width: 20px; height: 20px; object-fit: contain; opacity: 0.7; }
    .check-item.ok { background: var(--success-100); border-color: var(--success-500); color: var(--success-500); }
    .check-item.ok img { opacity: 1; }
    .check-item.falla { background: var(--danger-100); border-color: var(--danger-500); color: var(--danger-500); }
    .check-item.falla img { opacity: 1; }

    /* 🔥 FOTOS */
    .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .foto-slot { aspect-ratio: 4/3; border-radius: var(--r-lg); border: 2px dashed var(--border-2); background: var(--bg-elev-1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-3); font-size: 12px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s; }
    .foto-slot:active { transform: scale(0.98); border-color: var(--brand-500); background: color-mix(in srgb, var(--brand-500) 5%, transparent); }
    .foto-slot img.slot-icon { width: 36px; height: 36px; object-fit: contain; opacity: 0.8; }
    .foto-slot img.preview { width: 100%; height: 100%; object-fit: cover; }

    /* 🔥 SERVICIOS Y COSTOS */
    .servicio-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-1); font-size: 14px; font-weight: 600; outline: none; transition: 0.2s; }
    .servicio-item input.servicio-desc:focus { border-color: var(--brand-500); }
    .servicio-item input.servicio-costo { width: 90px; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--brand-500); font-weight: 800; text-align: right; font-size: 14px; outline: none; }
    .removeServicio { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--danger-100); color: var(--danger-500); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .removeServicio:active { transform: scale(0.9); }
    .removeServicio img { width: 20px; height: 20px; }

    /* 🔥 FOOTER INMERSIVO (Efecto Cristal) */
    .wizard-footer {
      padding: 12px 16px;
      background: color-mix(in srgb, var(--bg-base) 90%, transparent);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border-1);
      display: flex;
      gap: 10px;
      padding-bottom: calc(85px + env(safe-area-inset-bottom)); /* Deja espacio para la barra inferior */
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .wizard-footer .btn { padding: 14px; font-size: 15px; height: 52px; font-weight: 800; border-radius: var(--r-lg); }
  </style>
