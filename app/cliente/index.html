<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Nuevo Recibo</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <!-- CSS UNIFICADOS (Rutas corregidas) -->
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/app-layouts.css">
  <link rel="stylesheet" href="../css/app-components.css">

  <style>
    /* Estilos específicos del Wizard */
    .wizard-progress { padding: 10px 0 20px 0; display: flex; justify-content: center; gap: 8px; }
    .wizard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-elev-2); transition: 0.3s; }
    .wizard-dot.active { background: var(--brand-500); transform: scale(1.3); }
    .wizard-dot.done { background: var(--brand-500); opacity: 0.5; }

    .wizard-panel { display: none; animation: fadeUp 0.3s ease; }
    .wizard-panel.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .step-indicator { font-size: 12px; font-weight: 800; color: var(--brand-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .field-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; display: block; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }

    .marcas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .marca-btn { padding: 12px 6px; border-radius: 10px; border: 1px solid var(--border-1); background: var(--bg-elev-1); color: var(--text-1); font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .marca-btn.active { background: var(--brand-100); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; }
    
    .radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .radio-option { padding: 12px 6px; border-radius: 10px; border: 1px solid var(--border-1); background: var(--bg-elev-1); color: var(--text-1); font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
    .radio-option.active { background: var(--brand-100); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; }

    .chips-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip-btn { padding: 10px 14px; border-radius: 20px; background: var(--bg-elev-1); border: 1px solid var(--border-1); color: var(--text-1); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .chip-btn.active { background: var(--brand-500); border-color: var(--brand-500); color: white; }

    .checklist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .check-item { padding: 10px 4px; background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: 8px; color: var(--text-1); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s; text-align: center; }
    .check-item.ok { background: rgba(16, 185, 129, 0.1); border-color: var(--success-500); color: var(--success-500); }
    .check-item.falla { background: rgba(239, 68, 68, 0.1); border-color: var(--danger-500); color: var(--danger-500); }

    .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .foto-slot { aspect-ratio: 4/3; border-radius: 12px; border: 1px dashed var(--border-2); background: var(--bg-elev-1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-3); font-size: 12px; cursor: pointer; position: relative; overflow: hidden; }
    .foto-slot img { width: 100%; height: 100%; object-fit: cover; }
    .foto-remove { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.7); color: white; border: none; display: flex; align-items: center; justify-content: center; }

    .servicio-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-elev-1); color: var(--text-1); }
    .servicio-item input.servicio-costo { width: 90px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-1); background: var(--bg-elev-1); color: var(--brand-500); font-weight: 800; text-align: right; }
    .removeServicio { width: 42px; height: 42px; border-radius: 8px; background: rgba(239, 68, 68, 0.1); color: var(--danger-500); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- LOADER CON LOGO Y ANILLO (Igual al del panel) -->
  <div class="loading-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img">
    </div>
    <div class="loader-text">Cargando Wizard...</div>
  </div>

  <main class="app-container">
    <!-- HEADER CON LOGO -->
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backToPanelBtn">
          <img src="/app/icons/volver.png" width="20" height="20" alt="Volver">
        </button>
        
        <!-- 🔥 LOGO AGREGADO AQUÍ -->
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR Xiaomi">
        </div>
        
        <div class="brand-text">
          <h1>Nuevo Recibo</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearDraftBtn" title="Limpiar">
          <img src="/app/icons/eliminar.png" width="18" height="18" alt="Limpiar">
        </button>
        <button class="icon-btn" id="themeToggleBtn" title="Tema">
          <img src="/app/icons/tema.png" width="18" height="18" alt="Tema">
        </button>
      </div>
    </header>

    <div class="app-content" id="appBody">
      <div class="wizard-progress" id="wizardProgress">
        <div class="wizard-dot active"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
        <div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
      </div>

      <main id="wizardContent">
        <!-- PASO 1: CLIENTE -->
        <section class="wizard-panel active" data-panel="1">
          <div class="step-indicator">Paso 1 · Cliente</div>
          <div class="card">
            <div class="field"><input type="text" id="nombre" placeholder=" " autocomplete="name"><label for="nombre">Nombre completo *</label></div>
            <div class="field" style="margin-bottom: 0;"><input type="tel" id="telefono" placeholder=" " inputmode="numeric" maxlength="8"><label for="telefono">Teléfono / WhatsApp *</label></div>
          </div>
        </section>

        <!-- PASO 2: EQUIPO -->
        <section class="wizard-panel" data-panel="2">
          <div class="step-indicator">Paso 2 · Equipo</div>
          <div class="card">
            <label class="field-title">Marca *</label>
            <div class="marcas-grid" id="marcasGrid">
              <button type="button" class="marca-btn" data-marca="Xiaomi">Xiaomi</button>
              <button type="button" class="marca-btn" data-marca="Samsung">Samsung</button>
              <button type="button" class="marca-btn" data-marca="Huawei">Huawei</button>
              <button type="button" class="marca-btn" data-marca="Tecno">Tecno</button>
              <button type="button" class="marca-btn" data-marca="Honor">Honor</button>
              <button type="button" class="marca-btn" data-marca="Infinix">Infinix</button>
              <button type="button" class="marca-btn" data-marca="iPhone">iPhone</button>
              <button type="button" class="marca-btn" data-marca="Otro">Otro</button>
            </div>
            <input type="hidden" id="marca">
          </div>
          <div class="card">
            <div class="field"><input type="text" id="modelo" placeholder=" "><label for="modelo">Modelo del equipo *</label></div>
            <div class="field" style="margin-bottom: 0;"><input type="text" id="color" placeholder=" "><label for="color">Color (opcional)</label></div>
          </div>
          <div class="card">
            <label class="field-title">¿El equipo enciende? *</label>
            <div class="radio-group" id="enciendeGroup">
              <button type="button" class="radio-option" data-value="Sí"><i class="fas fa-power-off"></i><span>Sí</span></button>
              <button type="button" class="radio-option" data-value="No"><i class="fas fa-ban"></i><span>No</span></button>
              <button type="button" class="radio-option" data-value="A veces"><i class="fas fa-circle-half-stroke"></i><span>A veces</span></button>
            </div>
            <input type="hidden" id="enciende">
          </div>
        </section>

        <!-- PASO 3: RECEPCIÓN -->
        <section class="wizard-panel" data-panel="3">
          <div class="step-indicator">Paso 3 · Recepción</div>
          <div class="card" id="cardReparaciones" style="display: none;">
            <label class="field-title">1. Motivo de Reparación</label>
            <div class="chips-group" id="motivoIngresoGroup">
              <button type="button" class="chip-btn" data-value="Cambio de pantalla">📱 Cambio pantalla</button>
              <button type="button" class="chip-btn" data-value="Cambio de batería">🔋 Cambio batería</button>
              <button type="button" class="chip-btn" data-value="Módulo de carga">🔌 Módulo carga</button>
              <button type="button" class="chip-btn" data-value="Cambio de tapa">🪵 Cambio tapa</button>
              <button type="button" class="chip-btn" data-value="Problema de placa">🔬 Placa</button>
              <button type="button" class="chip-btn" data-value="Otro">🛠️ Otro</button>
            </div>
            <input type="hidden" id="motivoIngreso" value="">
          </div>
          <div class="card" id="cardAuditoriaGeneral">
            <label class="field-title">2. Auditoría General</label>
            <div class="checklist-grid" id="checklistGeneralGroup">
              <button type="button" class="check-item" data-item="Cámaras"><span>Cámaras</span></button>
              <button type="button" class="check-item" data-item="Audio"><span>Audio</span></button>
              <button type="button" class="check-item" data-item="Wi-Fi"><span>Wi-Fi</span></button>
              <button type="button" class="check-item" data-item="Táctil"><span>Táctil</span></button>
              <button type="button" class="check-item" data-item="Botones"><span>Botones</span></button>
              <button type="button" class="check-item" data-item="Batería"><span>Batería</span></button>
            </div>
          </div>
          <input type="hidden" id="checklistResultados" value="">
          <div class="card">
            <label class="field-title">Detalles extra</label>
            <div class="field" style="margin-bottom:0;"><textarea id="fallaDetalle" placeholder=" " rows="2"></textarea><label for="fallaDetalle">Escribe algo más...</label></div>
          </div>
        </section>

        <!-- PASO 4: SEGURIDAD -->
        <section class="wizard-panel" data-panel="4">
          <div class="step-indicator">Paso 4 · Seguridad</div>
          <div class="card">
            <div class="radio-group" id="tipoSeguridadGroup" style="margin-bottom:16px;">
              <button type="button" class="radio-option active" data-value="patron"><i class="fas fa-braille"></i><span>Patrón</span></button>
              <button type="button" class="radio-option" data-value="pin"><i class="fas fa-hashtag"></i><span>PIN</span></button>
              <button type="button" class="radio-option" data-value="ninguno"><i class="fas fa-lock-open"></i><span>Ninguno</span></button>
            </div>
            <input type="hidden" id="tipoSeguridad" value="patron">
            
            <div id="pinContainer" style="display: none;">
              <div class="field"><input type="text" id="pinInput" placeholder=" " maxlength="12" inputmode="numeric"><label for="pinInput">PIN de acceso</label></div>
            </div>

            <div id="patronContainer">
              <div style="position: relative; width: 100%; max-width: 260px; margin: 0 auto; aspect-ratio: 1 / 1;">
                <canvas id="bgCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
                <canvas id="lineCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%; touch-action: none;"></canvas>
              </div>
              <div style="text-align:center;margin:12px 0;">
                <span id="pattern-sequence" style="font-size: 13px; font-weight: 700; color: var(--brand-500);">Sin patrón</span>
              </div>
              <button type="button" id="clearPattern" class="btn btn-secondary" style="width: 100%;"><i class="fas fa-eraser"></i> Borrar patrón</button>
            </div>
          </div>
        </section>

        <!-- PASO 5: FOTOS -->
        <section class="wizard-panel" data-panel="5">
          <div class="step-indicator">Paso 5 · Fotos</div>
          <div class="card">
            <div class="fotos-grid" id="fotosGrid">
              <button type="button" class="foto-slot" data-slot="0"><i class="fas fa-camera"></i><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="1"><i class="fas fa-camera"></i><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="2"><i class="fas fa-camera"></i><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="3"><i class="fas fa-camera"></i><span>Añadir</span></button>
            </div>
          </div>
        </section>

        <!-- PASO 6: COSTOS -->
        <section class="wizard-panel" data-panel="6">
          <div class="step-indicator">Paso 6 · Costos</div>
          <div class="card">
            <div class="servicios-container" id="serviciosList"></div>
            <button type="button" id="addServicio" class="btn btn-secondary" style="width: 100%; margin-top: 8px;"><i class="fas fa-plus"></i> Añadir otro servicio</button>
            <div style="margin-top: 16px;">
              <label class="field-title">Precios rápidos</label>
              <div class="chips-group" id="preciosRapidosGroup">
                <button type="button" class="chip-btn" data-precio="50">Bs. 50</button>
                <button type="button" class="chip-btn" data-precio="100">Bs. 100</button>
                <button type="button" class="chip-btn" data-precio="200">Bs. 200</button>
                <button type="button" class="chip-btn" data-precio="350">Bs. 350</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div style="display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px;"><span>Total</span><strong id="costoTotalDisplay" style="color: var(--brand-500); font-size: 18px;">Bs. 0.00</strong></div>
            <div class="field"><input type="number" id="adelanto" placeholder=" " value="0"><label for="adelanto">Adelanto</label></div>
            <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border-1); padding-top: 12px; margin-top: 12px; color: var(--brand-500); font-weight: 800; font-size: 16px;"><span>Saldo a Pagar</span><strong id="saldoDisplay">Bs. 0.00</strong></div>
          </div>
          <input type="hidden" id="costoTotal" value="0">
        </section>

        <!-- PASO 7: PREVIEW -->
        <section class="wizard-panel" data-panel="7">
          <div class="step-indicator">Paso 7 · Listo</div>
          <div id="previewContainer"></div>
        </section>
      </main>
    </div>

    <!-- FOOTER (BOTONES) -->
    <div style="padding: 16px; background: var(--bg-base); border-top: 1px solid var(--border-1); display: flex; gap: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom));">
      <button type="button" class="btn btn-secondary" id="btnPrev" style="display: none; flex: 0 0 50px; padding: 14px 0;"><i class="fas fa-arrow-left"></i></button>
      <button type="button" class="btn btn-primary" id="btnNext" style="flex: 1;">Siguiente <i class="fas fa-arrow-right"></i></button>
      <button type="button" class="btn btn-primary" id="btnGenerate" style="display: none; flex: 1;"><i class="fas fa-paper-plane"></i> Generar Recibo</button>
    </div>
  </main>

  <!-- MODAL ÉXITO -->
  <div class="sheet-backdrop" id="successModal">
    <div class="sheet" style="text-align: center;">
      <div class="sheet-handle"></div>
      <div style="font-size: 56px; color: var(--success-500); margin-bottom: 16px;"><i class="fas fa-check-circle"></i></div>
      <h3 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--text-1);">¡Recibo guardado!</h3>
      <p style="font-size: 15px; color: var(--text-3); margin-bottom: 24px;" id="successNumero">REC-XXX</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-whatsapp" id="sendWhatsappBtn"><i class="fab fa-whatsapp"></i> Enviar recibo por WhatsApp</button>
        <button class="btn btn-secondary" id="backToPanelBtn2">Volver al panel</button>
      </div>
    </div>
  </div>

  <!-- MODAL FOTO -->
  <div class="sheet-backdrop" id="fotoSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 style="margin-bottom: 20px; text-align: center; font-weight: 800;">Añadir foto</h3>
      <button type="button" class="btn btn-primary" id="btnTomarFoto" style="width: 100%; margin-bottom: 10px;"><i class="fas fa-camera"></i> Tomar Foto</button>
      <button type="button" class="btn btn-secondary" id="btnSubirFoto" style="width: 100%; margin-bottom: 10px;"><i class="fas fa-image"></i> Elegir de Galería</button>
      <button type="button" class="btn" id="btnCancelarFoto" style="width: 100%; background:transparent; color:var(--text-3);">Cancelar</button>
    </div>
  </div>

  <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display: none;">
  <input type="file" id="inputGaleria" accept="image/*" style="display: none;">

  <script type="module" src="/app/js/clientes.js"></script>
</body>
</html>
