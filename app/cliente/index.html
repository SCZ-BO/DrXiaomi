<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Nuevo Recibo</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <!-- CSS UNIFICADOS -->
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/app-layouts.css">
  <link rel="stylesheet" href="../css/app-components.css">

  <style>
    /* ==========================================
       WIZARD INMERSIVO - ESTILO APP NATIVA
       ========================================== */
    .wizard-progress { padding: 10px 0 16px 0; display: flex; justify-content: center; gap: 6px; }
    .wizard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-elev-3); transition: 0.3s; }
    .wizard-dot.active { background: var(--brand-500); transform: scale(1.3); box-shadow: 0 0 10px var(--brand-500); }
    .wizard-dot.done { background: var(--brand-500); opacity: 0.5; }

    .wizard-panel { display: none; animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .wizard-panel.active { display: block; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .step-indicator { font-size: 11px; font-weight: 800; color: var(--brand-500); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
    .field-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; display: block; color: var(--text-2); }

    /* 🔥 INPUTS ESTILO APP (Flotantes, oscuros y con glow) */
    .field { position: relative; margin-bottom: 16px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 16px; font-size: 15px; font-weight: 600;
      background: var(--bg-elev-2); border: 1.5px solid var(--border-1);
      border-radius: var(--r-lg); color: var(--text-1);
      transition: all 0.3s var(--ease); outline: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      background: var(--bg-elev-1); border-color: var(--brand-500);
      box-shadow: 0 0 0 4px var(--brand-100);
    }
    .field label {
      position: absolute; left: 16px; top: 16px; font-size: 15px; color: var(--text-3);
      pointer-events: none; transition: all 0.2s var(--ease);
    }
    .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label,
    .field textarea:focus ~ label, .field textarea:not(:placeholder-shown) ~ label {
      top: -10px; left: 12px; font-size: 11px; font-weight: 800; color: var(--brand-500);
      background: var(--bg-base); padding: 0 6px; border-radius: 4px;
    }

    /* 🔥 SELECTOR DE MARCA */
    .marcas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .marca-btn { padding: 12px 6px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-2); font-weight: 600; font-size: 11px; cursor: pointer; transition: all 0.2s var(--ease-spring); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .marca-btn img { width: 28px; height: 28px; object-fit: contain; }
    .marca-btn.active { background: color-mix(in srgb, var(--brand-500) 15%, transparent); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 105, 0, 0.2); }
    
    /* 🔥 BOTONES DE ESTADO */
    .radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .radio-option { padding: 14px 6px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-2); font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s var(--ease-spring); }
    .radio-option img { width: 24px; height: 24px; object-fit: contain; }
    .radio-option.active { background: color-mix(in srgb, var(--brand-500) 15%, transparent); border-color: var(--brand-500); color: var(--brand-500); font-weight: 800; transform: translateY(-2px); }

    /* 🔥 CHIPS */
    .chips-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip-btn { padding: 10px 14px; border-radius: var(--r-full); background: var(--bg-elev-1); border: 1.5px solid var(--border-2); color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .chip-btn img { width: 18px; height: 18px; object-fit: contain; }
    .chip-btn.active { background: var(--brand-500); border-color: var(--brand-500); color: white; box-shadow: 0 4px 12px var(--brand-100); }

    /* 🔥 CHECKLIST */
    .checklist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .check-item { padding: 10px 4px; background: var(--bg-elev-1); border: 1.5px solid var(--border-2); border-radius: var(--r-md); color: var(--text-2); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: 0.2s var(--ease-spring); text-align: center; }
    .check-item img { width: 20px; height: 20px; object-fit: contain; opacity: 0.7; }
    .check-item.ok { background: var(--success-100); border-color: var(--success-500); color: var(--success-500); }
    .check-item.ok img { opacity: 1; }
    .check-item.falla { background: var(--danger-100); border-color: var(--danger-500); color: var(--danger-500); }
    .check-item.falla img { opacity: 1; }

    /* 🔥 FOTOS */
    .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .foto-slot { aspect-ratio: 4/3; border-radius: var(--r-lg); border: 2px dashed var(--border-2); background: var(--bg-elev-1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-3); font-size: 12px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s; }
    .foto-slot:active { transform: scale(0.98); border-color: var(--brand-500); background: color-mix(in srgb, var(--brand-500) 5%, transparent); }
    .foto-slot img.slot-icon { width: 36px; height: 36px; object-fit: contain; opacity: 0.8; }
    .foto-slot img.preview { width: 100%; height: 100%; object-fit: cover; }

    /* 🔥 SERVICIOS Y COSTOS */
    .servicio-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--text-1); font-size: 14px; font-weight: 600; outline: none; transition: 0.2s; }
    .servicio-item input.servicio-desc:focus { border-color: var(--brand-500); }
    .servicio-item input.servicio-costo { width: 90px; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--border-2); background: var(--bg-elev-1); color: var(--brand-500); font-weight: 800; text-align: right; font-size: 14px; outline: none; }
    .removeServicio { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--danger-100); color: var(--danger-500); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .removeServicio:active { transform: scale(0.9); }
    .removeServicio img { width: 20px; height: 20px; }

    /* 🔥 FOOTER INMERSIVO (Efecto Cristal) */
    .wizard-footer {
      padding: 12px 16px;
      background: color-mix(in srgb, var(--bg-base) 90%, transparent);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border-1);
      display: flex;
      gap: 10px;
      padding-bottom: calc(85px + env(safe-area-inset-bottom));
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .wizard-footer .btn { padding: 14px; font-size: 15px; height: 52px; font-weight: 800; border-radius: var(--r-lg); }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img">
    </div>
    <div class="loader-text">Cargando Wizard...</div>
  </div>

  <main class="app-container">
    <!-- HEADER SE INYECTA DESDE LAYOUT.JS -->
    <script type="module">
      import { montarLayout } from '../js/layout.js';
      montarLayout({ titulo: 'Nuevo Recibo', padre: '/app/', activo: 'panel' });
    </script>

    <div class="app-content" id="appBody">
      <div class="wizard-progress" id="wizardProgress">
        <div class="wizard-dot active"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
        <div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
      </div>

      <main id="wizardContent">
        <!-- PASO 1: CLIENTE -->
        <section class="wizard-panel active" data-panel="1">
          <div class="step-indicator">Paso 1 · Cliente</div>
          <div class="card">
            <div class="field"><input type="text" id="nombre" placeholder=" " autocomplete="name"><label for="nombre">Nombre completo *</label></div>
            <div class="field" style="margin-bottom: 0;"><input type="tel" id="telefono" placeholder=" " inputmode="numeric" maxlength="8"><label for="telefono">Teléfono / WhatsApp *</label></div>
          </div>
        </section>

        <!-- PASO 2: EQUIPO -->
        <section class="wizard-panel" data-panel="2">
          <div class="step-indicator">Paso 2 · Equipo</div>
          <div class="card">
            <label class="field-title">Marca *</label>
            <div class="marcas-grid" id="marcasGrid">
              <button type="button" class="marca-btn" data-marca="Xiaomi"><img src="/app/icons/telefono.png" alt="Xiaomi">Xiaomi</button>
              <button type="button" class="marca-btn" data-marca="Samsung"><img src="/app/icons/telefono.png" alt="Samsung">Samsung</button>
              <button type="button" class="marca-btn" data-marca="Huawei"><img src="/app/icons/telefono.png" alt="Huawei">Huawei</button>
              <button type="button" class="marca-btn" data-marca="Tecno"><img src="/app/icons/telefono.png" alt="Tecno">Tecno</button>
              <button type="button" class="marca-btn" data-marca="Honor"><img src="/app/icons/telefono.png" alt="Honor">Honor</button>
              <button type="button" class="marca-btn" data-marca="Infinix"><img src="/app/icons/telefono.png" alt="Infinix">Infinix</button>
              <button type="button" class="marca-btn" data-marca="iPhone"><img src="/app/icons/telefono.png" alt="iPhone">iPhone</button>
              <button type="button" class="marca-btn" data-marca="Otro"><img src="/app/icons/agregar.png" alt="Otro">Otro</button>
            </div>
            <input type="hidden" id="marca">
          </div>
          <div class="card">
            <div class="field"><input type="text" id="modelo" placeholder=" "><label for="modelo">Modelo del equipo *</label></div>
            <div class="field" style="margin-bottom: 0;"><input type="text" id="color" placeholder=" "><label for="color">Color (opcional)</label></div>
          </div>
          <div class="card">
            <label class="field-title">¿El equipo enciende? *</label>
            <div class="radio-group" id="enciendeGroup">
              <button type="button" class="radio-option" data-value="Sí"><img src="/app/icons/bateria.png" alt="Sí"><span>Sí</span></button>
              <button type="button" class="radio-option" data-value="No"><img src="/app/icons/falla.png" alt="No"><span>No</span></button>
              <button type="button" class="radio-option" data-value="A veces"><img src="/app/icons/estado-reparacion.png" alt="A veces"><span>A veces</span></button>
            </div>
            <input type="hidden" id="enciende">
          </div>
        </section>

        <!-- PASO 3: RECEPCIÓN -->
        <section class="wizard-panel" data-panel="3">
          <div class="step-indicator">Paso 3 · Recepción</div>
          <div class="card" id="cardReparaciones" style="display: none;">
            <label class="field-title">1. Motivo de Reparación</label>
            <div class="chips-group" id="motivoIngresoGroup">
              <button type="button" class="chip-btn" data-value="Cambio de pantalla"><img src="/app/icons/telefono.png" alt="Pantalla"> Pantalla</button>
              <button type="button" class="chip-btn" data-value="Cambio de batería"><img src="/app/icons/bateria.png" alt="Batería"> Batería</button>
              <button type="button" class="chip-btn" data-value="Módulo de carga"><img src="/app/icons/servicios.png" alt="Carga"> Carga</button>
              <button type="button" class="chip-btn" data-value="Cambio de tapa"><img src="/app/icons/inventario.png" alt="Tapa"> Tapa</button>
              <button type="button" class="chip-btn" data-value="Problema de placa"><img src="/app/icons/estado-reparacion.png" alt="Placa"> Placa</button>
              <button type="button" class="chip-btn" data-value="Otro"><img src="/app/icons/servicios.png" alt="Otro"> Otro</button>
            </div>
            <input type="hidden" id="motivoIngreso" value="">
          </div>
          
          <div class="card" id="cardAuditoriaGeneral">
            <label class="field-title">2. Auditoría General</label>
            <div class="checklist-grid" id="checklistGeneralGroup">
              <button type="button" class="check-item" data-item="Cámaras"><img src="/app/icons/camara.png" alt="Cámaras"><span>Cámaras</span></button>
              <button type="button" class="check-item" data-item="Audio"><img src="/app/icons/servicios.png" alt="Audio"><span>Audio</span></button>
              <button type="button" class="check-item" data-item="Wi-Fi"><img src="/app/icons/estado-reparacion.png" alt="Wi-Fi"><span>Wi-Fi</span></button>
              <button type="button" class="check-item" data-item="Táctil"><img src="/app/icons/telefono.png" alt="Táctil"><span>Táctil</span></button>
              <button type="button" class="check-item" data-item="Botones"><img src="/app/icons/agregar.png" alt="Botones"><span>Botones</span></button>
              <button type="button" class="check-item" data-item="Batería"><img src="/app/icons/bateria.png" alt="Batería"><span>Batería</span></button>
            </div>
          </div>
          <input type="hidden" id="checklistResultados" value="">
          <div class="card">
            <label class="field-title">Detalles extra</label>
            <div class="field" style="margin-bottom:0;"><textarea id="fallaDetalle" placeholder=" " rows="2"></textarea><label for="fallaDetalle">Escribe algo más...</label></div>
          </div>
        </section>

        <!-- PASO 4: SEGURIDAD -->
        <section class="wizard-panel" data-panel="4">
          <div class="step-indicator">Paso 4 · Seguridad</div>
          <div class="card">
            <div class="radio-group" id="tipoSeguridadGroup" style="margin-bottom:16px;">
              <button type="button" class="radio-option active" data-value="patron"><img src="/app/icons/patron.png" alt="Patrón"><span>Patrón</span></button>
              <button type="button" class="radio-option" data-value="pin"><img src="/app/icons/falla.png" alt="PIN"><span>PIN</span></button>
              <button type="button" class="radio-option" data-value="ninguno"><img src="/app/icons/cliente.png" alt="Ninguno"><span>Ninguno</span></button>
            </div>
            <input type="hidden" id="tipoSeguridad" value="patron">
            
            <div id="pinContainer" style="display: none;">
              <div class="field"><input type="text" id="pinInput" placeholder=" " maxlength="12" inputmode="numeric"><label for="pinInput">PIN de acceso</label></div>
            </div>

            <div id="patronContainer">
              <div style="position: relative; width: 100%; max-width: 260px; margin: 0 auto; aspect-ratio: 1 / 1;">
                <canvas id="bgCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
                <canvas id="lineCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%; touch-action: none;"></canvas>
              </div>
              <div style="text-align:center;margin:12px 0;">
                <span id="pattern-sequence" style="font-size: 13px; font-weight: 700; color: var(--brand-500);">Sin patrón</span>
              </div>
              <button type="button" id="clearPattern" class="btn btn-secondary" style="width: 100%;"><img src="/app/icons/eliminar.png" width="18" style="margin-right:6px;"> Borrar patrón</button>
            </div>
          </div>
        </section>

        <!-- PASO 5: FOTOS -->
        <section class="wizard-panel" data-panel="5">
          <div class="step-indicator">Paso 5 · Fotos</div>
          <div class="card">
            <div class="fotos-grid" id="fotosGrid">
              <button type="button" class="foto-slot" data-slot="0"><img src="/app/icons/camara.png" class="slot-icon" alt="Añadir"><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="1"><img src="/app/icons/camara.png" class="slot-icon" alt="Añadir"><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="2"><img src="/app/icons/camara.png" class="slot-icon" alt="Añadir"><span>Añadir</span></button>
              <button type="button" class="foto-slot" data-slot="3"><img src="/app/icons/camara.png" class="slot-icon" alt="Añadir"><span>Añadir</span></button>
            </div>
          </div>
        </section>

        <!-- PASO 6: COSTOS -->
        <section class="wizard-panel" data-panel="6">
          <div class="step-indicator">Paso 6 · Costos</div>
          <div class="card">
            <div class="servicios-container" id="serviciosList"></div>
            <button type="button" id="addServicio" class="btn btn-secondary" style="width: 100%; margin-top: 8px;"><img src="/app/icons/agregar.png" width="18" style="margin-right:6px;"> Añadir otro servicio</button>
            <div style="margin-top: 12px;">
              <label class="field-title">Precios rápidos</label>
              <div class="chips-group" id="preciosRapidosGroup">
                <button type="button" class="chip-btn" data-precio="50">Bs. 50</button>
                <button type="button" class="chip-btn" data-precio="100">Bs. 100</button>
                <button type="button" class="chip-btn" data-precio="200">Bs. 200</button>
                <button type="button" class="chip-btn" data-precio="350">Bs. 350</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div style="display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px;"><span>Total</span><strong id="costoTotalDisplay" style="color: var(--brand-500); font-size: 18px;">Bs. 0.00</strong></div>
            <div class="field"><input type="number" id="adelanto" placeholder=" " value="0"><label for="adelanto">Adelanto</label></div>
            <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border-1); padding-top: 12px; margin-top: 12px; color: var(--brand-500); font-weight: 800; font-size: 16px;"><span>Saldo a Pagar</span><strong id="saldoDisplay">Bs. 0.00</strong></div>
          </div>
          <input type="hidden" id="costoTotal" value="0">
        </section>

        <!-- PASO 7: PREVIEW -->
        <section class="wizard-panel" data-panel="7">
          <div class="step-indicator">Paso 7 · Listo</div>
          <div id="previewContainer"></div>
        </section>
      </main>
    </div>

    <!-- FOOTER DEL WIZARD (BOTONES) -->
    <div class="wizard-footer">
      <button type="button" class="btn btn-secondary" id="btnPrev" style="display: none; flex: 0 0 50px; padding: 14px 0;"><i class="fas fa-arrow-left"></i></button>
      <button type="button" class="btn btn-primary" id="btnNext" style="flex: 1;">Siguiente <i class="fas fa-arrow-right"></i></button>
      <button type="button" class="btn btn-primary" id="btnGenerate" style="display: none; flex: 1;"><i class="fas fa-paper-plane"></i> Generar Recibo</button>
    </div>
  </main>

  <!-- MODAL ÉXITO -->
  <div class="sheet-backdrop" id="successModal">
    <div class="sheet" style="text-align: center;">
      <div class="sheet-handle"></div>
      <div style="margin-bottom: 16px;"><img src="/app/icons/cierre.png" width="64" alt="Éxito"></div>
      <h3 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; color: var(--text-1);">¡Recibo guardado!</h3>
      <p style="font-size: 15px; color: var(--text-3); margin-bottom: 24px;" id="successNumero">REC-XXX</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-whatsapp" id="sendWhatsappBtn"><img src="/app/icons/whatsapp.png" width="20" style="margin-right:6px;"> Enviar recibo por WhatsApp</button>
        <button class="btn btn-secondary" id="backToPanelBtn2">Volver al panel</button>
      </div>
    </div>
  </div>

  <!-- MODAL FOTO -->
  <div class="sheet-backdrop" id="fotoSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 style="margin-bottom: 20px; text-align: center; font-weight: 800;">Añadir foto</h3>
      <button type="button" class="btn btn-primary" id="btnTomarFoto" style="width: 100%; margin-bottom: 10px;"><img src="/app/icons/camara.png" width="20" style="margin-right:6px;"> Tomar Foto</button>
      <button type="button" class="btn btn-secondary" id="btnSubirFoto" style="width: 100%; margin-bottom: 10px;"><img src="/app/icons/galeria.png" width="20" style="margin-right:6px;"> Elegir de Galería</button>
      <button type="button" class="btn" id="btnCancelarFoto" style="width: 100%; background:transparent; color:var(--text-3);">Cancelar</button>
    </div>
  </div>

  <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display: none;">
  <input type="file" id="inputGaleria" accept="image/*" style="display: none;">

  <script type="module" src="/app/js/clientes.js"></script>

  <!-- 🔥 PARACAÍDAS DE SEGURIDAD -->
  <script>
    setTimeout(() => {
      const loader = document.getElementById('appLoader');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        console.log('✅ Loader cerrado por seguridad.');
      }
    }, 2000);
  </script>
</body>
</html>
