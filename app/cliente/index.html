<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Nuevo Recibo</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="manifest" href="/manifest.json">

  <style>
    :root { 
      --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px;
      --brand: #FF6900; --brand-glow: rgba(255, 105, 0, 0.3); 
      --bg-main: #0A0A0B; --bg-card: #121214; --bg-elev: #1A1A1D; 
      --text-main: #FAFAFA; --text-mute: #888888; --border: rgba(255, 255, 255, 0.08); 
      --success: #10B981; --red: #EF4444;
    }
    [data-theme="light"] {
      --bg-main: #F8F8F9; --bg-card: #FFFFFF; --bg-elev: #F5F5F6; 
      --text-main: #111111; --text-mute: #666666; --border: rgba(0, 0, 0, 0.06); 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-header { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 16px 20px; background: rgba(10, 10, 11, 0.8); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); z-index: 100; position: sticky; top: 0;
      padding-top: calc(16px + env(safe-area-inset-top));
    }
    .app-body { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
    .brand-text p { font-size: 12px; color: var(--text-mute); margin: 0; font-weight: 500; }
    
    .header-actions { display: flex; gap: 10px; }
    .icon-btn { 
      width: 40px; height: 40px; border-radius: 50%; background: var(--bg-elev); 
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; 
      cursor: pointer; transition: 0.2s; 
    }
    .icon-btn:active { transform: scale(0.9); background: var(--bg-card); }

    .wizard-progress { padding: 0 0 24px 0; display: flex; justify-content: center; gap: 6px; }
    .wizard-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-elev); transition: 0.3s; }
    .wizard-dot.active { background: var(--brand); transform: scale(1.3); box-shadow: 0 0 10px var(--brand-glow); }
    .wizard-dot.done { background: var(--brand); opacity: 0.4; }

    .step-indicator { font-size: 13px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; }
    
    /* 🔥 ESTILOS MODERNOS PARA LOS INPUTS */
    .field { position: relative; margin-bottom: 16px; }
    .field input, .field textarea { 
      width: 100%; padding: 16px 16px 16px 16px; background: var(--bg-elev); 
      border: 1.5px solid transparent; border-radius: var(--radius-md); 
      color: var(--text-main); font-size: 16px; font-family: inherit; 
      font-weight: 500; transition: all 0.3s ease; outline: none; 
    }
    .field input:focus, .field textarea:focus { 
      border-color: var(--brand); background: var(--bg-card); 
      box-shadow: 0 4px 12px rgba(255, 105, 0, 0.1); 
    }
    .field label { 
      position: absolute; left: 16px; top: 16px; font-size: 15px; 
      color: var(--text-mute); transition: 0.2s; pointer-events: none; font-weight: 500;
    }
    .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label, 
    .field textarea:focus ~ label, .field textarea:not(:placeholder-shown) ~ label { 
      top: 6px; font-size: 11px; font-weight: 700; color: var(--brand); 
    }

    .field-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: block; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* GRIDS */
    .marcas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .marca-btn { padding: 12px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .marca-btn.active { background: rgba(255, 105, 0, 0.15); border-color: var(--brand); color: var(--brand); font-weight: 800; }
    
    .radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .radio-option { padding: 14px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; }
    .radio-option.active { background: rgba(255, 105, 0, 0.15); border-color: var(--brand); color: var(--brand); font-weight: 800; }
    .radio-option i { font-size: 18px; }

    .chips-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chip-btn { padding: 10px 16px; border-radius: 20px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-main); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .chip-btn.active { background: var(--brand); border-color: var(--brand); color: white; box-shadow: 0 4px 12px var(--brand-glow); }

    .checklist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .check-item { padding: 12px 6px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; text-align: center; }
    .check-item::before { content: '?'; font-weight: 800; color: var(--text-mute); font-size: 12px; }
    .check-item.ok { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
    .check-item.ok::before { content: '✓'; color: var(--success); }
    .check-item.falla { background: rgba(239, 68, 68, 0.1); border-color: var(--red); color: var(--red); }
    .check-item.falla::before { content: '✕'; color: var(--red); }

    .fotos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .foto-slot { aspect-ratio: 4/3; border-radius: var(--radius-sm); border: 2px dashed var(--border); background: var(--bg-elev); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-mute); font-size: 13px; font-weight: 600; cursor: pointer; position: relative; overflow: hidden; transition: 0.2s; }
    .foto-slot:hover { border-color: var(--brand); color: var(--brand); }
    .foto-slot img { width: 100%; height: 100%; object-fit: cover; }
    .foto-remove { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.8); color: white; border: none; display: flex; align-items: center; justify-content: center; }

    .servicio-item { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); font-size: 14px; font-weight: 500; }
    .servicio-item input.servicio-costo { width: 100px; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--brand); font-weight: 800; text-align: right; font-size: 15px; }
    .removeServicio { width: 46px; height: 46px; border-radius: var(--radius-sm); background: rgba(239, 68, 68, 0.1); color: var(--red); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    .resumen-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .resumen-saldo { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; color: var(--brand); font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

    /* BOTONES FIJOS */
    .wizard-footer { 
      padding: 16px 20px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); 
      background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); display: flex; gap: 12px; 
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; 
      max-width: 600px; margin: 0 auto;
    }
    .btn { padding: 16px; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 6px 20px var(--brand-glow); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    #btnPrev { flex: 0 0 56px; padding: 16px 0; }
    #btnNext, #btnGenerate { flex: 1; }

    .sheet-backdrop, .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; }
    .sheet-backdrop { align-items: flex-end; }
    .sheet-backdrop.show, .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 24px; width: 100%; max-width: 500px; border-top: 1px solid var(--border); }
    .modal { background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <button class="icon-btn" id="backToPanelBtn">
        <img src="/app/icons/volver.png" width="20" height="20" alt="Volver">
      </button>
      <div class="brand-text"><h1>Nuevo Recibo</h1><p id="userInfo">Cargando...</p></div>
    </div>
    
    <div class="header-actions">
      <button class="icon-btn" id="clearDraftBtn" title="Limpiar">
        <img src="/app/icons/eliminar.png" width="18" height="18" alt="Limpiar">
      </button>
      <button class="icon-btn" id="themeToggleBtn" title="Tema">
        <img src="/app/icons/tema.png" width="18" height="18" alt="Tema">
      </button>
    </div>
  </header>

  <div class="app-body" id="appBody">
    <div class="wizard-progress" id="wizardProgress">
      <div class="wizard-dot active"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
      <div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div><div class="wizard-dot"></div>
    </div>

    <main id="wizardContent">
      <!-- PASO 1 -->
      <section class="wizard-panel" data-panel="1" aria-hidden="false">
        <div class="step-indicator">Paso 1 · Cliente</div>
        <div class="card">
          <div class="field"><input type="text" id="nombre" placeholder=" " required autocomplete="name"><label for="nombre">Nombre completo *</label></div>
          <div class="field" style="margin-bottom:0;"><input type="tel" id="telefono" placeholder=" " required inputmode="numeric" maxlength="8"><label for="telefono">Teléfono / WhatsApp *</label></div>
        </div>
      </section>

      <!-- PASO 2 -->
      <section class="wizard-panel hidden" data-panel="2" aria-hidden="true">
        <div class="step-indicator">Paso 2 · Equipo</div>
        <div class="card">
          <label class="field-title">Marca *</label>
          <div class="marcas-grid" id="marcasGrid">
            <button type="button" class="marca-btn" data-marca="Xiaomi">Xiaomi</button>
            <button type="button" class="marca-btn" data-marca="Samsung">Samsung</button>
            <button type="button" class="marca-btn" data-marca="Huawei">Huawei</button>
            <button type="button" class="marca-btn" data-marca="Tecno">Tecno</button>
            <button type="button" class="marca-btn" data-marca="Honor">Honor</button>
            <button type="button" class="marca-btn" data-marca="Infinix">Infinix</button>
            <button type="button" class="marca-btn" data-marca="iPhone">iPhone</button>
            <button type="button" class="marca-btn" data-marca="Otro">Otro</button>
          </div>
          <input type="hidden" id="marca" required>
        </div>
        <div class="card">
          <div class="field"><input type="text" id="modelo" placeholder=" " required><label for="modelo">Modelo del equipo *</label></div>
          <div class="field" style="margin-bottom: 0;"><input type="text" id="color" placeholder=" "><label for="color">Color (opcional)</label></div>
        </div>
        <div class="card">
          <label class="field-title">¿El equipo enciende? *</label>
          <div class="radio-group" id="enciendeGroup">
            <button type="button" class="radio-option" data-value="Sí"><i class="fas fa-power-off"></i><span>Sí</span></button>
            <button type="button" class="radio-option" data-value="No"><i class="fas fa-ban"></i><span>No</span></button>
            <button type="button" class="radio-option" data-value="A veces"><i class="fas fa-circle-half-stroke"></i><span>A veces</span></button>
          </div>
          <input type="hidden" id="enciende" required>
        </div>
      </section>

      <!-- PASO 3 -->
      <section class="wizard-panel hidden" data-panel="3" aria-hidden="true">
        <div class="step-indicator">Paso 3 · Recepción</div>
        <div class="card hidden" id="cardReparaciones">
          <label class="field-title">1. Motivo de Reparación</label>
          <div class="chips-group" id="motivoIngresoGroup">
            <button type="button" class="chip-btn" data-value="Cambio de pantalla">📱 Cambio pantalla</button>
            <button type="button" class="chip-btn" data-value="Cambio de batería">🔋 Cambio batería</button>
            <button type="button" class="chip-btn" data-value="Módulo de carga">🔌 Módulo carga</button>
            <button type="button" class="chip-btn" data-value="Cambio de tapa">🪵 Cambio tapa</button>
            <button type="button" class="chip-btn" data-value="Problema de placa">🔬 Placa</button>
            <button type="button" class="chip-btn" data-value="Otro">🛠️ Otro</button>
          </div>
          <input type="hidden" id="motivoIngreso" value="">
        </div>
        <div class="card hidden" id="cardAuditoriaGeneral">
          <label class="field-title">2. Auditoría General</label>
          <div class="checklist-grid" id="checklistGeneralGroup">
            <button type="button" class="check-item" data-item="Cámaras"><span>Cámaras</span></button>
            <button type="button" class="check-item" data-item="Audio"><span>Audio</span></button>
            <button type="button" class="check-item" data-item="Wi-Fi"><span>Wi-Fi</span></button>
            <button type="button" class="check-item" data-item="Táctil"><span>Táctil</span></button>
            <button type="button" class="check-item" data-item="Botones"><span>Botones</span></button>
            <button type="button" class="check-item" data-item="Batería"><span>Batería</span></button>
          </div>
        </div>
        <div class="card hidden" id="cardAuditoriaFisica">
          <label class="field-title">Auditoría Física</label>
          <div class="checklist-grid" id="checklistFisicoGroup">
            <button type="button" class="check-item" data-item="Pantalla"><span>Pantalla sana</span></button>
            <button type="button" class="check-item" data-item="Tapa trasera"><span>Tapa trasera</span></button>
            <button type="button" class="check-item" data-item="Botones"><span>Botones</span></button>
          </div>
        </div>
        <input type="hidden" id="checklistResultados" value="">
        <div class="card">
          <label class="field-title">Detalles extra (opcional)</label>
          <div class="field" style="margin-bottom:0;"><textarea id="fallaDetalle" placeholder=" " rows="2"></textarea><label for="fallaDetalle">Escribe algo más...</label></div>
        </div>
      </section>

      <!-- PASO 4 -->
      <section class="wizard-panel hidden" data-panel="4" aria-hidden="true">
        <div class="step-indicator">Paso 4 · Seguridad</div>
        <div class="card">
          <div class="radio-group" id="tipoSeguridadGroup" style="margin-bottom:16px;">
            <button type="button" class="radio-option active" data-value="patron"><i class="fas fa-braille"></i><span>Patrón</span></button>
            <button type="button" class="radio-option" data-value="pin"><i class="fas fa-hashtag"></i><span>PIN</span></button>
            <button type="button" class="radio-option" data-value="ninguno"><i class="fas fa-lock-open"></i><span>Ninguno</span></button>
          </div>
          <input type="hidden" id="tipoSeguridad" value="patron">
          
          <div id="pinContainer" class="hidden">
            <div class="field"><input type="text" id="pinInput" placeholder=" " maxlength="12" inputmode="numeric"><label for="pinInput">PIN de acceso</label></div>
          </div>

          <div id="patronContainer">
            <div style="position: relative; width: 100%; max-width: 260px; margin: 0 auto; aspect-ratio: 1 / 1;">
              <canvas id="bgCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
              <canvas id="lineCanvas" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%; touch-action: none;"></canvas>
            </div>
            <div style="text-align:center;margin:12px 0;">
              <span id="pattern-sequence" style="font-size: 13px; font-weight: 700; color: var(--brand);">Sin patrón</span>
            </div>
            <button type="button" id="clearPattern" class="btn btn-secondary" style="width: 100%;"><i class="fas fa-eraser"></i> Borrar patrón</button>
          </div>
        </div>
      </section>

      <!-- PASO 5 -->
      <section class="wizard-panel hidden" data-panel="5" aria-hidden="true">
        <div class="step-indicator">Paso 5 · Fotos</div>
        <div class="card">
          <div class="fotos-grid" id="fotosGrid">
            <button type="button" class="foto-slot" data-slot="0"><i class="fas fa-camera"></i><span>Añadir</span></button>
            <button type="button" class="foto-slot" data-slot="1"><i class="fas fa-camera"></i><span>Añadir</span></button>
            <button type="button" class="foto-slot" data-slot="2"><i class="fas fa-camera"></i><span>Añadir</span></button>
            <button type="button" class="foto-slot" data-slot="3"><i class="fas fa-camera"></i><span>Añadir</span></button>
          </div>
        </div>
      </section>

      <!-- PASO 6 -->
      <section class="wizard-panel hidden" data-panel="6" aria-hidden="true">
        <div class="step-indicator">Paso 6 · Costos</div>
        <div class="card">
          <div class="servicios-container" id="serviciosList"></div>
          <button type="button" id="addServicio" class="btn btn-secondary" style="width: 100%; margin-top: 12px;"><i class="fas fa-plus"></i> Añadir otro servicio</button>
          <div style="margin-top: 20px;">
            <label class="field-title" style="font-size: 11px;">Precios rápidos</label>
            <div class="chips-group" id="preciosRapidosGroup" style="margin-bottom:0;">
              <button type="button" class="chip-btn" data-precio="50">Bs. 50</button>
              <button type="button" class="chip-btn" data-precio="100">Bs. 100</button>
              <button type="button" class="chip-btn" data-precio="200">Bs. 200</button>
              <button type="button" class="chip-btn" data-precio="350">Bs. 350</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="resumen-row"><span>Total</span><strong id="costoTotalDisplay" style="color: var(--brand); font-size: 18px;">Bs. 0.00</strong></div>
          <div class="field"><input type="number" id="adelanto" placeholder=" " value="0"><label for="adelanto">Adelanto</label></div>
          <div class="resumen-row resumen-saldo"><span>Saldo pendiente</span><strong id="saldoDisplay">Bs. 0.00</strong></div>
        </div>
        <input type="hidden" id="costoTotal" value="0">
      </section>

      <!-- PASO 7 -->
      <section class="wizard-panel hidden" data-panel="7" aria-hidden="true">
        <div class="step-indicator">Paso 7 · Listo</div>
        <div id="previewContainer"></div>
      </section>
    </main>
  </div>

  <footer class="wizard-footer" id="wizardFooter">
    <button type="button" class="btn btn-secondary" id="btnPrev" style="display: none;"><i class="fas fa-arrow-left"></i></button>
    <button type="button" class="btn btn-primary" id="btnNext">Siguiente <i class="fas fa-arrow-right"></i></button>
    <button type="button" class="btn btn-primary" id="btnGenerate" style="display: none;"><i class="fas fa-paper-plane"></i> Generar Recibo</button>
  </footer>

  <div class="modal-backdrop" id="successModal">
    <div class="modal">
      <div style="font-size: 56px; color: var(--success); margin-bottom: 16px;"><i class="fas fa-check-circle"></i></div>
      <h3 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">¡Recibo guardado!</h3>
      <p style="font-size: 14px; color: var(--text-mute); margin-bottom: 24px;" id="successNumero">REC-XXX</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn" style="background:#25D366;color:white; font-size:16px;" id="sendWhatsappBtn"><i class="fab fa-whatsapp"></i> Enviar por WhatsApp</button>
        <button class="btn btn-secondary" id="backToPanelBtn2">Volver al panel</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="fotoSheet">
    <div class="sheet">
      <h3 style="margin-bottom: 20px; text-align: center; font-weight: 800; font-size:20px;">Añadir foto</h3>
      <button type="button" class="btn btn-primary" id="btnTomarFoto" style="width: 100%; margin-bottom: 12px; padding:16px;"><i class="fas fa-camera"></i> Tomar Foto</button>
      <button type="button" class="btn btn-secondary" id="btnSubirFoto" style="width: 100%; margin-bottom: 12px; padding:16px;"><i class="fas fa-image"></i> Elegir de Galería</button>
      <button type="button" class="btn" id="btnCancelarFoto" style="width: 100%; background:transparent; color:var(--text-mute); font-weight:600;">Cancelar</button>
    </div>
  </div>

  <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display: none;">
  <input type="file" id="inputGaleria" accept="image/*" style="display: none;">

  <script type="module" src="/app/js/clientes.js"></script>
</body>
