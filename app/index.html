<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DR. Xiaomi · Panel</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">

  <!-- PWA -->
  <link rel="manifest" href="/app/manifest.json">
  <meta name="apple-mobile-web-app-title" content="DR. Xiaomi Panel">

  <style>
    /* Estilos específicos del panel */
    .orden-card .chip-recibido    { background: rgba(245, 158, 11, 0.18); color: #F59E0B; }
    .orden-card .chip-reparacion  { background: rgba(59, 130, 246, 0.18); color: #3B82F6; }
    .orden-card .chip-listo       { background: rgba(16, 185, 129, 0.18); color: #10B981; }
    .orden-card .chip-entregado   { background: rgba(139, 92, 246, 0.18); color: #8B5CF6; }
    .orden-card .chip-devuelto    { background: rgba(239, 68, 68, 0.18); color: #EF4444; }
    .orden-card .chip-cancelado   { background: rgba(115, 115, 115, 0.18); color: #9CA3AF; }

    /* ============================================================ */
    /* LOGO EN EL HEADER                                            */
    /* ============================================================ */
    .brand-logo-limpio {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: transparent;
      box-shadow: 0 4px 12px rgba(255, 105, 0, 0.35);
    }
    .brand-logo-limpio img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* ============================================================ */
    /* ICONOS PNG EN EL HEADER                                      */
    /* ============================================================ */
    .icon-btn .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    .icon-btn .icon-img.blanco {
      filter: brightness(0) invert(1);
    }
    .icon-btn:hover .icon-img { opacity: 1; }
    .icon-btn:active .icon-img { transform: scale(0.9); }

    /* ============================================================ */
    /* 🎨 TARJETAS DE ORDEN MEJORADAS                               */
    /* ============================================================ */
    .orden-card {
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .orden-card:active {
      transform: scale(0.99);
      background: var(--bg-elev-2) !important;
    }
    .orden-card:hover {
      background: var(--bg-elev-2);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <!-- 🟠 Logo DR. XIAOMI -->
        <div class="brand-logo-limpio">
          <img src="/img/logo1.png" alt="DR. Xiaomi"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand-500); font-size:22px; width:46px; height:46px; display:flex; align-items:center; justify-content:center;&quot;></i>';">
        </div>
        <div class="brand-text">
          <h1>DR. XIAOMI</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- 🏷️ Botón de Precios -->
        <button class="icon-btn" id="preciosBtn" title="Buscar precio" aria-label="Buscar precio">
          <img src="/imagenes/icon-precio.png" alt="Precio" class="icon-img blanco"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-dollar-sign&quot;></i>';">
        </button>

        <!-- 📊 Botón de Reportes (solo admin) -->
        <button class="icon-btn" id="reportesBtn" title="Reportes" style="display: none;">
          <img src="/imagenes/icon-reportes.png" alt="Reportes" class="icon-img blanco"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-chart-bar&quot;></i>';">
        </button>

        <!-- 🚪 Botón de Salir -->
        <button class="icon-btn" id="logoutBtn" title="Cerrar sesión">
          <img src="/imagenes/icon-salir.png" alt="Salir" class="icon-img blanco"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-sign-out-alt&quot;></i>';">
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="app-content">

      <!-- Stats -->
      <div class="stats-grid" style="margin-bottom: 20px;">
        <div class="stat-card">
          <div class="stat-value" id="statActivas">—</div>
          <div class="stat-label">Activas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value success" id="statListas">—</div>
          <div class="stat-label">Listas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value brand" id="statHoy">—</div>
          <div class="stat-label">Hoy</div>
        </div>
      </div>

      <!-- Buscador -->
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="search" 
               id="buscador" 
               placeholder="Buscar por cliente, teléfono o recibo..."
               autocomplete="off">
      </div>

      <!-- Filtros -->
      <div class="filters-row" id="filtros">
        <button class="chip chip-interactive active" data-filtro="todos">Todas</button>
        <button class="chip chip-interactive" data-filtro="recibido">Recibidas</button>
        <button class="chip chip-interactive" data-filtro="reparacion">En reparación</button>
        <button class="chip chip-interactive" data-filtro="listo">Listas</button>
        <button class="chip chip-interactive" data-filtro="entregado">Entregadas</button>
        <button class="chip chip-interactive" data-filtro="devuelto">Devueltas</button>
      </div>

      <!-- Lista -->
      <div class="cards-list" id="listaOrdenes">
        <div class="empty-state">
          <div class="spinner" style="margin: 20px auto;"></div>
          <p>Cargando órdenes...</p>
        </div>
      </div>

    </main>

    <!-- FAB -->
    <button class="btn-fab" id="nuevoReciboBtn" title="Nuevo recibo">
      <i class="fas fa-plus"></i>
    </button>

  </div>

  <script type="module">
    import { requireAuth, logout } from '/js/app-auth.js';
    import { toast, haptic, initTheme, toggleTheme, tiempoRelativo, formatBs, escapeHtml } from '/js/app-ui.js';
    import { db } from '/js/firebase.js';
    import { 
      collection, query, orderBy, onSnapshot, limit 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initTheme();

    let sesion = null;
    let ordenes = [];
    let filtroActual = 'todos';
    let busquedaActual = '';
    let unsubscribe = null;

    requireAuth((s) => {
      sesion = s;
      iniciarApp();
    });

    function iniciarApp() {
      document.getElementById('userInfo').textContent = 
        `${sesion.icono || ''} ${sesion.nombre}`;

      if (sesion.rol === 'admin') {
        const btnRep = document.getElementById('reportesBtn');
        if (btnRep) btnRep.style.display = 'flex';
      }

      configurarEventos();
      cargarOrdenes();

      toast(`Bienvenido, ${sesion.nombre}`, 'success', 2000);
    }

    function configurarEventos() {
      document.getElementById('preciosBtn')?.addEventListener('click', () => {
        haptic(15);
        window.location.href = '/precio/';
      });

      document.getElementById('reportesBtn')?.addEventListener('click', () => {
        haptic(15);
        window.location.href = '/app/reportes/';
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        haptic(20);
        logout();
      });

      document.getElementById('nuevoReciboBtn').addEventListener('click', () => {
        haptic(15);
        window.location.href = '/cliente/';
      });

      document.getElementById('filtros').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filtro]');
        if (!btn) return;

        haptic(10);
        document.querySelectorAll('#filtros .chip-interactive').forEach(b => 
          b.classList.remove('active')
        );
        btn.classList.add('active');
        filtroActual = btn.dataset.filtro;
        renderizarOrdenes();
      });

      document.getElementById('buscador').addEventListener('input', (e) => {
        busquedaActual = e.target.value.toLowerCase().trim();
        renderizarOrdenes();
      });
    }

    function cargarOrdenes() {
      const q = query(
        collection(db, 'recibos'),
        orderBy('fecha', 'desc'),
        limit(200)
      );

      unsubscribe = onSnapshot(q, 
        (snapshot) => {
          ordenes = snapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          console.log(`📋 ${ordenes.length} órdenes cargadas`);
          renderizarOrdenes();
          actualizarStats();
        },
        (error) => {
          console.error('❌ Error cargando órdenes:', error);
          
          if (error.message && error.message.includes('index')) {
            document.getElementById('listaOrdenes').innerHTML = `
              <div class="empty-state">
                <i class="fas fa-database"></i>
                <h3>Falta crear un índice</h3>
                <p>Abre la consola (F12) para ver el link</p>
              </div>
            `;
          } else {
            document.getElementById('listaOrdenes').innerHTML = `
              <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Error al cargar</h3>
                <p>${error.message || 'Intenta de nuevo'}</p>
              </div>
            `;
          }
        }
      );
    }

    function renderizarOrdenes() {
      const lista = document.getElementById('listaOrdenes');

      let filtradas = ordenes;

      if (filtroActual !== 'todos') {
        filtradas = filtradas.filter(o => (o.estadoOrden || 'recibido') === filtroActual);
      }

      if (busquedaActual) {
        filtradas = filtradas.filter(o => {
          const texto = [
            o.numeroRecibo,
            o.cliente,
            o.telefono,
            o.marca,
            o.modelo
          ].filter(Boolean).join(' ').toLowerCase();
          return texto.includes(busquedaActual);
        });
      }

      if (filtradas.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h3>${busquedaActual ? 'Sin resultados' : 'No hay órdenes'}</h3>
            <p>${busquedaActual ? 'Prueba otra búsqueda' : 'Crea el primer recibo tocando +'}</p>
          </div>
        `;
        return;
      }

      lista.innerHTML = filtradas.map(o => renderCard(o)).join('');

      lista.querySelectorAll('.orden-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          haptic(10);
          window.location.href = `/app/orden.html?id=${id}`;
        });
      });
    }

    function renderCard(o) {
      const estadoActual = o.estadoOrden || 'recibido';
      const estadoInfo = {
        recibido:          { clase: 'recibido',  texto: 'EN PROCESO',     emoji: '📦', color: '#F59E0B' },
        reparacion:        { clase: 'reparacion',texto: 'EN REPARACIÓN',  emoji: '🔧', color: '#3B82F6' },
        'espera-repuesto': { clase: 'espera',    texto: 'ESPERANDO',      emoji: '⏳', color: '#FF6900' },
        listo:             { clase: 'listo',     texto: 'LISTO',          emoji: '✅', color: '#10B981' },
        entregado:         { clase: 'entregado', texto: 'ENTREGADO',      emoji: '🤝', color: '#8B5CF6' },
        devuelto:          { clase: 'devuelto',  texto: 'DEVUELTO',       emoji: '↩️', color: '#EF4444' },
        cancelado:         { clase: 'cancelado', texto: 'CANCELADO',      emoji: '⛔', color: '#9CA3AF' }
      }[estadoActual] || { clase: 'recibido', texto: estadoActual.toUpperCase(), emoji: '📋', color: '#FF6900' };

      const total = Number(o.total) || 0;

      let serviciosTexto = '';
      if (Array.isArray(o.servicios) && o.servicios.length > 0) {
        serviciosTexto = o.servicios
          .map(s => s.desc)
          .filter(d => d && d.trim() !== '' && d.trim() !== 'Sin descripción')
          .join(' · ');
      }

      return `
        <div class="card card-interactive orden-card" data-id="${o.id}" style="border-left: 4px solid ${estadoInfo.color}; padding-left: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; background: ${estadoInfo.color}; color: white; box-shadow: 0 2px 8px ${estadoInfo.color}40;">
                  ${estadoInfo.emoji} ${estadoInfo.texto}
                </span>
                <span style="font-size: 10px; color: var(--text-3); font-weight: 700; font-family: monospace;">
                  ${o.numeroRecibo || '—'}
                </span>
              </div>
              <div style="font-size: 17px; font-weight: 800; color: var(--text-1); margin-bottom: 6px; letter-spacing: -0.3px;">
                ${escapeHtml(o.marca || '')} ${escapeHtml(o.modelo || '')}
              </div>
              ${o.cliente ? `
                <div style="font-size: 12px; color: var(--text-2); margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
                  <span style="font-size: 13px;">👤</span>
                  <span>${escapeHtml(o.cliente)}</span>
                </div>
              ` : ''}
              ${serviciosTexto ? `
                <div style="font-size: 11px; color: var(--text-3); margin-bottom: 4px; line-height: 1.4; display: flex; align-items: start; gap: 6px;">
                  <span style="font-size: 12px; flex-shrink: 0;">🔧</span>
                  <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;">${escapeHtml(serviciosTexto)}</span>
                </div>
              ` : ''}
              <div style="font-size: 10px; color: var(--text-3); margin-top: 8px; display: flex; align-items: center; gap: 4px;">
                <i class="far fa-clock"></i> ${tiempoRelativo(o.fecha)}
              </div>
            </div>
            <div style="text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: end; gap: 4px;">
              <div style="font-size: 20px; font-weight: 900; color: var(--brand-500); letter-spacing: -0.5px;">
                ${formatBs(total)}
              </div>
              ${Number(o.saldo) > 0 ? `
                <div style="font-size: 10px; color: #F59E0B; font-weight: 700;">
                  Saldo: ${formatBs(o.saldo)}
                </div>
              ` : `
                <div style="font-size: 10px; color: #10B981; font-weight: 700;">
                  ✓ Pagado
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function actualizarStats() {
      const activas = ordenes.filter(o => {
        const e = o.estadoOrden || 'recibido';
        return ['recibido', 'reparacion', 'espera-repuesto'].includes(e);
      }).length;

      const listas = ordenes.filter(o => o.estadoOrden === 'listo').length;

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const hoyCount = ordenes.filter(o => {
        if (!o.fecha) return false;
        const d = o.fecha.toDate ? o.fecha.toDate() : new Date(o.fecha);
        return d >= hoy;
      }).length;

      document.getElementById('statActivas').textContent = activas;
      document.getElementById('statListas').textContent = listas;
      document.getElementById('statHoy').textContent = hoyCount;
    }

  </script>

</body>
</html>
