<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B" id="metaThemeColor">
  <title>DR. Xiaomi · Panel</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="./css/app-theme.css">
  <link rel="stylesheet" href="./css/app-layouts.css">
  <link rel="stylesheet" href="./css/app-components.css">
  <link rel="manifest" href="/manifest.json">

  <style>
    .hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .btn-hero { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px; border-radius: var(--r-xl); font-weight: 700; font-size: 14px; border: none; cursor: pointer; transition: var(--dur) var(--ease-spring); height: 105px; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
    .btn-hero:active { transform: scale(0.96); }
    .btn-hero-nuevo { background: linear-gradient(135deg, var(--brand-500), #FF8C00); color: white; box-shadow: var(--shadow-glow); }
    .btn-hero-venta { background: var(--bg-elev-1); color: var(--success-500); border: 1px solid var(--border-1); }
    .icon-box { width: 38px; height: 38px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 6px; margin-bottom: auto; z-index: 2; box-shadow: var(--shadow-sm); }
    .icon-box img { width: 100%; height: 100%; object-fit: contain; }
    .icon-raw { width: 38px; height: 38px; object-fit: contain; margin-bottom: auto; z-index: 2; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-elev-1); border-radius: var(--r-lg); padding: 14px 12px; display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--border-1); }
    .stat-value { font-size: 22px; font-weight: 800; color: var(--text-1); line-height: 1; margin-bottom: 6px; letter-spacing: -0.5px; }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .section-title { font-size: 15px; font-weight: 800; color: var(--text-1); margin-bottom: 12px; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
    .ingreso-card { background: var(--bg-elev-1); border-radius: var(--r-lg); padding: 14px; margin-bottom: 10px; transition: var(--dur) var(--ease); cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-1); border-left-width: 4px; border-left-style: solid; }
    .ingreso-card:active { transform: scale(0.98); background: var(--bg-elev-2); }
    .icon-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 14px; flex-shrink: 0; }
    .info-col { flex: 1; min-width: 0; }
    .info-title { font-size: 15px; font-weight: 700; color: var(--text-1); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-sub { font-size: 12px; color: var(--text-3); font-weight: 500; }
    .monto-col { text-align: right; margin-left: 10px; }
    .monto { font-size: 16px; font-weight: 800; }
    .estado-chip { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-top: 6px; display: inline-block; text-transform: uppercase; }
    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
    .page-btn { background: var(--bg-elev-1); border: 1px solid var(--border-1); color: var(--text-1); width: 38px; height: 38px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--dur); }
    .page-btn.active { background: var(--brand-500); border-color: var(--brand-500); color: white; box-shadow: var(--shadow-glow); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-nav { background: var(--bg-elev-2); border: 1px solid var(--border-1); color: var(--text-1); padding: 0 16px; height: 38px; border-radius: var(--r-md); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- LOADER -->
  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img">
    </div>
    <div class="loader-text">Sincronizando...</div>
  </div>

  <main class="app-container">
    
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="Logo">
        </div>
        <div class="brand-text">
          <h1>Panel de Control</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnSalir"><img src="/app/icons/salir.png" width="20" height="20" alt="Salir"></button>
        <button class="icon-btn" id="btnTema"><img src="/app/icons/tema.png" width="20" height="20" alt="Tema"></button>
      </div>
    </header>

    <div class="app-content">
      
      <div class="hero-actions">
        <button class="btn-hero btn-hero-nuevo" id="nuevoReciboBtn">
          <div class="icon-box"><img src="/app/icons/agregar.png" alt="Nuevo Equipo"></div>
          <span>Nuevo<br>Equipo</span>
        </button>
        <button class="btn-hero btn-hero-venta" id="ventaRapidaBtn">
          <img src="/app/icons/venta.png" alt="Venta Rápida" class="icon-raw">
          <span>Venta<br>Rápida</span>
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statActivas">—</div><div class="stat-label">Activas</div></div>
        <div class="stat-card"><div class="stat-value" id="statListas" style="color: var(--success-500);">—</div><div class="stat-label">Listas</div></div>
        <div class="stat-card"><div class="stat-value" id="statHoy" style="color: var(--brand-500);">—</div><div class="stat-label">Ingresos Hoy</div></div>
      </div>

      <div class="section-title">Movimientos Recientes</div>

      <div class="search-bar">
        <img src="/app/icons/buscar.png" width="18" height="18" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: 0.5;">
        <input type="search" id="buscador" placeholder="Buscar cliente o equipo..." autocomplete="off" style="padding-left: 44px;">
      </div>

      <div class="filters-row" id="filtros">
        <button class="chip-interactive active" data-filtro="todos">Todos</button>
        <button class="chip-interactive" data-filtro="reparacion">Reparación</button>
        <button class="chip-interactive" data-filtro="listo">Listos</button>
        <button class="chip-interactive" data-filtro="entregado">Entregados</button>
        <button class="chip-interactive" data-filtro="devuelto">Devueltos</button>
        <button class="chip-interactive" data-filtro="venta">Ventas</button>
      </div>

      <div class="cards-list" id="listaOrdenes"></div>
      <div class="pagination-container" id="paginationContainer"></div>
    </div>
  </main>

  <!-- MODAL VENTA RÁPIDA (Rediseñado) -->
  <div class="sheet-backdrop" id="modalVenta">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 20px; font-weight: 800; color: var(--text-1);"><i class="fas fa-cash-register" style="color: var(--brand-500);"></i> Venta Rápida</h3>
        <button class="icon-btn" id="btnCloseVenta"><i class="fas fa-times"></i></button>
      </div>

      <!-- 1. ELECCIÓN: ACCESORIO O SERVICIO -->
      <div id="tipoVentaStep">
        <p style="font-size: 14px; color: var(--text-3); margin-bottom: 16px; text-align: center;">¿Qué vas a registrar?</p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn btn-secondary" id="btnVentaAccesorio" style="padding: 20px; font-size: 16px; justify-content: flex-start;">
            <i class="fas fa-box" style="color: var(--brand-500); font-size: 24px; margin-right: 12px;"></i>
            <div style="text-align: left;">
              <div style="font-weight: 800;">Venta de Accesorio</div>
              <div style="font-size: 12px; color: var(--text-3);">Elegir producto con foto</div>
            </div>
          </button>
          <button class="btn btn-secondary" id="btnVentaServicio" style="padding: 20px; font-size: 16px; justify-content: flex-start;">
            <i class="fas fa-tools" style="color: var(--success-500); font-size: 24px; margin-right: 12px;"></i>
            <div style="text-align: left;">
              <div style="font-weight: 800;">Venta de Servicio</div>
              <div style="font-size: 12px; color: var(--text-3);">Limpieza, botón, reactivación...</div>
            </div>
          </button>
        </div>
      </div>

      <!-- 2. VENTA DE ACCESORIO (Inventario) -->
      <div id="ventaAccesorioStep" style="display: none;">
        <button class="btn btn-secondary" id="btnBackToTipo" style="margin-bottom: 16px; width: auto; padding: 8px 16px; font-size: 12px;"><i class="fas fa-arrow-left"></i> Volver</button>
        <div class="field">
          <label class="input-label">Producto</label>
          <select id="accesorioSelect" class="input-field"></select>
        </div>
        <div class="field">
          <label class="input-label">Cantidad</label>
          <input type="number" id="accesorioCantidad" class="input-field" value="1" min="1">
        </div>
        <button class="btn btn-primary" id="btnRegistrarAccesorio" style="width: 100%;">Registrar Venta</button>
      </div>

      <!-- 3. VENTA DE SERVICIO (Rápida) -->
      <div id="ventaServicioStep" style="display: none;">
        <button class="btn btn-secondary" id="btnBackToTipo2" style="margin-bottom: 16px; width: auto; padding: 8px 16px; font-size: 12px;"><i class="fas fa-arrow-left"></i> Volver</button>
        <div class="field"><select id="ventaConcepto" class="input-field"><option value="Botón">Botón</option><option value="Limpieza">Limpieza</option><option value="Reactivación">Reactivación</option><option value="Cargador">Cargador</option><option value="Otro">Otro</option></select></div>
        <div class="field" id="wrapConceptoOtro" style="display: none;"><input type="text" id="ventaConceptoOtro" class="input-field" placeholder="Especifique qué se vendió"></div>
        <div class="field"><input type="number" id="ventaMonto" class="input-field" placeholder="Monto (Bs.)" inputmode="decimal"></div>
        <div class="field"><select id="ventaMetodo" class="input-field"><option value="Efectivo">💵 Efectivo</option><option value="QR">📱 QR</option></select></div>
        <button class="btn btn-primary" id="btnGuardarVenta" style="width: 100%; margin-top: 10px;">Registrar Venta</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="./js/panel.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('appLoader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
        }
      }, 1500);
    });
  </script>
</body>
</html>
