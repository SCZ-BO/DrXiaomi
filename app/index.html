<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>DR. Xiaomi · Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">
  
  <style>
    /* Estilos esenciales para que el panel se vea PRO */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: 16px; padding: 16px 12px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: 800; color: var(--text-1); }
    .stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; }
    
    .orden-card { background: var(--bg-elev-1); border: 1px solid var(--border-1); border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
    .chip-estado { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .chip-estado[data-estado="recibido"] { background: rgba(255,255,255,0.1); color: var(--text-1); }
    .chip-estado[data-estado="reparacion"] { background: rgba(255,105,0,0.15); color: #FF6900; }
    .chip-estado[data-estado="listo"] { background: rgba(251,191,36,0.15); color: #FBBF24; }
    .chip-estado[data-estado="entregado"] { background: rgba(34,197,94,0.15); color: #22C55E; }
    
    /* Forzar el Bottom Sheet al centro de la pantalla */
    .sheet-backdrop { display: flex; align-items: center; justify-content: center; }
    .sheet { width: 90%; max-width: 400px; border-radius: 24px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo"><i class="fas fa-tools"></i></div>
        <div class="brand-text">
          <h1>DR. XIAOMI</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnRefresh"><i class="fas fa-rotate" style="color:var(--brand-500)"></i></button>
        <button class="icon-btn" id="reportesBtn" style="display:none;"><i class="fas fa-chart-bar"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statActivas">—</div><div class="stat-label">Activas</div></div>
        <div class="stat-card"><div class="stat-value success" id="statListas">—</div><div class="stat-label">Listas</div></div>
        <div class="stat-card"><div class="stat-value brand" id="statHoy">—</div><div class="stat-label">Hoy</div></div>
      </div>

      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="search" id="buscador" placeholder="Buscar recibo..." autocomplete="off">
      </div>

      <div class="filters-row" id="filtros">
        <button class="chip active" data-filtro="todos">Todas</button>
        <button class="chip" data-filtro="recibido">Recibidas</button>
        <button class="chip" data-filtro="reparacion">En reparación</button>
        <button class="chip" data-filtro="listo">Listas</button>
        <button class="chip" data-filtro="entregado">Entregadas</button>
      </div>

      <div class="cards-list" id="listaOrdenes">
        <div class="skeleton-card">Cargando...</div>
      </div>
      
      <button id="btnCargarMas" class="btn btn-secondary" style="display:none; width:100%; margin-top:10px;">Cargar más recibos</button>
    </main>
    
    <button class="btn-fab" id="nuevoReciboBtn"><i class="fas fa-plus"></i></button>
  </div>

  <div class="sheet-backdrop" id="reciboSheet">
    <div class="sheet">
      <button class="btn-close-sheet" id="btnCloseSheet"><i class="fas fa-times"></i></button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from '/js/app-auth.js';
    import { toast, haptic, initTheme, tiempoRelativo, formatBs, escapeHtml } from '/js/app-ui.js';
    import { db } from '/js/firebase.js';
    import { collection, query, orderBy, onSnapshot, limit, doc, updateDoc, deleteDoc, startAfter, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initTheme();
    let sesion = null, ordenes = [], filtroActual = 'todos', busquedaActual = '', unsubscribe = null;
    const LIMITE = 10;
    let ultimoDocumento = null, hayMas = true;

    requireAuth((s) => {
      sesion = s;
      document.getElementById('userInfo').textContent = `${sesion.icono || ''} ${sesion.nombre}`;
      if (sesion.rol === 'admin') document.getElementById('reportesBtn').style.display = 'flex';
      configurarEventos();
      cargarOrdenes();
    });

    function configurarEventos() {
      document.getElementById('reportesBtn')?.addEventListener('click', () => window.location.href = '/app/reportes/');
      document.getElementById('logoutBtn').addEventListener('click', () => logout());
      document.getElementById('nuevoReciboBtn').addEventListener('click', () => window.location.href = '/cliente/');
      document.getElementById('btnCloseSheet')?.addEventListener('click', cerrarSheet);
      document.getElementById('btnCargarMas')?.addEventListener('click', cargarMasOrdenes);

      document.getElementById('filtros').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filtro]');
        if (!btn) return;
        document.querySelectorAll('#filtros .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroActual = btn.dataset.filtro;
        renderizarOrdenes();
      });

      document.getElementById('buscador').addEventListener('input', (e) => {
        busquedaActual = e.target.value.toLowerCase().trim();
        renderizarOrdenes();
      });

      document.getElementById('btnRefresh')?.addEventListener('click', () => {
        if (unsubscribe) unsubscribe();
        cargarOrdenes();
        toast('Lista actualizada', 'success');
      });
    }

    function cargarOrdenes() {
      const q = query(collection(db, 'recibos'), orderBy('fecha', 'desc'), limit(LIMITE));
      unsubscribe = onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
        ordenes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        hayMas = snapshot.docs.length === LIMITE;
        if (snapshot.docs.length > 0) ultimoDocumento = snapshot.docs[snapshot.docs.length - 1];
        renderizarOrdenes();
        actualizarStats();
      });
    }

    async function cargarMasOrdenes() {
      if (!ultimoDocumento) return;
      const q = query(collection(db, 'recibos'), orderBy('fecha', 'desc'), startAfter(ultimoDocumento), limit(LIMITE));
      const snapshot = await getDocs(q);
      ordenes = [...ordenes, ...snapshot.docs.map(d => ({ id: d.id, ...d.data() }))];
      if (snapshot.docs.length > 0) ultimoDocumento = snapshot.docs[snapshot.docs.length - 1];
      renderizarOrdenes();
    }

    function renderizarOrdenes() {
      let lista = document.getElementById('listaOrdenes');
      let filtradas = ordenes;
      
      if (filtroActual !== 'todos') filtradas = filtradas.filter(o => (o.estadoOrden || 'recibido') === filtroActual);
      if (busquedaActual) filtradas = filtradas.filter(o => `${o.cliente} ${o.numeroRecibo}`.toLowerCase().includes(busquedaActual));

      if (filtradas.length === 0) {
        lista.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3)">No hay órdenes</div>';
        return;
      }

      lista.innerHTML = filtradas.map(o => `
        <div class="orden-card" onclick="abrirSheet('${o.id}')">
          <div style="display:flex; justify-content:space-between;">
            <div>
              <span class="chip-estado" data-estado="${o.estadoOrden || 'recibido'}">${o.estadoOrden || 'Recibido'}</span>
              <div style="font-size:16px; font-weight:700; margin-top:5px;">${escapeHtml(o.marca)} ${escapeHtml(o.modelo)}</div>
              <div style="font-size:13px; color:var(--text-3)">👤 ${escapeHtml(o.cliente)}</div>
            </div>
            <div style="font-weight:800; color:var(--brand-500)">${formatBs(o.total)}</div>
          </div>
        </div>
      `).join('');

      document.getElementById('btnCargarMas').style.display = hayMas ? 'block' : 'none';
    }

    function actualizarStats() {
      document.getElementById('statActivas').textContent = ordenes.filter(o => ['recibido', 'reparacion'].includes(o.estadoOrden)).length;
      document.getElementById('statListas').textContent = ordenes.filter(o => o.estadoOrden === 'listo').length;
      document.getElementById('statHoy').textContent = ordenes.filter(o => {
        if (!o.fecha) return false;
        const d = o.fecha.toDate ? o.fecha.toDate() : new Date(o.fecha);
        return d.toDateString() === new Date().toDateString();
      }).length;
    }

    // Función global para el botón de la tarjeta
    window.abrirSheet = function(id) {
      const orden = ordenes.find(o => o.id === id);
      if (!orden) return;
      document.getElementById('sheetContent').innerHTML = `
        <h3 style="margin-bottom:20px;">${escapeHtml(orden.numeroRecibo)}</h3>
        <button class="btn btn-primary" style="margin-bottom:10px; width:100%;" onclick="window.location.href='/app/orden.html?id=${id}'">Ver Detalle</button>
        <button class="btn btn-secondary" style="width:100%;" onclick="document.getElementById('reciboSheet').classList.remove('show')">Cerrar</button>
      `;
      document.getElementById('reciboSheet').classList.add('show');
    };

    function cerrarSheet() {
      document.getElementById('reciboSheet').classList.remove('show');
    }
  </script>
</body>
</html>
