<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DR. Xiaomi · Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="/css/app-theme.css">
  <link rel="stylesheet" href="/css/app-components.css">
  <link rel="stylesheet" href="/css/app-layouts.css">

  <style>
    /* Estilos específicos del panel */
    .orden-card .chip-recibido    { background: rgba(245, 158, 11, 0.18); color: #F59E0B; }
    .orden-card .chip-reparacion  { background: rgba(59, 130, 246, 0.18); color: #3B82F6; }
    .orden-card .chip-listo       { background: rgba(16, 185, 129, 0.18); color: #10B981; }
    .orden-card .chip-entregado   { background: rgba(139, 92, 246, 0.18); color: #8B5CF6; }
    .orden-card .chip-devuelto    { background: rgba(239, 68, 68, 0.18); color: #EF4444; }
    .orden-card .chip-cancelado   { background: rgba(115, 115, 115, 0.18); color: #9CA3AF; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <i class="fas fa-tools"></i>
        </div>
        <div class="brand-text">
          <h1>DR. XIAOMI</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="logoutBtn" title="Cerrar sesión">
          <i class="fas fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="app-content">

      <!-- Stats -->
      <div class="stats-grid" style="margin-bottom: 20px;">
        <div class="stat-card">
          <div class="stat-value" id="statActivas">—</div>
          <div class="stat-label">Activas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value success" id="statListas">—</div>
          <div class="stat-label">Listas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value brand" id="statHoy">—</div>
          <div class="stat-label">Hoy</div>
        </div>
      </div>

      <!-- Buscador -->
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="search" 
               id="buscador" 
               placeholder="Buscar por cliente, teléfono o recibo..."
               autocomplete="off">
      </div>

      <!-- Filtros -->
      <div class="filters-row" id="filtros">
        <button class="chip chip-interactive active" data-filtro="todos">Todas</button>
        <button class="chip chip-interactive" data-filtro="recibido">Recibidas</button>
        <button class="chip chip-interactive" data-filtro="reparacion">En reparación</button>
        <button class="chip chip-interactive" data-filtro="listo">Listas</button>
        <button class="chip chip-interactive" data-filtro="entregado">Entregadas</button>
        <button class="chip chip-interactive" data-filtro="devuelto">Devueltas</button>
      </div>

      <!-- Lista -->
      <div class="cards-list" id="listaOrdenes">
        <div class="empty-state">
          <div class="spinner" style="margin: 20px auto;"></div>
          <p>Cargando órdenes...</p>
        </div>
      </div>

    </main>

    <!-- FAB -->
    <button class="btn-fab" id="nuevoReciboBtn" title="Nuevo recibo">
      <i class="fas fa-plus"></i>
    </button>

  </div>

  <script type="module">
    import { requireAuth, logout } from '/js/app-auth.js';
    import { toast, haptic, initTheme, toggleTheme, tiempoRelativo, formatBs, escapeHtml } from '/js/app-ui.js';
    import { db } from '/js/firebase.js';
    import { 
      collection, query, orderBy, onSnapshot, limit 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initTheme();

    let sesion = null;
    let ordenes = [];
    let filtroActual = 'todos';
    let busquedaActual = '';
    let unsubscribe = null;

    requireAuth((s) => {
      sesion = s;
      iniciarApp();
    });

    function iniciarApp() {
      document.getElementById('userInfo').textContent = 
        `${sesion.icono || ''} ${sesion.nombre}`;

      configurarEventos();
      cargarOrdenes();

      toast(`Bienvenido, ${sesion.nombre}`, 'success', 2000);
    }

    function configurarEventos() {
      document.getElementById('logoutBtn').addEventListener('click', () => {
        haptic(20);
        logout();
      });

      document.getElementById('nuevoReciboBtn').addEventListener('click', () => {
        haptic(15);
        window.location.href = '/cliente/';
      });

      document.getElementById('filtros').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filtro]');
        if (!btn) return;

        haptic(10);
        document.querySelectorAll('#filtros .chip-interactive').forEach(b => 
          b.classList.remove('active')
        );
        btn.classList.add('active');
        filtroActual = btn.dataset.filtro;
        renderizarOrdenes();
      });

      document.getElementById('buscador').addEventListener('input', (e) => {
        busquedaActual = e.target.value.toLowerCase().trim();
        renderizarOrdenes();
      });
    }

    function cargarOrdenes() {
      const q = query(
        collection(db, 'recibos'),
        orderBy('fecha', 'desc'),
        limit(200)
      );

      unsubscribe = onSnapshot(q, 
        (snapshot) => {
          ordenes = snapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
          }));

          console.log(`📋 ${ordenes.length} órdenes cargadas`);
          renderizarOrdenes();
          actualizarStats();
        },
        (error) => {
          console.error('❌ Error cargando órdenes:', error);
          
          if (error.message && error.message.includes('index')) {
            document.getElementById('listaOrdenes').innerHTML = `
              <div class="empty-state">
                <i class="fas fa-database"></i>
                <h3>Falta crear un índice</h3>
                <p>Abre la consola (F12) para ver el link</p>
              </div>
            `;
          } else {
            document.getElementById('listaOrdenes').innerHTML = `
              <div class="empty-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Error al cargar</h3>
                <p>${error.message || 'Intenta de nuevo'}</p>
              </div>
            `;
          }
        }
      );
    }

    function renderizarOrdenes() {
      const lista = document.getElementById('listaOrdenes');

      let filtradas = ordenes;

      if (filtroActual !== 'todos') {
        filtradas = filtradas.filter(o => (o.estadoOrden || 'recibido') === filtroActual);
      }

      if (busquedaActual) {
        filtradas = filtradas.filter(o => {
          const texto = [
            o.numeroRecibo,
            o.cliente,
            o.telefono,
            o.marca,
            o.modelo
          ].filter(Boolean).join(' ').toLowerCase();
          return texto.includes(busquedaActual);
        });
      }

      if (filtradas.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h3>${busquedaActual ? 'Sin resultados' : 'No hay órdenes'}</h3>
            <p>${busquedaActual ? 'Prueba otra búsqueda' : 'Crea el primer recibo tocando +'}</p>
          </div>
        `;
        return;
      }

      lista.innerHTML = filtradas.map(o => renderCard(o)).join('');

      lista.querySelectorAll('.orden-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          haptic(10);
          toast(`Abriendo ${id}... (próximamente)`, 'info', 2000);
        });
      });
    }

    function renderCard(o) {
      const estadoActual = o.estadoOrden || 'recibido';
      const estadoInfo = {
        recibido:   { clase: 'recibido',   texto: 'Recibido' },
        reparacion: { clase: 'reparacion', texto: 'En reparación' },
        listo:      { clase: 'listo',      texto: 'Listo para entregar' },
        entregado:  { clase: 'entregado',  texto: 'Entregado' },
        devuelto:   { clase: 'devuelto',   texto: 'Devuelto' },
        cancelado:  { clase: 'cancelado',  texto: 'Cancelado' }
      }[estadoActual] || { clase: 'recibido', texto: estadoActual };

      const total = Number(o.total) || 0;

      return `
        <div class="card card-interactive orden-card" data-id="${o.id}">
          <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;">
                <span class="chip chip-${estadoInfo.clase}">${estadoInfo.texto}</span>
                <span style="font-size: 11px; color: var(--text-3); font-weight: 600;">
                  ${o.numeroRecibo || '—'}
                </span>
              </div>
              <div style="font-size: 15px; font-weight: 700; color: var(--text-1); margin-bottom: 2px;">
                ${escapeHtml(o.cliente) || 'Sin nombre'}
              </div>
              <div style="font-size: 13px; color: var(--text-3);">
                <i class="fas fa-mobile-screen" style="font-size: 11px;"></i>
                ${escapeHtml(o.marca || '')} ${escapeHtml(o.modelo || '')}
              </div>
              <div style="font-size: 11px; color: var(--text-3); margin-top: 6px;">
                <i class="far fa-clock"></i> ${tiempoRelativo(o.fecha)}
              </div>
            </div>
            <div style="text-align: right; flex-shrink: 0;">
              <div style="font-size: 18px; font-weight: 800; color: var(--brand-500);">
                ${formatBs(total)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function actualizarStats() {
      const activas = ordenes.filter(o => {
        const e = o.estadoOrden || 'recibido';
        return ['recibido', 'reparacion'].includes(e);
      }).length;

      const listas = ordenes.filter(o => o.estadoOrden === 'listo').length;

      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const hoyCount = ordenes.filter(o => {
        if (!o.fecha) return false;
        const d = o.fecha.toDate ? o.fecha.toDate() : new Date(o.fecha);
        return d >= hoy;
      }).length;

      document.getElementById('statActivas').textContent = activas;
      document.getElementById('statListas').textContent = listas;
      document.getElementById('statHoy').textContent = hoyCount;
    }

  </script>

</body>
</html>
