<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Panel</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/imagenes/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root { 
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; 
      --brand: #E65100; --brand-hover: #BF360C; --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; --bg-card: #181818; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2A2A2A; 
      --success: #22C55E;
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; --bg-card: #FFFFFF; --bg-elev: #F0F0F0; 
      --text-main: #111111; --text-mute: #666666; --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }
    
    .hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .btn-hero { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px 10px; border-radius: var(--radius-md); font-weight: 800; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; text-align: center; }
    .btn-hero:active { transform: scale(0.96); }
    .btn-hero i { font-size: 28px; }
    .btn-hero-nuevo { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(230, 81, 0, 0.3); }
    .btn-hero-venta { background: var(--bg-card); color: var(--success); border: 2px solid var(--success); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .stat-value { font-size: 18px; font-weight: 800; color: var(--text-main); line-height: 1; margin-bottom: 4px; }
    .stat-value.success { color: var(--success); }
    .stat-value.brand { color: var(--brand); }
    .stat-label { font-size: 10px; font-weight: 600; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; }

    .search-bar { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; align-items: center; padding: 0 12px; margin-bottom: 12px; height: 44px; }
    .search-bar i { color: var(--text-mute); margin-right: 8px; font-size: 14px; }
    .search-bar input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 14px; outline: none; font-family: inherit; }
    .filters-row { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filters-row::-webkit-scrollbar { display: none; }
    .chip { padding: 8px 14px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-mute); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .chip.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); font-weight: 700; }

    /* 🔥 LISTA UNIFICADA DE INGRESOS */
    .section-title { font-size: 11px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 24px; }
    
    .ingreso-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; transition: 0.2s; cursor: pointer; position: relative; border-left: 3px solid var(--border); }
    .ingreso-card:active { transform: scale(0.98); background: var(--bg-elev); }
    
    /* Colores por tipo */
    .ingreso-card[data-tipo="telefono"] { border-left-color: var(--brand); }
    .ingreso-card[data-tipo="venta"] { border-left-color: var(--success); }
    .ingreso-card[data-tipo="cierre"] { border-left-color: #8B5CF6; }

    .chip-estado { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .chip-estado[data-tipo="telefono"] { background: rgba(230, 81, 0, 0.15); color: var(--brand); }
    .chip-estado[data-tipo="venta"] { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .chip-estado[data-tipo="cierre"] { background: rgba(139, 92, 246, 0.15); color: #8B5CF6; }
    
    .metodo-pago { font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 4px; color: #22C55E; }

    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999999; opacity: 0; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; transition: 0.3s; }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; width: 100%; max-width: 500px; transform: translateY(100%); transition: 0.3s; border-top: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
    .sheet-backdrop.show .sheet { transform: translateY(0); }
    
    .btn-sheet { width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; transition: 0.2s; }
    .btn-sheet-primary { background: var(--brand); color: white; }
    .btn-sheet-whatsapp { background: #25D366; color: white; }
    .btn-sheet-danger { background: rgba(239, 68, 68, 0.1); color: #EF4444; }
    .btn-sheet-edit { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    
    .custom-select { width: 100%; padding: 12px; border-radius: var(--radius-sm); background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); outline: none; font-weight: 600; font-size: 14px; appearance: none; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-mute); text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); outline: none; font-family: inherit; font-size: 15px; }
    .form-control:focus { border-color: var(--brand); }
    .btn-sheet-success { background: var(--success); color: white; }

    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); box-shadow: 0 0 20px rgba(230, 81, 0, 0.2); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-mute); }
    .empty-state i { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; color: var(--text-main); margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-logo-container">
      <div class="loader-ring"></div>
      <img src="/img/logo1.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/web-app-manifest-192x192.png'">
    </div>
    <div class="loader-text">Cargando recibos...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <img src="/img/logo1.png" alt="DR. Xiaomi" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand); font-size:18px;&quot;></i>';">
        </div>
        <div class="brand-text">
          <h1>DR. XIAOMI</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnPDFDia" title="Reporte del Día (PDF)" style="color: var(--brand);">
          <i class="fas fa-file-pdf" style="font-size: 16px;"></i>
        </button>
        <button class="icon-btn" id="btnRefresh" title="Actualizar">
          <i class="fas fa-rotate" id="iconRefresh" style="color: var(--brand); font-size: 14px;"></i>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Cerrar sesión">
          <img src="/imagenes/icon-salir.png" alt="Salir" class="icon-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-sign-out-alt&quot;></i>';">
        </button>
      </div>
    </header>

    <main class="app-content">
      
      <div class="hero-actions">
        <button class="btn-hero btn-hero-nuevo" id="nuevoReciboBtn">
          <i class="fas fa-mobile-screen-button"></i>
          <span>Nuevo<br>Equipo</span>
        </button>
        <button class="btn-hero btn-hero-venta" id="ventaRapidaBtn">
          <i class="fas fa-cash-register"></i>
          <span>Venta<br>Rápida</span>
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statActivas">—</div><div class="stat-label">Activas</div></div>
        <div class="stat-card"><div class="stat-value success" id="statListas">—</div><div class="stat-label">Listas</div></div>
        <div class="stat-card"><div class="stat-value brand" id="statHoy">—</div><div class="stat-label">Ingresos Hoy</div></div>
      </div>

      <div class="section-title" style="margin-top: 0;">📋 Movimientos de Hoy</div>

      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="search" id="buscador" placeholder="Buscar cliente o recibo..." autocomplete="off">
      </div>

      <div class="filters-row" id="filtros">
        <button class="chip active" data-filtro="todos">Todos</button>
        <button class="chip" data-filtro="telefono">Reparaciones</button>
        <button class="chip" data-filtro="venta">Ventas</button>
      </div>

      <div class="cards-list" id="listaOrdenes"></div>

      <button id="btnCargarMas" style="display: none; width: 100%; padding: 14px; border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); font-weight: 600; cursor: pointer; margin-top: 10px;">
        <i class="fas fa-chevron-down"></i> Cargar más recibos
      </button>
    </main>
  </div>

  <!-- MODAL: VENTA RÁPIDA -->
  <div class="sheet-backdrop" id="modalVenta">
    <div class="sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 18px; font-weight: 800; color: var(--success);"><i class="fas fa-cash-register"></i> Venta Rápida</h3>
        <button class="icon-btn" id="btnCloseVenta" style="background: var(--bg-elev);"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="input-group">
        <label>Concepto</label>
        <select id="ventaConcepto" class="form-control">
          <option value="Botón">Botón</option>
          <option value="Limpieza">Limpieza</option>
          <option value="Reactivación">Reactivación</option>
          <option value="Cargador">Cargador</option>
          <option value="Otro">Otro</option>
        </select>
      </div>

      <div class="input-group">
        <label>Monto (Bs.)</label>
        <input type="number" id="ventaMonto" class="form-control" placeholder="0.00" inputmode="decimal">
      </div>

      <div class="input-group">
        <label>Método de Pago</label>
        <select id="ventaMetodo" class="form-control">
          <option value="Efectivo">💵 Efectivo</option>
          <option value="QR">📱 QR</option>
          <option value="Transferencia">🏦 Transferencia</option>
        </select>
      </div>

      <button class="btn-sheet btn-sheet-success" id="btnGuardarVenta">
        <i class="fas fa-save"></i> Registrar Venta
      </button>
    </div>
  </div>

  <!-- MODAL: DETALLE RECIBO -->
  <div class="sheet-backdrop" id="reciboSheet">
    <div class="sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 800;">Detalle del Movimiento</h3>
        <button class="icon-btn" id="btnCloseSheet" style="background: var(--bg-elev);"><i class="fas fa-times"></i></button>
      </div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from '/js/app-auth.js';
    import { toast, haptic, initTheme, tiempoRelativo, formatBs, escapeHtml } from '/js/app-ui.js';
    import { db } from '/js/firebase.js';
    import { collection, query, onSnapshot, limit, doc, updateDoc, deleteDoc, startAfter, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    initTheme();
    let sesion = null;
    let ordenes = [];
    let ventasHoy = [];
    let filtroActual = 'todos';
    let busquedaActual = '';
    let unsubscribe = null;
    let unsubscribeVentas = null;
    let unsubscribeCierres = null; 
    
    const LIMITE_POR_PAGINA = 10;
    let ultimoDocumento = null;
    let hayMasRecibos = true;

    const reciboSheet = document.getElementById('reciboSheet');
    const modalVenta = document.getElementById('modalVenta');
    const sheetContent = document.getElementById('sheetContent');
    const btnCargarMas = document.getElementById('btnCargarMas');
    const appLoader = document.getElementById('appLoader');

    requireAuth((s) => {
      sesion = s;
      setTimeout(() => {
        iniciarApp();
      }, 500);
    });

    function iniciarApp() {
      document.getElementById('userInfo').textContent = `${sesion.icono || ''} ${sesion.nombre}`;
      configurarEventos();
      cargarDatos();
    }

    function parsearFecha(fechaObj) {
      if (!fechaObj) return null;
      if (typeof fechaObj.toDate === 'function') return fechaObj.toDate();
      if (fechaObj.seconds !== undefined) return new Date(fechaObj.seconds * 1000);
      const d = new Date(fechaObj);
      return isNaN(d.getTime()) ? null : d;
    }

    function configurarEventos() {
      document.getElementById('nuevoReciboBtn').addEventListener('click', () => { haptic(15); window.location.href = '/cliente/'; });
      document.getElementById('ventaRapidaBtn').addEventListener('click', () => { haptic(15); modalVenta.classList.add('show'); });
      
      document.getElementById('btnCloseVenta')?.addEventListener('click', () => modalVenta.classList.remove('show'));
      modalVenta?.addEventListener('click', (e) => { if (e.target === modalVenta) modalVenta.classList.remove('show'); });
      
      document.getElementById('btnCloseSheet')?.addEventListener('click', cerrarSheet);
      reciboSheet?.addEventListener('click', (e) => { if (e.target === reciboSheet) cerrarSheet(); });

      document.getElementById('btnGuardarVenta')?.addEventListener('click', async () => {
        const concepto = document.getElementById('ventaConcepto').value;
        const monto = parseFloat(document.getElementById('ventaMonto').value);
        const metodo = document.getElementById('ventaMetodo').value;

        if (!monto || monto <= 0) { toast('Ingresa un monto válido', 'error'); return; }

        haptic(20);
        try {
          await addDoc(collection(db, 'ventas'), {
            concepto, monto, metodoPago: metodo,
            fecha: serverTimestamp(),
            creadoPor: sesion.nombre
          });
          toast('Venta registrada', 'success');
          modalVenta.classList.remove('show');
          document.getElementById('ventaMonto').value = '';
        } catch (err) {
          toast('Error al guardar venta', 'error');
          console.error(err);
        }
      });

      document.getElementById('btnPDFDia')?.addEventListener('click', generarPDFDia);

      document.getElementById('logoutBtn').addEventListener('click', () => { haptic(20); logout(); });
      document.getElementById('btnRefresh')?.addEventListener('click', () => {
        haptic(15);
        const icon = document.getElementById('iconRefresh');
        icon.style.animation = 'spin 0.8s linear infinite';
        
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        if (unsubscribeVentas) { unsubscribeVentas(); unsubscribeVentas = null; }
        if (unsubscribeCierres) { unsubscribeCierres(); unsubscribeCierres = null; }
        
        cargarDatos();
        
        setTimeout(() => { icon.style.animation = 'none'; toast('Lista actualizada', 'success', 1500); }, 1500);
      });

      document.getElementById('filtros').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filtro]');
        if (!btn) return;
        haptic(10);
        document.querySelectorAll('#filtros .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filtroActual = btn.dataset.filtro;
        renderizarTodo();
      });
      
      document.getElementById('buscador').addEventListener('input', (e) => {
        busquedaActual = e.target.value.toLowerCase().trim();
        renderizarTodo();
      });

      btnCargarMas?.addEventListener('click', cargarMasOrdenes);
    }

    let ventasPanel = [];
    let ventasCierre = [];

    function cargarDatos() {
      // 1. Cargar Recibos
      if (unsubscribe) unsubscribe();
      if (appLoader) appLoader.classList.remove('hidden');
      const qRecibos = query(collection(db, 'recibos'), limit(200));
      unsubscribe = onSnapshot(qRecibos, { includeMetadataChanges: true }, 
        (snapshot) => {
          ordenes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          
          ordenes.sort((a, b) => {
            const fa = a.fechaEditada || a.fecha;
            const fb = b.fechaEditada || b.fecha;
            const da = parsearFecha(fa);
            const db = parsearFecha(fb);
            return db - da;
          });
          
          hayMasRecibos = snapshot.docs.length === LIMITE_POR_PAGINA;
          if (snapshot.docs.length > 0) ultimoDocumento = snapshot.docs[snapshot.docs.length - 1];

          renderizarTodo();
          if (appLoader) appLoader.classList.add('hidden');
        }, 
        (error) => {
          document.getElementById('listaOrdenes').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error</h3><p>${error.message}</p></div>`;
          if (appLoader) appLoader.classList.add('hidden');
        }
      );

      // 2. Cargar Ventas Rápidas
      if (unsubscribeVentas) unsubscribeVentas();
      const qVentas = query(collection(db, 'ventas'), limit(100));
      unsubscribeVentas = onSnapshot(qVentas, (snapshot) => {
        ventasPanel = snapshot.docs.map(d => ({ id: d.id, origen: 'panel', coleccion: 'ventas', ...d.data() }));
        procesarVentas();
      });

      // 3. Cargar Cierres Extras
      if (unsubscribeCierres) unsubscribeCierres();
      const qCierres = query(collection(db, 'cierres'), limit(100));
      unsubscribeCierres = onSnapshot(qCierres, (snapshot) => {
        ventasCierre = [];
        snapshot.forEach(doc => {
          const d = doc.data();
          
          if (d.ventasInventario && d.ventasInventario.length > 0) {
            d.ventasInventario.forEach((v, index) => {
              ventasCierre.push({
                id: doc.id,
                indexExtra: `inv_${index}`,
                origen: 'cierre',
                coleccion: 'cierres',
                concepto: `${v.cantidad}x ${v.nombre}`,
                monto: Number(v.precio * v.cantidad) || 0,
                metodoPago: 'Efectivo',
                fecha: d.fecha
              });
            });
          }

          if (d.extras && d.extras.length > 0) {
            d.extras.forEach((e, index) => {
              if (e.monto > 0) {
                ventasCierre.push({
                  id: doc.id,
                  indexExtra: `ext_${index}`,
                  origen: 'cierre',
                  coleccion: 'cierres',
                  concepto: e.desc || 'Venta Extra',
                  monto: Number(e.monto) || 0,
                  metodoPago: 'Efectivo',
                  fecha: d.fecha
                });
              }
            });
          }
        });
        procesarVentas();
      });
    }

    function procesarVentas() {
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const todas = [...ventasPanel, ...ventasCierre];
      
      ventasHoy = todas.filter(v => {
        const f = parsearFecha(v.fecha);
        return f && f >= hoy;
      });

      ventasHoy.sort((a, b) => {
        const fa = parsearFecha(a.fecha);
        const fb = parsearFecha(b.fecha);
        return fb - fa;
      });

      renderizarTodo();
    }

    // 🔥 UNIFICACIÓN DE LISTAS (TELÉFONOS + VENTAS)
    function renderizarTodo() {
      actualizarStats();
      
      const lista = document.getElementById('listaOrdenes');
      let todosLosMovimientos = [];

      // 1. Agregar Teléfonos
      if (filtroActual === 'todos' || filtroActual === 'telefono') {
        ordenes.forEach(o => {
          const estaEntregado = o.estadoOrden === 'entregado';
          const montoCobrado = Number(o.montoCobrado) || 0;
          
          // Solo mostramos teléfonos que sean ingresos (entregados y con monto) o que estén activos
          if (estaEntregado && montoCobrado > 0) {
            todosLosMovimientos.push({
              tipo: 'telefono',
              data: o,
              fechaOrden: parsearFecha(o.fechaEntrega) || parsearFecha(o.fechaEditada) || parsearFecha(o.fecha),
              monto: montoCobrado
            });
          } else if (!estaEntregado) {
             // Mostrar activos también
             todosLosMovimientos.push({
              tipo: 'telefono',
              data: o,
              fechaOrden: parsearFecha(o.fechaEditada) || parsearFecha(o.fecha),
              monto: Number(o.total) || 0
            });
          }
        });
      }

      // 2. Agregar Ventas (Solo si el filtro es "Todos" o "Venta")
      if (filtroActual === 'todos' || filtroActual === 'venta') {
        ventasHoy.forEach(v => {
          todosLosMovimientos.push({
            tipo: v.origen === 'panel' ? 'venta' : 'cierre',
            data: v,
            fechaOrden: parsearFecha(v.fecha),
            monto: v.monto
          });
        });
      }

      // 3. Filtrar por Búsqueda
      if (busquedaActual) {
        todosLosMovimientos = todosLosMovimientos.filter(m => {
          let texto = '';
          if (m.tipo === 'telefono') {
            const o = m.data;
            texto = [o.numeroRecibo, o.cliente, o.telefono, o.marca, o.modelo].filter(Boolean).join(' ').toLowerCase();
          } else {
            texto = m.data.concepto.toLowerCase();
          }
          return texto.includes(busquedaActual);
        });
      }

      // 4. Ordenar TODO por fecha (lo más reciente arriba)
      todosLosMovimientos.sort((a, b) => b.fechaOrden - a.fechaOrden);

      // 5. Renderizar
      if (todosLosMovimientos.length === 0) {
        lista.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><h3>Sin movimientos</h3><p>No hay ingresos ni órdenes hoy.</p></div>`;
        btnCargarMas.style.display = 'none';
        return;
      }

      lista.innerHTML = todosLosMovimientos.map(m => {
        if (m.tipo === 'telefono') {
          return renderCardTelefono(m.data);
        } else {
          return renderCardVenta(m.data, m.tipo);
        }
      }).join('');

      // Eventos
      lista.querySelectorAll('.ingreso-card').forEach(card => {
        card.addEventListener('click', () => {
          haptic(10);
          if (card.dataset.tipo === 'telefono') {
            abrirSheetTelefono(card.dataset.id);
          } else {
            abrirSheetVenta(card.dataset.id, card.dataset.origen, card.dataset.extra);
          }
        });
      });

      if (hayMasRecibos && !busquedaActual && filtroActual === 'todos') btnCargarMas.style.display = 'flex';
      else btnCargarMas.style.display = 'none';
    }

    function renderCardTelefono(o) {
      const estadoActual = o.estadoOrden || 'recibido';
      const estadoInfo = {
        recibido: { texto: 'Recibido', emoji: '📦' },
        reparacion: { texto: 'En Reparación', emoji: '🔧' },
        'espera-repuesto': { texto: 'Espera Repuesto', emoji: '⏳' },
        listo: { texto: 'Listo', emoji: '✅' },
        entregado: { texto: 'Entregado', emoji: '🤝' },
        devuelto: { texto: 'Devuelto', emoji: '↩️' },
        cancelado: { texto: 'Cancelado', emoji: '⛔' }
      }[estadoActual] || { texto: estadoActual, emoji: '📋' };

      const total = Number(o.montoCobrado) || Number(o.total) || 0;
      const metodoPago = o.metodoPago ? o.metodoPago.replace(/\(.*\)/, '').trim() : '';

      return `
        <div class="ingreso-card" data-tipo="telefono" data-id="${o.id}" data-estado="${estadoActual}">
          <div style="display: flex; justify-content: space-between; align-items: start; gap: 10px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;">
                <span class="chip-estado" data-tipo="telefono">${estadoInfo.emoji} ${estadoInfo.texto}</span>
                <span style="font-size: 10px; color: var(--text-mute); font-weight: 600; font-family: monospace;">${o.numeroRecibo || '—'}</span>
              </div>
              <div style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 2px;">${escapeHtml(o.marca || '')} ${escapeHtml(o.modelo || '')}</div>
              ${o.cliente ? `<div style="font-size: 12px; color: var(--text-mute); margin-bottom: 2px;">👤 ${escapeHtml(o.cliente)}</div>` : ''}
              <div style="font-size: 10px; color: var(--text-mute); margin-top: 8px; display: flex; align-items: center; gap: 4px;"><i class="far fa-clock"></i> ${tiempoRelativo(o.fechaEditada || o.fecha)}</div>
            </div>
            <div style="text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: end; gap: 2px;">
              <div style="font-size: 16px; font-weight: 800; color: var(--brand);">${formatBs(total)}</div>
              ${metodoPago ? `<div class="metodo-pago">${getIconoMetodo(metodoPago)} ${escapeHtml(metodoPago)}</div>` : (estadoActual === 'entregado' ? `<div class="metodo-pago">✓ Pagado</div>` : '')}
            </div>
          </div>
        </div>
      `;
    }

    function renderCardVenta(v, tipo) {
      const fechaD = parsearFecha(v.fecha);
      const horaStr = `${String(fechaD.getHours()).padStart(2, '0')}:${String(fechaD.getMinutes()).padStart(2, '0')}`;
      
      let icono = '🛒';
      if (v.concepto === 'Botón') icono = '🔘';
      else if (v.concepto === 'Limpieza') icono = '🧹';
      else if (v.concepto === 'Reactivación') icono = '⚡';
      else if (v.concepto === 'Cargador') icono = '🔌';

      return `
        <div class="ingreso-card" data-tipo="${tipo}" data-id="${v.id}" data-origen="${v.origen}" data-extra="${v.indexExtra || ''}">
          <div style="display: flex; justify-content: space-between; align-items: start; gap: 10px;">
            <div style="flex: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;">
                <span class="chip-estado" data-tipo="${tipo}">${tipo === 'venta' ? '⚡ Venta' : '🛒 Extra'}</span>
                <span style="font-size: 10px; color: var(--text-mute); font-weight: 600; font-family: monospace;">${horaStr}</span>
              </div>
              <div style="font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 2px;">${icono} ${escapeHtml(v.concepto)}</div>
              <div style="font-size: 11px; color: var(--text-mute); margin-bottom: 2px;">💵 ${escapeHtml(v.metodoPago)}</div>
            </div>
            <div style="text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: end; gap: 2px;">
              <div style="font-size: 16px; font-weight: 800; color: var(--success);">${formatBs(v.monto)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function getIconoMetodo(metodo) {
      const m = String(metodo || '').toLowerCase();
      if (m.includes('efectivo')) return '💵';
      if (m.includes('qr')) return '📱';
      if (m.includes('transf')) return '🏦';
      if (m.includes('mixto')) return '🔀';
      return '💳';
    }

    function actualizarStats() {
      const activas = ordenes.filter(o => ['recibido', 'reparacion', 'espera-repuesto'].includes(o.estadoOrden || 'recibido')).length;
      const listas = ordenes.filter(o => o.estadoOrden === 'listo').length;
      document.getElementById('statActivas').textContent = activas;
      document.getElementById('statListas').textContent = listas;

      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      let ingresosReparaciones = 0;

      ordenes.forEach(o => {
        if (o.estadoOrden === 'entregado') {
          const fEntrega = parsearFecha(o.fechaEntrega) || parsearFecha(o.fechaEditada) || parsearFecha(o.fecha);
          if (fEntrega && fEntrega >= hoy) {
            ingresosReparaciones += Number(o.montoCobrado) || 0;
          }
        }
      });

      const ingresosVentas = ventasHoy.reduce((sum, v) => sum + (Number(v.monto) || 0), 0);
      
      document.getElementById('statHoy').textContent = formatBs(ingresosReparaciones + ingresosVentas);
    }

    async function cargarMasOrdenes() {
      if (!ultimoDocumento) return;
      haptic(10);
      const textoOriginal = btnCargarMas.innerHTML;
      btnCargarMas.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
      btnCargarMas.disabled = true;

      try {
        const q = query(collection(db, 'recibos'), startAfter(ultimoDocumento), limit(LIMITE_POR_PAGINA));
        const snapshot = await getDocs(q);
        const nuevosRecibos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        
        ordenes = [...ordenes, ...nuevosRecibos];
        ordenes.sort((a, b) => {
          const fa = a.fechaEditada || a.fecha;
          const fb = b.fechaEditada || b.fecha;
          const da = parsearFecha(fa);
          const db = parsearFecha(fb);
          return db - da;
        });
        
        if (snapshot.docs.length > 0) ultimoDocumento = snapshot.docs[snapshot.docs.length - 1];
        hayMasRecibos = snapshot.docs.length === LIMITE_POR_PAGINA;

        renderizarTodo();
      } catch (error) {
        toast('No se pudieron cargar más', 'error');
      } finally {
        btnCargarMas.innerHTML = textoOriginal;
        btnCargarMas.disabled = false;
      }
    }

    // 🔥 MODAL PARA TELÉFONOS
    function abrirSheetTelefono(id) {
      const orden = ordenes.find(o => o.id === id);
      if (!orden) return;

      sheetContent.innerHTML = `
        <div style="margin-bottom: 20px;">
          <h3 style="font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0 0 4px 0;">${escapeHtml(orden.numeroRecibo)}</h3>
          <p style="font-size: 13px; color: var(--text-mute); margin: 0;">${escapeHtml(orden.cliente)} · ${escapeHtml(orden.marca)} ${escapeHtml(orden.modelo)}</p>
        </div>
        <button class="btn-sheet btn-sheet-edit" id="btnEditarOrden"><i class="fas fa-edit"></i> Editar Orden Completa</button>
        <div style="background: var(--bg-elev); padding: 14px; border-radius: var(--radius-sm); margin: 16px 0; border: 1px solid var(--border);">
          <label style="font-size: 10px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; margin-bottom: 8px; display: block;">Cambiar Estado</label>
          <select id="selectEstado" class="custom-select">
            <option value="recibido" ${orden.estadoOrden === 'recibido' ? 'selected' : ''}>📦 Recibido</option>
            <option value="reparacion" ${orden.estadoOrden === 'reparacion' ? 'selected' : ''}>🔧 En reparación</option>
            <option value="espera-repuesto" ${orden.estadoOrden === 'espera-repuesto' ? 'selected' : ''}>⏳ Esperando repuesto</option>
            <option value="listo" ${orden.estadoOrden === 'listo' ? 'selected' : ''}>✅ Listo para entregar</option>
            <option value="entregado" ${orden.estadoOrden === 'entregado' ? 'selected' : ''}>🤝 Entregado</option>
            <option value="devuelto" ${orden.estadoOrden === 'devuelto' ? 'selected' : ''}>↩️ Devuelto</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column;">
          <button class="btn-sheet btn-sheet-primary" id="btnActualizarEstado"><i class="fas fa-save"></i> Guardar Cambios</button>
          <button class="btn-sheet btn-sheet-whatsapp" id="btnWhatsApp"><i class="fab fa-whatsapp"></i> Reenviar por WhatsApp</button>
          <button class="btn-sheet btn-sheet-danger" id="btnEliminar"><i class="fas fa-trash"></i> Eliminar Recibo</button>
        </div>
      `;

      reciboSheet.classList.add('show');
      haptic(15);

      document.getElementById('btnEditarOrden')?.addEventListener('click', () => {
        window.location.href = `/app/orden.html?id=${id}`;
      });

      document.getElementById('btnActualizarEstado')?.addEventListener('click', async () => {
        const nuevoEstado = document.getElementById('selectEstado').value;
        try {
          await updateDoc(doc(db, 'recibos', id), { estadoOrden: nuevoEstado });
          toast('Estado actualizado', 'success');
          cerrarSheet();
        } catch (err) { toast('Error al actualizar', 'error'); }
      });

      document.getElementById('btnWhatsApp')?.addEventListener('click', () => {
        const mensaje = `Hola ${orden.cliente.split(' ')[0]}, tu equipo ${orden.marca} ${orden.modelo} está en estado: *${orden.estadoOrden || 'recibido'}*.\n\nN Recibo: ${orden.numeroRecibo}\nPuedes revisarlo en: https://xiaomi.scz.red/?recibo=${orden.numeroRecibo}`;
        const tel = orden.telefono.replace(/\D/g, '');
        window.open(`https://wa.me/591${tel}?text=${encodeURIComponent(mensaje)}`, '_blank');
        cerrarSheet();
      });

      document.getElementById('btnEliminar')?.addEventListener('click', async () => {
        if (confirm('¿Eliminar este recibo permanentemente?')) {
          try {
            await deleteDoc(doc(db, 'recibos', id));
            toast('Recibo eliminado', 'success');
            cerrarSheet();
          } catch (err) { toast('Error al eliminar', 'error'); }
        }
      });
    }

    // 🔥 MODAL PARA VENTAS
    function abrirSheetVenta(id, origen, extra) {
      const venta = ventasHoy.find(v => v.id === id && (v.indexExtra || '') === extra);
      if (!venta) return;

      const fechaD = parsearFecha(venta.fecha);
      const horaStr = `${String(fechaD.getHours()).padStart(2, '0')}:${String(fechaD.getMinutes()).padStart(2, '0')}`;

      sheetContent.innerHTML = `
        <div style="margin-bottom: 20px;">
          <h3 style="font-size: 18px; font-weight: 800; color: var(--success); margin: 0 0 4px 0;">${escapeHtml(venta.concepto)}</h3>
          <p style="font-size: 13px; color: var(--text-mute); margin: 0;">${formatBs(venta.monto)} · ${horaStr} · ${escapeHtml(venta.metodoPago)}</p>
        </div>
        
        ${origen === 'panel' ? `
          <button class="btn-sheet btn-sheet-edit" id="btnEditarVenta"><i class="fas fa-edit"></i> Editar Monto / Detalle</button>
        ` : ''}
        
        <button class="btn-sheet btn-sheet-danger" id="btnEliminarVenta"><i class="fas fa-trash"></i> Eliminar Venta</button>
      `;

      reciboSheet.classList.add('show');
      haptic(15);

      if (origen === 'panel') {
        document.getElementById('btnEditarVenta')?.addEventListener('click', () => {
          cerrarSheet();
          abrirModalEditarVenta(venta);
        });
      }

      document.getElementById('btnEliminarVenta')?.addEventListener('click', async () => {
        if (!confirm('¿Eliminar esta venta permanentemente?')) return;
        haptic(20);
        try {
          if (origen === 'panel') {
            await deleteDoc(doc(db, 'ventas', id));
            toast('Venta eliminada', 'success');
          } else {
            await deleteDoc(doc(db, 'cierres', id));
            toast('Cierre eliminado', 'success');
          }
          cerrarSheet();
        } catch (err) {
          console.error(err);
          toast('Error al eliminar', 'error');
        }
      });
    }

    function abrirModalEditarVenta(venta) {
      const modal = document.createElement('div');
      modal.className = 'sheet-backdrop';
      modal.id = 'modalEditarVenta';
      modal.style.display = 'flex';

      modal.innerHTML = `
        <div class="sheet">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-size: 18px; font-weight: 800;">Editar Venta</h3>
            <button class="icon-btn" id="btnCloseEditV" style="background: var(--bg-elev);"><i class="fas fa-times"></i></button>
          </div>
          
          <div class="input-group">
            <label>Concepto</label>
            <input type="text" id="editConceptoV" class="form-control" value="${escapeHtml(venta.concepto)}">
          </div>

          <div class="input-group">
            <label>Monto (Bs.)</label>
            <input type="number" id="editMontoV" class="form-control" value="${venta.monto}">
          </div>

          <div class="input-group">
            <label>Método de Pago</label>
            <select id="editMetodoV" class="form-control">
              <option value="Efectivo" ${venta.metodoPago === 'Efectivo' ? 'selected' : ''}>💵 Efectivo</option>
              <option value="QR" ${venta.metodoPago === 'QR' ? 'selected' : ''}>📱 QR</option>
              <option value="Transferencia" ${venta.metodoPago === 'Transferencia' ? 'selected' : ''}>🏦 Transferencia</option>
            </select>
          </div>

          <button class="btn-sheet btn-sheet-primary" id="btnSaveEditV">
            <i class="fas fa-save"></i> Guardar Cambios
          </button>
        </div>
      `;

      document.body.appendChild(modal);
      setTimeout(() => modal.classList.add('show'), 10);

      const cerrar = () => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 300);
      };

      document.getElementById('btnCloseEditV').addEventListener('click', cerrar);
      modal.addEventListener('click', (e) => { if (e.target === modal) cerrar(); });

      document.getElementById('btnSaveEditV').addEventListener('click', async () => {
        const nuevoConcepto = document.getElementById('editConceptoV').value.trim();
        const nuevoMonto = parseFloat(document.getElementById('editMontoV').value) || 0;
        const nuevoMetodo = document.getElementById('editMetodoV').value;

        haptic(20);
        try {
          await updateDoc(doc(db, 'ventas', venta.id), {
            concepto: nuevoConcepto,
            monto: nuevoMonto,
            metodoPago: nuevoMetodo
          });
          toast('Venta actualizada', 'success');
          cerrar();
        } catch (err) {
          console.error(err);
          toast('Error al actualizar', 'error');
        }
      });
    }

    function cerrarSheet() {
      if (reciboSheet) reciboSheet.classList.remove('show');
    }

    function generarPDFDia() {
      haptic(20);
      toast('Generando PDF...', 'info');
      
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      
      pdf.setFontSize(18);
      pdf.text("Reporte del Día - DR. XIAOMI", 14, 20);
      pdf.setFontSize(10);
      pdf.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 28);
      
      let y = 40;
      let totalDia = 0;

      pdf.setFontSize(12);
      pdf.text("Reparaciones Entregadas Hoy", 14, y);
      y += 8;
      pdf.setFontSize(10);
      
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      ordenes.forEach(o => {
        if (o.estadoOrden === 'entregado') {
          const fEntrega = parsearFecha(o.fechaEntrega) || parsearFecha(o.fechaEditada) || parsearFecha(o.fecha);
          if (fEntrega && fEntrega >= hoy) {
            const monto = Number(o.montoCobrado) || 0;
            pdf.text(`- ${o.numeroRecibo || 'Sin N°'} | ${o.cliente} | ${o.marca} ${o.modelo} | Bs. ${monto.toFixed(2)}`, 14, y);
            totalDia += monto;
            y += 6;
          }
        }
      });

      y += 4;
      
      pdf.setFontSize(12);
      pdf.text("Ventas Rápidas y Extras (Mostrador)", 14, y);
      y += 8;
      pdf.setFontSize(10);

      ventasHoy.forEach(v => {
        const monto = Number(v.monto) || 0;
        pdf.text(`- ${v.concepto} | ${v.metodoPago} | Bs. ${monto.toFixed(2)}`, 14, y);
        totalDia += monto;
        y += 6;
      });

      y += 10;
      pdf.setFontSize(14);
      pdf.text(`TOTAL DEL DÍA: Bs. ${totalDia.toFixed(2)}`, 14, y);

      pdf.save(`Reporte_${new Date().toISOString().slice(0,10)}.pdf`);
      toast('PDF generado', 'success');
    }
  </script>

  <script>
    setTimeout(() => {
      const loader = document.getElementById('appLoader');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        console.warn('⚠️ Loader apagado por seguridad (timeout de 2s).');
      }
    }, 2000);
  </script>
</body>
</html>
