<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DR. Xiaomi · Ingresar</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- PWA -->
  <link rel="manifest" href="/app/manifest.json">
  <meta name="apple-mobile-web-app-title" content="DR. Xiaomi Panel">

  <style>
    /* ============================================================ */
    /* RESET Y BASE AISLADO CON PREFIJO lg- PARA EVITAR CHOQUES     */
    /* ============================================================ */
    :root {
      --lg-bg: #0A0A0B;
      --lg-card: #181818;
      --lg-elev: #242424;
      --lg-text: #F5F5F5;
      --lg-mute: #888888;
      --lg-border: #2A2A2A;
      --lg-brand: #FF6900;
      --lg-glow: rgba(255, 105, 0, 0.3);
      --lg-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    #login-app {
      position: fixed !important;
      inset: 0 !important;
      background-color: var(--lg-bg) !important;
      color: var(--lg-text) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 99999 !important;
    }

    #login-app::before {
      content: '' !important;
      position: absolute !important;
      top: -50% !important; left: -50% !important; width: 200% !important; height: 200% !important;
      background: radial-gradient(circle at 50% 30%, rgba(255, 105, 0, 0.08) 0%, transparent 60%) !important;
      z-index: -1 !important;
      pointer-events: none !important;
    }

    .lg-container {
      width: 100% !important;
      max-width: 400px !important;
      padding: 24px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      animation: lgFadeIn 0.4s var(--lg-spring) !important;
    }

    .lg-hidden { display: none !important; }

    /* Logo */
    .lg-logo {
      width: 88px !important;
      height: 88px !important;
      border-radius: 50% !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
      margin-bottom: 20px !important;
      box-shadow: 0 8px 32px var(--lg-glow) !important;
      background: var(--lg-card) !important;
      border: 1px solid var(--lg-border) !important;
    }
    .lg-logo img { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    .lg-logo.small { width: 76px !important; height: 76px !important; margin-bottom: 16px !important; }

    /* Títulos */
    .lg-title {
      font-size: 26px !important;
      font-weight: 800 !important;
      letter-spacing: -0.5px !important;
      margin: 0 0 6px 0 !important;
      background: linear-gradient(135deg, #FFF, #AAA) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }
    .lg-subtitle {
      font-size: 13px !important;
      color: var(--lg-mute) !important;
      font-weight: 500 !important;
      margin: 0 0 32px 0 !important;
    }
    .lg-section-title {
      font-size: 12px !important;
      font-weight: 600 !important;
      color: var(--lg-mute) !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
      margin: 0 0 16px 0 !important;
    }

    /* Lista de perfiles */
    #perfilesList {
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 12px !important;
    }

    .lg-profile-card {
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
      padding: 16px !important;
      background: var(--lg-card) !important;
      border: 1px solid var(--lg-border) !important;
      border-radius: 16px !important;
      cursor: pointer !important;
      transition: all 0.3s var(--lg-spring) !important;
      text-align: left !important;
      color: var(--lg-text) !important;
      font-family: inherit !important;
      margin: 0 !important;
    }

    .lg-profile-card:active {
      transform: scale(0.97) !important;
      background: var(--lg-elev) !important;
    }

    .lg-profile-icon {
      width: 48px !important;
      height: 48px !important;
      border-radius: 12px !important;
      background: var(--lg-elev) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 24px !important;
      margin-right: 16px !important;
      border: 1px solid var(--lg-border) !important;
      flex-shrink: 0 !important;
    }

    .lg-profile-info {
      flex: 1 !important;
    }

    .lg-profile-name {
      font-size: 16px !important;
      font-weight: 700 !important;
      margin: 0 0 2px 0 !important;
    }

    .lg-profile-role {
      font-size: 12px !important;
      color: var(--lg-mute) !important;
      font-weight: 500 !important;
      margin: 0 !important;
    }

    .lg-profile-arrow {
      color: var(--lg-mute) !important;
      font-size: 14px !important;
    }

    /* Botones flotantes */
    .lg-btn-floating {
      position: fixed !important;
      top: 20px !important;
      width: 44px !important;
      height: 44px !important;
      background: var(--lg-card) !important;
      border: 1px solid var(--lg-border) !important;
      border-radius: 12px !important;
      color: var(--lg-text) !important;
      font-size: 18px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      z-index: 100000 !important;
      transition: all 0.2s var(--lg-spring) !important;
      margin: 0 !important;
    }
    .lg-btn-floating:active { transform: scale(0.9) !important; }
    .lg-btn-floating.left { left: 20px !important; }
    .lg-btn-floating.right { right: 20px !important; }

    /* Formulario PIN */
    #pinForm {
      width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      margin: 0 !important;
    }

    .lg-input-group {
      position: relative !important;
      width: 100% !important;
      margin-bottom: 16px !important;
    }

    #pinInput {
      width: 100% !important;
      padding: 18px 50px 18px 18px !important;
      background: var(--lg-card) !important;
      border: 1.5px solid var(--lg-border) !important;
      border-radius: 16px !important;
      color: var(--lg-text) !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      text-align: center !important;
      letter-spacing: 2px !important;
      transition: all 0.2s ease !important;
      font-family: inherit !important;
      outline: none !important;
      margin: 0 !important;
    }

    #pinInput:focus {
      border-color: var(--lg-brand) !important;
      box-shadow: 0 0 0 4px var(--lg-glow) !important;
    }

    #togglePin {
      position: absolute !important;
      right: 10px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      width: 40px !important;
      height: 40px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: transparent !important;
      border: none !important;
      color: var(--lg-mute) !important;
      font-size: 16px !important;
      cursor: pointer !important;
      border-radius: 12px !important;
      transition: color 0.2s !important;
      margin: 0 !important;
    }
    #togglePin:hover { color: var(--lg-text) !important; }

    #pinError {
      text-align: center !important;
      color: #EF4444 !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      min-height: 20px !important;
      margin-bottom: 12px !important;
    }

    /* Botón Principal */
    .lg-btn-login {
      width: 100% !important;
      padding: 16px !important;
      border-radius: 16px !important;
      background: linear-gradient(135deg, var(--lg-brand), #FF8C00) !important;
      color: white !important;
      font-size: 16px !important;
      font-weight: 700 !important;
      border: none !important;
      cursor: pointer !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      transition: all 0.2s var(--lg-spring) !important;
      box-shadow: 0 4px 16px -4px var(--lg-glow) !important;
      font-family: inherit !important;
      margin: 0 !important;
    }

    .lg-btn-login:active { transform: scale(0.96) !important; }
    .lg-btn-login:disabled { opacity: 0.7 !important; cursor: not-allowed !important; }

    /* Spinner */
    .lg-spinner {
      border: 2px solid rgba(255,255,255,0.3) !important;
      border-top-color: #fff !important;
      border-radius: 50% !important;
      animation: lgSpin 0.8s linear infinite !important;
    }

    @keyframes lgSpin { to { transform: rotate(360deg); } }
    @keyframes lgFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes lgShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

  </style>
</head>
<body>

  <div id="login-app">
    <!-- ============================================================
         VISTA 1: SELECCIÓN DE PERFIL
         ============================================================ -->
    <div class="lg-container" id="viewPerfiles">
      <div class="lg-logo">
        <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi"
             onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--lg-brand); font-size:36px;&quot;></i>';">
      </div>

      <h1 class="lg-title">DR. XIAOMI</h1>
      <p class="lg-subtitle">Servicio Técnico Especializado</p>

      <p class="lg-section-title">¿Quién está ingresando?</p>

      <div id="perfilesList"></div>

      <button id="themeToggle" class="lg-btn-floating right" aria-label="Cambiar tema">
        <i class="fas fa-sun"></i>
      </button>
    </div>

    <!-- ============================================================ -->
    <!-- VISTA 2: INGRESAR CLAVE                                      -->
    <!-- ============================================================ -->
    <div class="lg-container lg-hidden" id="viewPin">
      <button id="backBtn" class="lg-btn-floating left" aria-label="Volver">
        <i class="fas fa-arrow-left"></i>
      </button>

      <div class="lg-logo small" id="profileIconView">
        <span style="font-size: 36px;">👑</span>
      </div>

      <h1 class="lg-title" id="profileNameView" style="font-size: 22px;">Admin</h1>
      <p class="lg-subtitle" id="profileRoleView" style="margin-bottom: 32px;">Dueño</p>

      <form id="pinForm">
        <div class="lg-input-group">
          <input type="password" 
                 id="pinInput" 
                 placeholder="Ingresa tu clave"
                 autocomplete="current-password"
                 autofocus>
          <button type="button" id="togglePin" aria-label="Mostrar clave">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <div id="pinError"></div>

        <button type="submit" class="lg-btn-login" id="submitBtn">
          <i class="fas fa-sign-in-alt"></i>
          Ingresar
        </button>
      </form>

      <button id="themeToggle2" class="lg-btn-floating right" aria-label="Cambiar tema">
        <i class="fas fa-sun"></i>
      </button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- SCRIPTS                                                      -->
  <!-- ============================================================ -->
  <script type="module">
    import { getPerfiles, login, getSesion, redirigirSegunRol } from '/js/app-auth.js';
    import { toast, haptic, initTheme, toggleTheme } from '/js/app-ui.js';

    let perfilActual = null;

    const viewPerfiles    = document.getElementById('viewPerfiles');
    const viewPin         = document.getElementById('viewPin');
    const perfilesList    = document.getElementById('perfilesList');
    const profileIconView = document.getElementById('profileIconView');
    const profileNameView = document.getElementById('profileNameView');
    const profileRoleView = document.getElementById('profileRoleView');
    const pinForm         = document.getElementById('pinForm');
    const pinInput        = document.getElementById('pinInput');
    const pinError        = document.getElementById('pinError');
    const submitBtn       = document.getElementById('submitBtn');
    const togglePin       = document.getElementById('togglePin');
    const backBtn         = document.getElementById('backBtn');
    const themeToggle     = document.getElementById('themeToggle');
    const themeToggle2    = document.getElementById('themeToggle2');

    initTheme();

    const sesionExistente = getSesion();
    if (sesionExistente) {
      console.log('✅ Ya hay sesión activa, redirigiendo...');
      redirigirSegunRol();
    }

    themeToggle.addEventListener('click', () => { haptic(10); toggleTheme(); });
    themeToggle2.addEventListener('click', () => { haptic(10); toggleTheme(); });

    function cargarPerfiles() {
      const perfiles = getPerfiles();

      perfilesList.innerHTML = perfiles.map(p => `
        <button class="lg-profile-card" data-perfil-id="${p.id}" type="button">
          <div class="lg-profile-icon">${p.icono}</div>
          <div class="lg-profile-info">
            <div class="lg-profile-name">${p.nombre}</div>
            <div class="lg-profile-role">${p.subtitulo}</div>
          </div>
          <i class="fas fa-chevron-right lg-profile-arrow"></i>
        </button>
      `).join('');

      perfilesList.querySelectorAll('.lg-profile-card').forEach(card => {
        card.addEventListener('click', () => {
          const perfilId = card.dataset.perfilId;
          const perfil = perfiles.find(p => p.id === perfilId);
          if (perfil) seleccionarPerfil(perfil);
        });
      });
    }

    function seleccionarPerfil(perfil) {
      perfilActual = perfil;
      haptic(15);

      profileIconView.innerHTML = `<span style="font-size: 36px;">${perfil.icono}</span>`;
      profileNameView.textContent = perfil.nombre;
      profileRoleView.textContent = perfil.subtitulo;

      pinForm.reset();
      pinError.textContent = '';
      pinInput.type = 'password';
      togglePin.innerHTML = '<i class="fas fa-eye"></i>';

      viewPerfiles.classList.add('lg-hidden');
      viewPin.classList.remove('lg-hidden');

      setTimeout(() => pinInput.focus(), 100);
    }

    backBtn.addEventListener('click', () => {
      haptic(10);
      perfilActual = null;
      pinInput.value = '';
      pinError.textContent = '';
      viewPin.classList.add('lg-hidden');
      viewPerfiles.classList.remove('lg-hidden');
    });

    togglePin.addEventListener('click', () => {
      haptic(8);
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        togglePin.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        pinInput.type = 'password';
        togglePin.innerHTML = '<i class="fas fa-eye"></i>';
      }
      pinInput.focus();
    });

    pinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      verificarPin();
    });

    function verificarPin() {
      if (!perfilActual) return;

      const pin = pinInput.value;
      if (!pin) {
        pinError.textContent = 'Ingresa tu clave';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="lg-spinner" style="width: 18px; height: 18px;"></div> Verificando...';
      pinError.textContent = '';

      const resultado = login(perfilActual.id, pin);

      if (resultado.success) {
        haptic([15, 50, 15]);
        toast(`¡Bienvenido, ${perfilActual.nombre}!`, 'success', 1200);

        setTimeout(() => {
          redirigirSegunRol();
        }, 800);
      } else {
        haptic([50, 30, 50]);
        pinError.textContent = resultado.error || 'Clave incorrecta';

        pinForm.style.animation = 'lgShake 0.4s';
        setTimeout(() => pinForm.style.animation = '', 400);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';

        pinInput.select();
      }
    }

    cargarPerfiles();
  </script>

</body>
</html>
