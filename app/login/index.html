<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DR. Xiaomi · Ingresar</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- PWA -->
  <link rel="manifest" href="/app/manifest.json">
  <meta name="apple-mobile-web-app-title" content="DR. Xiaomi Panel">

  <style>
    /* ============================================================ */
    /* RESET Y BASE PARA EL LOGIN (Aislado del tema global)         */
    /* ============================================================ */
    :root {
      --bg-app: #0A0A0B;
      --bg-card: #181818;
      --bg-elev: #242424;
      --text-main: #F5F5F5;
      --text-mute: #888888;
      --border: #2A2A2A;
      --brand: #FF6900;
      --brand-glow: rgba(255, 105, 0, 0.3);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fondo con gradiente sutil y desenfoque */
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 30%, rgba(255, 105, 0, 0.08) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    /* Contenedor principal */
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s var(--ease-spring);
    }

    .hidden { display: none !important; }

    /* Logo */
    .login-logo-limpio {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px var(--brand-glow);
      background: var(--bg-card);
      border: 1px solid var(--border);
    }
    .login-logo-limpio img { width: 100%; height: 100%; object-fit: cover; }
    .login-logo-limpio.small { width: 76px; height: 76px; margin-bottom: 16px; }

    /* Títulos */
    .login-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #FFF, #AAA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 500;
      margin-bottom: 32px;
    }
    .login-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mute);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* Lista de perfiles */
    #perfilesList {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s var(--ease-spring);
      text-align: left;
      color: var(--text-main);
      font-family: inherit;
    }

    .profile-card:active {
      transform: scale(0.97);
      background: var(--bg-elev);
    }

    .profile-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-elev);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-right: 16px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .profile-role {
      font-size: 12px;
      color: var(--text-mute);
      font-weight: 500;
    }

    .profile-arrow {
      color: var(--text-mute);
      font-size: 14px;
    }

    /* Botones flotantes (Tema y Atrás) */
    .icon-btn-floating {
      position: fixed;
      top: 20px;
      width: 44px;
      height: 44px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s var(--ease-spring);
    }
    .icon-btn-floating:active { transform: scale(0.9); }
    .icon-btn-floating.left { left: 20px; }
    .icon-btn-floating.right { right: 20px; }

    /* Formulario PIN */
    #pinForm {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-group {
      position: relative;
      width: 100%;
      margin-bottom: 16px;
    }

    #pinInput {
      width: 100%;
      padding: 18px 50px 18px 18px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      font-family: inherit;
      outline: none;
    }

    #pinInput:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-glow);
    }

    #togglePin {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-mute);
      font-size: 16px;
      cursor: pointer;
      border-radius: 12px;
      transition: color 0.2s;
    }
    #togglePin:hover { color: var(--text-main); }

    #pinError {
      text-align: center;
      color: #EF4444;
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
      margin-bottom: 12px;
    }

    /* Botón Principal */
    .btn-login {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand), #FF8C00);
      color: white;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s var(--ease-spring);
      box-shadow: 0 4px 16px -4px var(--brand-glow);
      font-family: inherit;
    }

    .btn-login:active { transform: scale(0.96); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

  </style>
</head>
<body>

  <!-- ============================================================
       VISTA 1: SELECCIÓN DE PERFIL
       ============================================================ -->
  <div class="login-container" id="viewPerfiles">
    <div class="login-logo-limpio">
      <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi"
           onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand); font-size:36px;&quot;></i>';">
    </div>

    <h1 class="login-title">DR. XIAOMI</h1>
    <p class="login-subtitle">Servicio Técnico Especializado</p>

    <p class="login-section-title">¿Quién está ingresando?</p>

    <div id="perfilesList"></div>

    <button id="themeToggle" class="icon-btn-floating right" aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================ -->
  <!-- VISTA 2: INGRESAR CLAVE                                      -->
  <!-- ============================================================ -->
  <div class="login-container hidden" id="viewPin">
    <button id="backBtn" class="icon-btn-floating left" aria-label="Volver">
      <i class="fas fa-arrow-left"></i>
    </button>

    <div class="login-logo-limpio small" id="profileIconView">
      <span style="font-size: 36px;">👑</span>
    </div>

    <h1 class="login-title" id="profileNameView" style="font-size: 22px;">Admin</h1>
    <p class="login-subtitle" id="profileRoleView" style="margin-bottom: 32px;">Dueño</p>

    <form id="pinForm">
      <div class="input-group">
        <input type="password" 
               id="pinInput" 
               placeholder="Ingresa tu clave"
               autocomplete="current-password"
               autofocus>
        <button type="button" id="togglePin" aria-label="Mostrar clave">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div id="pinError"></div>

      <button type="submit" class="btn-login" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i>
        Ingresar
      </button>
    </form>

    <button id="themeToggle2" class="icon-btn-floating right" aria-label="Cambiar tema">
      <i class="fas fa-sun"></i>
    </button>
  </div>

  <!-- ============================================================ -->
  <!-- SCRIPTS                                                      -->
  <!-- ============================================================ -->
  <script type="module">
    import { getPerfiles, login, getSesion, redirigirSegunRol } from '/js/app-auth.js';
    import { toast, haptic, initTheme, toggleTheme } from '/js/app-ui.js';

    let perfilActual = null;

    const viewPerfiles    = document.getElementById('viewPerfiles');
    const viewPin         = document.getElementById('viewPin');
    const perfilesList    = document.getElementById('perfilesList');
    const profileIconView = document.getElementById('profileIconView');
    const profileNameView = document.getElementById('profileNameView');
    const profileRoleView = document.getElementById('profileRoleView');
    const pinForm         = document.getElementById('pinForm');
    const pinInput        = document.getElementById('pinInput');
    const pinError        = document.getElementById('pinError');
    const submitBtn       = document.getElementById('submitBtn');
    const togglePin       = document.getElementById('togglePin');
    const backBtn         = document.getElementById('backBtn');
    const themeToggle     = document.getElementById('themeToggle');
    const themeToggle2    = document.getElementById('themeToggle2');

    initTheme();

    const sesionExistente = getSesion();
    if (sesionExistente) {
      console.log('✅ Ya hay sesión activa, redirigiendo...');
      redirigirSegunRol();
    }

    themeToggle.addEventListener('click', () => { haptic(10); toggleTheme(); });
    themeToggle2.addEventListener('click', () => { haptic(10); toggleTheme(); });

    function cargarPerfiles() {
      const perfiles = getPerfiles();

      perfilesList.innerHTML = perfiles.map(p => `
        <button class="profile-card" data-perfil-id="${p.id}" type="button">
          <div class="profile-icon">${p.icono}</div>
          <div class="profile-info">
            <div class="profile-name">${p.nombre}</div>
            <div class="profile-role">${p.subtitulo}</div>
          </div>
          <i class="fas fa-chevron-right profile-arrow"></i>
        </button>
      `).join('');

      perfilesList.querySelectorAll('.profile-card').forEach(card => {
        card.addEventListener('click', () => {
          const perfilId = card.dataset.perfilId;
          const perfil = perfiles.find(p => p.id === perfilId);
          if (perfil) seleccionarPerfil(perfil);
        });
      });
    }

    function seleccionarPerfil(perfil) {
      perfilActual = perfil;
      haptic(15);

      profileIconView.innerHTML = `<span style="font-size: 36px;">${perfil.icono}</span>`;
      profileNameView.textContent = perfil.nombre;
      profileRoleView.textContent = perfil.subtitulo;

      pinForm.reset();
      pinError.textContent = '';
      pinInput.type = 'password';
      togglePin.innerHTML = '<i class="fas fa-eye"></i>';

      viewPerfiles.classList.add('hidden');
      viewPin.classList.remove('hidden');

      setTimeout(() => pinInput.focus(), 100);
    }

    backBtn.addEventListener('click', () => {
      haptic(10);
      perfilActual = null;
      pinInput.value = '';
      pinError.textContent = '';
      viewPin.classList.add('hidden');
      viewPerfiles.classList.remove('hidden');
    });

    togglePin.addEventListener('click', () => {
      haptic(8);
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        togglePin.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        pinInput.type = 'password';
        togglePin.innerHTML = '<i class="fas fa-eye"></i>';
      }
      pinInput.focus();
    });

    pinForm.addEventListener('submit', (e) => {
      e.preventDefault();
      verificarPin();
    });

    function verificarPin() {
      if (!perfilActual) return;

      const pin = pinInput.value;
      if (!pin) {
        pinError.textContent = 'Ingresa tu clave';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner" style="width: 18px; height: 18px; border-width: 2px;"></div> Verificando...';
      pinError.textContent = '';

      const resultado = login(perfilActual.id, pin);

      if (resultado.success) {
        haptic([15, 50, 15]);
        toast(`¡Bienvenido, ${perfilActual.nombre}!`, 'success', 1200);

        setTimeout(() => {
          redirigirSegunRol();
        }, 800);
      } else {
        haptic([50, 30, 50]);
        pinError.textContent = resultado.error || 'Clave incorrecta';

        pinForm.style.animation = 'shake 0.4s';
        setTimeout(() => pinForm.style.animation = '', 400);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';

        pinInput.select();
      }
    }

    cargarPerfiles();
  </script>

</body>
</html>
