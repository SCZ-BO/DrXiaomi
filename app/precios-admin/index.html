<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. XIAOMI | Admin Precios</title>

  <script>
    (function() {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (!sesion || sesion.rol !== 'admin') window.location.replace('/app/');
      } catch (e) { window.location.replace('/app/'); }
    })();
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --brand: #FF6900; --brand-hover: #E55A00; --brand-light: rgba(255, 105, 0, 0.15);
      --bg-main: #0A0A0A; --bg-card: #161616; --bg-elev: #242424;
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2C2C2C;
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 999px;
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100dvh; -webkit-font-smoothing: antialiased; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 100%; }

    /* HEADER */
    .header { padding: calc(12px + var(--safe-top)) 16px 10px; background: var(--bg-main); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.9); }
    .header h1 { font-size: 16px; font-weight: 800; }
    
    /* CONTROLS */
    .controls { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
    .search-container { position: relative; }
    .search-input { width: 100%; padding: 12px 38px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-main); font-size: 14px; font-family: inherit; }
    .search-input:focus { outline: none; border-color: var(--brand); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-mute); }
    
    .filter-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 12px; border-radius: var(--radius-pill); background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-mute); font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip.active { background: var(--brand); color: white; border-color: var(--brand); }

    /* LISTA */
    .main-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
    .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
    .item-card::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; background: var(--brand); border-radius: 0 3px 3px 0; }
    
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; padding-left: 6px; }
    .item-brand { font-size: 10px; font-weight: 800; color: var(--brand); text-transform: uppercase; }
    .item-model { font-size: 15px; font-weight: 700; margin-top: 2px; }
    
    .item-badges { display: flex; gap: 6px; flex-wrap: wrap; padding-left: 6px; }
    .badge { padding: 3px 8px; border-radius: 4px; background: var(--bg-elev); font-size: 10px; font-weight: 600; color: var(--text-mute); }
    
    .item-prices { display: flex; gap: 16px; padding-left: 6px; margin-top: 4px; }
    .price-box { display: flex; flex-direction: column; }
    .price-label { font-size: 9px; color: var(--text-mute); text-transform: uppercase; font-weight: 700; }
    .price-val { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .price-val.sale { color: var(--brand); }

    .item-actions { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }
    .action-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .action-btn:active { transform: scale(0.9); }
    .action-btn.edit { background: rgba(59, 130, 246, 0.15); color: #3B82F6; border: 1px solid rgba(59, 130, 246, 0.3); }
    .action-btn.del { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* FAB */
    .fab { position: fixed; bottom: calc(24px + var(--safe-bottom)); right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--brand); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; border: none; box-shadow: 0 8px 24px rgba(255, 105, 0, 0.4); cursor: pointer; z-index: 100; transition: 0.2s; }
    .fab:active { transform: scale(0.9); }

    /* MODAL */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; width: 100%; max-width: 540px; border: 1px solid var(--border); border-bottom: none; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-size: 15px; font-family: inherit; }
    .form-input:focus { outline: none; border-color: var(--brand); }
    
    .modal-buttons { display: flex; gap: 8px; margin-top: 20px; }
    .btn-modal { flex: 1; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .btn-modal:active { transform: scale(0.97); }
    .btn-cancel { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    .btn-save { background: var(--brand); color: white; }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" onclick="window.location.href='/app/'"><i class="fas fa-arrow-left"></i></button>
      <h1>Admin Precios</h1>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="btnExportar" title="Exportar CSV"><i class="fas fa-download"></i></button>
      <button class="icon-btn" id="btnImportar" title="Importar CSV"><i class="fas fa-upload"></i></button>
      <input type="file" id="fileInput" accept=".csv" style="display: none;">
    </div>
  </header>

  <div class="controls">
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar modelo o marca...">
    </div>
    <div class="filter-scroll" id="providerFilters">
      <div class="chip active" data-prov="all">Todos</div>
      <!-- Se llenan dinámicamente -->
    </div>
  </div>

  <div class="main-content" id="listaContainer">
    <div style="text-align:center; padding:40px; color:var(--text-mute);">
      <div class="search-loader" style="margin:0 auto 10px;"></div>
      <p id="countLoader">Cargando productos...</p>
    </div>
  </div>

  <button class="fab" id="btnNuevo"><i class="fas fa-plus"></i></button>
</div>

<script type="module">
  import { db } from '/js/firebase.js';
  import { collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc, serverTimestamp, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let allProducts = [];
  let filteredProducts = [];
  let currentProvider = 'all';
  let searchTerm = '';

  const $ = id => document.getElementById(id);

  // 1. Cargar datos de Firebase en tiempo real
  onSnapshot(collection(db, "precios"), (snapshot) => {
    allProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    $('countLoader').textContent = `${allProducts.length} productos cargados`;
    updateProviderFilters();
    applyFilters();
  });

  function updateProviderFilters() {
    const providers = [...new Set(allProducts.map(p => p.proveedor))].filter(Boolean).sort();
    const container = $('providerFilters');
    container.innerHTML = `<div class="chip ${currentProvider === 'all' ? 'active' : ''}" data-prov="all">Todos</div>` + 
      providers.map(p => `<div class="chip ${currentProvider === p ? 'active' : ''}" data-prov="${p}">${p}</div>`).join('');
    
    container.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        currentProvider = e.target.dataset.prov;
        updateProviderFilters();
        applyFilters();
      });
    });
  }

  function applyFilters() {
    filteredProducts = allProducts.filter(p => {
      const matchProv = currentProvider === 'all' || p.proveedor === currentProvider;
      const matchSearch = searchTerm === '' || 
        (p.modelo && p.modelo.toLowerCase().includes(searchTerm)) || 
        (p.marca && p.marca.toLowerCase().includes(searchTerm));
      return matchProv && matchSearch;
    });
    renderList();
  }

  $('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  function renderList() {
    const container = $('listaContainer');
    if (filteredProducts.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-mute);"><i class="fas fa-box-open" style="font-size:40px; opacity:0.3; margin-bottom:10px;"></i><p>No hay productos</p></div>`;
      return;
    }

    container.innerHTML = filteredProducts.map(p => `
      <div class="item-card">
        <div class="item-header">
          <div>
            <div class="item-brand">${p.marca}</div>
            <div class="item-model">${p.modelo}</div>
          </div>
        </div>
        <div class="item-badges">
          <span class="badge">${p.tipo || 'LCD'}</span>
          <span class="badge" style="background:rgba(255,105,0,0.1); color:var(--brand);">${p.proveedor}</span>
        </div>
        <div class="item-prices">
          <div class="price-box">
            <span class="price-label">Compra</span>
            <span class="price-val">${p.compra} Bs</span>
          </div>
          <div class="price-box">
            <span class="price-label">Venta</span>
            <span class="price-val sale">${p.venta} Bs</span>
          </div>
        </div>
        <div class="item-actions">
          <button class="action-btn edit" onclick="window.editProduct('${p.id}')"><i class="fas fa-pen"></i></button>
          <button class="action-btn del" onclick="window.deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    `).join('');
  }

  // --- LÓGICA DEL MODAL (CREAR / EDITAR) ---
  function openModal(product = null) {
    const isEdit = product !== null;
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalForm';
    
    const provs = [...new Set(allProducts.map(p => p.proveedor))].filter(Boolean).join(',');
    
    modal.innerHTML = `
      <div class="modal-content">
        <div class="sheet-handle"></div>
        <h3 style="margin-bottom:16px;">${isEdit ? 'Editar Producto' : 'Nuevo Producto'}</h3>
        
        <div class="form-group">
          <label>Marca</label>
          <input type="text" id="fMarca" class="form-input" value="${isEdit ? product.marca : ''}" placeholder="Ej: XIAOMI">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input type="text" id="fModelo" class="form-input" value="${isEdit ? product.modelo : ''}" placeholder="Ej: Redmi Note 12">
        </div>
        <div class="form-group">
          <label>Proveedor</label>
          <input type="text" id="fProveedor" class="form-input" value="${isEdit ? product.proveedor : ''}" list="provList" placeholder="Ej: J&A">
          <datalist id="provList">${provs.split(',').map(p => `<option value="${p}">`).join('')}</datalist>
        </div>
        <div class="form-group">
          <label>Tipo (LCD, OLED, ORIG, etc.)</label>
          <input type="text" id="fTipo" class="form-input" value="${isEdit ? product.tipo : ''}" placeholder="Ej: OLED">
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;">
            <label>Precio Compra</label>
            <input type="number" id="fCompra" class="form-input" value="${isEdit ? product.compra : ''}" placeholder="0">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Precio Venta</label>
            <input type="number" id="fVenta" class="form-input" value="${isEdit ? product.venta : ''}" placeholder="0">
          </div>
        </div>
        
        <div class="modal-buttons">
          <button class="btn-modal btn-cancel" onclick="document.getElementById('modalForm').remove()">Cancelar</button>
          <button class="btn-modal btn-save" id="btnSaveForm"><i class="fas fa-save"></i> Guardar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    $('btnSaveForm').addEventListener('click', async () => {
      const data = {
        marca: $('fMarca').value.toUpperCase().trim(),
        modelo: $('fModelo').value.trim(),
        proveedor: $('fProveedor').value.trim(),
        tipo: $('fTipo').value.toUpperCase().trim() || 'LCD',
        compra: parseFloat($('fCompra').value) || 0,
        venta: parseFloat($('fVenta').value) || 0,
        activo: true
      };

      if (!data.modelo || !data.marca) {
        alert("Marca y modelo son obligatorios");
        return;
      }

      $('btnSaveForm').textContent = "Guardando...";

      try {
        if (isEdit) {
          await updateDoc(doc(db, "precios", product.id), data);
        } else {
          data.creadoEn = serverTimestamp();
          data.actualizadoEn = serverTimestamp();
          await addDoc(collection(db, "precios"), data);
        }
        modal.remove();
      } catch (e) {
        console.error(e);
        alert("Error al guardar");
        $('btnSaveForm').innerHTML = '<i class="fas fa-save"></i> Guardar';
      }
    });
  }

  window.editProduct = (id) => {
    const p = allProducts.find(x => x.id === id);
    if (p) openModal(p);
  };

  window.deleteProduct = async (id) => {
    if (confirm("¿Seguro que quieres eliminar este producto?")) {
      try { await deleteDoc(doc(db, "precios", id)); } catch(e) { alert("Error al eliminar"); }
    }
  };

  $('btnNuevo').addEventListener('click', () => openModal(null));

  // --- IMPORTAR Y EXPORTAR CSV ---
  $('btnExportar').addEventListener('click', () => {
    if (allProducts.length === 0) return alert("No hay productos para exportar");
    
    // Cabecera exacta como tus listas
    let csvContent = "Marca,Modelo,Tipo,Proveedor,Precio Compra,Precio Venta\n";
    
    allProducts.forEach(p => {
      const marca = (p.marca || '').replace(/,/g, '');
      const modelo = (p.modelo || '').replace(/,/g, '');
      const tipo = (p.tipo || '').replace(/,/g, '');
      const prov = (p.proveedor || '').replace(/,/g, '');
      csvContent += `${marca},${modelo},${tipo},${prov},${p.compra || 0},${p.venta || 0}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", `Lista_Precios_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  $('btnImportar').addEventListener('click', () => $('fileInput').click());

  $('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!confirm("⚠️ ATENCIÓN: Al importar, se borrarán todos los precios actuales de la nube y se reemplazarán por los del archivo. ¿Deseas continuar?")) {
      e.target.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = async (event) => {
      const text = event.target.result;
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      
      if (lines.length < 2) return alert("El archivo está vacío o no tiene el formato correcto.");

      $('countLoader').textContent = "Limpiando base de datos...";
      
      // Borrar existentes
      const snapshot = await getDocs(collection(db, "precios"));
      for (const docSnap of snapshot.docs) {
        await deleteDoc(doc(db, "precios", docSnap.id));
      }

      $('countLoader').textContent = "Subiendo nuevos productos...";
      
      const CHUNK_SIZE = 500;
      let totalSubidos = 0;

      for (let i = 1; i < lines.length; i += CHUNK_SIZE) {
        const chunk = lines.slice(i, i + CHUNK_SIZE);
        const batch = writeBatch(db);

        chunk.forEach(line => {
          const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          if (cols.length >= 5) {
            const es6 = cols.length >= 6;
            const data = {
              marca: cols[0] || 'N/A',
              modelo: cols[1] || '',
              tipo: es6 ? (cols[2] || 'LCD') : (cols[2] || 'LCD'),
              proveedor: es6 ? (cols[3] || 'Generico') : (cols[3] || 'Generico'),
              compra: parseFloat(es6 ? cols[4] : cols[3]) || 0,
              venta: parseFloat(es6 ? cols[5] : cols[4]) || 0,
              activo: true,
              creadoEn: serverTimestamp()
            };
            
            if (data.modelo) {
              const newRef = doc(collection(db, "precios"));
              batch.set(newRef, data);
              totalSubidos++;
            }
          }
        });
        
        await batch.commit();
        $('countLoader').textContent = `Subidos ${totalSubidos}...`;
      }

      alert(`✅ Importación completada. Se subieron ${totalSubidos} productos.`);
      e.target.value = '';
    };
    reader.readAsText(file);
  });

</script>
</body>
</html>
