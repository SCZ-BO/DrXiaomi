<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Venta Directa</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root { 
      --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; 
      --brand: #E65100; --brand-hover: #BF360C; --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; --bg-card: #181818; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2A2A2A; 
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; --bg-card: #FFFFFF; --bg-elev: #F0F0F0; 
      --text-main: #111111; --text-mute: #666666; --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; }
    .field { position: relative; margin-bottom: 10px; }
    .field input, .field textarea { width: 100%; padding: 12px; background: var(--bg-elev); border: 1px solid transparent; border-radius: var(--radius-sm); color: var(--text-main); font-size: 14px; font-family: inherit; transition: 0.2s; outline: none; }
    .field input:focus { border-color: var(--brand); background: var(--bg-card); }
    .field label { position: absolute; left: 12px; top: 12px; font-size: 13px; color: var(--text-mute); transition: 0.2s; pointer-events: none; }
    .field input:focus ~ label, .field input:not(:placeholder-shown) ~ label { top: 4px; font-size: 9px; font-weight: 700; color: var(--brand); }
    
    .field-title { font-size: 11px; font-weight: 700; margin-bottom: 8px; display: block; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }

    .servicio-item { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); }
    .servicio-item input.servicio-costo { width: 80px; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--brand); font-weight: 700; text-align: right; }
    .removeServicio { width: 38px; height: 38px; border-radius: var(--radius-sm); background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); cursor: pointer; }

    .metodos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .metodo-btn { padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); font-weight: 600; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
    .metodo-btn.activo { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }

    .btn { padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:active { background: var(--brand-hover); transform: scale(0.98); }
    .btn-secondary { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25D366; color: white; }

    .total-display { text-align: right; font-size: 24px; font-weight: 800; color: var(--brand); margin-top: 10px; }

    .sheet-backdrop, .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; }
    .sheet-backdrop { align-items: flex-end; }
    .sheet-backdrop.show, .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    
    .sheet { background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 20px; width: 100%; max-width: 550px; border-top: 1px solid var(--border); transform: translateY(100%); transition: 0.3s; max-height: 90vh; display: flex; flex-direction: column; }
    .sheet-backdrop.show .sheet { transform: translateY(0); }
    
    .modal { background: var(--bg-card); padding: 20px; border-radius: var(--radius-md); width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
    .hidden { display: none !important; }
    
    .inv-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; gap: 10px; align-items: center; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
    .inv-card:hover { background: var(--bg-elev); }
    .inv-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .inv-info { flex: 1; }
    .inv-nombre { font-weight: 700; font-size: 13px; }
    .inv-precio { font-size: 11px; color: var(--brand); font-weight: 700; }
    .inv-stock { font-size: 10px; color: var(--text-mute); }

    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-ring { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); margin-top: 20px; }
  </style>
</head>
<body>

  <div class="loader-overlay" id="appLoader">
    <div class="loader-ring"></div>
    <div class="loader-text">Cargando venta...</div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-text">
          <h1>VENTA DIRECTA</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
    </header>

    <main class="app-content">
      <div class="card">
        <label class="field-title">Datos del Cliente (Opcional)</label>
        <div class="field">
          <input type="text" id="clienteNombre" placeholder=" ">
          <label for="clienteNombre">Nombre del cliente</label>
        </div>
        <div class="field">
          <input type="tel" id="clienteTelefono" placeholder=" ">
          <label for="clienteTelefono">Teléfono</label>
        </div>
        <div class="field" style="margin-bottom: 0;">
          <input type="date" id="fechaVenta" required>
          <label for="fechaVenta" style="top: -8px; font-size: 10px; font-weight: 700; color: var(--brand);">Fecha de Venta</label>
        </div>
      </div>

      <div class="card">
        <label class="field-title">Productos o Servicios</label>
        <button type="button" id="btnAbrirInventario" class="btn btn-primary" style="width: 100%; margin-bottom: 12px; background: #0284C7; color: white;">
          <i class="fas fa-box-open"></i> Buscar repuesto con foto
        </button>
        <div id="serviciosList"></div>
        <button type="button" id="addServicio" class="btn btn-secondary" style="width: 100%; margin-top: 6px; font-size: 12px; padding: 10px;">
          <i class="fas fa-plus"></i> Añadir otro manual
        </button>
      </div>

      <div class="card">
        <label class="field-title">Método de Pago</label>
        <div class="metodos-grid" id="metodosGroup">
          <button type="button" class="metodo-btn activo" data-metodo="Efectivo">
            <i class="fas fa-money-bill-wave"></i> Efectivo
          </button>
          <button type="button" class="metodo-btn" data-metodo="QR">
            <i class="fas fa-qrcode"></i> QR
          </button>
          <button type="button" class="metodo-btn" data-metodo="Transferencia" id="btnMetodoTransf">
            <i class="fas fa-university"></i> Transf.
          </button>
          <button type="button" class="metodo-btn" data-metodo="Mixto" id="btnMetodoMixto">
            <i class="fas fa-random"></i> Mixto
          </button>
        </div>
        <input type="hidden" id="metodoPago" value="Efectivo">
      </div>

      <div class="card">
        <div class="field-title" style="margin-bottom: 0;">Total a cobrar</div>
        <div class="total-display" id="totalDisplay">Bs. 0.00</div>
      </div>

      <button type="button" class="btn btn-primary" id="btnGenerarVenta" style="width: 100%; padding: 16px; font-size: 16px;">
        <i class="fas fa-check"></i> Registrar Venta
      </button>
    </main>
  </div>

  <div class="sheet-backdrop" id="modalInventario">
    <div class="sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 800;">Seleccionar Repuesto</h3>
        <button type="button" class="icon-btn" onclick="document.getElementById('modalInventario').classList.remove('show')"><i class="fas fa-times"></i></button>
      </div>
      <div id="modalInvGrid" style="overflow-y: auto; flex: 1; padding-bottom: 20px;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="successModal">
    <div class="modal">
      <div style="font-size: 48px; color: #22C55E; margin-bottom: 16px;"><i class="fas fa-check-circle"></i></div>
      <h3 style="font-size: 20px; margin-bottom: 8px;">¡Venta registrada!</h3>
      <p style="font-size: 16px; color: var(--brand); font-weight: 800; margin-bottom: 24px;" id="successTotal">Total</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-whatsapp" id="btnGenerarPDF"><i class="fas fa-file-pdf"></i> Generar PDF</button>
        <button class="btn btn-secondary" id="btnCerrarModal"><i class="fas fa-home"></i> Volver al panel</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (sesion && sesion.rol !== 'admin') {
          document.getElementById('btnMetodoTransf').style.display = 'none';
          document.getElementById('btnMetodoMixto').style.display = 'none';
        }
      } catch (e) {}
    });
  </script>

  <script type="module" src="/app/venta/venta.js"></script>
  
  <script>
    setTimeout(() => {
      const loader = document.getElementById('appLoader');
      if (loader) loader.classList.add('hidden');
    }, 2000);
  </script>
</body>
</html>
