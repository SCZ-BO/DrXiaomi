<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>DR. Xiaomi · Venta Directa</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="/manifest.json">

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root { 
      --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; 
      --brand: #E65100; --brand-hover: #BF360C; --brand-light: rgba(230, 81, 0, 0.1); 
      --bg-main: #0E0E0E; --bg-card: #181818; --bg-elev: #242424; 
      --text-main: #F5F5F5; --text-mute: #888888; --border: #2A2A2A; 
    }
    [data-theme="light"] {
      --bg-main: #F9F9F9; --bg-card: #FFFFFF; --bg-elev: #F0F0F0; 
      --text-main: #111111; --text-mute: #666666; --border: #E0E0E0; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    
    .app-container { display: flex; flex-direction: column; height: 100%; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-main); border-bottom: 1px solid var(--border); z-index: 100; }
    .app-content { flex: 1; overflow-y: auto; padding: 12px 12px 100px 12px; -webkit-overflow-scrolling: touch; }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .brand-text h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    .brand-text p { font-size: 11px; color: var(--text-mute); margin: 0; }
    
    .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.95); }

    .section-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 12px; }
    .section-block h3 { font-size: 11px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    .form-field { margin-bottom: 12px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .form-input { width: 100%; padding: 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-family: inherit; font-size: 14px; outline: none; }
    
    .servicio-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .servicio-item input.servicio-desc { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-main); }
    .servicio-item input.servicio-costo { width: 80px; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); color: var(--brand); font-weight: 700; text-align: right; }
    .removeServicio { width: 38px; height: 38px; border-radius: var(--radius-sm); background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); cursor: pointer; }

    .metodos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metodo-btn { padding: 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; }
    .metodo-btn.activo { background: var(--brand-light); border-color: var(--brand); color: var(--brand); font-weight: 700; }

    .total-destacado { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; text-align: center; margin-top: 12px; }
    .total-destacado .valor { font-size: 32px; font-weight: 800; color: var(--brand); line-height: 1; }
    .total-destacado .label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px; }

    .btn-action { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; border: none; margin-top: 10px; transition: 0.2s; font-family: inherit; }
    .btn-action:active { transform: scale(0.98); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-secondary { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }

    /* MODAL */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--bg-card); padding: 24px; border-radius: var(--radius-md); width: 90%; max-width: 400px; border: 1px solid var(--border); text-align: center; }

    /* LOADER PRO */
    .loader-overlay { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .loader-overlay.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <button class="icon-btn" id="backBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="brand-logo">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi" onerror="this.style.display='none';">
        </div>
        <div class="brand-text">
          <h1>VENTA DIRECTA</h1>
          <p id="userInfo">Cargando...</p>
        </div>
      </div>
    </header>

    <main class="app-content">
      <!-- Datos del Cliente -->
      <div class="section-block">
        <h3><i class="fas fa-user"></i> Cliente (Opcional)</h3>
        <div class="form-field">
          <input type="text" id="clienteNombre" class="form-input" placeholder="Nombre del cliente">
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <input type="tel" id="clienteTelefono" class="form-input" placeholder="Teléfono (para WhatsApp)">
        </div>
      </div>

      <!-- Productos / Servicios -->
      <div class="section-block">
        <h3><i class="fas fa-shopping-bag"></i> Productos o Servicios</h3>
        <div id="serviciosList"></div>
        <button class="btn-action btn-secondary" id="addServicio" style="padding: 10px; font-size: 12px;">
          <i class="fas fa-plus"></i> Añadir otro producto
        </button>
      </div>

      <!-- Método de Pago -->
      <div class="section-block">
        <h3><i class="fas fa-credit-card"></i> Método de Pago</h3>
        <div class="metodos-grid" id="metodosGroup">
          <button type="button" class="metodo-btn" data-metodo="Efectivo"><i class="fas fa-money-bill-wave"></i><span>Efectivo</span></button>
          <button type="button" class="metodo-btn" data-metodo="QR"><i class="fas fa-qrcode"></i><span>QR</span></button>
          <button type="button" class="metodo-btn" data-metodo="Transferencia"><i class="fas fa-building-columns"></i><span>Transf.</span></button>
          <button type="button" class="metodo-btn" data-metodo="Mixto"><i class="fas fa-shuffle"></i><span>Mixto</span></button>
        </div>
        <input type="hidden" id="metodoPago" value="Efectivo">
      </div>

      <!-- Total -->
      <div class="total-destacado">
        <div class="valor" id="totalDisplay">Bs. 0.00</div>
        <div class="label">Total a Cobrar</div>
      </div>

      <!-- Botón de Acción -->
      <button class="btn-action btn-primary" id="btnGenerarVenta">
        <i class="fas fa-check"></i> Registrar Venta
      </button>
    </main>
  </div>

  <!-- MODAL DE ÉXITO -->
  <div class="modal-backdrop" id="successModal">
    <div class="modal">
      <div style="font-size: 48px; color: #22C55E; margin-bottom: 16px;"><i class="fas fa-check-circle"></i></div>
      <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">¡Venta Registrada!</h3>
      <p style="font-size: 13px; color: var(--text-mute); margin-bottom: 24px;" id="successTotal">Total: Bs. 0.00</p>
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-action" id="btnGenerarPDF" style="background:#3B82F6; color:white; margin:0;">
          <i class="fas fa-file-pdf"></i> Generar Recibo PDF
        </button>
        <button class="btn-action btn-primary" id="btnCerrarModal" style="margin:0;">
          <i class="fas fa-check"></i> Cerrar (Venta Rápida)
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="venta.js"></script>
</body>
</html>
