<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF6900">
  <title>Tu Recibo - DR. XIAOMI</title>

  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/imagenes/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <meta property="og:title" content="Recibo de Reparación - DR. XIAOMI SCZ">
  <meta property="og:description" content="Haz clic aquí para ver el estado de tu equipo y descargar tu comprobante en PDF.">
  <meta property="og:image" content="https://xiaomi.scz.red/imagenes/web-app-manifest-192x192.png">
  <meta property="og:url" content="https://xiaomi.scz.red/recibo/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DR. XIAOMI SCZ">
  <meta name="twitter:card" content="summary_large_image">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-main: #09090B; --bg-card: rgba(24, 24, 27, 0.7); --bg-elev: #27272A;
      --text-main: #FAFAFA; --text-mute: #A1A1AA; --border: rgba(255,255,255,0.08);
      --brand: #FF6900; --brand-glow: rgba(255, 105, 0, 0.3); --success: #10B981; --danger: #EF4444; --warning: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(255, 105, 0, 0.15), transparent 60%), radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.1), transparent 60%); background-attachment: fixed; }
    .card { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .header { background: linear-gradient(135deg, #FF6900, #E55A00); color: white; padding: 20px; position: relative; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px var(--brand-glow); z-index: 2; display: flex; align-items: center; gap: 15px; }
    .header::after { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23p)"/></svg>'); border-radius: 0 0 30px 30px; pointer-events: none; }
    .header-logo-container { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; position: relative; z-index: 3; animation: breathe 3s ease-in-out infinite; flex-shrink: 0; }
    .header-logo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    @keyframes breathe { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } 50% { box-shadow: 0 0 15px 5px rgba(255,255,255,0.1); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); } }
    .header-text { position: relative; z-index: 3; }
    .header h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 2px; line-height: 1; }
    .header p { font-size: 12px; opacity: 0.9; font-weight: 600; background: rgba(0,0,0,0.2); display: inline-block; padding: 4px 10px; border-radius: 20px;}
    .body { padding: 20px; flex: 1; z-index: 2; }
    .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    .glass-card:nth-child(1) { animation-delay: 0.1s; }
    .glass-card:nth-child(2) { animation-delay: 0.2s; }
    .glass-card:nth-child(3) { animation-delay: 0.3s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .aviso { padding: 14px; border-radius: 12px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600; line-height: 1.4; backdrop-filter: blur(10px); }
    .aviso-warning { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: var(--warning); }
    .aviso-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: var(--danger); }
    .estado-container { text-align: center; margin-bottom: 24px; }
    .estado { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 30px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; }
    .row span:first-child { color: var(--text-mute); font-weight: 500; }
    .row span:last-child { font-weight: 700; text-align: right; max-width: 60%; color: var(--text-main); }
    .servicios-title { font-size: 11px; text-transform: uppercase; font-weight: 800; color: var(--text-mute); margin-bottom: 12px; letter-spacing: 1px; }
    .total-box { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 16px; margin-top: 20px; border: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--text-mute); font-weight: 500;}
    .total-row:last-child { margin-bottom: 0; font-size: 22px; font-weight: 900; color: var(--text-main); margin-top: 12px; padding-top: 16px; border-top: 1px dashed var(--border); letter-spacing: -0.5px;}
    .text-success { color: var(--success) !important; }
    .text-danger { color: var(--danger) !important; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; background: var(--brand); color: white; text-align: center; text-decoration: none; border-radius: 16px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; margin-bottom: 12px; transition: 0.2s; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(255, 105, 0, 0.3); }
    .btn:active { transform: scale(0.96); }
    .btn-wsp { background: #25D366; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3); }
    .btn-disabled { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-mute); cursor: not-allowed; box-shadow: none; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: var(--text-mute); font-size: 14px; font-weight: 500; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 80px; font-weight: 900; color: rgba(255,255,255,0.03); pointer-events: none; white-space: nowrap; z-index: 1; text-transform: uppercase; }
    .install-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 9999; opacity: 0; pointer-events: none; transition: 0.3s; }
    .install-sheet-overlay.show { opacity: 1; pointer-events: auto; }
    .install-sheet { position: fixed; bottom: -100%; left: 0; right: 0; margin: 0 auto; max-width: 440px; background: #18181B; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); z-index: 10000; transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-top: 1px solid rgba(255,255,255,0.1); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; text-align: center; }
    .install-sheet.show { bottom: 0; }
    .install-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #FF6900, #E55A00); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(255,105,0,0.4); }
    .install-sheet h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: white; }
    .install-sheet p { font-size: 14px; color: #A1A1AA; margin-bottom: 24px; line-height: 1.4; }
    .btn-install-main { background: linear-gradient(135deg, #FF6900, #E55A00); color: white; width: 100%; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(255,105,0,0.3); margin-bottom: 12px; }
    .btn-install-cancel { background: transparent; color: #A1A1AA; width: 100%; padding: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card" id="appCard">
    <div class="loading">
      <div class="spinner"></div>
      Cargando tu recibo...
    </div>
  </div>

  <div class="install-sheet-overlay" id="installOverlay"></div>
  <div class="install-sheet" id="installSheet">
    <div class="install-icon"><i class="fas fa-mobile-screen-button"></i></div>
    <h3>Instala nuestra App</h3>
    <p>Recibe notificaciones en tiempo real y revisa el estado de tu reparación sin abrir el navegador.</p>
    <button class="btn-install-main" id="btnConfirmInstall"><i class="fas fa-download"></i> Instalar Ahora</button>
    <button class="btn-install-cancel" id="btnCancelInstall">Quizás más tarde</button>
  </div>

  <script type="module">
    import { db } from '/js/firebase.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const reciboId = params.get('id');
    const appCard = document.getElementById('appCard');

    let deferredPrompt;
    const installOverlay = document.getElementById('installOverlay');
    const installSheet = document.getElementById('installSheet');
    const btnConfirmInstall = document.getElementById('btnConfirmInstall');
    const btnCancelInstall = document.getElementById('btnCancelInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        if (!localStorage.getItem('ocultar_install_banner')) {
          installOverlay.classList.add('show');
          installSheet.classList.add('show');
        }
      }, 2000);
    });

    function cerrarSheetInstall() {
      installOverlay.classList.remove('show');
      installSheet.classList.remove('show');
    }

    btnCancelInstall?.addEventListener('click', () => {
      cerrarSheetInstall();
      localStorage.setItem('ocultar_install_banner', 'true');
    });

    btnConfirmInstall?.addEventListener('click', async () => {
      if (!deferredPrompt) {
        alert('Para instalar la app, abre el menú de tu navegador y selecciona "Añadir a pantalla de inicio".');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') cerrarSheetInstall();
      deferredPrompt = null;
    });

    if (!reciboId) {
      appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-times-circle" style="font-size:40px; margin-bottom:15px;"></i>No se especificó un recibo.</div>';
    } else {
      buscarRecibo(reciboId);
    }

    async function buscarRecibo(id) {
      try {
        const q = query(collection(db, 'recibos'), where('numeroRecibo', '==', id));
        const snap = await getDocs(q);

        if (snap.empty) {
          appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-search-minus" style="font-size:40px; margin-bottom:15px;"></i>Recibo no encontrado o eliminado.</div>';
          return;
        }

        const recibo = snap.docs[0].data();
        renderizarRecibo(recibo, id);
      } catch (error) {
        console.error(error);
        appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-wifi" style="font-size:40px; margin-bottom:15px;"></i>Error de conexión.</div>';
      }
    }

    function renderizarRecibo(r, id) {
      let estadoTexto = 'Recibido'; let estadoColor = '#9CA3AF'; let estadoIcono = 'fa-box';
      if (r.estadoOrden === 'reparacion') { estadoTexto = 'En Reparación'; estadoColor = 'var(--brand)'; estadoIcono = 'fa-screwdriver-wrench'; }
      else if (r.estadoOrden === 'espera-repuesto') { estadoTexto = 'Esperando Repuesto'; estadoColor = '#8B5CF6'; estadoIcono = 'fa-clock'; }
      else if (r.estadoOrden === 'listo') { estadoTexto = 'Listo para Entregar'; estadoColor = 'var(--warning)'; estadoIcono = 'fa-check-circle'; }
      else if (r.estadoOrden === 'entregado') { estadoTexto = 'Entregado'; estadoColor = 'var(--success)'; estadoIcono = 'fa-handshake'; }
      else if (r.estadoOrden === 'devuelto') { estadoTexto = 'Devuelto'; estadoColor = '#3B82F6'; estadoIcono = 'fa-rotate-left'; }

      let avisoHtml = ''; let botonDescargaHtml = `<button class="btn" id="btnDescargar"><i class="fas fa-file-pdf"></i> Descargar Recibo PDF</button>`; let diasRestantes = 30;
      if (r.estadoOrden === 'entregado' && r.fechaEntrega) {
        let fecha = r.fechaEntrega.toDate ? r.fechaEntrega.toDate() : new Date(r.fechaEntrega);
        diasRestantes = 30 - Math.floor((new Date() - fecha) / (1000 * 60 * 60 * 24));
        if (diasRestantes <= 0) { avisoHtml = `<div class="aviso aviso-danger">⚠️ Este enlace de descarga ha expirado.</div>`; botonDescargaHtml = `<button class="btn btn-disabled" disabled><i class="fas fa-lock"></i> PDF Expirado</button>`; }
        else if (diasRestantes <= 15) { avisoHtml = `<div class="aviso aviso-warning">⏳ Te quedan <b>${diasRestantes} días</b> para descargar este PDF. ¡Guárdalo!</div>`; }
      }

      let fechaIngreso = '-';
      if (r.fechaEditada || r.fecha) {
        let d = (r.fechaEditada || r.fecha).toDate ? (r.fechaEditada || r.fecha).toDate() : new Date(r.fechaEditada || r.fecha);
        fechaIngreso = d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      const serviciosHtml = (r.servicios || []).map(s => `<div class="row"><span>${s.desc}</span><span>Bs. ${Number(s.costo).toFixed(2)}</span></div>`).join('');

      appCard.innerHTML = `
        <div class="watermark">DR. XIAOMI</div>
        <div class="header">
          <div class="header-logo-container"><img src="/imagenes/web-app-manifest-192x192.png" alt="Logo" class="header-logo" onerror="this.style.display='none'"></div>
          <div class="header-text"><h1>DR. XIAOMI</h1><p>Recibo N°: ${r.numeroRecibo}</p></div>
        </div>
        <div class="body">
          ${avisoHtml}
          <div class="estado-container"><span class="estado" style="background: ${estadoColor}20; color: ${estadoColor}; border: 1px solid ${estadoColor}40;"><i class="fas ${estadoIcono}"></i> ${estadoTexto}</span></div>
          <div class="glass-card">
            <div class="row"><span>Cliente</span> <span>${r.cliente}</span></div>
            <div class="row"><span>Equipo</span> <span>${r.marca} ${r.modelo}</span></div>
            <div class="row"><span>Falla reportada</span> <span>${r.falla || 'No especificada'}</span></div>
            <div class="row"><span>Fecha de Ingreso</span> <span>${fechaIngreso}</span></div>
          </div>
          <div class="glass-card">
            <div class="servicios-title">Servicios Realizados</div>
            ${serviciosHtml || '<div class="row"><span>Sin servicios</span><span>-</span></div>'}
            <div class="total-box">
              <div class="total-row"><span>Total</span> <span>Bs. ${Number(r.total || 0).toFixed(2)}</span></div>
              ${r.adelanto > 0 ? `<div class="total-row"><span>Adelanto</span> <span>Bs. ${Number(r.adelanto).toFixed(2)}</span></div>` : ''}
              <div class="total-row"><span>${r.saldo > 0 ? 'Saldo Pendiente' : 'Estado'}</span> <span class="${r.saldo > 0 ? 'text-danger' : 'text-success'}">${r.saldo > 0 ? `Bs. ${Number(r.saldo).toFixed(2)}` : '✅ Pagado'}</span></div>
            </div>
          </div>
          <div style="margin-top: 10px;">
            ${botonDescargaHtml}
            <a class="btn btn-wsp" href="https://wa.me/59175959450?text=Hola,%20consulto%20por%20mi%20recibo%20${r.numeroRecibo}"><i class="fab fa-whatsapp"></i> Contactar al Taller</a>
          </div>
        </div>
      `;

      if (diasRestantes > 0 || r.estadoOrden !== 'entregado') {
        document.getElementById('btnDescargar')?.addEventListener('click', () => generarPDFPremium(r));
      }
    }

    // =====================================================================
    // 🔥 MOTOR DE PDF FORMATO TICKET (TODO EN UNA SOLA TIRA LARGA)
    // =====================================================================
    async function generarPDFPremium(r) {
      const btn = document.getElementById('btnDescargar');
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generando PDF...';
      btn.style.opacity = '0.7';
      btn.disabled = true;

      try {
        const { jsPDF } = window.jspdf;
        
        // 🔥 FORMATO TICKET (Ancho 80mm, Alto dinámico)
        const pdf = new jsPDF({ unit: 'mm', format: [80, 250] });
        const W = 80, M = 5, CW = W - M * 2;
        let y = 0;

        const logoDataUrl = await getLogoDataUrl();
        const qrDataUrl = await getQRDataUrl(`https://xiaomi.scz.red/recibo/?id=${r.numeroRecibo}`);

        // 1. ENCABEZADO NARANJA
        pdf.setFillColor(255, 105, 0); pdf.rect(0, 0, W, 25, 'F');
        
        if (logoDataUrl) {
          try {
            pdf.setFillColor(255, 255, 255);
            pdf.circle(W / 2, 8, 5, 'F'); // Logo al centro
            pdf.addImage(logoDataUrl, 'PNG', W / 2 - 4, 4, 8, 8); 
          } catch (e) {}
        }

        pdf.setTextColor(255, 255, 255); 
        pdf.setFont('helvetica', 'bold'); 
        pdf.setFontSize(14);
        pdf.text('DR. XIAOMI SCZ', W / 2, 19, { align: 'center' });
        
        pdf.setFontSize(7); 
        pdf.setFont('helvetica', 'normal');
        pdf.text('Servicio Técnico Especializado', W / 2, 23, { align: 'center' });

        y = 30;

        // 2. DATOS DEL RECIBO (Texto simple)
        pdf.setTextColor(30, 30, 30); 
        pdf.setFont('helvetica', 'bold'); 
        pdf.setFontSize(10);
        pdf.text(`RECIBO: ${r.numeroRecibo}`, W / 2, y, { align: 'center' });
        y += 5;
        
        pdf.setFont('helvetica', 'normal'); 
        pdf.setFontSize(8);
        pdf.text(`Fecha: ${new Date().toLocaleDateString('es-BO')}`, W / 2, y, { align: 'center' });
        y += 6;

        // Línea divisoria
        pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.3);
        pdf.line(M, y, W - M, y);
        y += 5;

        // 3. DATOS CLIENTE
        pdf.setFontSize(8); pdf.setTextColor(100, 100, 100);
        pdf.text('CLIENTE:', M, y); y += 4;
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
        pdf.text((r.cliente || '').slice(0, 25), M, y); y += 4;
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(100, 100, 100);
        pdf.text(`Tel: ${r.telefono || ''}`, M, y); y += 6;

        // 4. DATOS EQUIPO
        pdf.setTextColor(100, 100, 100);
        pdf.text('EQUIPO:', M, y); y += 4;
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
        pdf.text(`${r.marca || ''} ${r.modelo || ''}`.slice(0, 25), M, y); y += 4;
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(100, 100, 100);
        pdf.text(`Enciende: ${r.enciende || 'Sí'}`, M, y); y += 6;

        // 5. FALLA
        pdf.setTextColor(100, 100, 100);
        pdf.text('FALLA:', M, y); y += 4;
        pdf.setTextColor(30, 30, 30);
        pdf.text(pdf.splitTextToSize(r.falla || 'No especificada', CW), M, y); y += 6;

        // 6. CLAVE
        pdf.setTextColor(100, 100, 100);
        pdf.text('CLAVE:', M, y); y += 4;
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold');
        let segInfo = r.tipoSeguridad === 'pin' ? `PIN: ${r.pin}` : (r.patron ? `Patrón: ${r.patron.split(',').join('-')}` : 'Sin clave');
        pdf.text(segInfo, M, y); y += 6;

        // Línea divisoria
        pdf.setDrawColor(200, 200, 200); pdf.line(M, y, W - M, y); y += 5;

        // 7. TABLA DE SERVICIOS (Ticket)
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('SERVICIOS', M, y); 
        pdf.text('COSTO', W - M, y, { align: 'right' }); 
        y += 4;

        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'normal');
        (r.servicios || []).forEach(s => {
          pdf.text(s.desc.slice(0, 30), M, y);
          pdf.text(`Bs. ${Number(s.costo).toFixed(2)}`, W - M, y, { align: 'right' });
          y += 5;
        });

        y += 2;
        pdf.setDrawColor(200, 200, 200); pdf.line(M, y, W - M, y); y += 5;

        // 8. TOTALES
        pdf.setFontSize(9); pdf.setTextColor(100, 100, 100);
        pdf.text('Total:', M, y);
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold');
        pdf.text(`Bs. ${Number(r.total || 0).toFixed(2)}`, W - M, y, { align: 'right' });
        y += 5;

        if (r.adelanto > 0) {
          pdf.setFont('helvetica', 'normal'); pdf.setTextColor(100, 100, 100);
          pdf.text('Adelanto:', M, y);
          pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold');
          pdf.text(`- Bs. ${Number(r.adelanto).toFixed(2)}`, W - M, y, { align: 'right' });
          y += 5;
        }

        pdf.setFillColor(255, 245, 235);
        pdf.roundedRect(M, y - 2, CW, 10, 2, 2, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
        pdf.text('SALDO:', M + 2, y + 4);
        pdf.text(`Bs. ${Number(r.saldo || 0).toFixed(2)}`, W - M - 2, y + 4, { align: 'right' });
        y += 14;

        // 9. QR Y BANNER
        if (qrDataUrl) {
          try {
            pdf.addImage(qrDataUrl, 'PNG', W / 2 - 10, y, 20, 20);
            y += 22;
            pdf.setTextColor(100, 100, 100); pdf.setFontSize(7);
            pdf.text('Escanea para ver tu recibo', W / 2, y, { align: 'center' });
          } catch (e) {}
        }

        // 10. PIE DE PÁGINA
        pdf.setFillColor(255, 105, 0); pdf.rect(0, y + 5, W, 10, 'F');
        pdf.setTextColor(255, 255, 255); pdf.setFontSize(7); pdf.setFont('helvetica', 'bold');
        pdf.text('¡Gracias por confiar en DR. XIAOMI!', W / 2, y + 11, { align: 'center' });

        // 🔥 GUARDAR EL PDF (con alto dinámico para que no sobre espacio)
        const finalY = y + 15;
        pdf.save(`Recibo_${r.numeroRecibo}.pdf`);

      } catch (err) {
        console.error("Error generando PDF:", err);
        alert("Hubo un error al generar el PDF. Revisa tu conexión.");
      } finally {
        btn.innerHTML = textoOriginal;
        btn.style.opacity = '1';
        btn.disabled = false;
      }
    }

    async function getLogoDataUrl() {
      return new Promise((resolve) => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            resolve(c.toDataURL('image/png'));
          } catch (e) { resolve(''); }
        };
        img.onerror = () => resolve('');
        img.src = '/imagenes/web-app-manifest-192x192.png';
      });
    }

    async function getQRDataUrl(texto) {
      return new Promise((resolve) => {
        if (typeof QRCode === 'undefined') { resolve(''); return; }
        const div = document.createElement('div');
        div.style.cssText = 'position:absolute;left:-9999px;';
        document.body.appendChild(div);
        try {
          new QRCode(div, { text: texto, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
          setTimeout(() => {
            const canvas = div.querySelector('canvas'), img = div.querySelector('img');
            let dataUrl = canvas ? canvas.toDataURL('image/png') : (img && img.src ? img.src : '');
            div.remove(); resolve(dataUrl);
          }, 200);
        } catch (e) { div.remove(); resolve(''); }
      });
    }
  </script>
