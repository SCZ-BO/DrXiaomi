<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <title>Tu Recibo - DR. XIAOMI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    :root {
      --bg-main: #09090B;
      --bg-card: rgba(24, 24, 27, 0.7);
      --bg-elev: #27272A;
      --text-main: #FAFAFA;
      --text-mute: #A1A1AA;
      --border: rgba(255,255,255,0.08);
      --brand: #FF6900;
      --brand-glow: rgba(255, 105, 0, 0.3);
      --success: #10B981;
      --danger: #EF4444;
      --warning: #FBBF24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 105, 0, 0.15), transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.1), transparent 60%);
      background-attachment: fixed;
    }

    .card { 
      width: 100%; 
      max-width: 440px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 🔥 HEADER INMERSIVO */
    .header { 
      background: linear-gradient(135deg, #FF6900, #E55A00); 
      color: white; 
      padding: 40px 20px 30px; 
      text-align: center; 
      position: relative;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 30px var(--brand-glow);
      z-index: 2;
    }
    .header::after {
      content: ''; position: absolute; inset: 0;
      background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23p)"/></svg>');
      border-radius: 0 0 30px 30px; pointer-events: none;
    }
    .header h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 6px; position: relative; z-index: 3; }
    .header p { font-size: 15px; opacity: 0.9; font-weight: 600; position: relative; z-index: 3; background: rgba(0,0,0,0.2); display: inline-block; padding: 4px 12px; border-radius: 20px;}

    .body { padding: 20px; flex: 1; z-index: 2; }

    /* 🔥 TARJETAS GLASSMORPHISM */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .glass-card:nth-child(1) { animation-delay: 0.1s; }
    .glass-card:nth-child(2) { animation-delay: 0.2s; }
    .glass-card:nth-child(3) { animation-delay: 0.3s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .aviso { padding: 14px; border-radius: 12px; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 600; line-height: 1.4; backdrop-filter: blur(10px); }
    .aviso-warning { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: var(--warning); }
    .aviso-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: var(--danger); }

    .estado-container { text-align: center; margin-bottom: 24px; }
    .estado { 
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 30px; 
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; }
    .row span:first-child { color: var(--text-mute); font-weight: 500; }
    .row span:last-child { font-weight: 700; text-align: right; max-width: 60%; color: var(--text-main); }

    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 20px 0; }

    .servicios-title { font-size: 11px; text-transform: uppercase; font-weight: 800; color: var(--text-mute); margin-bottom: 12px; letter-spacing: 1px; }
    
    .total-box { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 16px; margin-top: 20px; border: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--text-mute); font-weight: 500;}
    .total-row:last-child { margin-bottom: 0; font-size: 22px; font-weight: 900; color: var(--text-main); margin-top: 12px; padding-top: 16px; border-top: 1px dashed var(--border); letter-spacing: -0.5px;}
    .text-success { color: var(--success) !important; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
    .text-danger { color: var(--danger) !important; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

    /* 🔥 BOTONES */
    .btn { 
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px; background: var(--brand); color: white; 
      text-align: center; text-decoration: none; border-radius: 16px; 
      font-weight: 700; font-size: 16px; border: none; cursor: pointer; 
      margin-bottom: 12px; transition: 0.2s; position: relative; overflow: hidden;
      box-shadow: 0 8px 20px rgba(255, 105, 0, 0.3);
    }
    .btn::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:active::after { left: 100%; }
    
    .btn-wsp { background: #25D366; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3); }
    .btn-install { background: #27272A; color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.3); border: 1px solid var(--border); }
    .btn-disabled { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-mute); cursor: not-allowed; box-shadow: none; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: var(--text-mute); font-size: 14px; font-weight: 500; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 🔥 MARCA DE AGUA */
    .watermark {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 80px; font-weight: 900; color: rgba(255,255,255,0.03); pointer-events: none;
      white-space: nowrap; z-index: 1; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card" id="appCard">
    <div class="loading">
      <div class="spinner"></div>
      Cargando tu recibo...
    </div>
  </div>

  <!-- Modal para instalar PWA -->
  <div id="installPrompt" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; background:#18181B; border:1px solid #FF6900; border-radius:16px; padding:16px; z-index:9999; box-shadow:0 10px 30px rgba(0,0,0,0.8); align-items:center; gap:12px;">
    <img src="/imagenes/web-app-manifest-192x192.png" style="width:40px; height:40px; border-radius:10px;">
    <div style="flex:1;">
      <h4 style="margin:0; font-size:14px; color:white;">Instalar App</h4>
      <p style="margin:0; font-size:11px; color:#A1A1AA;">Sigue el estado de tu equipo</p>
    </div>
    <button id="btnInstallPwa" style="background:#FF6900; color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; font-size:12px;">Instalar</button>
    <button id="btnCloseInstall" style="background:transparent; color:#A1A1AA; border:none; font-size:16px; padding:4px;"><i class="fas fa-times"></i></button>
  </div>

  <script type="module">
    import { db } from '/js/firebase.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const reciboId = params.get('id');
    const appCard = document.getElementById('appCard');

    if (!reciboId) {
      appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-times-circle" style="font-size:40px; margin-bottom:15px;"></i>No se especificó un recibo.</div>';
    } else {
      buscarRecibo(reciboId);
    }

    async function buscarRecibo(id) {
      try {
        const q = query(collection(db, 'recibos'), where('numeroRecibo', '==', id));
        const snap = await getDocs(q);

        if (snap.empty) {
          appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-search-minus" style="font-size:40px; margin-bottom:15px;"></i>Recibo no encontrado o eliminado.</div>';
          return;
        }

        const recibo = snap.docs[0].data();
        renderizarRecibo(recibo, id);
      } catch (error) {
        console.error(error);
        appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-wifi" style="font-size:40px; margin-bottom:15px;"></i>Error de conexión.</div>';
      }
    }

    function renderizarRecibo(r, id) {
      let estadoTexto = 'Recibido';
      let estadoColor = '#9CA3AF';
      let estadoIcono = 'fa-box';
      
      if (r.estadoOrden === 'reparacion') { estadoTexto = 'En Reparación'; estadoColor = 'var(--brand)'; estadoIcono = 'fa-screwdriver-wrench'; }
      else if (r.estadoOrden === 'espera-repuesto') { estadoTexto = 'Esperando Repuesto'; estadoColor = '#8B5CF6'; estadoIcono = 'fa-clock'; }
      else if (r.estadoOrden === 'listo') { estadoTexto = 'Listo para Entregar'; estadoColor = 'var(--warning)'; estadoIcono = 'fa-check-circle'; }
      else if (r.estadoOrden === 'entregado') { estadoTexto = 'Entregado'; estadoColor = 'var(--success)'; estadoIcono = 'fa-handshake'; }
      else if (r.estadoOrden === 'devuelto') { estadoTexto = 'Devuelto'; estadoColor = '#3B82F6'; estadoIcono = 'fa-rotate-left'; }

      // 🔥 LÓGICA DE VENCIMIENTO (30 DÍAS)
      let avisoHtml = '';
      let botonDescargaHtml = `<button class="btn" id="btnDescargar"><i class="fas fa-file-pdf"></i> Descargar Recibo PDF</button>`;
      let diasRestantes = 30;
      
      if (r.estadoOrden === 'entregado' && r.fechaEntrega) {
        let fecha = r.fechaEntrega.toDate ? r.fechaEntrega.toDate() : new Date(r.fechaEntrega);
        let diasTranscurridos = Math.floor((new Date() - fecha) / (1000 * 60 * 60 * 24));
        diasRestantes = 30 - diasTranscurridos;

        if (diasRestantes <= 0) {
          avisoHtml = `<div class="aviso aviso-danger">⚠️ Este enlace de descarga ha expirado (más de 30 días desde la entrega).</div>`;
          botonDescargaHtml = `<button class="btn btn-disabled" disabled><i class="fas fa-lock"></i> PDF Expirado</button>`;
        } else if (diasRestantes <= 15) {
          avisoHtml = `<div class="aviso aviso-warning">⏳ Te quedan <b>${diasRestantes} días</b> para descargar este PDF. ¡Guárdalo en tu celular!</div>`;
        }
      }

      // Formatear fecha de ingreso
      let fechaIngreso = '-';
      if (r.fechaEditada || r.fecha) {
        let f = (r.fechaEditada || r.fecha);
        let d = f.toDate ? f.toDate() : new Date(f);
        fechaIngreso = d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      const serviciosHtml = (r.servicios || []).map(s => `
        <div class="row">
          <span>${s.desc}</span> 
          <span>Bs. ${Number(s.costo).toFixed(2)}</span>
        </div>
      `).join('');

      appCard.innerHTML = `
        <div class="watermark">DR. XIAOMI</div>
        
        <div class="header">
          <h1>DR. XIAOMI</h1>
          <p>Recibo N°: ${r.numeroRecibo}</p>
        </div>
        
        <div class="body">
          ${avisoHtml}

          <div class="estado-container">
            <span class="estado" style="background: ${estadoColor}20; color: ${estadoColor}; border: 1px solid ${estadoColor}40;">
              <i class="fas ${estadoIcono}"></i> ${estadoTexto}
            </span>
          </div>
          
          <div class="glass-card">
            <div class="row"><span>Cliente</span> <span>${r.cliente}</span></div>
            <div class="row"><span>Equipo</span> <span>${r.marca} ${r.modelo}</span></div>
            <div class="row"><span>Falla reportada</span> <span>${r.falla || 'No especificada'}</span></div>
            <div class="row"><span>Fecha de Ingreso</span> <span>${fechaIngreso}</span></div>
          </div>
          
          <div class="glass-card">
            <div class="servicios-title">Servicios Realizados</div>
            ${serviciosHtml || '<div class="row"><span>Sin servicios</span><span>-</span></div>'}

            <div class="total-box">
              <div class="total-row"><span>Total</span> <span>Bs. ${Number(r.total || 0).toFixed(2)}</span></div>
              ${r.adelanto > 0 ? `<div class="total-row"><span>Adelanto</span> <span>Bs. ${Number(r.adelanto).toFixed(2)}</span></div>` : ''}
              <div class="total-row">
                <span>${r.saldo > 0 ? 'Saldo Pendiente' : 'Estado'}</span> 
                <span class="${r.saldo > 0 ? 'text-danger' : 'text-success'}">
                  ${r.saldo > 0 ? `Bs. ${Number(r.saldo).toFixed(2)}` : '✅ Pagado'}
                </span>
              </div>
            </div>
          </div>

          <div style="margin-top: 10px;">
            ${botonDescargaHtml}
            
            <!-- 🔥 BOTÓN PARA INSTALAR LA PWA -->
            <button class="btn btn-install" id="btnInstallTrigger">
              <i class="fas fa-mobile-screen-button" style="color:var(--brand);"></i> Instalar App de Seguimiento
            </button>

            <a class="btn btn-wsp" href="https://wa.me/59175959450?text=Hola,%20consulto%20por%20mi%20recibo%20${r.numeroRecibo}">
              <i class="fab fa-whatsapp"></i> Contactar al Taller
            </a>
          </div>
        </div>
      `;

      // Conectar el botón de PDF
      if (diasRestantes > 0 || r.estadoOrden !== 'entregado') {
        document.getElementById('btnDescargar')?.addEventListener('click', () => generarPDF(r, id));
      }

      // Lógica del botón de instalar App (PWA)
      let deferredPrompt;
      const btnInstallTrigger = document.getElementById('btnInstallTrigger');
      const installPromptUI = document.getElementById('installPrompt');
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btnInstallTrigger.style.display = 'flex'; // Mostrar botón si el navegador lo soporta
      });

      btnInstallTrigger?.addEventListener('click', async () => {
        if (!deferredPrompt) {
          alert('Para instalar la app, abre el menú de tu navegador y selecciona "Añadir a pantalla de inicio".');
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btnInstallTrigger.style.display = 'none';
        }
        deferredPrompt = null;
      });
    }

    async function generarPDF(r, id) {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4' });

      // Header PDF
      pdf.setFillColor(255, 105, 0); pdf.rect(0, 0, 210, 45, 'F');
      pdf.setTextColor(255, 255, 255); pdf.setFontSize(24); pdf.setFont('helvetica', 'bold');
      pdf.text('DR. XIAOMI SCZ', 20, 22);
      pdf.setFontSize(11); pdf.setFont('helvetica', 'normal');
      pdf.text('Servicio Tecnico Especializado', 20, 30);
      pdf.text('Centro Comercial Canoto #K1 - Tel: 75959450', 20, 36);
      
      // Info Cliente
      pdf.setTextColor(0, 0, 0); pdf.setFontSize(14); pdf.setFont('helvetica', 'bold');
      pdf.text(`Recibo: ${r.numeroRecibo}`, 20, 60);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(12);
      pdf.text(`Cliente: ${r.cliente}`, 20, 70);
      pdf.text(`Equipo: ${r.marca} ${r.modelo}`, 20, 78);
      pdf.text(`Fecha: ${new Date().toLocaleDateString()}`, 20, 86);
      
      // Tabla de Servicios
      pdf.autoTable({
        startY: 95,
        head: [['Descripcion del Servicio', 'Costo']],
        body: (r.servicios || []).map(s => [s.desc, `Bs. ${Number(s.costo).toFixed(2)}`]),
        headStyles: { fillColor: [255, 105, 0] },
        columnStyles: { 1: { halign: 'right' } }
      });

      // Totales
      let finalY = pdf.lastAutoTable.finalY + 20;
      pdf.setFontSize(12); pdf.setFont('helvetica', 'normal');
      pdf.text(`Total: Bs. ${Number(r.total || 0).toFixed(2)}`, 130, finalY);
      
      if (r.adelanto > 0) {
        pdf.text(`Adelanto: Bs. ${Number(r.adelanto).toFixed(2)}`, 130, finalY + 10);
        finalY += 10;
      }
      
      pdf.setFontSize(16); pdf.setFont('helvetica', 'bold');
      pdf.setTextColor(255, 105, 0);
      pdf.text(`SALDO: Bs. ${Number(r.saldo || 0).toFixed(2)}`, 130, finalY + 15);

      pdf.save(`Recibo_${r.numeroRecibo}.pdf`);
    }
  </script>
</body>
</html>
