<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#FF6900">
  <title>Tu Recibo - DR. XIAOMI</title>

  <!-- 🔥 FAVICONS -->
  <link rel="icon" href="/imagenes/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/imagenes/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <!-- 🔥 MANIFEST (CLAVE PARA QUE CHROME PERMITA INSTALAR) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DR XIAOMI">

  <!-- 🔥 VISTA PREVIA WHATSAPP -->
  <meta property="og:title" content="Recibo de Reparación - DR. XIAOMI SCZ">
  <meta property="og:description" content="Haz clic aquí para ver el estado de tu equipo y descargar tu comprobante en PDF.">
  <meta property="og:image" content="https://xiaomi.scz.red/imagenes/web-app-manifest-192x192.png">
  <meta property="og:url" content="https://xiaomi.scz.red/app/recibo/">
  <meta property="og:type" content="website">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg-main: #09090B; --bg-card: rgba(24, 24, 27, 0.7); --bg-elev: #27272A;
      --text-main: #FAFAFA; --text-mute: #A1A1AA; --border: rgba(255,255,255,0.08);
      --brand: #FF6900; --brand-glow: rgba(255, 105, 0, 0.3); --success: #10B981; --danger: #EF4444; --warning: #FBBF24; --blue: #3B82F6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 105, 0, 0.15), transparent 60%), radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.1), transparent 60%);
      background-attachment: fixed;
    }

    .card { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    .header { background: linear-gradient(135deg, #FF6900, #E55A00); color: white; padding: 20px; position: relative; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px var(--brand-glow); z-index: 2; display: flex; align-items: center; gap: 15px; }
    .header::after { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23p)"/></svg>'); border-radius: 0 0 30px 30px; pointer-events: none; }
    .header-logo-container { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; position: relative; z-index: 3; flex-shrink: 0; }
    .header-logo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .header-text { position: relative; z-index: 3; }
    .header h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 2px; line-height: 1; }
    .header p { font-size: 12px; opacity: 0.9; font-weight: 600; background: rgba(0,0,0,0.2); display: inline-block; padding: 4px 10px; border-radius: 20px;}

    .body { padding: 20px 20px 80px 20px; flex: 1; z-index: 2; }

    /* BARRA DE ESTADO (TIMELINE) */
    .status-timeline { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 24px; position: relative; padding: 0 10px;}
    .status-timeline::before { content: ''; position: absolute; top: 15px; left: 30px; right: 30px; height: 3px; background: var(--bg-elev); z-index: 1; border-radius: 5px; }
    .status-timeline::after { content: ''; position: absolute; top: 15px; left: 30px; height: 3px; background: var(--brand); z-index: 2; border-radius: 5px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); width: var(--progress-width, 0%); }
    
    .step { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 3; width: 60px; }
    .step-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-elev); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-mute); font-size: 14px; transition: 0.3s; }
    .step-label { font-size: 9px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; text-align: center; transition: 0.3s; line-height: 1.2;}
    
    .step.active .step-icon { background: var(--brand); border-color: var(--brand); color: white; box-shadow: 0 0 15px var(--brand-glow); transform: scale(1.1); }
    .step.active .step-label { color: var(--brand); }
    .step.done .step-icon { background: rgba(255, 105, 0, 0.2); border-color: var(--brand); color: var(--brand); }
    .step.done .step-label { color: var(--text-main); }

    .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; }
    .row span:first-child { color: var(--text-mute); font-weight: 500; }
    .row span:last-child { font-weight: 700; text-align: right; max-width: 60%; color: var(--text-main); }

    .servicios-title { font-size: 11px; text-transform: uppercase; font-weight: 800; color: var(--text-mute); margin-bottom: 12px; letter-spacing: 1px; }
    
    .total-box { background: rgba(0,0,0,0.2); border-radius: 16px; padding: 16px; margin-top: 20px; border: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: var(--text-mute); font-weight: 500;}
    
    .total-row:last-child { 
      margin-bottom: 0; font-size: 20px; font-weight: 900; color: var(--text-main); 
      margin-top: 12px; padding-top: 16px; border-top: 1px dashed var(--border); 
      letter-spacing: -0.5px; display: flex; align-items: center; white-space: nowrap; 
    }
    
    .text-success { color: var(--success) !important; }
    .text-danger { color: var(--danger) !important; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 18px; background: var(--brand); color: white; text-align: center; text-decoration: none; border-radius: 16px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; margin-bottom: 12px; transition: 0.2s; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(255, 105, 0, 0.3); }
    .btn:active { transform: scale(0.96); }
    .btn-wsp { background: #25D366; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3); }
    .btn-disabled { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-mute); cursor: not-allowed; box-shadow: none; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: var(--text-mute); font-size: 14px; font-weight: 500; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

    /* 🔥 BANNER FLOTANTE PWA (IDÉNTICO AL DE TU PÁGINA PRINCIPAL) */
    .install-banner {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(300%);
      width: calc(100% - 2rem);
      max-width: 400px;
      background: linear-gradient(135deg, #1A1E2C, #0E1118);
      border: 1.5px solid var(--brand);
      border-radius: 1.4rem;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      z-index: 1500;
      box-shadow: 0 12px 40px -8px rgba(255,105,0,0.6);
      transition: transform 0.4s cubic-bezier(.2,.9,.4,1.2);
      box-sizing: border-box;
    }
    .install-banner.show { transform: translateX(-50%) translateY(0); }
    .install-banner.ios { border-color: #007AFF; }
    .install-banner-icon { width: 46px; height: 46px; background: transparent; padding: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 12px -2px rgba(255, 105, 0, 0.5); flex-shrink: 0; display: block; }
    .install-banner-logo { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
    .install-banner-text { flex: 1; min-width: 0; }
    .install-banner-text strong { display: block; font-size: 0.85rem; color: white; font-weight: 700; }
    .install-banner-text span { display: block; font-size: 0.68rem; color: var(--text-mute); margin-top: 3px; line-height: 1.3; }
    .install-banner-btn { background: linear-gradient(95deg, var(--brand), #E55A00); border: none; color: white; padding: 0.6rem 1.1rem; border-radius: 2rem; font-weight: 700; font-size: 0.72rem; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: transform 0.12s; white-space: nowrap; }
    .install-banner-btn:active { transform: scale(0.92); }
    .install-banner-close { background: transparent; border: none; color: var(--text-mute); font-size: 1.2rem; cursor: pointer; padding: 4px; opacity: 0.7; flex-shrink: 0; line-height: 1; }
    
    /* 🔥 LOADER DEL PDF */
    .pdf-loader { position: fixed; inset: 0; background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(10px); z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
    .pdf-loader.show { opacity: 1; pointer-events: auto; }
    .pdf-loader-icon { font-size: 50px; color: var(--brand); margin-bottom: 20px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    .pdf-loader-text { font-size: 16px; font-weight: 700; color: white; margin-bottom: 8px; }
    .pdf-loader-sub { font-size: 13px; color: var(--text-mute); }
  </style>
</head>
<body>

  <div class="card" id="appCard">
    <div class="loading">
      <div class="spinner"></div>
      Cargando tu recibo en tiempo real...
    </div>
  </div>

  <!-- LOADER DEL PDF -->
  <div class="pdf-loader" id="pdfLoader">
    <i class="fas fa-file-pdf pdf-loader-icon"></i>
    <div class="pdf-loader-text" id="pdfLoaderText">Preparando tu recibo...</div>
    <div class="pdf-loader-sub" id="pdfLoaderSub">Por favor espera un momento</div>
  </div>

  <!-- 🔥 BANNER FLOTANTE PWA (IDÉNTICO AL DE TU PÁGINA PRINCIPAL) -->
  <div class="install-banner" id="installBanner">
    <div class="install-banner-icon" id="installIcon">
      <img src="/imagenes/web-app-manifest-192x192.png" alt="DR XIAOMI" class="install-banner-logo">
    </div>
    <div class="install-banner-text">
      <strong id="installTitle">Instalar DR XIAOMI</strong>
      <span id="installSubtitle">Acceso rápido desde tu inicio</span>
    </div>
    <button class="install-banner-btn" id="installBtn">INSTALAR</button>
    <button class="install-banner-close" id="installClose" aria-label="Cerrar">✕</button>
  </div>

  <script type="module">
    import { db } from '/js/firebase.js';
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 🔥 REGISTRO DEL SERVICE WORKER (OBLIGATORIO PARA QUE CHROME DEJE INSTALAR)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW Error:', err));
    }

    const params = new URLSearchParams(window.location.search);
    const reciboId = params.get('id');
    const appCard = document.getElementById('appCard');

    // ==========================================
    // 🔥 LÓGICA DEL BANNER PWA (IDÉNTICA A TU INDEX)
    // ==========================================
    let deferredPrompt = null;
    const installBanner = document.getElementById('installBanner');
    const installTitle = document.getElementById('installTitle');
    const installSubtitle = document.getElementById('installSubtitle');
    const installBtn = document.getElementById('installBtn');
    const installClose = document.getElementById('installClose');

    function detectPlatform() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /Android/i.test(ua);
      const isDesktop = !isIOS && !isAndroid;
      return { isIOS, isAndroid, isDesktop };
    }
    const PLATFORM = detectPlatform();

    function setupInstallBanner() {
      if (PLATFORM.isIOS) {
        installBanner.classList.add('ios');
        installTitle.textContent = 'Instalar en iPhone';
        installSubtitle.textContent = 'Toca Compartir ⬆️ y "Añadir a pantalla de inicio"';
        installBtn.innerHTML = 'VER CÓMO';
      } else {
        installTitle.textContent = 'Instalar DR XIAOMI';
        installSubtitle.textContent = 'Acceso rápido desde tu inicio';
        installBtn.innerHTML = 'INSTALAR';
      }
    }
    setupInstallBanner();

    const installClosed = localStorage.getItem('drxiaomi_install_closed');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!installClosed && !isStandalone) {
        setTimeout(() => installBanner.classList.add('show'), 3000);
      }
    });

    if ((PLATFORM.isIOS || PLATFORM.isDesktop) && !installClosed && !isStandalone) {
      setTimeout(() => installBanner.classList.add('show'), 3000);
    }

    installBtn.addEventListener('click', async () => {
      if (PLATFORM.isIOS) {
        alert('Para instalar la app:\n\n1. Abre el menú de tu navegador (los 3 puntos o el botón de compartir).\n2. Busca la opción "Agregar a la pantalla principal".\n3. Confirma la instalación.');
        return;
      }
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBanner.classList.remove('show');
        }
        deferredPrompt = null;
      } else {
        alert('Para instalar la app:\n\n1. Abre el menú de tu navegador (los 3 puntos).\n2. Busca la opción "Instalar app" o "Agregar a la pantalla principal".\n3. Confirma la instalación.');
      }
    });

    installClose.addEventListener('click', () => {
      installBanner.classList.remove('show');
      localStorage.setItem('drxiaomi_install_closed', '1');
    });

    // ==========================================
    // 🔥 CARGAR DATOS DEL RECIBO
    // ==========================================
    if (!reciboId) {
      appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-times-circle" style="font-size:40px; margin-bottom:15px;"></i>No se especificó un recibo.</div>';
    } else {
      escucharRecibo(reciboId);
    }

    function escucharRecibo(id) {
      const q = query(collection(db, 'recibos'), where('numeroRecibo', '==', id));
      
      onSnapshot(q, (snap) => {
        if (snap.empty) {
          appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-search-minus" style="font-size:40px; margin-bottom:15px;"></i>Recibo no encontrado o eliminado.</div>';
          return;
        }
        
        const recibo = snap.docs[0].data();
        renderizarRecibo(recibo, id);
      }, (error) => {
        console.error(error);
        appCard.innerHTML = '<div class="loading" style="color:var(--danger)"><i class="fas fa-wifi" style="font-size:40px; margin-bottom:15px;"></i>Error de conexión.</div>';
      });
    }

    function renderizarRecibo(r, id) {
      let stepActivo = 1;
      if (r.estadoOrden === 'reparacion' || r.estadoOrden === 'espera-repuesto') stepActivo = 2;
      else if (r.estadoOrden === 'listo') stepActivo = 3;
      else if (r.estadoOrden === 'entregado') stepActivo = 4;

      const progressWidth = ((stepActivo - 1) / 3) * 100 + '%';
      
      const stepsHtml = `
        <div class="status-timeline" style="--progress-width: ${progressWidth};">
          <div class="step ${stepActivo >= 1 ? (stepActivo === 1 ? 'active' : 'done') : ''}">
            <div class="step-icon"><i class="fas fa-box"></i></div>
            <div class="step-label">Recibido</div>
          </div>
          <div class="step ${stepActivo >= 2 ? (stepActivo === 2 ? 'active' : 'done') : ''}">
            <div class="step-icon"><i class="fas fa-screwdriver-wrench"></i></div>
            <div class="step-label">Reparación</div>
          </div>
          <div class="step ${stepActivo >= 3 ? (stepActivo === 3 ? 'active' : 'done') : ''}">
            <div class="step-icon"><i class="fas fa-check-circle"></i></div>
            <div class="step-label">Listo</div>
          </div>
          <div class="step ${stepActivo >= 4 ? (stepActivo === 4 ? 'active' : 'done') : ''}">
            <div class="step-icon"><i class="fas fa-handshake"></i></div>
            <div class="step-label">Entregado</div>
          </div>
        </div>
      `;

      let avisoHtml = '';
      let botonDescargaHtml = `<button class="btn" id="btnDescargar"><i class="fas fa-file-pdf"></i> Descargar Recibo PDF</button>`;
      let diasRestantes = 30;
      
      if (r.estadoOrden === 'entregado' && r.fechaEntrega) {
        let fecha = r.fechaEntrega.toDate ? r.fechaEntrega.toDate() : new Date(r.fechaEntrega);
        diasRestantes = 30 - Math.floor((new Date() - fecha) / (1000 * 60 * 60 * 24));
        if (diasRestantes <= 0) { 
          avisoHtml = `<div class="aviso aviso-danger">⚠️ Este enlace de descarga ha expirado.</div>`; 
          botonDescargaHtml = `<button class="btn btn-disabled" disabled><i class="fas fa-lock"></i> PDF Expirado</button>`; 
        } else if (diasRestantes <= 15) { 
          avisoHtml = `<div class="aviso aviso-warning">⏳ Te quedan <b>${diasRestantes} días</b> para descargar este PDF. ¡Guárdalo!</div>`; 
        }
      }

      let fechaIngreso = '-';
      if (r.fechaEditada || r.fecha) {
        let d = (r.fechaEditada || r.fecha).toDate ? (r.fechaEditada || r.fecha).toDate() : new Date(r.fechaEditada || r.fecha);
        fechaIngreso = d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      const serviciosHtml = (r.servicios || []).map(s => `<div class="row"><span>${s.desc}</span><span>Bs. ${Number(s.costo).toFixed(2)}</span></div>`).join('');

      appCard.innerHTML = `
        <div class="header">
          <div class="header-logo-container"><img src="/imagenes/web-app-manifest-192x192.png" alt="Logo" class="header-logo" onerror="this.style.display='none'"></div>
          <div class="header-text"><h1>DR. XIAOMI</h1><p>Recibo N°: ${r.numeroRecibo}</p></div>
        </div>
        
        <div class="body">
          ${stepsHtml}
          ${avisoHtml}
          
          <div class="glass-card">
            <div class="row"><span>Cliente</span> <span>${r.cliente}</span></div>
            <div class="row"><span>Equipo</span> <span>${r.marca} ${r.modelo}</span></div>
            <div class="row"><span>Falla reportada</span> <span>${r.falla || 'No especificada'}</span></div>
            <div class="row"><span>Fecha de Ingreso</span> <span>${fechaIngreso}</span></div>
          </div>
          
          <div class="glass-card">
            <div class="servicios-title">Servicios Realizados</div>
            ${serviciosHtml || '<div class="row"><span>Sin servicios</span><span>-</span></div>'}
            <div class="total-box">
              <div class="total-row"><span>Total</span> <span>Bs. ${Number(r.total || 0).toFixed(2)}</span></div>
              ${r.adelanto > 0 ? `<div class="total-row"><span>Adelanto</span> <span>Bs. ${Number(r.adelanto).toFixed(2)}</span></div>` : ''}
              <div class="total-row"><span>${r.saldo > 0 ? 'Saldo Pendiente' : 'Estado'}</span> <span class="${r.saldo > 0 ? 'text-danger' : 'text-success'}">${r.saldo > 0 ? `Bs. ${Number(r.saldo).toFixed(2)}` : '✅ Pagado'}</span></div>
            </div>
          </div>

          <div style="margin-top: 10px;">
            ${botonDescargaHtml}
            <a class="btn btn-wsp" href="https://wa.me/59175959450?text=Hola,%20consulto%20por%20mi%20recibo%20${r.numeroRecibo}"><i class="fab fa-whatsapp"></i> Contactar al Taller</a>
          </div>
        </div>
      `;

      if (diasRestantes > 0 || r.estadoOrden !== 'entregado') {
        document.getElementById('btnDescargar')?.addEventListener('click', () => generarPDFPremium(r));
      }
    }

    // =====================================================================
    // 🔥 MOTOR DE PDF COMPLETO (DISEÑO PROFESIONAL TIPO HOJA A4)
    // =====================================================================
    async function generarPDFPremium(r) {
      const loader = document.getElementById('pdfLoader');
      const loaderText = document.getElementById('pdfLoaderText');
      const loaderSub = document.getElementById('pdfLoaderSub');
      
      loader.classList.add('show');
      loaderText.textContent = 'Preparando tu recibo...';
      loaderSub.textContent = 'Cargando datos...';

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: 'a4' }); 
        const W = 210, M = 15, CW = W - M * 2;
        let y = 0;

        loaderText.textContent = 'Cargando logo...';
        const logoDataUrl = await getLogoDataUrl();

        loaderText.textContent = 'Generando código QR...';
        loaderSub.textContent = 'Enlazando a la web...';
        const qrDataUrl = await getQRDataUrl(`https://xiaomi.scz.red/app/recibo/?id=${r.numeroRecibo}`);

        loaderText.textContent = 'Construyendo PDF...';
        loaderSub.textContent = 'Dando formato a los datos...';

        // 1. ENCABEZADO NARANJA
        pdf.setFillColor(255, 105, 0); pdf.rect(0, 0, W, 35, 'F');
        if (logoDataUrl) {
          try {
            pdf.setFillColor(255, 255, 255); pdf.circle(M + 10, 17.5, 9, 'F');
            pdf.addImage(logoDataUrl, 'PNG', M + 2, 10, 15, 15); 
          } catch (e) {}
        }
        pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(22);
        pdf.text('DR. XIAOMI SCZ', M + 24, 16);
        pdf.setFontSize(9); pdf.setFont('helvetica', 'normal');
        pdf.text('Servicio Técnico Especializado', M + 24, 22);
        pdf.text('Centro Comercial Cañoto #K1 · Tel: 75959450', M + 24, 27);

        pdf.setFillColor(255, 255, 255); pdf.roundedRect(W - M - 60, 8, 60, 20, 2, 2, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('RECIBO N°', W - M - 4, 14, { align: 'right' });
        pdf.setFontSize(11); pdf.text(r.numeroRecibo || '-', W - M - 4, 20, { align: 'right' });
        y = 45;

        // 2. TARJETAS DE DATOS
        const colW = (CW - 6) / 2;
        pdf.setFillColor(248, 248, 248); pdf.roundedRect(M, y, colW, 25, 2, 2, 'F');
        pdf.setFillColor(255, 105, 0); pdf.rect(M, y, 2, 25, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('DATOS DEL CLIENTE', M + 5, y + 6);
        pdf.setTextColor(30, 30, 30); pdf.setFontSize(11); pdf.text((r.cliente || '').slice(0, 25), M + 5, y + 14);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(100, 100, 100);
        pdf.text(`Tel: ${r.telefono || ''}`, M + 5, y + 21);

        pdf.setFillColor(248, 248, 248); pdf.roundedRect(M + colW + 6, y, colW, 25, 2, 2, 'F');
        pdf.setFillColor(255, 105, 0); pdf.rect(M + colW + 6, y, 2, 25, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('DATOS DEL EQUIPO', M + colW + 11, y + 6);
        pdf.setTextColor(30, 30, 30); pdf.setFontSize(11); pdf.text(`${r.marca || ''} ${r.modelo || ''}`.slice(0, 25), M + colW + 11, y + 14);
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9); pdf.setTextColor(100, 100, 100);
        pdf.text(`Enciende: ${r.enciende || 'Sí'}`, M + colW + 11, y + 21);
        y += 30;

        pdf.setFillColor(248, 248, 248); pdf.roundedRect(M, y, colW, 25, 2, 2, 'F');
        pdf.setFillColor(255, 105, 0); pdf.rect(M, y, 2, 25, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('ESTADO / FALLA', M + 5, y + 6);
        pdf.setTextColor(100, 100, 100); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
        pdf.text(pdf.splitTextToSize(r.falla || 'No especificada', colW - 10), M + 5, y + 13);

        pdf.setFillColor(248, 248, 248); pdf.roundedRect(M + colW + 6, y, colW, 25, 2, 2, 'F');
        pdf.setFillColor(255, 105, 0); pdf.rect(M + colW + 6, y, 2, 25, 'F');
        pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8);
        pdf.text('SEGURIDAD', M + colW + 11, y + 6);
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
        let segInfo = r.tipoSeguridad === 'pin' ? `PIN: ${r.pin}` : (r.patron ? `Patrón: ${r.patron.split(',').join('-')}` : 'Sin clave');
        pdf.text(segInfo.slice(0, 25), M + colW + 11, y + 15);
        y += 30;

        // 3. TABLA DE SERVICIOS
        pdf.setFillColor(255, 105, 0); pdf.roundedRect(M, y, CW, 8, 2, 2, 'F');
        pdf.setTextColor(255, 255, 255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
        pdf.text('SERVICIOS Y COSTOS', M + 5, y + 5.5);
        y += 12;

        pdf.autoTable({
          startY: y,
          head: [['Descripción del Servicio', 'Costo']],
          body: (r.servicios || []).map(s => [s.desc, `Bs. ${Number(s.costo).toFixed(2)}`]),
          styles: { fontSize: 9, cellPadding: 4, lineColor: [230, 230, 230], lineWidth: 0.1 },
          headStyles: { fillColor: [255, 105, 0], textColor: 255, fontStyle: 'bold', fontSize: 9 },
          alternateRowStyles: { fillColor: [255, 250, 245] },
          columnStyles: { 0: { cellWidth: CW - 40 }, 1: { halign: 'right', cellWidth: 40, fontStyle: 'bold', textColor: [255, 105, 0] } },
          margin: { left: M, right: M },
          theme: 'grid'
        });

        y = pdf.lastAutoTable.finalY + 10;

        // 4. TOTALES
        const boxW = 80; const boxX = M + CW - boxW;
        pdf.setFillColor(248, 248, 248); pdf.roundedRect(boxX, y, boxW, 20, 2, 2, 'F');
        pdf.setDrawColor(255, 105, 0); pdf.setLineWidth(0.4); pdf.roundedRect(boxX, y, boxW, 20, 2, 2, 'S');

        pdf.setTextColor(100, 100, 100); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
        pdf.text('Total:', boxX + 5, y + 8);
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11);
        pdf.text(`Bs. ${Number(r.total || 0).toFixed(2)}`, boxX + boxW - 5, y + 8, { align: 'right' });
        
        pdf.setTextColor(255, 105, 0); pdf.setFontSize(10);
        pdf.text('SALDO:', boxX + 5, y + 16);
        pdf.setFontSize(12); pdf.text(`Bs. ${Number(r.saldo || 0).toFixed(2)}`, boxX + boxW - 5, y + 16, { align: 'right' });

        y += 28;

        // 5. FOTOS (Si existen)
        const fotosValidas = (r.fotos || []).filter(f => f && typeof f === 'string');
        if (fotosValidas.length > 0) {
          pdf.setTextColor(255, 105, 0); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
          pdf.text('IMÁGENES DEL EQUIPO', M, y); y += 6;

          const fotoW = (CW - 6) / 2;
          const fotoH = fotoW * 0.75;
          let x = M;

          for (let i = 0; i < Math.min(fotosValidas.length, 2); i++) {
            try {
              pdf.setFillColor(255, 255, 255); pdf.roundedRect(x, y, fotoW, fotoH, 2, 2, 'F');
              pdf.setDrawColor(220, 220, 220); pdf.roundedRect(x, y, fotoW, fotoH, 2, 2, 'S');
              pdf.addImage(fotosValidas[i], 'JPEG', x + 1, y + 1, fotoW - 2, fotoH - 2, undefined, 'FAST');
            } catch (e) {}
            x += fotoW + 6;
          }
          y += fotoH + 10;
        }

        // 6. CONDICIONES DEL SERVICIO
        if (y > 230) { pdf.addPage(); y = 20; }
        
        pdf.setFillColor(248, 248, 248); pdf.roundedRect(M, y, CW, 35, 2, 2, 'F');
        pdf.setTextColor(30, 30, 30); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
        pdf.text('CONDICIONES DEL SERVICIO', M + 5, y + 6);

        pdf.setTextColor(100, 100, 100); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
        const garantia = [
          '1. Conserve este recibo; solo con él puede retirar su equipo.',
          '2. La fecha de entrega está sujeta a disponibilidad de repuestos.',
          '3. El retiro debe hacerse Max dentro de los 10 días posteriores al aviso.',
          '4. Pasados 20 días sin retiro, el equipo se considera abandonado.',
          '5. Garantía: 30 días en repuesto / 60 días en mano de obra.'
        ];
        garantia.forEach((txt, i) => {
          pdf.text(txt, M + 5, y + 12 + (i * 4));
        });

        y += 40;

        // 7. FIRMA Y QR
        if (y > 250) { pdf.addPage(); y = 20; }

        pdf.setDrawColor(200, 200, 200); pdf.setLineWidth(0.3);
        pdf.line(M, y + 15, M + 60, y + 15);
        pdf.setTextColor(100, 100, 100); pdf.setFontSize(8);
        pdf.text('Firma del Cliente', M + 15, y + 20);

        if (qrDataUrl) {
          try {
            pdf.addImage(qrDataUrl, 'PNG', W - M - 25, y, 25, 25);
            pdf.setFontSize(6); pdf.text('Ver estado online', W - M - 25, y + 28);
          } catch (e) {}
        }

        // 8. PIE DE PÁGINA
        pdf.setFillColor(255, 105, 0); pdf.rect(0, 285, W, 12, 'F');
        pdf.setTextColor(255, 255, 255); pdf.setFontSize(8); pdf.setFont('helvetica', 'bold');
        pdf.text('¡Gracias por confiar en DR. XIAOMI SCZ!', W / 2, 290, { align: 'center' });
        pdf.setFontSize(7); pdf.setFont('helvetica', 'normal');
        pdf.text('Síguenos en xiaomi.scz.red', W / 2, 294, { align: 'center' });

        loaderText.textContent = '¡Listo!'; loaderSub.textContent = 'Descargando archivo...';
        await new Promise(res => setTimeout(res, 800));
        pdf.save(`Recibo_${r.numeroRecibo}.pdf`);

      } catch (err) {
        console.error("Error generando PDF:", err);
        alert("Hubo un error al generar el PDF.");
      } finally {
        loader.classList.remove('show');
      }
    }

    async function getLogoDataUrl() {
      return new Promise((resolve) => {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => {
          try { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); resolve(c.toDataURL('image/png')); } catch (e) { resolve(''); }
        };
        img.onerror = () => resolve('');
        img.src = '/imagenes/web-app-manifest-192x192.png';
      });
    }

    async function getQRDataUrl(texto) {
      return new Promise((resolve) => {
        if (typeof QRCode === 'undefined') { resolve(''); return; }
        const div = document.createElement('div'); div.style.cssText = 'position:absolute;left:-9999px;'; document.body.appendChild(div);
        try {
          new QRCode(div, { text: texto, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
          setTimeout(() => {
            const canvas = div.querySelector('canvas'), img = div.querySelector('img');
            let dataUrl = canvas ? canvas.toDataURL('image/png') : (img && img.src ? img.src : '');
            div.remove(); resolve(dataUrl);
          }, 200);
        } catch (e) { div.remove(); resolve(''); }
      });
    }
  </script>
