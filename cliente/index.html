<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6900" id="metaThemeColor">
  <meta name="description" content="Catálogo de pantallas y repuestos">
  <title>DR. XIAOMI | Catálogo</title>

  <script>
    (function() {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (!sesion || !sesion.rol) {
          window.location.replace('/app/');
        }
      } catch (e) {
        window.location.replace('/app/');
      }
    })();
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --xiaomi-orange: #FF6900;
      --xiaomi-orange-dark: #E55A00;
      --xiaomi-orange-soft: #FF8A3C;
      --xiaomi-orange-glow: rgba(255, 105, 0, 0.15);
      --gold-1: #FFD700;
      --gold-2: #FFA500;
      --gold-glow: rgba(255, 200, 0, 0.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
      --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      --transition-fast: all 0.12s cubic-bezier(0.2, 0.9, 0.4, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    [data-theme="light"] {
      --bg-primary: #F5F5F7; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
      --bg-glass: rgba(255,255,255,0.72);
      --text-primary: #1D1D1F; --text-secondary: #6E6E73; --text-tertiary: #8A8A8E;
      --border: #E5E5EA; --border-soft: #F0F0F3; --card-border: #EEEEF1;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --suggestion-bg: #FFFFFF; --suggestion-hover: #F5F5F7;
      --overlay: rgba(0,0,0,0.45);
    }
    [data-theme="dark"] {
      --bg-primary: #0A0A0A; --bg-secondary: #1A1A1A; --bg-card: #141414;
      --bg-glass: rgba(20,20,20,0.72);
      --text-primary: #F5F5F7; --text-secondary: #A1A1A6; --text-tertiary: #7A7A80;
      --border: #232326; --border-soft: #1C1C1E; --card-border: #1F1F22;
      --card-shadow: none;
      --suggestion-bg: #141414; --suggestion-hover: #1F1F22;
      --overlay: rgba(0,0,0,0.75);
    }
    html, body { height: 100%; overscroll-behavior-y: none; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; width: 100%; height: 100dvh; transition: background 0.3s ease; -webkit-font-smoothing: antialiased; user-select: none; }
    .app { max-width: 100%; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); position: relative; }

    /* ============ HEADER MINIMALISTA ============ */
    .header { background: var(--bg-primary); border-bottom: 1px solid var(--border-soft); padding: calc(12px + var(--safe-top)) 16px 10px; flex-shrink: 0; position: relative; z-index: 50; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; display: block; }
    .logo h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
    .logo span { font-weight: 500; color: var(--text-tertiary); font-size: 13px; }

    .header-actions { display: flex; gap: 4px; }
    .icon-btn { background: transparent; border: none; border-radius: 4px; padding: 0; color: var(--text-secondary); cursor: pointer; font-size: 15px; transition: var(--transition-fast); display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; position: relative; overflow: hidden; }
    .icon-btn:hover { background: var(--bg-secondary); }
    .icon-btn:active { transform: scale(0.9); color: var(--xiaomi-orange); }
    .icon-btn.tech-active { background: var(--xiaomi-orange) !important; color: white !important; }

    /* ============ SEARCH ============ */
    .search-wrapper { position: relative; }
    .search-container { position: relative; }
    .search-input { width: 100%; padding: 11px 80px 11px 38px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-size: 14px; font-weight: 500; transition: var(--transition); }
    .search-input:focus { outline: none; border-color: var(--xiaomi-orange); background: var(--bg-card); }
    .search-input::placeholder { color: var(--text-tertiary); font-weight: 400; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 13px; pointer-events: none; }
    .search-actions { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; align-items: center; }
    .search-actions button { background: transparent; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 20px; transition: var(--transition); }
    .search-actions button:hover { color: var(--text-primary); }
    .search-loader { width: 16px; height: 16px; border: 2px solid var(--border); border-top: 2px solid var(--xiaomi-orange); border-radius: 50%; animation: spinLoader 0.6s linear infinite; margin-right: 4px; display: inline-block; }
    @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ============ SUGGESTIONS ============ */
    .suggestions-panel { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: var(--suggestion-bg); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-lg); max-height: min(300px, 40vh); overflow-y: auto; display: none; z-index: 60; }
    .suggestions-panel.active { display: block; animation: panelIn 0.18s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .suggestion-header { padding: 10px 14px; font-size: 10px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-soft); background: var(--bg-primary); position: sticky; top: 0; }
    .suggestion-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; transition: var(--transition-fast); font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--suggestion-hover); }
    .suggestion-item:active { background: var(--suggestion-hover); transform: scale(0.99); }
    .suggestion-item i { color: var(--text-tertiary); font-size: 12px; width: 16px; }
    .suggestion-highlight { color: var(--xiaomi-orange); font-weight: 700; }
    .suggestion-price-tag { font-size: 9px; color: var(--text-tertiary); background: var(--bg-primary); padding: 2px 7px; border-radius: 4px; font-weight: 600; }
    .recent-header { padding: 8px 14px 4px; font-size: 9px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-item { padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); transition: var(--transition-fast); }
    .recent-item:active { background: var(--suggestion-hover); }

    /* ============ FILTROS MINIMALISTAS ============ */
    .quick-filters { padding: 8px 16px 10px; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; background: var(--bg-primary); border-bottom: 1px solid var(--border-soft); }
    .quick-filters::-webkit-scrollbar { display: none; }
    .filter-chip { padding: 5px 12px; border-radius: 4px; font-size: 11.5px; font-weight: 600; background: transparent; color: var(--text-tertiary); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; transition: var(--transition-fast); position: relative; overflow: hidden; letter-spacing: -0.1px; }
    .filter-chip:hover { color: var(--text-secondary); border-color: var(--text-tertiary); }
    .filter-chip.active { background: var(--xiaomi-orange); color: white; border-color: var(--xiaomi-orange); }
    .filter-chip[data-filter="ORIG"].active { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #4A2800; border-color: var(--gold-2); }
    .filter-chip:active { transform: scale(0.96); }

    /* ============ MAIN CONTENT ============ */
    .main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
    .cards-view { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; padding-bottom: calc(90px + var(--safe-bottom)); width: 100%; max-width: 100%; box-sizing: border-box; }

    /* ============ PRODUCT CARD MINIMALISTA ============ */
    .product-card { background: var(--bg-card); border-radius: 6px; padding: 14px 16px; border: 1px solid var(--card-border); position: relative; opacity: 0; transform: translateY(6px); animation: cardIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1) forwards; content-visibility: auto; contain-intrinsic-size: 0 100px; width: 100%; max-width: 100%; box-sizing: border-box; }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .product-card::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; background: var(--xiaomi-orange); border-radius: 0; }
    .product-card.is-orig::before { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
    .product-card:active { background: var(--bg-secondary); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; padding-left: 8px; gap: 10px; }
    .card-brand { font-size: 10px; font-weight: 700; color: var(--xiaomi-orange); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; }
    .product-card.is-orig .card-brand { color: #B8860B; }
    [data-theme="dark"] .product-card.is-orig .card-brand { color: var(--gold-1); }
    .card-model { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.2px; word-break: break-word; line-height: 1.3; }

    .fav-btn { background: transparent; border: none; color: var(--text-tertiary); font-size: 15px; cursor: pointer; padding: 2px; transition: var(--transition-fast); flex-shrink: 0; opacity: 0.6; }
    .fav-btn.active { color: #FFB800; opacity: 1; }
    .fav-btn:active { transform: scale(0.85); }

    .card-specs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; padding-left: 8px; }
    .card-type { padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 600; background: var(--bg-primary); color: var(--text-tertiary); letter-spacing: 0.2px; }
    .card-type.oled { background: rgba(255, 105, 0, 0.1); color: var(--xiaomi-orange); }
    .card-type.orig { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #4A2800; font-weight: 800; letter-spacing: 0.3px; }
    .card-type.orig::before { content: '👑 '; font-size: 9px; }

    .supplier-badge { padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 600; background: rgba(255,105,0,0.08); color: var(--xiaomi-orange); }
    [data-theme="dark"] .supplier-badge { background: rgba(255,105,0,0.15); }

    .price-badge { padding: 3px 9px; border-radius: 4px; font-size: 10px; font-weight: 600; background: rgba(16, 185, 129, 0.08); color: #10B981; }
    [data-theme="dark"] .price-badge { background: rgba(16, 185, 129, 0.15); }

    .card-price-row { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-soft); padding-left: 8px; gap: 10px; flex-wrap: wrap; }
    .card-price { font-size: 20px; font-weight: 800; color: var(--text-primary); cursor: pointer; transition: var(--transition); letter-spacing: -0.5px; padding: 3px 8px; border-radius: 4px; margin-left: -8px; }
    .card-price:active { color: var(--xiaomi-orange); background: var(--xiaomi-orange-glow); }
    .card-actions-group { display: flex; gap: 5px; }
    .image-btn, .whatsapp-btn { border: none; padding: 6px 12px; border-radius: 4px; font-size: 10.5px; font-weight: 700; cursor: pointer; transition: var(--transition-fast); display: flex; align-items: center; gap: 4px; position: relative; overflow: hidden; }
    .image-btn:active, .whatsapp-btn:active { transform: scale(0.92); }
    .image-btn { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .image-btn:hover { border-color: var(--text-tertiary); }
    .whatsapp-btn { background: #25D366; color: white; }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-primary); border-top: 1px solid var(--border-soft); display: flex; padding: 6px 20px calc(10px + var(--safe-bottom)); gap: 12px; z-index: 100; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 8px; border: none; background: transparent; color: var(--text-tertiary); border-radius: 6px; cursor: pointer; font-size: 9.5px; font-weight: 600; transition: var(--transition-fast); position: relative; text-decoration: none; }
    .nav-item.active { color: var(--xiaomi-orange); }
    .nav-item i { font-size: 17px; transition: var(--transition-fast); }
    .nav-item.active i { transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(255, 105, 0, 0.5)); }
    .nav-item:active i { transform: scale(0.85); }

    /* ============ MODAL ============ */
    .modal { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal.active { display: flex; animation: modalFade 0.18s ease; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal-content { background: var(--bg-card); border-radius: 6px 6px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom)); width: 100%; max-width: 520px; border: 1px solid var(--border); border-bottom: none; animation: sheetUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1); position: relative; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 32px; height: 3px; background: var(--border); border-radius: 3px; margin: -8px auto 14px; }
    .modal-content h3 { margin-bottom: 16px; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px; transition: var(--transition-fast); }
    .modal-buttons button:active { transform: scale(0.97); }
    .modal-buttons button:last-child { background: var(--xiaomi-orange); color: white; }

    /* ============ TOAST ============ */
    .toast { position: fixed; bottom: calc(80px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: var(--bg-card); padding: 10px 18px; border-radius: 6px; color: var(--text-primary); font-size: 12px; font-weight: 600; z-index: 150; animation: fadeInUp 0.25s ease; border: 1px solid var(--border); box-shadow: var(--shadow-lg); max-width: 90%; text-align: center; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ============ RESULTS COUNT ============ */
    .results-count { padding: 10px 18px 6px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .results-count .offline-tag { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--bg-secondary); color: var(--text-tertiary); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 4px; }
    .results-count .offline-tag.on { color: #FF9500; border-color: #FF9500; }
    .results-count .offline-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ============ EMPTY STATE ============ */
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-tertiary); }
    .empty-state i { font-size: 44px; opacity: 0.15; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }
    .empty-state .btn-google { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 10px 18px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; transition: var(--transition-fast); }
    .empty-state .btn-google:active { transform: scale(0.95); }

    .main-content::-webkit-scrollbar { width: 2px; }
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ptr-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px); background: var(--bg-card); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--xiaomi-orange); z-index: 10; transition: transform 0.2s ease, opacity 0.2s ease; opacity: 0; font-size: 14px; }
    .ptr-indicator.visible { opacity: 1; }
    .ptr-indicator.spinning i { animation: spinLoader 0.8s linear infinite; }

    .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.2; transform: scale(0); animation: rippleAnim 0.5s ease-out; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* ============ SPLASH NATIVO (LOGO GIRATORIO) ============ */
    .splash { position: fixed; inset: 0; background: rgba(14, 14, 14, 0.95); backdrop-filter: blur(8px); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .splash.hidden { opacity: 0; pointer-events: none; }
    
    .loader-logo-container {
      position: relative;
      width: 90px; height: 90px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    
    .loader-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--xiaomi-orange);
      border-bottom-color: var(--xiaomi-orange);
      animation: spinLoader 1.2s linear infinite;
    }
    
    .loader-logo-img {
      width: 70px; height: 70px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg-elev);
      border: 2px solid var(--border);
      box-shadow: 0 0 20px rgba(230, 81, 0, 0.2);
    }
    
    .loader-text {
      font-size: 13px; font-weight: 600; color: var(--text-mute);
      letter-spacing: 0.5px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .scroll-top-btn { position: fixed; bottom: calc(84px + var(--safe-bottom)); right: 14px; width: 40px; height: 40px; border-radius: 6px; background: var(--bg-card); color: var(--xiaomi-orange); border: 1px solid var(--border); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; z-index: 90; opacity: 0; transform: translateY(20px) scale(0.8); pointer-events: none; transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1); }
    .scroll-top-btn.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .scroll-top-btn:active { transform: scale(0.9); }

    /* ============ FICHA TÉCNICA (IA) ============ */
    #modalSpecs .modal-content { max-height: 85vh; overflow-y: auto; padding-bottom: calc(20px + var(--safe-bottom)); }
    .spec-loading { text-align: center; padding: 30px; color: var(--text-tertiary); font-size: 13px; }

    @media (min-width: 640px) {
      .app { max-width: 500px; }
      .modal { align-items: center; padding: 20px; }
      .modal-content { border-radius: 6px; border-bottom: 1px solid var(--border); }
      .sheet-handle { display: none; }
    }
  </style>
</head>
<body>

<!-- LOADER NATIVO -->
<div class="splash" id="splash">
  <div class="loader-logo-container">
    <div class="loader-ring"></div>
    <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/favicon-96x96.png'">
  </div>
  <div class="loader-text">Cargando catálogo...</div>
</div>

<div class="app" id="appRoot" style="opacity:0;">
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--xiaomi-orange); font-size:16px;&quot;></i>';">
        </div>
        <h1>DR XIAOMI <span>Catálogo</span></h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Tema" aria-label="Cambiar tema">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" id="techModeBtn" title="Modo Técnico" aria-label="Modo técnico">
          <i class="fas fa-microchip"></i>
        </button>
        <button class="icon-btn" id="receiptBtn" title="Nuevo Recibo" aria-label="Nuevo Recibo">
          <i class="fas fa-receipt"></i>
        </button>
        <button class="icon-btn" id="backBtn" title="Volver al panel" aria-label="Volver al panel">
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
    </div>
    <div class="search-wrapper">
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar modelo... Ej: Redmi Note 10" autocomplete="off" aria-label="Buscar modelo">
        <div class="search-actions" id="searchActions">
          <div id="searchLoaderIndicator" style="display: none;"><div class="search-loader"></div></div>
          <button id="clearSearchBtn" style="display: none;" aria-label="Limpiar búsqueda"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="suggestions-panel" id="suggestionsPanel"></div>
    </div>
  </header>

  <div class="quick-filters" id="quickFilters">
    <button class="filter-chip active" data-filter="all">Todos</button>
    <button class="filter-chip" data-filter="ORIG">ORIG</button>
    <button class="filter-chip" data-filter="OLED">OLED</button>
    <button class="filter-chip" data-filter="LCD">LCD</button>
    <button class="filter-chip" data-filter="FAV">⭐ Favoritos</button>
  </div>

  <div class="main-content" id="mainScrollContainer">
    <div class="ptr-indicator" id="ptrIndicator"><i class="fas fa-rotate"></i></div>
    <div id="resultsCount" class="results-count"></div>
    <div id="resultsContainer"></div>
  </div>

  <nav class="bottom-nav">
    <a href="/app/" class="nav-item active" data-tab="home">
      <i class="fas fa-home"></i><span>Inicio</span>
    </a>
    <a href="/app/reportes/" class="nav-item" data-tab="compare">
      <i class="fas fa-chart-line"></i><span>Comparar</span>
    </a>
  </nav>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Ir arriba">
    <i class="fas fa-arrow-up"></i>
  </button>
</div>

<script>
  const CONFIG = {
    dataSources: [
      { name: "J&A",          url: "/precio/data/ja2.csv" },
      { name: "CentralCell",  url: "/precio/data/centralcel.csv" },
      { name: "Osmobil",      url: "/precio/data/osmobil.csv" },
      { name: "CFH LP",       url: "/precio/data/CFH.csv" },
      { name: "BITE",         url: "/precio/data/boe.csv" },
      { name: "MR PANTALLA",  url: "/precio/data/mrpantalla.csv" }
    ],
    fetchTimeoutMs: 12000,
    cachePrefix: "drxiaomi_csv_",
    cacheMetaKey: "drxiaomi_cache_meta_v1",
    favoritesKey: "drxiaomi_favs_v1",
    recentKey: "drxiaomi_recent_v1",
   specsApiBase: "https://api-mobilespecs.azharimm.dev/v2"
  };

  let allData = [];
  let filteredData = [];
  let techMode = false;
  let currentTab = "home";
  let currentFilter = "all";
  let currentTheme = "light";
  let searchDebounceTimer = null;
  let lastSyncInfo = { time: 0, fromCache: true };
  let favorites = new Set();
  let recentSearches = [];

  const $ = id => document.getElementById(id);
  const container = $("resultsContainer");
  const searchInput = $("searchInput");
  const resultsCount = $("resultsCount");
  const suggestionsPanel = $("suggestionsPanel");
  const clearSearchBtn = $("clearSearchBtn");
  const searchLoaderIndicator = $("searchLoaderIndicator");
  const mainScrollContainer = $("mainScrollContainer");
  const appRoot = $("appRoot");
  const splash = $("splash");
  const ptrIndicator = $("ptrIndicator");
  const techModeBtn = $("techModeBtn");
  const scrollTopBtn = $("scrollTopBtn");

  function uid() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      try { return crypto.randomUUID(); } catch(e) {}
    }
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
  function escapeHtml(str) {
    if (str == null) return "";
    const d = document.createElement('div'); d.textContent = String(str); return d.innerHTML;
  }
  function normalizeText(str) {
    return String(str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
  }
  function getTokens(str) { return normalizeText(str).split(" ").filter(t => t.length > 0); }
  function haptic(ms = 15) {
    if (navigator.vibrate && navigator.userActivation?.hasBeenActive) {
      try { navigator.vibrate(ms); } catch(e) {}
    }
  }
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  function attachRipple(el) {
    if (!isTouch) return;
    el.addEventListener('pointerdown', (e) => {
      const rect = el.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top  = (e.clientY - rect.top  - size/2) + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);
    }, { passive: true });
  }
  function tiempoRelativo(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'hace unos segundos';
    if (min < 60) return `hace ${min} min`;
    const horas = Math.floor(min / 60);
    if (horas < 24) return `hace ${horas}h`;
    const dias = Math.floor(horas / 24);
    return `hace ${dias} día${dias > 1 ? 's' : ''}`;
  }

  // PARSERS
  function parsePrice(priceStr) {
    if (priceStr == null) return 0;
    let s = String(priceStr).trim().replace(/[^\d.,-]/g, '');
    if (!s) return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) {
      if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');
      else         s = s.replace(/,/g, '');
    } else if (lc > -1) {
      const parts = s.split(',');
      if (parts.length === 2 && parts[1].length <= 2) s = parts[0] + '.' + parts[1];
      else s = s.replace(/,/g, '');
    } else if (ld > -1) {
      const parts = s.split('.');
      if (parts.length > 2) s = parts.join('');
      else if (parts[1] && parts[1].length === 3) s = parts.join('');
    }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(n);
  }
  function cleanText(t) { return t ? String(t).trim().replace(/^"|"$/g, "") : ""; }
  function parseCSVLine(line) {
    const r = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') q = !q;
      else if ((c === "," || c === ";") && !q) { r.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    r.push(cur.trim());
    return r.map(f => f.replace(/^"|"$/g, ""));
  }
  function normalizeTipo(raw) {
    const t = String(raw || "").toUpperCase().trim();
    if (!t) return "LCD";
    if (/\b(ORIG|ORIGINAL|ORI|ORG|GENUINE|OEM|SERVICE\s*PACK|\bSP\b)\b/.test(t)) return "ORIG";
    if (/(AMOLED|OLED|SUPER\s*AMOLED|SUPERAMOLED|RETINA)/.test(t)) return "OLED";
    return "LCD";
  }
  function parseCSV(text, provider) {
    const lines = String(text || "").split(/\r?\n/).filter(l => l.trim() !== "");
    if (lines.length < 2) return [];
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i]);
      if (cols.length >= 6) {
        const marca = cleanText(cols[0]) || "N/A";
        const modelo = cleanText(cols[1]);
        const tipo = normalizeTipo(cleanText(cols[2]));
        const prov = cleanText(cols[3]) || provider;
        const compra = parsePrice(cols[4]);
        const venta = parsePrice(cols[5]);
        if (modelo && modelo.toLowerCase() !== "modelo") {
          data.push({ id: uid(), marca, modelo, tipo, proveedor: prov, compra, venta });
        }
      } else if (cols.length >= 5) {
        const marca = cleanText(cols[0]) || "N/A";
        const modelo = cleanText(cols[1]);
        const tipo = normalizeTipo(cleanText(cols[2]));
        const compra = parsePrice(cols[3]);
        const venta = parsePrice(cols[4]);
        if (modelo && modelo.toLowerCase() !== "modelo") {
          data.push({ id: uid(), marca, modelo, tipo, proveedor: provider, compra, venta });
        }
      }
    }
    return data;
  }

  // BÚSQUEDA
  function performPreciseSearch(data, term) {
    if (!term.trim()) return data;
    const tokens = getTokens(term);
    if (!tokens.length) return data;
    const results = [];
    for (const item of data) {
      const mn = normalizeText(item.modelo), mk = normalizeText(item.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      score += tokens.length * 5;
      results.push({ item, score });
    }
    results.sort((a, b) => b.score - a.score);
    return results.map(r => r.item);
  }
  function generateSuggestions(term) {
    if (!term.trim() || term.trim().length < 2) return [];
    const tokens = getTokens(term);
    const map = new Map();
    for (const p of allData) {
      const mn = normalizeText(p.modelo), mk = normalizeText(p.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      const key = `${p.marca}|${p.modelo}`;
      if (!map.has(key) || map.get(key).score < score) map.set(key, { ...p, score });
    }
    return Array.from(map.values()).sort((a, b) => b.score - a.score).slice(0, 8);
  }
  function highlight(text, term) {
    if (!term.trim()) return escapeHtml(text);
    const tokens = getTokens(term);
    let r = escapeHtml(text);
    tokens.forEach(t => {
      const rx = new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      r = r.replace(rx, '<span class="suggestion-highlight">$1</span>');
    });
    return r;
  }

  // FAVORITOS / RECIENTES
  function loadFavorites() {
    try { favorites = new Set(JSON.parse(localStorage.getItem(CONFIG.favoritesKey) || "[]")); }
    catch { favorites = new Set(); }
  }
  function saveFavorites() {
    try { localStorage.setItem(CONFIG.favoritesKey, JSON.stringify([...favorites])); } catch {}
  }
  function toggleFavorite(id) {
    if (favorites.has(id)) { favorites.delete(id); showToast("Quitado"); }
    else { favorites.add(id); showToast("Agregado"); haptic(30); }
    saveFavorites();
    const btn = document.querySelector(`.fav-btn[onclick*="${id}"]`);
    if (btn) {
      const isFav = favorites.has(id);
      btn.classList.toggle('active', isFav);
      btn.innerHTML = `<i class="fa${isFav ? 's' : 'r'} fa-star"></i>`;
    }
    if (currentFilter === 'FAV') render(true);
  }
  window.toggleFavorite = toggleFavorite;

  function loadRecent() {
    try { recentSearches = JSON.parse(localStorage.getItem(CONFIG.recentKey) || "[]"); }
    catch { recentSearches = []; }
  }
  function addRecent(term) {
    if (!term.trim()) return;
    recentSearches = [term, ...recentSearches.filter(t => t.toLowerCase() !== term.toLowerCase())].slice(0, 5);
    try { localStorage.setItem(CONFIG.recentKey, JSON.stringify(recentSearches)); } catch {}
  }

  // CACHE
  function readCachedCSV(name) {
    try {
      const raw = localStorage.getItem(CONFIG.cachePrefix + name);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return p && typeof p.text === 'string' ? p : null;
    } catch { return null; }
  }
  function writeCachedCSV(name, text, etag, lm) {
    try {
      localStorage.setItem(CONFIG.cachePrefix + name, JSON.stringify({ text, etag: etag||"", lastModified: lm||"", savedAt: Date.now() }));
    } catch (e) {
      console.warn('⚠️ localStorage lleno, limpiando caché antigua...');
      for (const s of CONFIG.dataSources) {
        try { localStorage.removeItem(CONFIG.cachePrefix + s.name); } catch {}
      }
      try {
        localStorage.setItem(CONFIG.cachePrefix + name, JSON.stringify({ text, etag: etag||"", lastModified: lm||"", savedAt: Date.now() }));
      } catch {}
    }
  }
  function readCacheMeta() {
    try { return JSON.parse(localStorage.getItem(CONFIG.cacheMetaKey) || "{}"); } catch { return {}; }
  }
  function writeCacheMeta(m) {
    try { localStorage.setItem(CONFIG.cacheMetaKey, JSON.stringify(m)); } catch {}
  }
  async function fetchTimeout(url, opts = {}, ms = CONFIG.fetchTimeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }

  async function loadAllData({ silent = false } = {}) {
    const cached = [];
    for (const s of CONFIG.dataSources) {
      const c = readCachedCSV(s.name);
      if (c) cached.push(...parseCSV(c.text, s.name));
    }
    if (cached.length) {
      allData = cached;
      lastSyncInfo = { time: Date.now(), fromCache: true };
      applyFiltersAndSearch(true);
    } else {
      showSkeleton();
    }
    if (!navigator.onLine) {
      if (!cached.length) showOfflineEmpty();
      else if (!silent) showToast("Sin conexión");
      return;
    }
    if (!silent && cached.length) showToast("Actualizando...");
    const meta = readCacheMeta();
    const fresh = [];
    let updated = false;
    for (const s of CONFIG.dataSources) {
      try {
        const headers = {};
        const prev = readCachedCSV(s.name);
        if (prev?.etag) headers["If-None-Match"] = prev.etag;
        if (prev?.lastModified) headers["If-Modified-Since"] = prev.lastModified;
        const res = await fetchTimeout(s.url, { headers, cache: "no-store" });
        if (res.status === 304 && prev) { fresh.push(...parseCSV(prev.text, s.name)); continue; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const etag = res.headers.get("ETag") || "";
        const lm = res.headers.get("Last-Modified") || "";
        if ((prev?.text || "") !== text) {
          writeCachedCSV(s.name, text, etag, lm);
          meta[s.name] = { savedAt: Date.now(), etag, lastModified: lm };
          updated = true;
        }
        const parsed = parseCSV(text, s.name);
        if (parsed.length === 0) console.warn(`⚠️ CSV ${s.name} devolvió 0 productos`);
        fresh.push(...parsed);
      } catch {
        const c = readCachedCSV(s.name);
        if (c) fresh.push(...parseCSV(c.text, s.name));
      }
    }
    writeCacheMeta(meta);
    if (fresh.length) {
      allData = fresh;
      lastSyncInfo = { time: Date.now(), fromCache: false };
      applyFiltersAndSearch(true);
    }
    if (updated && !silent) showToast("Actualizado");
  }

  const TIPO_PESO = { ORIG: 0, OLED: 1, LCD: 2 };
  const PAGE_SIZE = 30;
  let renderedCount = 0;

  function applyFiltersAndSearch(immediate = false) {
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    const run = () => {
      let data = [...allData];
      if (currentFilter === "FAV") data = data.filter(i => favorites.has(i.id));
      else if (currentFilter !== "all") data = data.filter(i => i.tipo === currentFilter);
      const term = searchInput.value.trim();
      if (term) {
        data = performPreciseSearch(data, term);
        clearSearchBtn.style.display = 'block';
      } else {
        clearSearchBtn.style.display = 'none';
      }
      data.sort((a, b) => {
        const pa = TIPO_PESO[a.tipo] ?? 3;
        const pb = TIPO_PESO[b.tipo] ?? 3;
        if (pa !== pb) return pa - pb;
        return a.venta - b.venta;
      });
      filteredData = data;
      updateResultsCount();
      render(true);
    };
    if (immediate) run();
    else {
      showSearchLoader();
      searchDebounceTimer = setTimeout(() => { run(); hideSearchLoader(); scrollToTop(); }, 200);
    }
  }
  function updateSuggestions() {
    const term = searchInput.value.trim();
    if (!term || term.length < 2) {
      if (recentSearches.length) {
        suggestionsPanel.innerHTML = `
          <div class="recent-header">Búsquedas recientes</div>
          ${recentSearches.map(r => `<div class="recent-item" data-term="${escapeHtml(r)}"><i class="fas fa-history"></i><span>${escapeHtml(r)}</span></div>`).join('')}
        `;
        suggestionsPanel.querySelectorAll('.recent-item').forEach(el => {
          el.addEventListener('click', () => {
            searchInput.value = el.dataset.term;
            suggestionsPanel.classList.remove('active');
            applyFiltersAndSearch();
          });
        });
        suggestionsPanel.classList.add('active');
      } else suggestionsPanel.classList.remove('active');
      return;
    }
    const sug = generateSuggestions(term);
    if (!sug.length) { suggestionsPanel.classList.remove('active'); return; }
    suggestionsPanel.innerHTML = `
      <div class="suggestion-header">COINCIDENCIAS (${sug.length})</div>
      ${sug.map(s => `
        <div class="suggestion-item" data-modelo="${escapeHtml(s.modelo)}">
          <i class="fas fa-mobile-alt"></i>
          <div style="flex:1;min-width:0;">
            <div>${highlight(s.modelo, term)}</div>
            <div style="font-size:10px;color:var(--text-tertiary);">${escapeHtml(s.marca)} · ${s.venta.toLocaleString()} Bs</div>
          </div>
          <span class="suggestion-price-tag">${s.tipo}</span>
        </div>
      `).join('')}
    `;
    suggestionsPanel.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        searchInput.value = el.dataset.modelo;
        addRecent(el.dataset.modelo);
        suggestionsPanel.classList.remove('active');
        applyFiltersAndSearch();
        haptic(20);
      });
    });
    suggestionsPanel.classList.add('active');
  }
  function updateResultsCount() {
    if (!resultsCount) return;
    const n = filteredData.length;
    const tag = lastSyncInfo.fromCache
      ? `<span class="offline-tag on"><span class="dot"></span>${tiempoRelativo(lastSyncInfo.time)}</span>`
      : `<span class="offline-tag"><span class="dot"></span>${tiempoRelativo(lastSyncInfo.time)}</span>`;
    resultsCount.innerHTML = `<span>${n} producto${n !== 1 ? 's' : ''}</span>${tag}`;
  }
  function render(reset = true) {
    if (!container) return;

    if (reset) {
      renderedCount = 0;
      if (!filteredData.length) {
        const term = searchInput.value.trim();
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <p style="font-weight:600;margin-bottom:6px;">Sin resultados</p>
            ${term ? `<p style="font-size:12px;">No se encontró "${escapeHtml(term)}"</p>` : ''}
            ${term ? `<a class="btn-google" href="https://www.google.com/search?q=${encodeURIComponent('pantalla ' + term)}&tbm=isch" target="_blank" rel="noopener">
              <i class="fab fa-google"></i> Buscar en Google
            </a>` : ''}
          </div>
        `;
        return;
      }
      container.innerHTML = `<div class="cards-view" id="cardsView"></div>`;
    }

    const view = document.getElementById("cardsView");
    if (!view) return;

    const slice = filteredData.slice(renderedCount, renderedCount + PAGE_SIZE);
    const html = slice.map((item, idx) => {
      const i = renderedCount + idx;
      const isOrig = item.tipo === 'ORIG';
      const isOled = item.tipo === 'OLED';
      const typeClass = isOrig ? 'orig' : isOled ? 'oled' : '';
      const animStyle = i < 20
        ? `animation-delay:${i * 12}ms`
        : `animation:none;opacity:1;transform:none`;
      return `
      <div class="product-card ${isOrig ? 'is-orig' : ''}" style="${animStyle}">
        <div class="card-header">
          <div style="min-width:0;flex:1;">
            <div class="card-brand">${escapeHtml(item.marca)}</div>
            <div class="card-model">${escapeHtml(item.modelo)}</div>
          </div>
          <button class="fav-btn ${favorites.has(item.id) ? 'active' : ''}" onclick="window.toggleFavorite('${item.id}')" aria-label="Favorito">
            <i class="fa${favorites.has(item.id) ? 's' : 'r'} fa-star"></i>
          </button>
        </div>
        <div class="card-specs">
          <span class="card-type ${typeClass}">${item.tipo}</span>
          ${techMode ? `<span class="supplier-badge">${escapeHtml(item.proveedor)}</span><span class="price-badge">Compra: ${item.compra.toLocaleString()}</span>` : ''}
        </div>
        <div class="card-price-row">
          <span class="card-price" onclick="window.copyPrice('${item.id}')">${item.venta.toLocaleString()} Bs</span>
          <div class="card-actions-group">
            <button class="image-btn" onclick="window.openGoogle('${item.id}')"><i class="fab fa-google"></i> LCD</button>
            <button class="image-btn" onclick="window.openFicha('${item.id}')"><i class="fas fa-info-circle"></i> Ficha</button>
            <button class="whatsapp-btn" onclick="window.shareWA('${item.id}')"><i class="fab fa-whatsapp"></i></button>
          </div>
        </div>
      </div>`;
    }).join('');

    view.insertAdjacentHTML('beforeend', html);
    renderedCount += slice.length;

    if (!reset && slice.length > 0) haptic(6);
  }
  function scrollToTop() { mainScrollContainer?.scrollTo({ top: 0, behavior: 'smooth' }); }
  function showSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "inline-flex"; }
  function hideSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "none"; }

  window.copyPrice = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return showToast("No encontrado");
    const msg = `${p.marca} ${p.modelo}\nPrecio Pantalla: ${p.venta.toLocaleString()} Bs\nINCLUYE INSTALACIÓN`;
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = msg; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast("Copiado"); } catch { showToast("Error"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(msg).then(() => { showToast("Precio copiado"); haptic(30); }).catch(fallback);
    } else fallback();
  };
  window.shareWA = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    const msg = `*${p.marca} ${p.modelo}*\nPrecio Pantalla: ${p.venta.toLocaleString()} Bs\nINCLUYE INSTALACIÓN`;
    if (navigator.share) {
      navigator.share({ text: msg }).catch(() => {});
    } else {
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
    }
    haptic(30);
  };
  window.openGoogle = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    const q = `LCD ${p.modelo} ${p.marca} pantalla`;
    window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=isch`, "_blank", "width=450,height=650");
    haptic(20);
  };

  // ============================================================
  // 🧠 FICHA TÉCNICA (AHORA CON GEMINI AI)
  // ============================================================
  window.openFicha = async function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return showToast("Producto no encontrado");

    haptic(20);

    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalSpecs';
    modal.innerHTML = `
      <div class="modal-content">
        <div class="sheet-handle"></div>
        <h3 style="display:flex;align-items:center;gap:8px;">
          <i class="fas fa-info-circle" style="color:var(--xiaomi-orange);"></i>
          Ficha Técnica (IA)
        </h3>
        <div id="specsContent" class="spec-loading">
          <div class="search-loader" style="margin:0 auto 10px;"></div>
          Generando ficha con IA para "${escapeHtml(p.modelo)}"...
        </div>
        <div class="modal-buttons" style="margin-top:16px;">
          <button onclick="window.cerrarFicha()" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);">Cerrar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    try {
      // 🔥 TU LLAVE API AQUÍ
      const GEMINI_API_KEY = "AQ.Ab8RN6LGWz6t8ZIMcO8zW1eT7xW_I8YWEB2TEyeVuNQzJndZ6g"; 
      
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;

      const prompt = `Eres un experto técnico en reparación de celulares en Bolivia. Genera una ficha técnica breve y útil para un técnico sobre el modelo: ${p.marca} ${p.modelo}. 
      Incluye: Pantalla, Batería, Procesador, RAM/Almacenamiento, y un consejo de reparación. 
      Usa un formato de lista limpia, sin markdown complejo (solo texto y saltos de línea). Si no estás seguro de un dato, indícalo como "No confirmado".`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message || "Error en la API de Gemini");
      }
      
      if (!data.candidates || !data.candidates[0].content.parts[0].text) {
        throw new Error("La IA no devolvió respuesta.");
      }

      const textoIA = data.candidates[0].content.parts[0].text;
      const textoHTML = textoIA.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      const content = document.getElementById('specsContent');
      if (content) {
        content.innerHTML = `<div style="font-size:13px; line-height:1.6; color:var(--text-secondary); text-align:left;">${textoHTML}</div>`;
        content.classList.remove('spec-loading');
      }

      haptic(15);

    } catch (err) {
      console.error('Error con Gemini:', err);
      const content = document.getElementById('specsContent');
      if (content) {
        content.innerHTML = `
          <div style="text-align:center;padding:30px;color:var(--text-tertiary);">
            <i class="fas fa-exclamation-triangle" style="font-size:32px;opacity:0.3;margin-bottom:10px;display:block;"></i>
            <p>Error al generar la ficha con IA</p>
            <p style="font-size:11px; color:#EF4444;">${err.message}</p>
          </div>
        `;
      }
    }
  };

  window.cerrarFicha = function() {
    haptic(10);
    document.getElementById('modalSpecs')?.remove();
  };

  function showCompareModal() {
    const data = filteredData.slice(0, 4);
    if (!data.length) { showToast("Nada para comparar"); return; }
    let html = '<div style="display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;">';
    data.forEach(p => {
      const accent = p.tipo === 'ORIG' ? 'var(--gold-2)' : 'var(--xiaomi-orange)';
      html += `<div style="background:var(--bg-secondary);padding:12px;border-radius:6px;border-left:3px solid ${accent};">
        <div style="font-size:11px;color:${accent};font-weight:700;">${escapeHtml(p.marca)}</div>
        <div style="font-size:14px;font-weight:600;margin:3px 0;">${escapeHtml(p.modelo)}</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;">${p.tipo}${techMode ? ' · ' + escapeHtml(p.proveedor) : ''}</div>
        <div style="font-size:18px;font-weight:700;">${p.venta.toLocaleString()} Bs</div>
      </div>`;
    });
    html += '</div><div class="modal-buttons" style="margin-top:14px;"><button onclick="window.closeCompare()" style="flex:1;padding:12px;background:var(--xiaomi-orange);border:none;border-radius:6px;color:white;font-weight:600;cursor:pointer;">Cerrar</button></div>';
    document.getElementById("compareModal")?.remove();
    document.body.insertAdjacentHTML("beforeend",
      `<div id="compareModal" class="modal active"><div class="modal-content"><div class="sheet-handle"></div><h3>Comparar</h3>${html}</div></div>`);
  }
  window.closeCompare = () => document.getElementById("compareModal")?.remove();

  function abrirModalTecnico() {
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalTecnico';
    modal.innerHTML = `
      <div class="modal-content" style="text-align: center;">
        <div class="sheet-handle"></div>
        <div style="font-size: 42px; margin-bottom: 10px;"><i class="fas fa-microchip" style="color:var(--xiaomi-orange);"></i></div>
        <h3 style="justify-content: center; margin-bottom: 10px; display: flex; font-size: 16px;">Modo Técnico</h3>
        <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; line-height: 1.5;">
          ¿Confirmas que eres el <strong style="color: var(--xiaomi-orange);">técnico de DR. XIAOMI</strong>?
        </p>
        <p style="color: var(--text-tertiary); font-size: 11px; margin-bottom: 20px; line-height: 1.5;">
          Se mostrarán los precios de compra y proveedores.
        </p>
        <div class="modal-buttons">
          <button onclick="window.cerrarModalTecnico()" style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border);">
            Cancelar
          </button>
          <button onclick="window.confirmarModoTecnico()" style="background: var(--xiaomi-orange); color: white;">
            <i class="fas fa-check"></i> Sí
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    haptic(20);
  }
  window.cerrarModalTecnico = function() {
    haptic(10);
    document.getElementById('modalTecnico')?.remove();
  };
  window.confirmarModoTecnico = function() {
    haptic([20, 50, 20]);
    document.getElementById('modalTecnico')?.remove();
    techMode = true;
    techModeBtn.classList.add('tech-active');
    showToast("Modo técnico ON");
    render(true);
  };

  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.setAttribute("data-theme", t);
    const icon = document.querySelector("#themeToggle i");
    if (icon) icon.className = t === "dark" ? "fas fa-sun" : "fas fa-moon";
    const meta = document.getElementById("metaThemeColor");
    if (meta) meta.setAttribute("content", t === "dark" ? "#0A0A0A" : "#FF6900");
    localStorage.setItem("theme", t);
  }
  function toggleTheme() { applyTheme(currentTheme === "light" ? "dark" : "light"); haptic(15); }
  function loadTheme() {
    const saved = localStorage.getItem("theme");
    if (saved) return applyTheme(saved);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? "dark" : "light");
  }

  function setupPullToRefresh() {
    let startY = 0, pulling = false, triggered = false;
    const threshold = 80;
    mainScrollContainer.addEventListener('touchstart', (e) => {
      if (mainScrollContainer.scrollTop <= 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
      else pulling = false;
    }, { passive: true });
    mainScrollContainer.addEventListener('touchmove', (e) => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 10 && mainScrollContainer.scrollTop <= 0) {
        const clamped = Math.min(dy, 120);
        ptrIndicator.style.transform = `translateX(-50%) translateY(${clamped - 20}px)`;
        ptrIndicator.classList.add('visible');
        if (clamped >= threshold && !triggered) {
          triggered = true;
          ptrIndicator.classList.add('spinning');
          haptic(20);
        }
      }
    }, { passive: true });
    mainScrollContainer.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;
      if (ptrIndicator.classList.contains('spinning')) {
        await loadAllData({ silent: false });
      }
      ptrIndicator.classList.remove('visible', 'spinning');
      ptrIndicator.style.transform = 'translateX(-50%) translateY(-60px)';
    }, { passive: true });
  }

  function setupInfiniteScroll() {
    let ticking = false;
    mainScrollContainer.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;

        if (mainScrollContainer.scrollTop > 600) {
          scrollTopBtn.classList.add('show');
        } else {
          scrollTopBtn.classList.remove('show');
        }

        if (renderedCount >= filteredData.length) return;
        const { scrollTop, scrollHeight, clientHeight } = mainScrollContainer;
        if (scrollTop + clientHeight >= scrollHeight - 500) {
          render(false);
        }
      });
    }, { passive: true });

    scrollTopBtn.addEventListener('click', () => {
      haptic(15);
      scrollToTop();
    });
  }

  function showSkeleton() {
    if (!container) return;
    container.innerHTML = `<div class="cards-view">${Array(6).fill().map(() => `<div class="product-card" style="height:100px;animation:none;opacity:1;transform:none;"><div style="background:linear-gradient(90deg, var(--border) 25%, transparent 50%, var(--border) 75%); background-size:200% 100%; animation:loading 1.5s infinite; border-radius:6px; height:100%;"></div></div>`).join('')}</div>`;
    if (!document.getElementById("skeletonKeyframes")) {
      const s = document.createElement("style");
      s.id = "skeletonKeyframes";
      s.textContent = `@keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }`;
      document.head.appendChild(s);
    }
  }
  function showOfflineEmpty() {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-wifi"></i><p style="font-weight:600;margin-bottom:6px;">Sin conexión</p><p style="font-size:12px;">Conéctate una vez para descargar el catálogo.</p><button onclick="location.reload()" style="margin-top:14px;padding:10px 20px;background:var(--xiaomi-orange);border:none;border-radius:6px;color:white;font-weight:600;cursor:pointer;font-family:inherit;font-size:12px;">Reintentar</button></div>`;
  }

  function setupEventListeners() {
    searchInput.addEventListener("input", () => { updateSuggestions(); applyFiltersAndSearch(); });
    searchInput.addEventListener("focus", () => { if (!searchInput.value && recentSearches.length) updateSuggestions(); });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === 'Enter') { addRecent(searchInput.value); suggestionsPanel.classList.remove('active'); applyFiltersAndSearch(); }
      if (e.key === 'Escape') suggestionsPanel.classList.remove('active');
    });
    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = ""; suggestionsPanel.classList.remove('active');
      clearSearchBtn.style.display = 'none'; applyFiltersAndSearch(); searchInput.focus();
    });

    $("themeToggle").addEventListener("click", toggleTheme);

    techModeBtn.addEventListener("click", () => {
      haptic(30);
      if (techMode) {
        techMode = false;
        techModeBtn.classList.remove('tech-active');
        showToast("Modo técnico OFF");
        render(true);
        return;
      }
      abrirModalTecnico();
    });

    $("receiptBtn").addEventListener("click", () => {
      haptic(15);
      window.location.href = '/cliente/';
    });

    $("backBtn").addEventListener("click", () => {
      haptic(15);
      window.location.href = '/app/';
    });

    document.querySelectorAll(".filter-chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active"); currentFilter = c.dataset.filter;
      applyFiltersAndSearch(); haptic(15);
    }));

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) suggestionsPanel.classList.remove('active');
    });

    window.addEventListener("online", () => { showToast("Conectado"); loadAllData({ silent: true }); });
    window.addEventListener("offline", () => {
      lastSyncInfo.fromCache = true; updateResultsCount();
      showToast("Offline");
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && navigator.onLine) loadAllData({ silent: true });
    });

    document.querySelectorAll(".icon-btn, .filter-chip, .nav-item, .image-btn, .whatsapp-btn").forEach(attachRipple);

    setupPullToRefresh();
    setupInfiniteScroll();
  }

  async function init() {
    loadTheme();
    loadFavorites();
    loadRecent();
    setupEventListeners();

    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 400);
    }, 600);

    appRoot.style.opacity = "1";
    loadAllData({ silent: true });
  }

  init();
</script>
</body>
</html>
