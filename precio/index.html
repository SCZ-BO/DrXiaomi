<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E" id="metaThemeColor">
  <meta name="description" content="Catálogo de pantallas y repuestos">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DR. XIAOMI | Catálogo</title>

  <script>
    (function() {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (!sesion || !sesion.rol) window.location.replace('/app/');
      } catch (e) { window.location.replace('/app/'); }
    })();
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ===================== TOKENS PANEL /APP ===================== */
    :root {
      --brand: #FF6900;
      --brand-hover: #E55A00;
      --brand-light: rgba(255, 105, 0, 0.15);
      --brand-glow: rgba(255, 105, 0, 0.35);
      
      --gold-1: #FFD700;
      --gold-2: #FFA500;
      --gold-glow: rgba(255, 200, 0, 0.35);

      --bg-main: #0A0A0A;
      --bg-card: #161616;
      --bg-elev: #242424;
      
      --text-main: #F5F5F5;
      --text-mute: #888888;
      --border: #2C2C2C;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;
      
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
      
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-h: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior-y: none; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main); color: var(--text-main);
      overflow: hidden; width: 100%; height: 100dvh;
      -webkit-font-smoothing: antialiased; user-select: none;
      letter-spacing: -0.01em;
    }

    .app {
      max-width: 100%; height: 100dvh; margin: 0 auto;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg-main); position: relative;
    }

    /* ============ HEADER ============ */
    .header {
      background: var(--bg-main);
      padding: calc(12px + var(--safe-top)) 16px 10px;
      flex-shrink: 0; position: relative; z-index: 50;
      border-bottom: 1px solid var(--border);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: var(--radius-sm); overflow: hidden;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: var(--bg-elev); border: 1px solid var(--border);
    }
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.4px; color: var(--text-main); }
    .logo span { font-weight: 500; color: var(--text-mute); font-size: 13px; }

    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: 50%;
      color: var(--text-main); cursor: pointer; font-size: 15px;
      transition: 0.2s; display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; position: relative;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.tech-active { background: var(--brand) !important; color: white !important; border-color: var(--brand); box-shadow: 0 0 12px var(--brand-glow); }

    /* ============ SEARCH ============ */
    .search-wrapper { position: relative; }
    .search-container { position: relative; }
    .search-input {
      width: 100%; padding: 12px 80px 12px 38px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--text-main);
      font-size: 14px; font-weight: 500; transition: 0.2s;
      font-family: inherit;
    }
    .search-input:focus { outline: none; border-color: var(--brand); background: var(--bg-card); }
    .search-input::placeholder { color: var(--text-mute); font-weight: 400; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-mute); font-size: 14px; pointer-events: none; }
    .search-actions { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; align-items: center; }
    .search-actions button { background: transparent; border: none; color: var(--text-mute); cursor: pointer; font-size: 12px; padding: 6px 8px; border-radius: 50%; transition: 0.15s; }
    .search-actions button:hover { color: var(--text-main); }
    .search-loader { width: 16px; height: 16px; border: 2px solid var(--border); border-top: 2px solid var(--brand); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 4px; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ============ SUGGESTIONS ============ */
    .suggestions-panel {
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg); max-height: min(320px, 44vh); overflow-y: auto;
      display: none; z-index: 60;
    }
    .suggestions-panel.active { display: block; animation: panelIn 0.18s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .suggestion-header {
      padding: 12px 16px; font-size: 10px; font-weight: 700; color: var(--text-mute);
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border); background: var(--bg-card);
      position: sticky; top: 0;
    }
    .suggestion-item {
      padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      transition: 0.15s; font-size: 14px; font-weight: 500; color: var(--text-main);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: var(--bg-elev); }
    .suggestion-item i { color: var(--text-mute); font-size: 13px; width: 18px; }
    .highlight-text { color: var(--brand); font-weight: 800; }
    .suggestion-price-tag { font-size: 10px; color: var(--text-mute); background: var(--bg-elev); padding: 3px 8px; border-radius: var(--radius-pill); font-weight: 700; }
    .recent-header { padding: 10px 16px 4px; font-size: 10px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-item { padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-mute); transition: 0.15s; }
    .recent-item:active { background: var(--bg-elev); }

    /* ============ FILTROS ============ */
    .quick-filters {
      padding: 10px 16px 12px; display: flex; gap: 6px; overflow-x: auto;
      scrollbar-width: none; background: var(--bg-main);
      border-bottom: 1px solid var(--border);
    }
    .quick-filters::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 7px 14px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 600; background: var(--bg-elev);
      color: var(--text-main); border: 1px solid var(--border);
      cursor: pointer; white-space: nowrap;
      transition: 0.2s;
    }
    .filter-chip:active { transform: scale(0.96); }
    .filter-chip.active { background: var(--brand); color: white; border-color: var(--brand); box-shadow: 0 4px 14px var(--brand-glow); }
    .filter-chip[data-filter="ORIG"].active { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #4A2800; border-color: var(--gold-2); box-shadow: 0 4px 14px var(--gold-glow); }

    /* ============ MAIN ============ */
    .main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
    .cards-view { display: flex; flex-direction: column; gap: 12px; padding: 16px; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px); width: 100%; box-sizing: border-box; }

    /* ============ PRODUCT CARD ============ */
    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px; position: relative; width: 100%; box-sizing: border-box;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background 0.2s;
      opacity: 0; transform: translateY(6px);
      animation: cardIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
      content-visibility: auto; contain-intrinsic-size: 0 110px;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .product-card::before {
      content: ''; position: absolute; left: 0; top: 16px; bottom: 16px;
      width: 3px; background: var(--brand); border-radius: 0 3px 3px 0;
    }
    .product-card.is-orig::before { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
    .product-card:active { transform: scale(0.98); background: var(--bg-elev); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; padding-left: 8px; gap: 10px; }
    .card-brand { font-size: 10px; font-weight: 800; color: var(--brand); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; }
    .product-card.is-orig .card-brand { color: #B8860B; }
    [data-theme="dark"] .product-card.is-orig .card-brand { color: var(--gold-1); }
    .card-model { font-size: 16px; font-weight: 700; color: var(--text-main); letter-spacing: -0.2px; word-break: break-word; line-height: 1.3; }

    .fav-btn { background: transparent; border: none; color: var(--text-mute); font-size: 18px; cursor: pointer; padding: 2px; transition: 0.15s; flex-shrink: 0; opacity: 0.8; }
    .fav-btn.active { color: #FFB800; opacity: 1; }
    .fav-btn:active { transform: scale(0.85); }

    .card-specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; padding-left: 8px; }
    .card-type { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; background: var(--bg-elev); color: var(--text-mute); }
    .card-type.oled { background: rgba(255,105,0,0.1); color: var(--brand); }
    .card-type.orig { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #4A2800; font-weight: 800; }
    .card-type.orig::before { content: '👑 '; font-size: 9px; }

    .supplier-badge { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; background: rgba(255,105,0,0.08); color: var(--brand); }
    .price-badge { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 10px; font-weight: 700; background: rgba(16,185,129,0.08); color: #10B981; }

    .card-price-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); padding-left: 8px; gap: 10px; flex-wrap: wrap; }
    .card-price { font-size: 22px; font-weight: 800; color: var(--text-main); cursor: pointer; transition: 0.15s; letter-spacing: -0.5px; padding: 4px 8px; border-radius: var(--radius-sm); margin-left: -8px; }
    .card-price:active { color: var(--brand); background: rgba(255,105,0,0.1); }
    
    .card-actions-group { display: flex; gap: 6px; }
    .image-btn, .whatsapp-btn, .edit-btn {
      border: none; padding: 8px 12px; border-radius: var(--radius-sm);
      font-size: 11px; font-weight: 700; cursor: pointer;
      transition: 0.15s; display: flex; align-items: center; gap: 5px; font-family: inherit;
    }
    .image-btn:active, .whatsapp-btn:active, .edit-btn:active { transform: scale(0.92); }
    .image-btn { background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border); }
    .whatsapp-btn { background: #25D366; color: white; }
    .edit-btn { background: rgba(59, 130, 246, 0.15); color: #3B82F6; border: 1px solid rgba(59, 130, 246, 0.3); }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav-wrapper {
      position: fixed; bottom: calc(16px + var(--safe-bottom)); left: 0; right: 0;
      display: flex; justify-content: center; pointer-events: none; z-index: 100;
    }
    .bottom-nav {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      display: flex; padding: 8px 16px; gap: 20px;
      box-shadow: var(--shadow-lg); pointer-events: auto;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 4px 12px; border: none; background: transparent;
      color: var(--text-mute); cursor: pointer; font-size: 10px; font-weight: 600;
      text-decoration: none; transition: 0.15s;
    }
    .nav-item.active { color: var(--brand); }
    .nav-item i { font-size: 18px; transition: transform 0.15s; }
    .nav-item.active i { transform: scale(1.1); filter: drop-shadow(0 0 6px var(--brand-glow)); }
    .nav-item:active i { transform: scale(0.85); }

    /* ============ MODAL ============ */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
    .modal.active { display: flex; animation: fade 0.2s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 16px 20px calc(20px + var(--safe-bottom));
      width: 100%; max-width: 540px;
      border: 1px solid var(--border); border-bottom: none;
      animation: sheetUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1); position: relative;
      box-shadow: var(--shadow-lg);
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: var(--radius-pill); margin: 0 auto 16px; }
    .modal-content h3 { margin-bottom: 16px; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 20px; }
    .modal-buttons button {
      flex: 1; padding: 14px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-weight: 700; font-size: 14px;
      transition: 0.15s; font-family: inherit;
    }
    .modal-buttons button:active { transform: scale(0.97); }
    .modal-buttons button:last-child { background: var(--brand); color: white; box-shadow: 0 4px 14px var(--brand-glow); }

    /* Inputs del modal de edición */
    .edit-input {
      width: 100%; padding: 14px; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-main); font-size: 16px; margin-top: 6px;
      font-family: inherit; font-weight: 700;
    }
    .edit-input:focus { outline: none; border-color: var(--brand); }
    .edit-label { font-size: 11px; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ============ TOAST ============ */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 30px);
      left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 12px 20px; border-radius: var(--radius-pill);
      color: var(--text-main); font-size: 13px; font-weight: 600;
      z-index: 150; animation: toastIn 0.25s var(--ease); 
      box-shadow: var(--shadow-lg); max-width: 90%; text-align: center;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ============ OTROS ============ */
    .results-count { padding: 12px 18px 6px; font-size: 11px; font-weight: 600; color: var(--text-mute); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .results-count .offline-tag { font-size: 9px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-sm); background: var(--bg-elev); color: var(--text-mute); display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); }
    .results-count .offline-tag.on { color: #FF9500; border-color: #FF9500; }
    .results-count .offline-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-mute); }
    .empty-state i { font-size: 48px; opacity: 0.15; margin-bottom: 14px; }
    .empty-state p { font-size: 13px; }
    .empty-state .btn-google { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; padding: 12px 20px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: none; transition: 0.15s; }
    .empty-state .btn-google:active { transform: scale(0.95); }

    .main-content::-webkit-scrollbar { width: 0; }
    
    .splash { position: fixed; inset: 0; background: var(--bg-main); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .splash.hidden { opacity: 0; pointer-events: none; }
    .loader-logo-container { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--brand); border-bottom-color: var(--brand); animation: spin 1.2s linear infinite; }
    .loader-logo-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: var(--bg-elev); border: 2px solid var(--border); }
    .loader-text { font-size: 13px; font-weight: 600; color: var(--text-mute); letter-spacing: 0.4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    .scroll-top-btn {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 30px); right: 16px;
      width: 42px; height: 42px; border-radius: 50%; background: var(--bg-card);
      color: var(--brand); border: 1px solid var(--border); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; z-index: 90;
      opacity: 0; transform: translateY(20px) scale(0.8); pointer-events: none;
      transition: 0.25s; box-shadow: var(--shadow-sm);
    }
    .scroll-top-btn.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .scroll-top-btn:active { transform: scale(0.9); }

    #modalSpecs .modal-content { max-height: 85vh; overflow-y: auto; }
    .spec-loading { text-align: center; padding: 30px; color: var(--text-mute); font-size: 13px; }

    @media (min-width: 640px) {
      .app { max-width: 500px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
      .modal { align-items: center; padding: 20px; }
      .modal-content { border-radius: var(--radius-lg); border-bottom: 1px solid var(--border); }
      .sheet-handle { display: none; }
    }
  </style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="loader-logo-container">
    <div class="loader-ring"></div>
    <img src="/imagenes/web-app-manifest-192x192.png" alt="Cargando..." class="loader-logo-img" onerror="this.src='/imagenes/favicon-96x96.png'">
  </div>
  <div class="loader-text">Conectando a base de datos...</div>
</div>

<div class="app" id="appRoot" style="opacity:0;">
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">
          <img src="/imagenes/web-app-manifest-192x192.png" alt="DR. Xiaomi"
               onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-tools&quot; style=&quot;color:var(--brand); font-size:16px;&quot;></i>';">
        </div>
        <h1>DR XIAOMI <span>Catálogo</span></h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="techModeBtn" title="Modo Técnico" aria-label="Modo técnico">
          <i class="fas fa-microchip"></i>
        </button>
        <button class="icon-btn" id="receiptBtn" title="Nuevo Recibo" aria-label="Nuevo Recibo">
          <i class="fas fa-receipt"></i>
        </button>
        <button class="icon-btn" id="backBtn" title="Volver al panel" aria-label="Volver al panel">
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
    </div>
    <div class="search-wrapper">
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar modelo... Ej: Redmi Note 10" autocomplete="off" aria-label="Buscar modelo">
        <div class="search-actions" id="searchActions">
          <div id="searchLoaderIndicator" style="display: none;"><div class="search-loader"></div></div>
          <button id="clearSearchBtn" style="display: none;" aria-label="Limpiar búsqueda"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="suggestions-panel" id="suggestionsPanel"></div>
    </div>
  </header>

  <div class="quick-filters" id="quickFilters">
    <button class="filter-chip active" data-filter="all">Todos</button>
    <button class="filter-chip" data-filter="ORIG">ORIG</button>
    <button class="filter-chip" data-filter="OLED">OLED</button>
    <button class="filter-chip" data-filter="LCD">LCD</button>
    <button class="filter-chip" data-filter="FAV">⭐ Favoritos</button>
  </div>

  <div class="main-content" id="mainScrollContainer">
    <div id="resultsCount" class="results-count"></div>
    <div id="resultsContainer"></div>
  </div>

  <div class="bottom-nav-wrapper">
    <nav class="bottom-nav">
      <a href="/app/" class="nav-item active" data-tab="home">
        <i class="fas fa-home"></i><span>Inicio</span>
      </a>
      <a href="/app/reportes/" class="nav-item" data-tab="compare">
        <i class="fas fa-chart-line"></i><span>Comparar</span>
      </a>
    </nav>
  </div>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Ir arriba">
    <i class="fas fa-arrow-up"></i>
  </button>
</div>

<script type="module">
  // 🔥 IMPORTAMOS FIREBASE
  import { db } from '/js/firebase.js';
  import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  let sesion = null;
  try { sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null'); } catch(e) {}
  const isAdmin = sesion && sesion.rol === 'admin';

  let allData = [];
  let filteredData = [];
  let techMode = false;
  let currentFilter = "all";
  let favorites = new Set();
  let recentSearches = [];
  let searchDebounceTimer = null;
  let unsubscribe = null;

  const $ = id => document.getElementById(id);
  const container = $("resultsContainer");
  const searchInput = $("searchInput");
  const resultsCount = $("resultsCount");
  const suggestionsPanel = $("suggestionsPanel");
  const clearSearchBtn = $("clearSearchBtn");
  const searchLoaderIndicator = $("searchLoaderIndicator");
  const mainScrollContainer = $("mainScrollContainer");
  const appRoot = $("appRoot");
  const splash = $("splash");
  const techModeBtn = $("techModeBtn");
  const scrollTopBtn = $("scrollTopBtn");

  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
  function escapeHtml(str) {
    if (str == null) return "";
    const d = document.createElement('div'); d.textContent = String(str); return d.innerHTML;
  }
  function normalizeText(str) {
    return String(str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
  }
  function getTokens(str) { return normalizeText(str).split(" ").filter(t => t.length > 0); }
  function haptic(ms = 15) {
    if (navigator.vibrate && navigator.userActivation?.hasBeenActive) {
      try { navigator.vibrate(ms); } catch(e) {}
    }
  }

  // ============ FIREBASE CONNECTION ============
  function initFirebase() {
    // 🔥 ESCUCHAMOS EN TIEMPO REAL LA COLECCIÓN 'precios'
    unsubscribe = onSnapshot(collection(db, "precios"), (snapshot) => {
      allData = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.activo !== false) { // Solo mostramos los activos
          allData.push({ id: doc.id, ...data });
        }
      });
      
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 400);
      appRoot.style.opacity = "1";
      
      applyFiltersAndSearch(true);
    }, (error) => {
      console.error("Error Firebase:", error);
      showToast("Error de conexión");
      splash.classList.add('hidden');
    });
  }

  function performPreciseSearch(data, term) {
    if (!term.trim()) return data;
    const tokens = getTokens(term);
    if (!tokens.length) return data;
    const results = [];
    for (const item of data) {
      const mn = normalizeText(item.modelo), mk = normalizeText(item.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      score += tokens.length * 5;
      results.push({ item, score });
    }
    results.sort((a, b) => b.score - a.score);
    return results.map(r => r.item);
  }
  
  function generateSuggestions(term) {
    if (!term.trim() || term.trim().length < 2) return [];
    const tokens = getTokens(term);
    const map = new Map();
    for (const p of allData) {
      const mn = normalizeText(p.modelo), mk = normalizeText(p.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      const key = `${p.marca}|${p.modelo}`;
      if (!map.has(key) || map.get(key).score < score) map.set(key, { ...p, score });
    }
    return Array.from(map.values()).sort((a, b) => b.score - a.score).slice(0, 8);
  }

  function highlight(text, term) {
    if (!term.trim()) return escapeHtml(text);
    const tokens = getTokens(term);
    let r = escapeHtml(text);
    tokens.forEach(t => {
      const safeT = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const rx = new RegExp(`(${safeT})`, 'gi');
      r = r.replace(rx, '<span class="highlight-text">$1</span>');
    });
    return r;
  }

  function loadFavorites() {
    try { favorites = new Set(JSON.parse(localStorage.getItem("drxiaomi_favs_v1") || "[]")); }
    catch { favorites = new Set(); }
  }
  function saveFavorites() {
    try { localStorage.setItem("drxiaomi_favs_v1", JSON.stringify([...favorites])); } catch {}
  }
  function toggleFavorite(id) {
    if (favorites.has(id)) { favorites.delete(id); showToast("Quitado"); }
    else { favorites.add(id); showToast("Agregado"); haptic(30); }
    saveFavorites();
    const btn = document.querySelector(`.fav-btn[onclick*="${id}"]`);
    if (btn) {
      const isFav = favorites.has(id);
      btn.classList.toggle('active', isFav);
      btn.innerHTML = `<i class="fa${isFav ? 's' : 'r'} fa-star"></i>`;
    }
    if (currentFilter === 'FAV') render(true);
  }
  window.toggleFavorite = toggleFavorite;

  function loadRecent() {
    try { recentSearches = JSON.parse(localStorage.getItem("drxiaomi_recent_v1") || "[]"); }
    catch { recentSearches = []; }
  }
  function addRecent(term) {
    if (!term.trim()) return;
    recentSearches = [term, ...recentSearches.filter(t => t.toLowerCase() !== term.toLowerCase())].slice(0, 5);
    try { localStorage.setItem("drxiaomi_recent_v1", JSON.stringify(recentSearches)); } catch {}
  }

  const TIPO_PESO = { ORIG: 0, OLED: 1, LCD: 2 };
  const PAGE_SIZE = 30;
  let renderedCount = 0;

  function applyFiltersAndSearch(immediate = false) {
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    const run = () => {
      let data = [...allData];
      if (currentFilter === "FAV") data = data.filter(i => favorites.has(i.id));
      else if (currentFilter !== "all") data = data.filter(i => i.tipo === currentFilter);
      const term = searchInput.value.trim();
      if (term) {
        data = performPreciseSearch(data, term);
        clearSearchBtn.style.display = 'block';
      } else {
        clearSearchBtn.style.display = 'none';
      }
      data.sort((a, b) => {
        const pa = TIPO_PESO[a.tipo] ?? 3;
        const pb = TIPO_PESO[b.tipo] ?? 3;
        if (pa !== pb) return pa - pb;
        return a.venta - b.venta;
      });
      filteredData = data;
      updateResultsCount();
      render(true);
    };
    if (immediate) run();
    else {
      showSearchLoader();
      searchDebounceTimer = setTimeout(() => { run(); hideSearchLoader(); scrollToTop(); }, 200);
    }
  }

  function updateSuggestions() {
    const term = searchInput.value.trim();
    if (!term || term.length < 2) {
      if (recentSearches.length) {
        suggestionsPanel.innerHTML = `
          <div class="recent-header">Búsquedas recientes</div>
          ${recentSearches.map(r => `<div class="recent-item" data-term="${escapeHtml(r)}"><i class="fas fa-history"></i><span>${escapeHtml(r)}</span></div>`).join('')}
        `;
        suggestionsPanel.querySelectorAll('.recent-item').forEach(el => {
          el.addEventListener('click', () => {
            searchInput.value = el.dataset.term;
            suggestionsPanel.classList.remove('active');
            applyFiltersAndSearch();
          });
        });
        suggestionsPanel.classList.add('active');
      } else suggestionsPanel.classList.remove('active');
      return;
    }
    const sug = generateSuggestions(term);
    if (!sug.length) { suggestionsPanel.classList.remove('active'); return; }
    suggestionsPanel.innerHTML = `
      <div class="suggestion-header">COINCIDENCIAS (${sug.length})</div>
      ${sug.map(s => `
        <div class="suggestion-item" data-modelo="${escapeHtml(s.modelo)}">
          <i class="fas fa-mobile-alt"></i>
          <div style="flex:1;min-width:0;">
            <div>${highlight(s.modelo, term)}</div>
            <div style="font-size:11px;color:var(--text-mute);">${escapeHtml(s.marca)} · ${s.venta.toLocaleString()} Bs</div>
          </div>
          <span class="suggestion-price-tag">${s.tipo}</span>
        </div>
      `).join('')}
    `;
    suggestionsPanel.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        searchInput.value = el.dataset.modelo;
        addRecent(el.dataset.modelo);
        suggestionsPanel.classList.remove('active');
        applyFiltersAndSearch();
        haptic(20);
      });
    });
    suggestionsPanel.classList.add('active');
  }

  function updateResultsCount() {
    if (!resultsCount) return;
    const n = filteredData.length;
    resultsCount.innerHTML = `<span>${n} producto${n !== 1 ? 's' : ''}</span><span class="offline-tag"><span class="dot"></span>En vivo</span>`;
  }

  function render(reset = true) {
    if (!container) return;

    if (reset) {
      renderedCount = 0;
      if (!filteredData.length) {
        const term = searchInput.value.trim();
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <p style="font-weight:600;margin-bottom:6px;">Sin resultados</p>
            ${term ? `<p style="font-size:12px;">No se encontró "${escapeHtml(term)}"</p>` : ''}
          </div>
        `;
        return;
      }
      container.innerHTML = `<div class="cards-view" id="cardsView"></div>`;
    }

    const view = document.getElementById("cardsView");
    if (!view) return;

    const slice = filteredData.slice(renderedCount, renderedCount + PAGE_SIZE);
    const html = slice.map((item, idx) => {
      const i = renderedCount + idx;
      const isOrig = item.tipo === 'ORIG';
      const isOled = item.tipo === 'OLED';
      const typeClass = isOrig ? 'orig' : isOled ? 'oled' : '';
      const animStyle = i < 20 ? `animation-delay:${i * 12}ms` : `animation:none;opacity:1;transform:none`;
      
      return `
      <div class="product-card ${isOrig ? 'is-orig' : ''}" style="${animStyle}">
        <div class="card-header">
          <div style="min-width:0;flex:1;">
            <div class="card-brand">${escapeHtml(item.marca)}</div>
            <div class="card-model">${escapeHtml(item.modelo)}</div>
          </div>
          <button class="fav-btn ${favorites.has(item.id) ? 'active' : ''}" onclick="window.toggleFavorite('${item.id}')" aria-label="Favorito">
            <i class="fa${favorites.has(item.id) ? 's' : 'r'} fa-star"></i>
          </button>
        </div>
        <div class="card-specs">
          <span class="card-type ${typeClass}">${item.tipo}</span>
          ${techMode || isAdmin ? `<span class="supplier-badge">${escapeHtml(item.proveedor)}</span><span class="price-badge">Compra: ${item.compra}</span>` : ''}
        </div>
        <div class="card-price-row">
          <span class="card-price" onclick="window.copyPrice('${item.id}')">${item.venta.toLocaleString()} Bs</span>
          <div class="card-actions-group">
            ${isAdmin ? `
              <button class="edit-btn" onclick="window.openEdit('${item.id}')"><i class="fas fa-pen"></i> Editar</button>
            ` : ''}
            <button class="image-btn" onclick="window.openGoogle('${item.id}')"><i class="fab fa-google"></i> LCD</button>
            <button class="whatsapp-btn" onclick="window.shareWA('${item.id}')"><i class="fab fa-whatsapp"></i></button>
          </div>
        </div>
      </div>`;
    }).join('');

    view.insertAdjacentHTML('beforeend', html);
    renderedCount += slice.length;

    if (!reset && slice.length > 0) haptic(6);
  }
  function scrollToTop() { mainScrollContainer?.scrollTo({ top: 0, behavior: 'smooth' }); }
  function showSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "inline-flex"; }
  function hideSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "none"; }

  window.copyPrice = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return showToast("No encontrado");
    const msg = `${p.marca} ${p.modelo}\nPrecio Pantalla: ${p.venta.toLocaleString()} Bs\nINCLUYE INSTALACIÓN`;
    navigator.clipboard.writeText(msg).then(() => { showToast("Precio copiado"); haptic(30); }).catch(() => showToast("Error al copiar"));
  };

  window.shareWA = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    const msg = `*${p.marca} ${p.modelo}*\nPrecio Pantalla: ${p.venta.toLocaleString()} Bs\nINCLUYE INSTALACIÓN`;
    if (navigator.share) navigator.share({ text: msg }).catch(() => {});
    else window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
  };

  window.openGoogle = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    window.open(`https://www.google.com/search?q=${encodeURIComponent(`LCD ${p.modelo} ${p.marca} pantalla`)}&tbm=isch`, "_blank");
  };

  // 🔥 MODAL DE EDICIÓN (SOLO ADMIN)
  window.openEdit = function(id) {
    if (!isAdmin) return;
    const p = allData.find(x => x.id === id);
    if (!p) return;
    haptic(20);

    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalEdit';
    modal.innerHTML = `
      <div class="modal-content">
        <div class="sheet-handle"></div>
        <h3 style="color:var(--brand);"><i class="fas fa-pen"></i> Editar Precios</h3>
        <p style="font-size:13px; color:var(--text-mute); margin-bottom:16px;">${escapeHtml(p.marca)} ${escapeHtml(p.modelo)}</p>
        
        <div style="margin-bottom:12px;">
          <label class="edit-label">Precio Compra</label>
          <input type="number" id="editCompra" class="edit-input" value="${p.compra}" step="1">
        </div>
        <div style="margin-bottom:12px;">
          <label class="edit-label" style="color:var(--brand);">Precio Venta</label>
          <input type="number" id="editVenta" class="edit-input" value="${p.venta}" step="1">
        </div>

        <div class="modal-buttons">
          <button onclick="document.getElementById('modalEdit').remove()" style="background:var(--bg-elev);color:var(--text-main);border:1px solid var(--border);">Cancelar</button>
          <button id="btnSaveEdit" onclick="window.saveEdit('${p.id}')"><i class="fas fa-save"></i> Guardar</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  };

  window.saveEdit = async function(id) {
    const compra = parseFloat(document.getElementById('editCompra').value) || 0;
    const venta = parseFloat(document.getElementById('editVenta').value) || 0;
    
    haptic(20);
    document.getElementById('btnSaveEdit').textContent = "Guardando...";
    
    try {
      const docRef = doc(db, "precios", id);
      await updateDoc(docRef, { compra, venta });
      showToast("Precio actualizado");
      document.getElementById('modalEdit').remove();
      // La UI se actualizará sola gracias al onSnapshot
    } catch (e) {
      console.error(e);
      showToast("Error al guardar");
      document.getElementById('btnSaveEdit').textContent = "Guardar";
    }
  };

  function abrirModalTecnico() {
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalTecnico';
    modal.innerHTML = `
      <div class="modal-content" style="text-align: center;">
        <div class="sheet-handle"></div>
        <div style="font-size: 44px; margin-bottom: 12px;"><i class="fas fa-microchip" style="color:var(--brand);"></i></div>
        <h3 style="justify-content: center; margin-bottom: 10px; display: flex; font-size: 18px;">Modo Técnico</h3>
        <p style="color: var(--text-main); font-size: 14px; margin-bottom: 8px; line-height: 1.5;">
          ¿Confirmas que eres el <strong style="color: var(--brand);">técnico de DR. XIAOMI</strong>?
        </p>
        <p style="color: var(--text-mute); font-size: 12px; margin-bottom: 22px; line-height: 1.5;">
          Se mostrarán los precios de compra y proveedores.
        </p>
        <div class="modal-buttons">
          <button onclick="window.cerrarModalTecnico()" style="background: var(--bg-elev); color: var(--text-main); border: 1px solid var(--border);">
            Cancelar
          </button>
          <button onclick="window.confirmarModoTecnico()" style="background: var(--brand); color: white;">
            <i class="fas fa-check"></i> Sí
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    haptic(20);
  }
  window.cerrarModalTecnico = function() {
    haptic(10);
    document.getElementById('modalTecnico')?.remove();
  };
  window.confirmarModoTecnico = function() {
    haptic([20, 50, 20]);
    document.getElementById('modalTecnico')?.remove();
    techMode = true;
    techModeBtn.classList.add('tech-active');
    showToast("Modo técnico ON");
    render(true);
  };

  function setupEventListeners() {
    searchInput.addEventListener("input", () => { updateSuggestions(); applyFiltersAndSearch(); });
    searchInput.addEventListener("focus", () => { if (!searchInput.value && recentSearches.length) updateSuggestions(); });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === 'Enter') { addRecent(searchInput.value); suggestionsPanel.classList.remove('active'); applyFiltersAndSearch(); }
      if (e.key === 'Escape') suggestionsPanel.classList.remove('active');
    });
    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = ""; suggestionsPanel.classList.remove('active');
      clearSearchBtn.style.display = 'none'; applyFiltersAndSearch(); searchInput.focus();
    });

    techModeBtn.addEventListener("click", () => {
      haptic(30);
      if (techMode) {
        techMode = false;
        techModeBtn.classList.remove('tech-active');
        showToast("Modo técnico OFF");
        render(true);
        return;
      }
      abrirModalTecnico();
    });

    $("receiptBtn").addEventListener("click", () => { haptic(15); window.location.href = '/cliente/'; });
    $("backBtn").addEventListener("click", () => { haptic(15); window.location.href = '/app/'; });

    document.querySelectorAll(".filter-chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active"); currentFilter = c.dataset.filter;
      applyFiltersAndSearch(); haptic(15);
    }));

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) suggestionsPanel.classList.remove('active');
    });

    setupInfiniteScroll();
  }

  function setupInfiniteScroll() {
    let ticking = false;
    mainScrollContainer.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        if (mainScrollContainer.scrollTop > 600) scrollTopBtn.classList.add('show');
        else scrollTopBtn.classList.remove('show');

        if (renderedCount >= filteredData.length) return;
        const { scrollTop, scrollHeight, clientHeight } = mainScrollContainer;
        if (scrollTop + clientHeight >= scrollHeight - 500) render(false);
      });
    }, { passive: true });

    scrollTopBtn.addEventListener('click', () => { haptic(15); scrollToTop(); });
  }

  async function init() {
    loadFavorites();
    loadRecent();
    setupEventListeners();
    initFirebase(); // 🔥 Inicia la conexión con Firestore
  }

  init();
</script>
</body>
</html>
