<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6900" id="metaThemeColor">
  <meta name="description" content="Catálogo de pantallas y repuestos - Búsqueda precisa">
  <title>DR. XIAOMI | Catálogo</title>

  <!-- ============================================================ -->
  <!-- 🔒 PROTECCIÓN CON LOGIN (compartida con el panel)            -->
  <!-- ============================================================ -->
  <script>
    (function() {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (!sesion || !sesion.rol) {
          window.location.replace('/app/');
        }
      } catch (e) {
        window.location.replace('/app/');
      }
    })();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --xiaomi-orange: #FF6900;
      --xiaomi-orange-dark: #E55A00;
      --xiaomi-orange-soft: #FF8A3C;
      --xiaomi-orange-glow: rgba(255, 105, 0, 0.15);
      --gold-1: #FFD700;
      --gold-2: #FFA500;
      --gold-glow: rgba(255, 200, 0, 0.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
      --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
      --transition-fast: all 0.15s cubic-bezier(0.2, 0.9, 0.4, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    [data-theme="light"] {
      --bg-primary: #F5F5F7; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
      --bg-glass: rgba(255,255,255,0.72);
      --text-primary: #1D1D1F; --text-secondary: #6E6E73; --text-tertiary: #6E6E73;
      --border: #E5E5EA; --card-border: #F0F0F3;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
      --suggestion-bg: #FFFFFF; --suggestion-hover: #F5F5F7;
      --overlay: rgba(0,0,0,0.45);
    }
    [data-theme="dark"] {
      --bg-primary: #000000; --bg-secondary: #1C1C1E; --bg-card: #1C1C1E;
      --bg-glass: rgba(28,28,30,0.72);
      --text-primary: #F5F5F7; --text-secondary: #A1A1A6; --text-tertiary: #A1A1A6;
      --border: #2C2C2E; --card-border: #2C2C2E;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --suggestion-bg: #1C1C1E; --suggestion-hover: #2C2C2E;
      --overlay: rgba(0,0,0,0.7);
    }
    html, body { height: 100%; overscroll-behavior-y: none; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; width: 100%; height: 100dvh; transition: background 0.35s ease; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; user-select: none; }
    .app { max-width: 100%; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); position: relative; }

    .header { background: var(--bg-primary); border-bottom: 1px solid var(--border); padding: calc(14px + var(--safe-top)) 18px 12px; flex-shrink: 0; position: relative; z-index: 50; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; }

    /* 🟠 LOGO REDONDO */
    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--xiaomi-orange-glow);
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .logo h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-primary); }
    .logo span { font-weight: 500; color: var(--text-secondary); font-size: 16px; }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; color: var(--text-secondary); cursor: pointer; font-size: 15px; transition: var(--transition-fast); display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; position: relative; overflow: hidden; }
    .icon-btn:active { transform: scale(0.9); color: var(--xiaomi-orange); border-color: var(--xiaomi-orange); }
    .icon-btn.syncing i { animation: spinLoader 1s linear infinite; }
    .icon-btn.tech-active { background: var(--xiaomi-orange) !important; color: white !important; border-color: var(--xiaomi-orange) !important; box-shadow: 0 4px 12px var(--xiaomi-orange-glow); }
    .icon-btn .badge-fav {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #FFB800;
      color: #000;
      font-size: 10px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 2px solid var(--bg-primary);
    }
    .icon-btn .badge-fav.show { display: flex; }

    .search-wrapper { position: relative; }
    .search-container { position: relative; }
    .search-input { width: 100%; padding: 14px 86px 14px 46px; background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 16px; color: var(--text-primary); font-size: 15px; font-weight: 500; transition: var(--transition); letter-spacing: -0.2px; }
    .search-input:focus { outline: none; border-color: var(--xiaomi-orange); box-shadow: 0 0 0 4px var(--xiaomi-orange-glow); }
    .search-input::placeholder { color: var(--text-tertiary); font-weight: 400; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); font-size: 15px; pointer-events: none; }
    .search-actions { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; align-items: center; }
    .search-actions button { background: var(--bg-primary); border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; padding: 6px 10px; border-radius: 20px; transition: var(--transition); }
    .search-loader { width: 22px; height: 22px; border: 2px solid var(--border); border-top: 2px solid var(--xiaomi-orange); border-radius: 50%; animation: spinLoader 0.6s linear infinite; margin-right: 6px; display: inline-block; }
    @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .suggestions-panel { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px; background: var(--suggestion-bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); max-height: min(320px, 45vh); overflow-y: auto; display: none; z-index: 60; transform-origin: top; }
    .suggestions-panel.active { display: block; animation: panelIn 0.2s cubic-bezier(0.2, 0.9, 0.4, 1); }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .suggestion-header { padding: 12px 18px; font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: var(--bg-primary); position: sticky; top: 0; }
    .suggestion-item { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: var(--transition-fast); font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: var(--suggestion-hover); color: var(--xiaomi-orange); transform: scale(0.99); }
    .suggestion-item i { color: var(--text-tertiary); font-size: 14px; width: 18px; }
    .suggestion-highlight { color: var(--xiaomi-orange); font-weight: 700; }
    .suggestion-price-tag { font-size: 10px; color: var(--text-tertiary); background: var(--bg-primary); padding: 3px 9px; border-radius: 10px; font-weight: 600; }
    .recent-header { padding: 10px 18px 6px; font-size: 10px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-item { padding: 10px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); transition: var(--transition-fast); }
    .recent-item:active { background: var(--suggestion-hover); }

    .quick-filters { padding: 12px 18px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; background: var(--bg-primary); border-bottom: 1px solid var(--border); }
    .quick-filters::-webkit-scrollbar { display: none; }
    .filter-chip { padding: 9px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; transition: var(--transition); position: relative; overflow: hidden; }
    .filter-chip.active { background: var(--xiaomi-orange); color: white; border-color: var(--xiaomi-orange); box-shadow: 0 4px 12px var(--xiaomi-orange-glow); }
    .filter-chip[data-filter="ORIG"].active { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); border-color: var(--gold-2); box-shadow: 0 4px 12px var(--gold-glow); color: #4A2800; }
    .filter-chip:active { transform: scale(0.95); }

    /* Barra de ordenamiento */
    .sort-bar {
      padding: 8px 18px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .sort-bar::-webkit-scrollbar { display: none; }
    .sort-label { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; margin-right: 4px; }
    .sort-btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      color: var(--text-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sort-btn.active {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-color: var(--xiaomi-orange);
    }
    .sort-btn:active { transform: scale(0.95); }

    .main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
    .cards-view { display: flex; flex-direction: column; gap: 14px; padding: 18px; padding-bottom: calc(100px + var(--safe-bottom)); }

    .product-card {
      background: var(--bg-card); border-radius: 24px; padding: 18px 20px;
      border: 1px solid var(--card-border); position: relative;
      box-shadow: var(--card-shadow); overflow: hidden;
      opacity: 0; transform: translateY(8px);
      animation: cardIn 0.35s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
      content-visibility: auto;
      contain-intrinsic-size: 0 140px;
      will-change: opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .product-card::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; background: linear-gradient(180deg, var(--xiaomi-orange), var(--xiaomi-orange-soft)); border-radius: 4px; }
    .product-card.is-orig { border-color: rgba(255, 200, 0, 0.35); }
    .product-card.is-orig::before { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); box-shadow: 0 0 12px var(--gold-glow); }
    .product-card:active { transform: scale(0.985); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; padding-left: 10px; gap: 10px; }
    .card-brand { font-size: 11px; font-weight: 700; color: var(--xiaomi-orange); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
    .product-card.is-orig .card-brand { color: #B8860B; }
    [data-theme="dark"] .product-card.is-orig .card-brand { color: var(--gold-1); }
    .card-model { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.4px; word-break: break-word; line-height: 1.25; }
    .fav-btn { background: transparent; border: none; color: var(--text-tertiary); font-size: 18px; cursor: pointer; padding: 4px; transition: var(--transition-fast); flex-shrink: 0; }
    .fav-btn.active { color: #FFB800; transform: scale(1.1); }
    .fav-btn:active { transform: scale(0.85); }
    .card-specs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; padding-left: 10px; }
    .card-type { padding: 6px 14px; border-radius: 30px; font-size: 11px; font-weight: 600; background: var(--bg-primary); color: var(--text-secondary); }
    .card-type.oled { background: rgba(255, 105, 0, 0.12); color: var(--xiaomi-orange-dark); }
    .card-type.orig {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #4A2800;
      font-weight: 800;
      box-shadow: 0 2px 8px var(--gold-glow);
      letter-spacing: 0.5px;
    }
    .card-type.orig::before { content: '👑 '; font-size: 10px; }
    .supplier-badge { padding: 6px 14px; border-radius: 30px; font-size: 11px; font-weight: 600; background: rgba(255,105,0,0.12); color: var(--xiaomi-orange-dark); }
    [data-theme="dark"] .supplier-badge { background: rgba(255,105,0,0.2); color: var(--xiaomi-orange-soft); }
    .price-badge { padding: 6px 14px; border-radius: 30px; font-size: 11px; font-weight: 700; background: rgba(16, 185, 129, 0.12); color: #10B981; }
    [data-theme="dark"] .price-badge { background: rgba(16, 185, 129, 0.2); }
    .card-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); padding-left: 10px; gap: 10px; flex-wrap: wrap; }
    .card-price { font-size: 30px; font-weight: 900; color: var(--text-primary); cursor: pointer; transition: var(--transition); letter-spacing: -1px; padding: 4px 12px; border-radius: 14px; }
    .card-price:active { color: var(--xiaomi-orange); background: var(--xiaomi-orange-glow); }
    .card-actions-group { display: flex; gap: 8px; }
    .image-btn, .whatsapp-btn { border: none; padding: 10px 18px; border-radius: 40px; font-size: 12px; font-weight: 700; cursor: pointer; transition: var(--transition-fast); display: flex; align-items: center; gap: 5px; position: relative; overflow: hidden; }
    .image-btn:active, .whatsapp-btn:active { transform: scale(0.92); }
    .image-btn { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
    .whatsapp-btn { background: #25D366; color: white; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-primary); border-top: 1px solid var(--border); display: flex; padding: 8px 24px calc(16px + var(--safe-bottom)); gap: 12px; z-index: 100; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; border: none; background: transparent; color: var(--text-tertiary); border-radius: 16px; cursor: pointer; font-size: 10px; font-weight: 700; transition: var(--transition-fast); position: relative; overflow: hidden; }
    .nav-item.active { color: var(--xiaomi-orange); background: var(--xiaomi-orange-glow); }
    .nav-item i { font-size: 20px; transition: var(--transition-fast); }
    .nav-item.active i { transform: scale(1.1); }
    .nav-item:active i { transform: scale(0.85); }

    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--overlay); z-index: 200; align-items: flex-end; justify-content: center; padding: 0; }
    .modal.active { display: flex; animation: modalFade 0.2s ease; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal-content { background: var(--bg-card); border-radius: 28px 28px 0 0; padding: 28px 24px calc(28px + var(--safe-bottom)); width: 100%; max-width: 520px; border: 1px solid var(--border); border-bottom: none; animation: sheetUp 0.35s cubic-bezier(0.2, 0.9, 0.4, 1); position: relative; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: -12px auto 16px; }
    .modal-content h3 { margin-bottom: 20px; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-buttons button { flex: 1; padding: 15px; border: none; border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 15px; transition: var(--transition-fast); position: relative; overflow: hidden; }
    .modal-buttons button:active { transform: scale(0.97); }
    .modal-buttons button:last-child { background: var(--xiaomi-orange); color: white; box-shadow: 0 6px 16px var(--xiaomi-orange-glow); }

    .toast { position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: var(--bg-card); padding: 12px 22px; border-radius: 40px; color: var(--text-primary); font-size: 13px; font-weight: 600; z-index: 150; animation: fadeInUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1); border: 1px solid var(--border); box-shadow: var(--shadow-lg); max-width: 90%; text-align: center; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    .results-count { padding: 16px 20px 4px; font-size: 13px; font-weight: 600; color: var(--text-tertiary); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .results-count .offline-tag { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 5px; }
    .results-count .offline-tag.on { color: #FF9500; border-color: #FF9500; }
    .results-count .offline-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
    .empty-state i { font-size: 56px; opacity: 0.15; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; }
    .empty-state .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px 22px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .empty-state .btn-google:active { transform: scale(0.95); }

    .main-content::-webkit-scrollbar { width: 3px; }
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .ptr-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px); background: var(--bg-card); border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--xiaomi-orange); z-index: 10; transition: transform 0.2s ease, opacity 0.2s ease; opacity: 0; box-shadow: var(--shadow-md); }
    .ptr-indicator.visible { opacity: 1; }
    .ptr-indicator.spinning i { animation: spinLoader 0.8s linear infinite; }

    .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: 0.25; transform: scale(0); animation: rippleAnim 0.6s ease-out; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .splash { position: fixed; inset: 0; background: linear-gradient(135deg, var(--xiaomi-orange), var(--xiaomi-orange-dark)); z-index: 10000; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    .splash.hidden { opacity: 0; pointer-events: none; }
    .splash-inner { text-align: center; color: white; animation: pulseIn 0.5s ease; }
    .splash-inner .big { font-size: 64px; font-weight: 900; letter-spacing: -3px; margin-bottom: 8px; }
    .splash-inner .small { font-size: 14px; font-weight: 600; opacity: 0.9; letter-spacing: 2px; text-transform: uppercase; }
    @keyframes pulseIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* FAB scroll to top */
    .scroll-top-btn {
      position: fixed;
      bottom: calc(100px + var(--safe-bottom));
      right: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--xiaomi-orange);
      color: white;
      border: none;
      box-shadow: 0 6px 20px var(--xiaomi-orange-glow);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:active { transform: scale(0.9); }

    @media (min-width: 640px) {
      .app { max-width: 520px; box-shadow: var(--shadow-lg); }
      .modal { align-items: center; padding: 24px; }
      .modal-content { border-radius: 28px; border-bottom: 1px solid var(--border); padding: 28px 24px; }
      .sheet-handle { display: none; }
    }
  </style>
</head>

<!-- FAB scroll to top -->

  <i class="fas fa-arrow-up"></i>

<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const CONFIG = {
    dataSources: [
      { name: "J&A",          url: "/precio/data/ja2.csv" },
      { name: "CentralCell",  url: "/precio/data/centralcel.csv" },
      { name: "Osmobil",      url: "/precio/data/osmobil.csv" },
      { name: "CFH LP",       url: "/precio/data/CFH.csv" },
      { name: "BITE",         url: "/precio/data/boe.csv" },
      { name: "MR PANTALLA",  url: "/precio/data/mrpantalla.csv" }
    ],
    fetchTimeoutMs: 12000,
    cachePrefix: "drxiaomi_csv_",
    cacheMetaKey: "drxiaomi_cache_meta_v1",
    favoritesKey: "drxiaomi_favs_v1",
    recentKey: "drxiaomi_recent_v1",
    sortKey: "drxiaomi_sort_v1"
  };

  // ============================================================
  // ESTADO
  // ============================================================
  let allData = [];
  let filteredData = [];
  let techMode = false;
  let currentTab = "home";
  let currentFilter = "all";
  let currentSort = "relevancia";
  let currentTheme = "light";
  let searchDebounceTimer = null;
  let lastSyncInfo = { time: 0, fromCache: true };
  let favorites = new Set();
  let recentSearches = [];

  const $ = id => document.getElementById(id);
  const container = $("resultsContainer");
  const searchInput = $("searchInput");
  const resultsCount = $("resultsCount");
  const suggestionsPanel = $("suggestionsPanel");
  const clearSearchBtn = $("clearSearchBtn");
  const searchLoaderIndicator = $("searchLoaderIndicator");
  const mainScrollContainer = $("mainScrollContainer");
  const appRoot = $("appRoot");
  const splash = $("splash");
  const ptrIndicator = $("ptrIndicator");
  const techModeBtn = $("techModeBtn");
  const scrollTopBtn = $("scrollTopBtn");
  const favBadge = $("favBadge");

  // ============================================================
  // UTILS
  // ============================================================
  function uid() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      try { return crypto.randomUUID(); } catch(e) {}
    }
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }
  function escapeHtml(str) {
    if (str == null) return "";
    const d = document.createElement('div'); d.textContent = String(str); return d.innerHTML;
  }
  function normalizeText(str) {
    return String(str || "").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
  }
  function getTokens(str) { return normalizeText(str).split(" ").filter(t => t.length > 0); }
  function haptic(ms = 15) { if (navigator.vibrate) navigator.vibrate(ms); }
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  function attachRipple(el) {
    if (!isTouch) return;
    el.addEventListener('pointerdown', (e) => {
      const rect = el.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top  = (e.clientY - rect.top  - size/2) + 'px';
      el.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }, { passive: true });
  }
  function tiempoRelativo(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'hace unos segundos';
    if (min < 60) return `hace ${min} min`;
    const horas = Math.floor(min / 60);
    if (horas < 24) return `hace ${horas}h`;
    const dias = Math.floor(horas / 24);
    return `hace ${dias} día${dias > 1 ? 's' : ''}`;
  }

  // ============================================================
  // PARSERS
  // ============================================================
  function parsePrice(priceStr) {
    if (priceStr == null) return 0;
    let s = String(priceStr).trim().replace(/[^\d.,-]/g, '');
    if (!s) return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc > -1 && ld > -1) {
      if (lc > ld) s = s.replace(/\./g, '').replace(',', '.');
      else         s = s.replace(/,/g, '');
    } else if (lc > -1) {
      const parts = s.split(',');
      if (parts.length === 2 && parts[1].length <= 2) s = parts[0] + '.' + parts[1];
      else s = s.replace(/,/g, '');
    } else if (ld > -1) {
      const parts = s.split('.');
      if (parts.length > 2) s = parts.join('');
      else if (parts[1] && parts[1].length === 3) s = parts.join('');
    }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(n);
  }
  function cleanText(t) { return t ? String(t).trim().replace(/^"|"$/g, "") : ""; }
  function parseCSVLine(line) {
    const r = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') q = !q;
      else if ((c === "," || c === ";") && !q) { r.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    r.push(cur.trim());
    return r.map(f => f.replace(/^"|"$/g, ""));
  }
  function normalizeTipo(raw) {
    const t = String(raw || "").toUpperCase().trim();
    if (!t) return "LCD";
    if (/\b(ORIG|ORIGINAL|ORI|ORG|GENUINE|OEM|SERVICE\s*PACK|\bSP\b)\b/.test(t)) return "ORIG";
    if (/(AMOLED|OLED|SUPER\s*AMOLED|SUPERAMOLED|RETINA)/.test(t)) return "OLED";
    return "LCD";
  }
  function parseCSV(text, provider) {
    const lines = String(text || "").split(/\r?\n/).filter(l => l.trim() !== "");
    if (lines.length < 2) return [];
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i]);
      if (cols.length >= 6) {
        const marca = cleanText(cols[0]) || "N/A";
        const modelo = cleanText(cols[1]);
        const tipo = normalizeTipo(cleanText(cols[2]));
        const prov = cleanText(cols[3]) || provider;
        const compra = parsePrice(cols[4]);
        const venta = parsePrice(cols[5]);
        if (modelo && modelo.toLowerCase() !== "modelo") {
          data.push({ id: uid(), marca, modelo, tipo, proveedor: prov, compra, venta });
        }
      } else if (cols.length >= 5) {
        const marca = cleanText(cols[0]) || "N/A";
        const modelo = cleanText(cols[1]);
        const tipo = normalizeTipo(cleanText(cols[2]));
        const compra = parsePrice(cols[3]);
        const venta = parsePrice(cols[4]);
        if (modelo && modelo.toLowerCase() !== "modelo") {
          data.push({ id: uid(), marca, modelo, tipo, proveedor: provider, compra, venta });
        }
      }
    }
    return data;
  }

  // ============================================================
  // BÚSQUEDA
  // ============================================================
  function performPreciseSearch(data, term) {
    if (!term.trim()) return data;
    const tokens = getTokens(term);
    if (!tokens.length) return data;
    const results = [];
    for (const item of data) {
      const mn = normalizeText(item.modelo), mk = normalizeText(item.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      score += tokens.length * 5;
      results.push({ item, score });
    }
    results.sort((a, b) => b.score - a.score);
    return results.map(r => r.item);
  }
  function generateSuggestions(term) {
    if (!term.trim() || term.trim().length < 2) return [];
    const tokens = getTokens(term);
    const map = new Map();
    for (const p of allData) {
      const mn = normalizeText(p.modelo), mk = normalizeText(p.marca);
      const combined = mn + " " + mk;
      if (!tokens.every(t => combined.includes(t))) continue;
      let score = 0;
      const joined = tokens.join(" ");
      if (mn === joined) score = 100;
      else if (mn.startsWith(joined)) score = 90;
      else {
        let pos = 0, ord = true;
        for (const t of tokens) {
          const idx = mn.indexOf(t, pos);
          if (idx === -1) { ord = false; break; }
          pos = idx + t.length;
        }
        score = ord ? 80 : 50;
      }
      const key = `${p.marca}|${p.modelo}`;
      if (!map.has(key) || map.get(key).score < score) map.set(key, { ...p, score });
    }
    return Array.from(map.values()).sort((a, b) => b.score - a.score).slice(0, 8);
  }
  function highlight(text, term) {
    if (!term.trim()) return escapeHtml(text);
    const tokens = getTokens(term);
    let r = escapeHtml(text);
    tokens.forEach(t => {
      const rx = new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      r = r.replace(rx, '<span class="suggestion-highlight">$1</span>');
    });
    return r;
  }

  // ============================================================
  // FAVORITOS / RECIENTES
  // ============================================================
  function loadFavorites() {
    try { favorites = new Set(JSON.parse(localStorage.getItem(CONFIG.favoritesKey) || "[]")); }
    catch { favorites = new Set(); }
    updateFavBadge();
  }
  function saveFavorites() {
    try { localStorage.setItem(CONFIG.favoritesKey, JSON.stringify([...favorites])); } catch {}
    updateFavBadge();
  }
  function updateFavBadge() {
    if (!favBadge) return;
    const n = favorites.size;
    if (n > 0) {
      favBadge.textContent = n > 99 ? '99+' : n;
      favBadge.classList.add('show');
    } else {
      favBadge.classList.remove('show');
    }
  }
  function toggleFavorite(id) {
    if (favorites.has(id)) { favorites.delete(id); showToast("⭐ Quitado de favoritos"); }
    else { favorites.add(id); showToast("⭐ Agregado a favoritos"); haptic(30); }
    saveFavorites();
    render(true);
  }
  window.toggleFavorite = toggleFavorite;

  function loadRecent() {
    try { recentSearches = JSON.parse(localStorage.getItem(CONFIG.recentKey) || "[]"); }
    catch { recentSearches = []; }
  }
  function addRecent(term) {
    if (!term.trim()) return;
    recentSearches = [term, ...recentSearches.filter(t => t.toLowerCase() !== term.toLowerCase())].slice(0, 5);
    try { localStorage.setItem(CONFIG.recentKey, JSON.stringify(recentSearches)); } catch {}
  }

  // ============================================================
  // ORDENAMIENTO
  // ============================================================
  function loadSort() {
    const saved = localStorage.getItem(CONFIG.sortKey);
    if (saved) {
      currentSort = saved;
      document.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sort === saved);
      });
    }
  }
  function saveSort() {
    try { localStorage.setItem(CONFIG.sortKey, currentSort); } catch {}
  }
  function applySort(data) {
    const sorted = [...data];
    const TIPO_PESO = { ORIG: 0, OLED: 1, LCD: 2 };
    switch (currentSort) {
      case 'precio-asc':
        sorted.sort((a, b) => a.venta - b.venta);
        break;
      case 'precio-desc':
        sorted.sort((a, b) => b.venta - a.venta);
        break;
      case 'modelo':
        sorted.sort((a, b) => a.modelo.localeCompare(b.modelo, 'es'));
        break;
      case 'relevancia':
      default:
        sorted.sort((a, b) => {
          const pa = TIPO_PESO[a.tipo] ?? 3;
          const pb = TIPO_PESO[b.tipo] ?? 3;
          if (pa !== pb) return pa - pb;
          return a.venta - b.venta;
        });
    }
    return sorted;
  }

  // ============================================================
  // CACHE
  // ============================================================
  function readCachedCSV(name) {
    try {
      const raw = localStorage.getItem(CONFIG.cachePrefix + name);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return p && typeof p.text === 'string' ? p : null;
    } catch { return null; }
  }
  function writeCachedCSV(name, text, etag, lm) {
    try {
      localStorage.setItem(CONFIG.cachePrefix + name, JSON.stringify({ text, etag: etag||"", lastModified: lm||"", savedAt: Date.now() }));
    } catch { try { localStorage.removeItem(CONFIG.cachePrefix + name); } catch {} }
  }
  function readCacheMeta() {
    try { return JSON.parse(localStorage.getItem(CONFIG.cacheMetaKey) || "{}"); } catch { return {}; }
  }
  function writeCacheMeta(m) {
    try { localStorage.setItem(CONFIG.cacheMetaKey, JSON.stringify(m)); } catch {}
  }
  async function fetchTimeout(url, opts = {}, ms = CONFIG.fetchTimeoutMs) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }

  // ============================================================
  // CARGA
  // ============================================================
  async function loadAllData({ silent = false } = {}) {
    const cached = [];
    for (const s of CONFIG.dataSources) {
      const c = readCachedCSV(s.name);
      if (c) cached.push(...parseCSV(c.text, s.name));
    }
    if (cached.length) {
      allData = cached;
      lastSyncInfo = { time: Date.now(), fromCache: true };
      applyFiltersAndSearch(true);
    } else {
      showSkeleton();
    }
    if (!navigator.onLine) {
      if (!cached.length) showOfflineEmpty();
      else if (!silent) showToast("📴 Sin conexión - datos guardados");
      return;
    }
    if (!silent && cached.length) showToast("🔄 Actualizando...");
    const meta = readCacheMeta();
    const fresh = [];
    let updated = false;
    for (const s of CONFIG.dataSources) {
      try {
        const headers = {};
        const prev = readCachedCSV(s.name);
        if (prev?.etag) headers["If-None-Match"] = prev.etag;
        if (prev?.lastModified) headers["If-Modified-Since"] = prev.lastModified;
        const res = await fetchTimeout(s.url, { headers, cache: "no-store" });
        if (res.status === 304 && prev) { fresh.push(...parseCSV(prev.text, s.name)); continue; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const etag = res.headers.get("ETag") || "";
        const lm = res.headers.get("Last-Modified") || "";
        if ((prev?.text || "") !== text) {
          writeCachedCSV(s.name, text, etag, lm);
          meta[s.name] = { savedAt: Date.now(), etag, lastModified: lm };
          updated = true;
        }
        fresh.push(...parseCSV(text, s.name));
      } catch {
        const c = readCachedCSV(s.name);
        if (c) fresh.push(...parseCSV(c.text, s.name));
      }
    }
    writeCacheMeta(meta);
    if (fresh.length) {
      allData = fresh;
      lastSyncInfo = { time: Date.now(), fromCache: false };
      applyFiltersAndSearch(true);
    }
    if (updated && !silent) showToast("✅ Listas actualizadas");
  }

  // ============================================================
  // FILTROS / RENDER
  // ============================================================
  const PAGE_SIZE = 30;
  let renderedCount = 0;

  function applyFiltersAndSearch(immediate = false) {
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    const run = () => {
      let data = [...allData];
      if (currentFilter === "FAV") data = data.filter(i => favorites.has(i.id));
      else if (currentFilter !== "all") data = data.filter(i => i.tipo === currentFilter);
      const term = searchInput.value.trim();
      if (term) {
        data = performPreciseSearch(data, term);
        clearSearchBtn.style.display = 'block';
      } else {
        clearSearchBtn.style.display = 'none';
      }
      data = applySort(data);
      filteredData = data;
      updateResultsCount();
      render(true);
    };
    if (immediate) run();
    else {
      showSearchLoader();
      searchDebounceTimer = setTimeout(() => { run(); hideSearchLoader(); scrollToTop(); }, 200);
    }
  }
  function updateSuggestions() {
    const term = searchInput.value.trim();
    if (!term || term.length < 2) {
      if (recentSearches.length) {
        suggestionsPanel.innerHTML = `
          <div class="recent-header">🕐 Búsquedas recientes</div>
          ${recentSearches.map(r => `<div class="recent-item" data-term="${escapeHtml(r)}"><i class="fas fa-history"></i><span>${escapeHtml(r)}</span></div>`).join('')}
        `;
        suggestionsPanel.querySelectorAll('.recent-item').forEach(el => {
          el.addEventListener('click', () => {
            searchInput.value = el.dataset.term;
            suggestionsPanel.classList.remove('active');
            applyFiltersAndSearch();
          });
        });
        suggestionsPanel.classList.add('active');
      } else suggestionsPanel.classList.remove('active');
      return;
    }
    const sug = generateSuggestions(term);
    if (!sug.length) { suggestionsPanel.classList.remove('active'); return; }
    suggestionsPanel.innerHTML = `
      <div class="suggestion-header">🎯 COINCIDENCIAS (${sug.length})</div>
      ${sug.map(s => `
        <div class="suggestion-item" data-modelo="${escapeHtml(s.modelo)}">
          <i class="fas fa-mobile-alt"></i>
          <div style="flex:1;min-width:0;">
            <div>${highlight(s.modelo, term)}</div>
            <div style="font-size:11px;color:var(--text-tertiary);">${escapeHtml(s.marca)} · ${s.venta.toLocaleString()} Bs</div>
          </div>
          <span class="suggestion-price-tag">${s.tipo}</span>
        </div>
      `).join('')}
    `;
    suggestionsPanel.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        searchInput.value = el.dataset.modelo;
        addRecent(el.dataset.modelo);
        suggestionsPanel.classList.remove('active');
        applyFiltersAndSearch();
        haptic(20);
      });
    });
    suggestionsPanel.classList.add('active');
  }
  function updateResultsCount() {
    if (!resultsCount) return;
    const n = filteredData.length;
    const tag = lastSyncInfo.fromCache
      ? `<span class="offline-tag on"><span class="dot"></span>Offline · ${tiempoRelativo(lastSyncInfo.time)}</span>`
      : `<span class="offline-tag"><span class="dot"></span>Actualizado ${tiempoRelativo(lastSyncInfo.time)}</span>`;
    resultsCount.innerHTML = `<span>${n} producto${n !== 1 ? 's' : ''}</span>${tag}`;
  }
  function render(reset = true) {
    if (!container) return;
    if (currentTab === "compare") { showCompareModal(); return; }

    if (reset) {
      renderedCount = 0;
      if (!filteredData.length) {
        const term = searchInput.value.trim();
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <p style="font-weight:600;margin-bottom:8px;">Sin resultados</p>
            ${term ? `<p style="font-size:13px;">No se encontró "${escapeHtml(term)}"</p>` : ''}
            ${term ? `<a class="btn-google" href="https://www.google.com/search?q=${encodeURIComponent('pantalla ' + term)}&tbm=isch" target="_blank" rel="noopener">
              <i class="fab fa-google"></i> Buscar en Google
            </a>` : ''}
          </div>
        `;
        return;
      }
      container.innerHTML = `<div class="cards-view" id="cardsView"></div>`;
    }

    const view = document.getElementById("cardsView");
    if (!view) return;

    const slice = filteredData.slice(renderedCount, renderedCount + PAGE_SIZE);
    const html = slice.map((item, idx) => {
      const i = renderedCount + idx;
      const isOrig = item.tipo === 'ORIG';
      const isOled = item.tipo === 'OLED';
      const typeClass = isOrig ? 'orig' : isOled ? 'oled' : '';
      const animStyle = i < 20
        ? `animation-delay:${i * 15}ms`
        : `animation:none;opacity:1;transform:none`;
      return `
      <div class="product-card ${isOrig ? 'is-orig' : ''}" style="${animStyle}">
        <div class="card-header">
          <div style="min-width:0;flex:1;">
            <div class="card-brand">${escapeHtml(item.marca)}</div>
            <div class="card-model">${escapeHtml(item.modelo)}</div>
          </div>
          <button class="fav-btn ${favorites.has(item.id) ? 'active' : ''}" onclick="window.toggleFavorite('${item.id}')" aria-label="Favorito">
            <i class="fa${favorites.has(item.id) ? 's' : 'r'} fa-star"></i>
          </button>
        </div>
        <div class="card-specs">
          <span class="card-type ${typeClass}">${item.tipo}</span>
          ${techMode ? `<span class="supplier-badge">🏷️ ${escapeHtml(item.proveedor)}</span><span class="price-badge">Compra: ${item.compra.toLocaleString()} Bs</span>` : ''}
        </div>
        <div class="card-price-row">
          <span class="card-price" onclick="window.copyPrice('${item.id}')">${item.venta.toLocaleString()} Bs</span>
          <div class="card-actions-group">
            <button class="image-btn" onclick="window.openGoogle('${item.id}')"><i class="fab fa-google"></i> LCD</button>
            <button class="whatsapp-btn" onclick="window.shareWA('${item.id}')"><i class="fab fa-whatsapp"></i></button>
          </div>
        </div>
      </div>`;
    }).join('');

    view.insertAdjacentHTML('beforeend', html);
    renderedCount += slice.length;

    // Vibración al cargar más items (infinite scroll)
    if (!reset && slice.length > 0) haptic(8);
  }
  function scrollToTop() { mainScrollContainer?.scrollTo({ top: 0, behavior: 'smooth' }); }
  function showSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "inline-flex"; }
  function hideSearchLoader() { if (searchLoaderIndicator) searchLoaderIndicator.style.display = "none"; }

  // ============================================================
  // ACCIONES
  // ============================================================
  window.copyPrice = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return showToast("❌ No encontrado");
    const msg = `📱 ${p.marca} ${p.modelo}\n💰 Precio Pantalla: ${p.venta.toLocaleString()} Bs\n✅ INCLUYE INSTALACIÓN`;
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = msg; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast("✅ Precio copiado"); } catch { showToast("❌ Error"); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(msg).then(() => { showToast("✅ Precio copiado"); haptic(30); }).catch(fallback);
    } else fallback();
  };
  window.shareWA = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    const msg = `📱 *${p.marca} ${p.modelo}*\n💰 Precio Pantalla: ${p.venta.toLocaleString()} Bs\n✅ INCLUYE INSTALACIÓN`;
    if (navigator.share) {
      navigator.share({ text: msg }).catch(() => {});
    } else {
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
    }
    haptic(30);
  };
  window.openGoogle = function(id) {
    const p = filteredData.find(x => x.id === id) || allData.find(x => x.id === id);
    if (!p) return;
    const q = `LCD ${p.modelo} ${p.marca} pantalla`;
    window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=isch`, "_blank", "width=450,height=650");
    haptic(20);
  };

  // ============================================================
  // COMPARE / MODALES
  // ============================================================
  function showCompareModal() {
    const data = filteredData.slice(0, 4);
    if (!data.length) { showToast("Nada para comparar"); return; }
    let html = '<div style="display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;">';
    data.forEach(p => {
      const accent = p.tipo === 'ORIG' ? 'var(--gold-2)' : 'var(--xiaomi-orange)';
      html += `<div style="background:var(--bg-secondary);padding:14px;border-radius:16px;border-left:4px solid ${accent};">
        <div style="font-size:12px;color:${accent};font-weight:700;">${escapeHtml(p.marca)}</div>
        <div style="font-size:15px;font-weight:600;margin:4px 0;">${escapeHtml(p.modelo)}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">${p.tipo}${techMode ? ' · ' + escapeHtml(p.proveedor) : ''}</div>
        <div style="font-size:22px;font-weight:800;">${p.venta.toLocaleString()} Bs</div>
      </div>`;
    });
    html += '</div><div class="modal-buttons" style="margin-top:16px;"><button onclick="window.closeCompare()" style="flex:1;padding:12px;background:var(--xiaomi-orange);border:none;border-radius:30px;color:white;font-weight:600;cursor:pointer;">Cerrar</button></div>';
    document.getElementById("compareModal")?.remove();
    document.body.insertAdjacentHTML("beforeend",
      `<div id="compareModal" class="modal active"><div class="modal-content"><div class="sheet-handle"></div><h3>📊 Comparar</h3>${html}</div></div>`);
  }
  window.closeCompare = () => document.getElementById("compareModal")?.remove();

  // ============================================================
  // MODAL CONFIRMACIÓN MODO TÉCNICO
  // ============================================================
  function abrirModalTecnico() {
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.id = 'modalTecnico';
    modal.innerHTML = `
      <div class="modal-content" style="text-align: center;">
        <div class="sheet-handle"></div>
        <div style="font-size: 48px; margin-bottom: 12px;">🔧</div>
        <h3 style="justify-content: center; margin-bottom: 12px; display: flex;">Modo Técnico</h3>
        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px; line-height: 1.5;">
          ¿Confirmas que eres el <strong style="color: var(--xiaomi-orange);">técnico de DR. XIAOMI</strong>?
        </p>
        <p style="color: var(--text-tertiary); font-size: 12px; margin-bottom: 24px; line-height: 1.5;">
          Se mostrarán los <strong>precios de compra</strong> y <strong>proveedores</strong> de cada repuesto.
        </p>
        <div class="modal-buttons">
          <button onclick="window.cerrarModalTecnico()" style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border);">
            Cancelar
          </button>
          <button onclick="window.confirmarModoTecnico()" style="background: var(--xiaomi-orange); color: white;">
            <i class="fas fa-check"></i> Sí, soy técnico
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    haptic(20);
  }
  window.cerrarModalTecnico = function() {
    haptic(10);
    document.getElementById('modalTecnico')?.remove();
  };
  window.confirmarModoTecnico = function() {
    haptic([20, 50, 20]);
    document.getElementById('modalTecnico')?.remove();
    techMode = true;
    techModeBtn.classList.add('tech-active');
    showToast("🔧 Modo técnico ACTIVADO");
    render(true);
  };

  // ============================================================
  // TEMA
  // ============================================================
  function applyTheme(t) {
    currentTheme = t;
    document.documentElement.setAttribute("data-theme", t);
    const icon = document.querySelector("#themeToggle i");
    if (icon) icon.className = t === "dark" ? "fas fa-sun" : "fas fa-moon";
    const meta = document.getElementById("metaThemeColor");
    if (meta) meta.setAttribute("content", t === "dark" ? "#000000" : "#FF6900");
    localStorage.setItem("theme", t);
  }
  function toggleTheme() { applyTheme(currentTheme === "light" ? "dark" : "light"); haptic(15); }
  function loadTheme() {
    applyTheme(localStorage.getItem("theme") === "dark" ? "dark" : "light");
  }

  // ============================================================
  // PULL TO REFRESH
  // ============================================================
  function setupPullToRefresh() {
    let startY = 0, pulling = false, triggered = false;
    const threshold = 80;
    mainScrollContainer.addEventListener('touchstart', (e) => {
      if (mainScrollContainer.scrollTop <= 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
      else pulling = false;
    }, { passive: true });
    mainScrollContainer.addEventListener('touchmove', (e) => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 10 && mainScrollContainer.scrollTop <= 0) {
        const clamped = Math.min(dy, 120);
        ptrIndicator.style.transform = `translateX(-50%) translateY(${clamped - 20}px)`;
        ptrIndicator.classList.add('visible');
        if (clamped >= threshold && !triggered) {
          triggered = true;
          ptrIndicator.classList.add('spinning');
          haptic(20);
        }
      }
    }, { passive: true });
    mainScrollContainer.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;
      if (ptrIndicator.classList.contains('spinning')) {
        await loadAllData({ silent: false });
      }
      ptrIndicator.classList.remove('visible', 'spinning');
      ptrIndicator.style.transform = 'translateX(-50%) translateY(-60px)';
    }, { passive: true });
  }

  // ============================================================
  // INFINITE SCROLL + SCROLL TO TOP FAB
  // ============================================================
  function setupInfiniteScroll() {
    let ticking = false;
    mainScrollContainer.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;

        // Mostrar/ocultar botón scroll to top
        if (mainScrollContainer.scrollTop > 600) {
          scrollTopBtn.classList.add('show');
        } else {
          scrollTopBtn.classList.remove('show');
        }

        // Infinite scroll
        if (renderedCount >= filteredData.length) return;
        const { scrollTop, scrollHeight, clientHeight } = mainScrollContainer;
        if (scrollTop + clientHeight >= scrollHeight - 500) {
          render(false);
        }
      });
    }, { passive: true });

    // Click scroll to top
    scrollTopBtn.addEventListener('click', () => {
      haptic(15);
      scrollToTop();
    });
  }

  // ============================================================
  // SKELETON / ERROR
  // ============================================================
  function showSkeleton() {
    if (!container) return;
    container.innerHTML = `<div class="cards-view">${Array(6).fill().map(() => `<div class="product-card" style="height:120px;animation:none;opacity:1;transform:none;"><div style="background:linear-gradient(90deg, var(--border) 25%, transparent 50%, var(--border) 75%); background-size:200% 100%; animation:loading 1.5s infinite; border-radius:12px; height:100%;"></div></div>`).join('')}</div>`;
    if (!document.getElementById("skeletonKeyframes")) {
      const s = document.createElement("style");
      s.id = "skeletonKeyframes";
      s.textContent = `@keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }`;
      document.head.appendChild(s);
    }
  }
  function showOfflineEmpty() {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-wifi"></i><p style="font-weight:600;margin-bottom:8px;">Sin conexión</p><p style="font-size:13px;">Conéctate una vez para descargar el catálogo.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;background:var(--xiaomi-orange);border:none;border-radius:30px;color:white;font-weight:600;cursor:pointer;">Reintentar</button></div>`;
  }

  // ============================================================
  // EVENTOS
  // ============================================================
  function setupEventListeners() {
    searchInput.addEventListener("input", () => { updateSuggestions(); applyFiltersAndSearch(); });
    searchInput.addEventListener("focus", () => { if (!searchInput.value && recentSearches.length) updateSuggestions(); });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === 'Enter') { addRecent(searchInput.value); suggestionsPanel.classList.remove('active'); applyFiltersAndSearch(); }
      if (e.key === 'Escape') suggestionsPanel.classList.remove('active');
    });
    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = ""; suggestionsPanel.classList.remove('active');
      clearSearchBtn.style.display = 'none'; applyFiltersAndSearch(); searchInput.focus();
    });

    $("themeToggle").addEventListener("click", toggleTheme);

    // 🏷️ Botón de Favoritos — activa filtro FAV
    $("favBtn").addEventListener("click", () => {
      haptic(15);
      document.querySelectorAll(".filter-chip").forEach(x => x.classList.remove("active"));
      const favChip = document.querySelector('.filter-chip[data-filter="FAV"]');
      if (favChip) favChip.classList.add("active");
      currentFilter = "FAV";
      applyFiltersAndSearch();
    });

    // 🔧 Modo Técnico — Con confirmación
    techModeBtn.addEventListener("click", () => {
      haptic(30);
      if (techMode) {
        techMode = false;
        techModeBtn.classList.remove('tech-active');
        showToast("Modo técnico desactivado");
        render(true);
        return;
      }
      abrirModalTecnico();
    });

    $("shuffleBtn").addEventListener("click", () => {
      if (!allData.length) return;
      filteredData = [...allData].sort(() => Math.random() - 0.5);
      updateResultsCount(); render(true); scrollToTop(); showToast("🔄 Mezclado"); haptic(20);
    });

    // 🔙 Volver al panel
    $("backBtn").addEventListener("click", () => {
      haptic(15);
      window.location.href = '/app/';
    });

    document.querySelectorAll(".filter-chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active"); currentFilter = c.dataset.filter;
      applyFiltersAndSearch(); haptic(15);
    }));

    // Botones de ordenamiento
    document.querySelectorAll(".sort-btn").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".sort-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      currentSort = b.dataset.sort;
      saveSort();
      applyFiltersAndSearch();
      haptic(10);
    }));

    document.querySelectorAll(".nav-item").forEach(n => n.addEventListener("click", () => {
      currentTab = n.dataset.tab;
      document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
      n.classList.add("active"); render(true); haptic(15);
    }));

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrapper")) suggestionsPanel.classList.remove('active');
    });

    window.addEventListener("online", () => { showToast("🌐 Conectado, actualizando..."); loadAllData({ silent: true }); });
    window.addEventListener("offline", () => {
      lastSyncInfo.fromCache = true; updateResultsCount();
      showToast("📴 Modo offline");
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && navigator.onLine) loadAllData({ silent: true });
    });

    document.querySelectorAll(".icon-btn, .filter-chip, .nav-item, .image-btn, .whatsapp-btn, .sort-btn").forEach(attachRipple);

    setupPullToRefresh();
    setupInfiniteScroll();
  }

  // ============================================================
  // INIT
  // ============================================================
  async function init() {
    loadTheme();
    loadFavorites();
    loadRecent();
    loadSort();
    setupEventListeners();

    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 600);
    }, 800);

    appRoot.style.opacity = "1";
    loadAllData({ silent: true });
  }

  init();
</script>
</body>
</html>
