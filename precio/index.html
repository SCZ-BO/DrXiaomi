<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6900" id="metaThemeColor">
  <meta name="description" content="Catálogo de pantallas y repuestos">
  <title>DR. XIAOMI | Catálogo</title>

  <script>
    (function() {
      try {
        const sesion = JSON.parse(localStorage.getItem('drx_sesion') || 'null');
        if (!sesion || !sesion.rol) {
          window.location.replace('/app/');
        }
      } catch (e) {
        window.location.replace('/app/');
      }
    })();
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="/imagenes/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/imagenes/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/imagenes/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/imagenes/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --xiaomi-orange: #FF6900;
      --xiaomi-orange-dark: #E55A00;
      --xiaomi-orange-soft: #FF8A3C;
      --xiaomi-orange-glow: rgba(255, 105, 0, 0.15);
      --gold-1: #FFD700;
      --gold-2: #FFA500;
      --gold-glow: rgba(255, 200, 0, 0.35);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
      --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      --transition-fast: all 0.12s cubic-bezier(0.2, 0.9, 0.4, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    [data-theme="light"] {
      --bg-primary: #F5F5F7; --bg-secondary: #FFFFFF; --bg-card: #FFFFFF;
      --bg-glass: rgba(255,255,255,0.72);
      --text-primary: #1D1D1F; --text-secondary: #6E6E73; --text-tertiary: #8A8A8E;
      --border: #E5E5EA; --border-soft: #F0F0F3; --card-border: #EEEEF1;
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --suggestion-bg: #FFFFFF; --suggestion-hover: #F5F5F7;
      --overlay: rgba(0,0,0,0.45);
    }
    [data-theme="dark"] {
      --bg-primary: #0A0A0A; --bg-secondary: #1A1A1A; --bg-card: #141414;
      --bg-glass: rgba(20,20,20,0.72);
      --text-primary: #F5F5F7; --text-secondary: #A1A1A6; --text-tertiary: #7A7A80;
      --border: #232326; --border-soft: #1C1C1E; --card-border: #1F1F22;
      --card-shadow: none;
      --suggestion-bg: #141414; --suggestion-hover: #1F1F22;
      --overlay: rgba(0,0,0,0.75);
    }
    html, body { height: 100%; overscroll-behavior-y: none; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow-x: hidden; width: 100%; height: 100dvh; transition: background 0.3s ease; -webkit-font-smoothing: antialiased; user-select: none; }
    .app { max-width: 100%; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); position: relative; }

    /* ============ HEADER ============ */
    .header { background: var(--bg-primary); border-bottom: 1px solid var(--border-soft); padding: calc(12px + var(--safe-top)) 16px 10px; flex-shrink: 0; position: relative; z-index: 50; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .logo h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
    .logo span { font-weight: 500; color: var(--text-tertiary); font-size: 13px; }

    .header-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 0;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 15px;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      position: relative;
      overflow: hidden;
    }
    .icon-btn:hover { background: var(--bg-secondary); }
    .icon-btn:active { transform: scale(0.9); color: var(--xiaomi-orange); }
    .icon-btn.tech-active {
      background: var(--xiaomi-orange) !important;
      color: white !important;
    }

    /* ============ SEARCH ============ */
    .search-wrapper { position: relative; }
    .search-container { position: relative; }
    .search-input {
      width: 100%;
      padding: 11px 80px 11px 38px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--xiaomi-orange);
      background: var(--bg-card);
    }
    .search-input::placeholder { color: var(--text-tertiary); font-weight: 400; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 13px;
      pointer-events: none;
    }
    .search-actions {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .search-actions button {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 20px;
      transition: var(--transition);
    }
    .search-actions button:hover { color: var(--text-primary); }
    .search-loader {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top: 2px solid var(--xiaomi-orange);
      border-radius: 50%;
      animation: spinLoader 0.6s linear infinite;
      margin-right: 4px;
      display: inline-block;
    }
    @keyframes spinLoader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ============ SUGGESTIONS ============ */
    .suggestions-panel {
      position: absolute;
      top: 100%; left: 0; right: 0;
      margin-top: 6px;
      background: var(--suggestion-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      max-height: min(300px, 40vh);
      overflow-y: auto;
      display: none;
      z-index: 60;
    }
    .suggestions-panel.active { display: block; animation: panelIn 0.18s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .suggestion-header {
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg-primary);
      position: sticky;
      top: 0;
    }
    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition-fast);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--suggestion-hover); }
    .suggestion-item:active { background: var(--suggestion-hover); transform: scale(0.99); }
    .suggestion-item i { color: var(--text-tertiary); font-size: 12px; width: 16px; }
    .suggestion-highlight { color: var(--xiaomi-orange); font-weight: 700; }
    .suggestion-price-tag {
      font-size: 9px;
      color: var(--text-tertiary);
      background: var(--bg-primary);
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .recent-header {
      padding: 8px 14px 4px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .recent-item {
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      transition: var(--transition-fast);
    }
    .recent-item:active { background: var(--suggestion-hover); }

    /* ============ FILTROS MINIMALISTAS ============ */
    .quick-filters {
      padding: 8px 16px 10px;
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-soft);
    }
    .quick-filters::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11.5px;
      font-weight: 600;
      background: transparent;
      color: var(--text-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
      position: relative;
      overflow: hidden;
      letter-spacing: -0.1px;
    }
    .filter-chip:hover {
      color: var(--text-secondary);
      border-color: var(--text-tertiary);
    }
    .filter-chip.active {
      background: var(--xiaomi-orange);
      color: white;
      border-color: var(--xiaomi-orange);
    }
    .filter-chip[data-filter="ORIG"].active {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #4A2800;
      border-color: var(--gold-2);
    }
    .filter-chip:active { transform: scale(0.96); }

    /* ============ MAIN CONTENT ============ */
    .main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; position: relative; }
    .cards-view {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      padding-bottom: calc(90px + var(--safe-bottom));
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* ============ PRODUCT CARD MINIMALISTA ============ */
    .product-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      position: relative;
      opacity: 0;
      transform: translateY(6px);
      animation: cardIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
      content-visibility: auto;
      contain-intrinsic-size: 0 100px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .product-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--xiaomi-orange);
      border-radius: 2px;
    }
    .product-card.is-orig::before {
      background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
    }
    .product-card:active { background: var(--bg-secondary); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      padding-left: 8px;
      gap: 10px;
    }
    .card-brand {
      font-size: 10px;
      font-weight: 700;
      color: var(--xiaomi-orange);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .product-card.is-orig .card-brand { color: #B8860B; }
    [data-theme="dark"] .product-card.is-orig .card-brand { color: var(--gold-1); }

    .card-model {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      word-break: break-word;
      line-height: 1.3;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      font-size: 15px;
      cursor: pointer;
      padding: 2px;
      transition: var(--transition-fast);
      flex-shrink: 0;
      opacity: 0.6;
    }
    .fav-btn.active { color: #FFB800; opacity: 1; }
    .fav-btn:active { transform: scale(0.85); }

    .card-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 10px;
      padding-left: 8px;
    }
    .card-type {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      background: var(--bg-primary);
      color: var(--text-tertiary);
      letter-spacing: 0.2px;
    }
    .card-type.oled {
      background: rgba(255, 105, 0, 0.1);
      color: var(--xiaomi-orange);
    }
    .card-type.orig {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: #4A2800;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .card-type.orig::before { content: '👑 '; font-size: 9px; }

    .supplier-badge {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(255,105,0,0.08);
      color: var(--xiaomi-orange);
    }
    [data-theme="dark"] .supplier-badge { background: rgba(255,105,0,0.15); }

    .price-badge {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.08);
      color: #10B981;
    }
    [data-theme="dark"] .price-badge { background: rgba(16, 185, 129, 0.15); }

    .card-price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border-soft);
      padding-left: 8px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-price {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: -0.5px;
      padding: 3px 8px;
      border-radius: 8px;
      margin-left: -8px;
    }
    .card-price:active {
      color: var(--xiaomi-orange);
      background: var(--xiaomi-orange-glow);
    }
    .card-actions-group { display: flex; gap: 5px; }
    .image-btn, .whatsapp-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }
    .image-btn:active, .whatsapp-btn:active { transform: scale(0.92); }
    .image-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .image-btn:hover { border-color: var(--text-tertiary); }
    .whatsapp-btn {
      background: #25D366;
      color: white;
    }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-soft);
      display: flex;
      padding: 6px 20px calc(10px + var(--safe-bottom));
      gap: 12px;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 8px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      border-radius: 12px;
      cursor: pointer;
      font-size: 9.5px;
      font-weight: 600;
      transition: var(--transition-fast);
      position: relative;
      text-decoration: none;
    }
    .nav-item.active {
      color: var(--xiaomi-orange);
    }
    .nav-item i {
      font-size: 17px;
      transition: var(--transition-fast);
    }
    .nav-item.active i {
      transform: scale(1.1);
      filter: drop-shadow(0 0 6px rgba(255, 105, 0, 0.5));
    }
    .nav-item:active i { transform: scale(0.85); }

    /* ============ MODAL ============ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.active { display: flex; animation: modalFade 0.18s ease; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + var(--safe-bottom));
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--border);
      border-bottom: none;
      animation: sheetUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      position: relative;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle {
      width: 32px; height: 3px;
      background: var(--border);
      border-radius: 3px;
      margin: -8px auto 14px;
    }
    .modal-content h3 {
      margin-bottom: 16px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: var(--transition-fast);
    }
    .modal-buttons button:active { transform: scale(0.97); }
    .modal-buttons button:last-child {
      background: var(--xiaomi-orange);
      color: white;
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      padding: 10px 18px;
      border-radius: 30px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      z-index: 150;
      animation: fadeInUp 0.25s ease;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      max-width: 90%;
      text-align: center;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ============ RESULTS COUNT ============ */
    .results-count {
      padding: 10px 18px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .results-count .offline-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      background: var(--bg-secondary);
      color: var(--text-tertiary);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .results-count .offline-tag.on { color: #FF9500; border-color: #FF9500; }
    .results-count .offline-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-tertiary);
    }
    .empty-state i { font-size: 44px; opacity: 0.15; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }
    .empty-state .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 10px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .empty-state .btn-google:active { transform: scale(0.95); }

    .main-content::-webkit-scrollbar { width: 2px; }
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .ptr-indicator {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%) translateY(-60px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--xiaomi-orange);
      z-index: 10;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0;
      font-size: 14px;
    }
    .ptr-indicator.visible { opacity: 1; }
    .ptr-indicator.spinning i { animation: spinLoader 0.8s linear infinite; }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.2;
      transform: scale(0);
      animation: rippleAnim 0.5s ease-out;
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--xiaomi-orange), var(--xiaomi-orange-dark));
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    .splash.hidden { opacity: 0; pointer-events: none; }
    .splash-inner { text-align: center; color: white; }
    .splash-inner .big { font-size: 56px; font-weight: 900; letter-spacing: -3px; margin-bottom: 6px; }
    .splash-inner .small { font-size: 12px; font-weight: 600; opacity: 0.9; letter-spacing: 2px; text-transform: uppercase; }

    .scroll-top-btn {
      position: fixed;
      bottom: calc(84px + var(--safe-bottom));
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--xiaomi-orange);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      opacity: 0;
      transform: translateY(20px) scale(0.8);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
    }
    .scroll-top-btn.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .scroll-top-btn:active { transform: scale(0.9); }

    /* ============ FICHA TÉCNICA ============ */
    #modalSpecs .modal-content {
      max-height: 85vh;
      overflow-y: auto;
      padding-bottom: calc(20px + var(--safe-bottom));
    }
    .spec-section {
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 10px;
    }
    .spec-section:last-child { border-bottom: none; }
    .spec-section h4 {
      font-size: 11px;
      font-weight: 800;
      color: var(--xiaomi-orange);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 0;
      font-size: 12px;
    }
    .spec-label {
      color: var(--text-tertiary);
      font-weight: 500;
      flex-shrink: 0;
    }
    .spec-value {
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }
    .spec-loading {
      text-align: center;
      padding: 30px;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    @media (min-width: 640px) {
      .app { max-width: 500px; }
      .modal { align-items: center; padding: 20px; }
      .modal-content { border-radius: 20px; border-bottom: 1px solid var(--border); }
      .sheet-handle { display: none; }
    }
  </style>
</head>
